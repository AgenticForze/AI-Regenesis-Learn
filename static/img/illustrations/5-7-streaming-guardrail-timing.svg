<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-7-streamtiming desc-5-7-streamtiming">
  <title id="title-5-7-streamtiming">Streaming reaches the user before a complete-response guardrail can</title>
  <desc id="desc-5-7-streamtiming">A diagram showing eight tokens streamed to a user in sequence, with a risky token appearing early in the stream, and a guardrail box positioned after the final token showing that a guardrail built to evaluate only a complete response finishes its check only after every token, including the risky one, has already reached the user.</desc>
  <defs></defs>
  <rect width="1400" height="560" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Streaming reaches the user before a complete-response guardrail can</text>
  <defs><marker id="arrow-5-7-streamtiming" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="367.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="402.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t1</text><rect x="452.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="487.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t2</text><rect x="537.5" y="120" width="70" height="60" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="572.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2f">t3</text><rect x="622.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="657.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t4</text><rect x="707.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="742.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t5</text><rect x="792.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="827.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t6</text><rect x="877.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="912.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t7</text><rect x="962.5" y="120" width="70" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="997.5" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">t8</text><line x1="367.5" y1="205" x2="1032.5" y2="205" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow-5-7-streamtiming)"/><text x="700" y="230" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Streamed to the user token by token, in real time</text><text x="572.5" y="105" text-anchor="middle" font-size="11" font-weight="600" fill="#a33a2f">risky content</text><rect x="390" y="340" width="620" height="100" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="700" y="366.45" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a33a2f">Guardrail evaluates the</text><text x="700" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a33a2f">complete response only now</text><text x="700" y="418.35" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">after the last token has already</text><text x="700" y="433.95000000000005" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">reached the user</text><line x1="997.5" y1="180" x2="700" y2="340" stroke="#a33a2f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-5-7-streamtiming)"/><rect x="60" y="470" width="1280" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">OpenAI: "streaming the model's output in a production application makes it more difficult to</text><text x="700" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">moderate the content of the completions, as partial completions may be more difficult to evaluate."</text>
</svg>