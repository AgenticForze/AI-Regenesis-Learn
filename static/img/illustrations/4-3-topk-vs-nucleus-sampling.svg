<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-topkvsnucleus desc-topkvsnucleus">
  <title id="title-topkvsnucleus">Top-k keeps a fixed number of tokens; nucleus sampling adapts to the distribution's actual shape</title>
  <desc id="desc-topkvsnucleus">Two bar-chart panels showing the same peaked six-token distribution. The left panel, top-k sampling with k=4, always includes exactly four tokens in the sampling pool regardless of shape. The right panel, nucleus sampling with p=0.9, includes only as many tokens as needed to reach 90 percent cumulative probability, which is fewer tokens here because the distribution is peaked, and would automatically include more on a flatter distribution.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Fixed pool size vs. adaptive pool size</text>
  <rect x="80" y="130" width="560" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Top-k sampling (k = 4, fixed)</text><rect x="130" y="289" width="60" height="121.00000000000001" fill="#5598e7" rx="2"/><rect x="210" y="366" width="60" height="44" fill="#5598e7" rx="2"/><rect x="290" y="383.6" width="60" height="26.4" fill="#5598e7" rx="2"/><rect x="370" y="392.4" width="60" height="17.6" fill="#5598e7" rx="2"/><rect x="450" y="403.4" width="60" height="6.6" fill="#e3e1db" rx="2"/><rect x="530" y="405.6" width="60" height="4.4" fill="#e3e1db" rx="2"/><line x1="110" y1="410" x2="610" y2="410" stroke="#898781" stroke-width="1.5"/><text x="360" y="450" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Always keeps exactly 4 tokens,</text><text x="360" y="468" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">even if the distribution is very peaked</text><rect x="720" y="130" width="560" height="340" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Nucleus (top-p) sampling (p = 0.9)</text><rect x="770" y="289" width="60" height="121.00000000000001" fill="#184f95" rx="2"/><rect x="850" y="366" width="60" height="44" fill="#184f95" rx="2"/><rect x="930" y="383.6" width="60" height="26.4" fill="#184f95" rx="2"/><rect x="1010" y="392.4" width="60" height="17.6" fill="#e3e1db" rx="2"/><rect x="1090" y="403.4" width="60" height="6.6" fill="#e3e1db" rx="2"/><rect x="1170" y="405.6" width="60" height="4.4" fill="#e3e1db" rx="2"/><line x1="750" y1="410" x2="1250" y2="410" stroke="#898781" stroke-width="1.5"/><text x="1000" y="450" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Keeps only enough tokens to reach 90%</text><text x="1000" y="468" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">cumulative probability: 3 tokens here, when peaked</text><rect x="60" y="550" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="580" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">On a flatter distribution (the model is genuinely uncertain), nucleus sampling would automatically</text><text x="680" y="597.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">include more tokens to reach the same 90% threshold, while top-k would still include exactly the</text><text x="680" y="615" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">same fixed number regardless.</text>
</svg>