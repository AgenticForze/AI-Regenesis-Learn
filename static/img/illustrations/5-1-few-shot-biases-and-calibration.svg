<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-1-bias desc-5-1-bias">
  <title id="title-5-1-bias">Three systematic biases, one calibration fix</title>
  <desc id="desc-5-1-bias">A diagram showing three systematic biases in few-shot prompted models, majority-label bias, recency bias, and common-token bias, all addressed by a contextual calibration step that probes the model with a content-free input.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three systematic biases, one calibration fix</text>
  <defs><marker id="arrow-5-1-calib" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="40" y="110" width="380" height="180" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="230" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Majority-label bias</text><text x="230" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Favors whichever label</text><text x="230" y="219" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">appeared most often</text><rect x="490" y="110" width="380" height="180" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="680" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Recency bias</text><text x="680" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Favors the label of the</text><text x="680" y="219" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">most recently shown example</text><rect x="940" y="110" width="380" height="180" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1130" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Common-token bias</text><text x="1130" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Favors tokens frequent in</text><text x="1130" y="219" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">pretraining data generally</text><rect x="420" y="380" width="520" height="110" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="680" y="431" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Contextual calibration</text><text x="680" y="449" text-anchor="middle" font-size="12.5" fill="#ffffff">probe with a content-free input, e.g. "N/A"</text><line x1="402.3" y1="290.0" x2="574.7" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-calib)"/><line x1="680.0" y1="290.0" x2="680.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-calib)"/><line x1="957.7" y1="290.0" x2="785.3" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-calib)"/><rect x="60" y="530" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="550" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Zhao et al., 2021: probing with a content-free input estimates each bias directly, letting the</text><text x="680" y="567.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">output distribution be adjusted to cancel it out, raising average accuracy and reducing variance</text><text x="680" y="585" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">across different example choices.</text>
</svg>