<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-8-overview desc-5-8-overview">
  <title id="title-5-8-overview">Three ways to shape an LLM's behavior</title>
  <desc id="desc-5-8-overview">A diagram comparing prompting, retrieval-augmented generation, and fine-tuning side by side: prompting changes what is written in the request and takes effect immediately with no training; RAG adds retrieved documents to the request so the model is grounded in current, citable source material while the base model stays frozen; fine-tuning changes the model's own weights through additional training so a behavior no longer needs to be re-explained in every request, at the cost of needing labeled data and compute.</desc>
  <defs></defs>
  <rect width="1400" height="620" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three ways to shape an LLM's behavior</text>
  <rect x="60" y="100" width="380" height="90" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="250" y="129.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Prompting</text><text x="250" y="165.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">Changes what is written</text><text x="250" y="180.04999999999998" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">in the request itself</text><rect x="60" y="210" width="380" height="150" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="250" y="244" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Takes effect immediately</text><text x="250" y="274" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No training required</text><text x="250" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Cheapest to try and revise</text><rect x="480" y="100" width="380" height="90" rx="8" fill="#5598e7" stroke="#5598e7" stroke-width="1.5"/><text x="670" y="119.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Retrieval-augmented</text><text x="670" y="139" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">generation</text><text x="670" y="174.85" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">Adds retrieved documents</text><text x="670" y="189.79999999999998" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">to the request at query</text><text x="670" y="204.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">time</text><rect x="480" y="210" width="380" height="150" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="670" y="244" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Grounds answers in current,</text><text x="670" y="274" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">citable source material</text><text x="670" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Base model stays frozen</text><rect x="900" y="100" width="380" height="90" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="1090" y="129.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Fine-tuning</text><text x="1090" y="165.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">Changes the model's own</text><text x="1090" y="180.04999999999998" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">weights through training</text><rect x="900" y="210" width="380" height="150" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1090" y="244" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No re-explaining in every</text><text x="1090" y="274" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">request once trained</text><text x="1090" y="304" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Needs labeled data and compute</text><rect x="60" y="390" width="1280" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="418.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Three different levers, not three tiers of the same lever: prompting and RAG both leave the model</text><text x="700" y="436.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">itself unchanged; fine-tuning is the only one of the three that does not.</text>
</svg>