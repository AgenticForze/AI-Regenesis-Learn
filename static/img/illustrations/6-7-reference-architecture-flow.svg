<svg width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-7-refarch desc-6-7-refarch">
  <title id="title-6-7-refarch">Three caching decisions along one request</title>
  <desc id="desc-6-7-refarch">A single-column flow diagram: a request checks a prompt cache for an exact-match static prefix, proceeds through retrieval and reranking, checks a semantic cache for a similar past question, proceeds to generation, and if the agent needs a tool call, checks a tool-call cache for a result that is still safe given how volatile the underlying data is, before arriving at a final answer.</desc>
  <rect width="1500" height="900" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Three caching decisions along one request</text>
  <defs><marker id="arrow-6-7-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-6-7-refarch-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="100" y="100" width="1300" height="68" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="136.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Request: system prompt + documents + question</text><rect x="100" y="194" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="224.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Prompt cache: exact-match static prefix?</text><text x="750" y="247.975" text-anchor="middle" font-size="10.5" fill="#6b7280">hit: ~10% price | miss: full price, then cache</text><line x1="750" y1="168" x2="750" y2="194" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/><rect x="100" y="288" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="324.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Retrieval + reranking (Ch. 6.4)</text><line x1="750" y1="262" x2="750" y2="288" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/><rect x="100" y="382" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="412.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Semantic cache: similar question above threshold?</text><text x="750" y="435.97499999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">hit: return cached response | miss: continue</text><line x1="750" y1="356" x2="750" y2="382" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/><rect x="100" y="476" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="512.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Generation</text><line x1="750" y1="450" x2="750" y2="476" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/><rect x="100" y="570" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="600.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Agent tool call needed?</text><text x="750" y="623.975" text-anchor="middle" font-size="10.5" fill="#6b7280">yes: check tool-call cache | no: skip to answer</text><line x1="750" y1="544" x2="750" y2="570" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/><rect x="100" y="664" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="694.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Tool-call cache: safe given data volatility?</text><text x="750" y="717.975" text-anchor="middle" font-size="10.5" fill="#6b7280">hit: reuse result | miss/unsafe: call live</text><line x1="750" y1="638" x2="750" y2="664" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/><rect x="100" y="758" width="1300" height="68" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="750" y="794.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Final answer</text><line x1="750" y1="732" x2="750" y2="758" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-refarch-main)"/>
</svg>