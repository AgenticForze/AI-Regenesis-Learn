<svg width="1560" height="720" viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-8-overview desc-6-8-overview">
  <title id="title-6-8-overview">Two halves of RAG evaluation</title>
  <desc id="desc-6-8-overview">A diagram showing a RAG pipeline branching into two evaluation halves: retrieval evaluation, checking whether the right documents were found using Precision at k, Recall at k, Mean Reciprocal Rank, and NDCG, and generation evaluation, checking whether the generated answer reflects those documents using Faithfulness, Context Precision, Context Recall, and Answer Relevancy.</desc>
  <rect width="1560" height="720" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Two halves of RAG evaluation</text>
  <defs><marker id="arrow-6-8-overview-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="650" stroke="#1f3a5f" stroke-width="3"/><rect x="740" y="130" width="320" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="900" y="159.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">RAG pipeline (retrieval +</text><text x="900" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">generation)</text><rect x="20" y="145" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">SYSTEM</text><rect x="280" y="280" width="590" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="575" y="321.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Retrieval evaluation</text><text x="575" y="345.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">were the right documents found?</text><rect x="930" y="280" width="590" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1225" y="321.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Generation evaluation</text><text x="1225" y="345.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">does the answer reflect what was found?</text><line x1="840" y1="200" x2="575" y2="280" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-overview-main)"/><line x1="960" y1="200" x2="1225" y2="280" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-overview-main)"/><rect x="280" y="420" width="590" height="42" rx="8" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.3"/><text x="575" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Precision@k</text><rect x="280" y="474" width="590" height="42" rx="8" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.3"/><text x="575" y="499" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Recall@k</text><rect x="280" y="528" width="590" height="42" rx="8" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.3"/><text x="575" y="553" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Mean Reciprocal Rank</text><rect x="280" y="582" width="590" height="42" rx="8" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.3"/><text x="575" y="607" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">NDCG</text><rect x="930" y="420" width="590" height="42" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="1225" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Faithfulness</text><rect x="930" y="474" width="590" height="42" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="1225" y="499" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Context Precision</text><rect x="930" y="528" width="590" height="42" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="1225" y="553" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Context Recall</text><rect x="930" y="582" width="590" height="42" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="1225" y="607" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2d3d">Answer Relevancy</text><line x1="575" y1="370" x2="575" y2="420" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-8-overview-main)"/><line x1="1225" y1="370" x2="1225" y2="420" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-8-overview-main)"/>
