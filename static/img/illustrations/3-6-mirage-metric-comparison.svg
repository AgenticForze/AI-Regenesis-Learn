<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-miragecheck desc-miragecheck">
  <title id="title-miragecheck">The same underlying model can look like it "emerges" or improves smoothly, depending on the metric</title>
  <desc id="desc-miragecheck">The same sequence of models evaluated on the same task can show a sharp jump under a discontinuous exact-match metric, where any single wrong token fails the whole answer, while a continuous per-token metric on the identical models reveals a smooth, gradual improvement underneath, the core argument of the emergent-abilities mirage critique.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Schaefer et al.: metric choice can manufacture apparent emergence</text>
  <text x="340" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Discontinuous metric (exact-match)</text><text x="1020" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Continuous metric (per-token score)</text><line x1="120" y1="420" x2="600" y2="420" stroke="#898781" stroke-width="1.5"/><line x1="120" y1="420" x2="120" y2="120" stroke="#898781" stroke-width="1.5"/><text x="360" y="454" text-anchor="middle" font-size="12.5" fill="#52514e">model scale →</text><line x1="800" y1="420" x2="1280" y2="420" stroke="#898781" stroke-width="1.5"/><line x1="800" y1="420" x2="800" y2="120" stroke="#898781" stroke-width="1.5"/><text x="1040" y="454" text-anchor="middle" font-size="12.5" fill="#52514e">model scale →</text><path d="M 130 415 L 420 412 C 440 410, 455 200, 480 150 L 590 130" fill="none" stroke="#a33a2f" stroke-width="3"/><line x1="450" y1="420" x2="450" y2="120" stroke="#e3e1db" stroke-width="1.5" stroke-dasharray="5,5"/><path d="M 810 400 L 829.2 394.5 L 848.3 388.9 L 867.5 383.2 L 886.7 377.3 L 905.8 371.3 L 925.0 365.2 L 944.2 358.8 L 963.3 352.3 L 982.5 345.5 L 1001.7 338.6 L 1020.8 331.4 L 1040.0 323.8 L 1059.2 316.0 L 1078.3 307.8 L 1097.5 299.2 L 1116.7 290.1 L 1135.8 280.4 L 1155.0 270.0 L 1174.2 258.7 L 1193.3 246.1 L 1212.5 231.9 L 1231.7 215.1 L 1250.8 193.1 L 1270.0 140.0" fill="none" stroke="#2a78d6" stroke-width="3"/><rect x="60" y="470" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Same models, same task: an all-or-nothing metric can manufacture a sharp jump that a graded,</text><text x="680" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">per-token metric shows was gradual all along.</text>
</svg>