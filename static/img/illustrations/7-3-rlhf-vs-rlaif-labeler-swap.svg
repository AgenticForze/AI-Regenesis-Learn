<svg width="1500" height="660" viewBox="0 0 1500 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-3-swap desc-7-3-swap">
  <title id="title-7-3-swap">RLAIF swaps the labeler, not the pipeline</title>
  <desc id="desc-7-3-swap">Two parallel pipelines sharing the same reward-model-plus-reinforcement-learning structure. RLHF's preference labels come from human reviewers comparing pairs of model outputs. RLAIF's preference labels come from an AI model performing the same comparison, feeding into the same reward model and reinforcement learning stage. A note states RLAIF achieves performance on-par with RLHF.</desc>
  <rect width="1500" height="660" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">RLAIF swaps the labeler, not the pipeline</text>
  <defs><marker id="arrow-7-3-swap-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="351" y="60" width="58" height="26" rx="13" fill="#6b7280" /><text x="380" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">RLHF</text><rect x="1087.25" y="60" width="65.5" height="26" rx="13" fill="#5b8fc9" /><text x="1120" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">RLAIF</text><rect x="150" y="110" width="460" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="380" y="148.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Human reviewers compare pairs</text><text x="380" y="166.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">of outputs</text><rect x="890" y="110" width="460" height="90" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1120" y="148.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">An AI model compares pairs of</text><text x="1120" y="166.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">outputs</text><line x1="380" y1="200" x2="690" y2="260" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-swap-main)"/><line x1="1120" y1="200" x2="810" y2="260" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-swap-main)"/><rect x="520" y="260" width="460" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="298.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Reward model trained on the</text><text x="750" y="315.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">preference dataset</text><line x1="750" y1="350" x2="750" y2="400" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-swap-main)"/><rect x="520" y="400" width="460" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="439.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Reinforcement learning (e.g.</text><text x="750" y="455.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">PPO) against the reward model</text><line x1="750" y1="490" x2="750" y2="540" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-swap-main)"/><rect x="520" y="540" width="460" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="750" y="576.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Aligned model</text><text x="750" y="601.0500000000001" text-anchor="middle" font-size="10.5" fill="#6b7280">"comparable performance to RLHF" (Lee et al.)</text>
</svg>