<svg width="1420" height="700" viewBox="0 0 1420 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-4-mask desc-5-4-mask">
  <title id="title-5-4-mask">Token masking at each decoding step</title>
  <desc id="desc-5-4-mask">A diagram showing a grammar automaton in its current state feeding into a mask over the full model vocabulary, where tokens inconsistent with the grammar are crossed out in red and only tokens the grammar allows remain available in blue, with sampling restricted to only those valid tokens.</desc>
  <defs></defs>
  <rect width="1420" height="700" fill="#fcfcfb"/>
  <text x="710" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Token masking at each decoding step</text>
  <defs><marker id="arrow-5-4-mask" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="540" y="90" width="340" height="65" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="710" y="115.35" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Grammar automaton,</text><text x="710" y="132.25" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">current state</text><rect x="260" y="220" width="900" height="130" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="710" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Full model vocabulary, one logit per token</text><rect x="306" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="316" y1="285" x2="366" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="366" y1="285" x2="316" y2="315" stroke="#a33a2f" stroke-width="1.5"/><rect x="388" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="398" y1="285" x2="448" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="448" y1="285" x2="398" y2="315" stroke="#a33a2f" stroke-width="1.5"/><rect x="470" y="275" width="70" height="50" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="505" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">valid</text><rect x="552" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="562" y1="285" x2="612" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="612" y1="285" x2="562" y2="315" stroke="#a33a2f" stroke-width="1.5"/><rect x="634" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="644" y1="285" x2="694" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="694" y1="285" x2="644" y2="315" stroke="#a33a2f" stroke-width="1.5"/><rect x="716" y="275" width="70" height="50" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="751" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">valid</text><rect x="798" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="808" y1="285" x2="858" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="858" y1="285" x2="808" y2="315" stroke="#a33a2f" stroke-width="1.5"/><rect x="880" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="890" y1="285" x2="940" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="940" y1="285" x2="890" y2="315" stroke="#a33a2f" stroke-width="1.5"/><rect x="962" y="275" width="70" height="50" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="997" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">valid</text><rect x="1044" y="275" width="70" height="50" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><line x1="1054" y1="285" x2="1104" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="1104" y1="285" x2="1054" y2="315" stroke="#a33a2f" stroke-width="1.5"/><line x1="710.0" y1="155.0" x2="710.0" y2="220.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-mask)"/><rect x="550" y="430" width="320" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="710" y="457.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Sample only from valid</text><text x="710" y="474.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">tokens</text><line x1="710.0" y1="350.0" x2="710.0" y2="430.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-mask)"/><text x="710" y="540" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Masked-out tokens (red, crossed out) cannot be produced no matter their raw probability;</text><text x="710" y="560" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">sampling happens only among the tokens the grammar leaves valid (blue).</text><rect x="60" y="590" width="1300" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="710" y="615" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">OpenAI, 2024: a JSON Schema is compiled into a context-free grammar, and after every token the</text><text x="710" y="632.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">inference engine determines which tokens are valid to produce next based on the grammar's rules and</text><text x="710" y="650" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">what has already been generated.</text>
</svg>