<svg width="1360" height="520" viewBox="0 0 1360 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-tok-pipe desc-tok-pipe">
  <title id="title-tok-pipe">Raw text becomes numbers through a fixed pipeline ending in a learned embedding lookup</title>
  <desc id="desc-tok-pipe">A five-stage pipeline: raw text is normalized, split into tokens, mapped to integer token IDs via a vocabulary, and finally mapped to dense embedding vectors via a learned embedding matrix.</desc>
  <defs><marker id="arr31a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs>
  <rect width="1360" height="520" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">From raw text to dense vectors</text>
  <rect x="50" y="200" width="210" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="155" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">"The account</text><text x="155" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">was overdrawn"</text><text x="155" y="312" text-anchor="middle" font-size="12" fill="#52514e">raw text</text><rect x="300" y="200" width="210" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="405" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">the account</text><text x="405" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">was overdrawn</text><text x="405" y="312" text-anchor="middle" font-size="12" fill="#52514e">normalized</text><line x1="260" y1="245" x2="300" y2="245" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr31a)"/><rect x="550" y="200" width="210" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="655" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">[the][account]</text><text x="655" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">[was][overdrawn]</text><text x="655" y="312" text-anchor="middle" font-size="12" fill="#52514e">tokens</text><line x1="510" y1="245" x2="550" y2="245" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr31a)"/><rect x="800" y="200" width="210" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="905" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">[41, 892,</text><text x="905" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">17, 3305]</text><text x="905" y="312" text-anchor="middle" font-size="12" fill="#52514e">token IDs</text><line x1="760" y1="245" x2="800" y2="245" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr31a)"/><rect x="1050" y="200" width="210" height="90" rx="8" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="1155" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4 dense</text><text x="1155" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">vectors</text><text x="1155" y="312" text-anchor="middle" font-size="12" fill="#52514e">embeddings</text><line x1="1010" y1="245" x2="1050" y2="245" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr31a)"/><text x="680" y="160" text-anchor="middle" font-size="14" fill="#52514e">Two hops turn text into numbers: text &#8594; IDs is fixed by the tokenizer, IDs &#8594; vectors is learned</text><rect x="50" y="350" width="1260" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="373.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Only the last step (embedding lookup) has trainable parameters; normalization, tokenization, and</text><text x="680" y="391.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">vocabulary lookup are fixed rules applied consistently every time.</text>
</svg>