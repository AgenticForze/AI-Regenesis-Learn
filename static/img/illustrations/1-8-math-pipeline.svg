<svg width="1300" height="600" viewBox="0 0 1300 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-mp desc-mp">
  <title id="title-mp">A training loop showing where linear algebra, probability, optimization, and statistics each do their work</title>
  <desc id="desc-mp">Feature vectors and matrices, from linear algebra, feed a model that computes predictions. A probability-based loss function scores how wrong those predictions are. Gradient descent, an optimization procedure, updates the parameters to reduce that loss, and the loop repeats. After training, statistics is used to evaluate whether the resulting model is genuinely better than the one it replaced.</desc>
  <rect width="1300" height="600" fill="#fcfcfb"/>

  <text x="650" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Four math areas, one training loop</text>

  <!-- Linear algebra -->
  <rect x="40" y="100" width="230" height="110" rx="10" fill="#86b6ef"/>
  <text x="155" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">LINEAR ALGEBRA</text>
  <text x="155" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Feature Vectors</text>
  <text x="155" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">and Matrices</text>
  <text x="155" y="198" text-anchor="middle" font-size="10.5" fill="#184f95">represents the data</text>

  <!-- Model predictions -->
  <rect x="340" y="100" width="230" height="110" rx="10" fill="#5598e7"/>
  <text x="455" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">MATRIX MULTIPLY</text>
  <text x="455" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Model Computes</text>
  <text x="455" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Predictions</text>
  <text x="455" y="198" text-anchor="middle" font-size="10.5" fill="#eaf2fc">data times parameters</text>

  <!-- Loss -->
  <rect x="640" y="100" width="230" height="110" rx="10" fill="#2a78d6"/>
  <text x="755" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">PROBABILITY</text>
  <text x="755" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Loss Function</text>
  <text x="755" y="198" text-anchor="middle" font-size="10.5" fill="#cde2fb">scores how wrong</text>

  <!-- Optimization -->
  <rect x="940" y="100" width="230" height="110" rx="10" fill="#104281"/>
  <text x="1055" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">OPTIMIZATION</text>
  <text x="1055" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Gradient Descent</text>
  <text x="1055" y="198" text-anchor="middle" font-size="10.5" fill="#9fb8d6">theta = theta - eta * grad(L)</text>

  <defs>
    <marker id="arrMP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52514e"/>
    </marker>
  </defs>

  <line x1="270" y1="155" x2="335" y2="155" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrMP)"/>
  <line x1="570" y1="155" x2="635" y2="155" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrMP)"/>
  <line x1="870" y1="155" x2="935" y2="155" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrMP)"/>

  <!-- loop back -->
  <line x1="1055" y1="210" x2="1055" y2="270" stroke="#52514e" stroke-width="1.5"/>
  <line x1="1055" y1="270" x2="455" y2="270" stroke="#52514e" stroke-width="1.5"/>
  <line x1="455" y1="270" x2="455" y2="215" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrMP)"/>
  <rect x="330" y="248" width="250" height="44" rx="8" fill="#eaf2fc"/>
  <text x="455" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">Updated parameters feed the next round</text>

  <!-- Statistics -->
  <rect x="940" y="330" width="230" height="110" rx="10" fill="#0d2c4e"/>
  <text x="1055" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">STATISTICS</text>
  <text x="1055" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Evaluate the Result</text>
  <text x="1055" y="410" text-anchor="middle" font-size="10.5" fill="#9fb8d6">is the new model really better?</text>
  <line x1="1055" y1="270" x2="1055" y2="325" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrMP)"/>

  <rect x="60" y="460" width="1180" height="70" rx="10" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/>
  <text x="650" y="488" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2f">These are not competing techniques</text>
  <text x="650" y="508" text-anchor="middle" font-size="12" fill="#a33a2f">they are four different jobs inside the same training loop, and most chapters need all four at once</text>
</svg>
