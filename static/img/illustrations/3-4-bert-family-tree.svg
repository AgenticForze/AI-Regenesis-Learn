<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-bertfamily desc-bertfamily">
  <title id="title-bertfamily">The BERT family: three different kinds of change from the same masked-LM root</title>
  <desc id="desc-bertfamily">BERT at the root, trained with masked language modeling and next sentence prediction, branches into RoBERTa (a training-recipe change: more data, dynamic masking, dropped NSP), ALBERT (an efficiency-architecture change: shared layer parameters and factorized embeddings), and DeBERTa (an attention-mechanism change: disentangled content and position representations).</desc>
  <defs><marker id="arr34b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">One root objective, three different kinds of evolution</text>
  <rect x="560" y="70" width="180" height="60" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="650" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">BERT</text><text x="650" y="114" text-anchor="middle" font-size="11" fill="#cde2fb">MLM + NSP</text><line x1="604.0" y1="130.0" x2="374.3" y2="280.0" stroke="#184f95" stroke-width="2" marker-end="url(#arr34b)"/><rect x="150" y="280" width="280" height="110" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="290" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">RoBERTa</text><text x="290" y="338" text-anchor="middle" font-size="12" fill="#52514e">more data, dynamic masking,</text><text x="290" y="356" text-anchor="middle" font-size="12" fill="#52514e">drop NSP</text><line x1="652.6" y1="130.0" x2="665.3" y2="280.0" stroke="#184f95" stroke-width="2" marker-end="url(#arr34b)"/><rect x="530" y="280" width="280" height="110" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="670" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">ALBERT</text><text x="670" y="338" text-anchor="middle" font-size="12" fill="#52514e">shared layer params,</text><text x="670" y="356" text-anchor="middle" font-size="12" fill="#52514e">factorized embeddings</text><line x1="701.1" y1="130.0" x2="956.4" y2="280.0" stroke="#184f95" stroke-width="2" marker-end="url(#arr34b)"/><rect x="910" y="280" width="280" height="110" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">DeBERTa</text><text x="1050" y="338" text-anchor="middle" font-size="12" fill="#52514e">disentangled</text><text x="1050" y="356" text-anchor="middle" font-size="12" fill="#52514e">content/position attention</text><rect x="90" y="430" width="1120" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="458.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">RoBERTa changed only training recipe. ALBERT and DeBERTa each changed a specific architectural</text><text x="650" y="476.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">mechanism, not just scale.</text>
</svg>