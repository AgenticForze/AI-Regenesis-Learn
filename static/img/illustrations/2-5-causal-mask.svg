<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-mask desc-mask">
  <title id="title-mask">The decoder masks future positions; the encoder attends freely in both directions</title>
  <desc id="desc-mask">Two 6 by 6 grids representing attention matrices. The left grid, labeled encoder self-attention, has every cell filled in, showing every position can attend to every other position. The right grid, labeled decoder self-attention, has only the lower-triangular cells filled in, showing each position can only attend to itself and earlier positions, with later positions masked out.</desc>
