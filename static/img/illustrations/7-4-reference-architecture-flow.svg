<svg width="1560" height="780" viewBox="0 0 1560 780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-4-refarch desc-7-4-refarch">
  <title id="title-7-4-refarch">Where domain adaptation and continual pretraining fit relative to fine-tuning</title>
  <desc id="desc-7-4-refarch">A flow diagram starting from a pretrained base model, splitting into two questions. If the gap is domain knowledge, the path runs through domain-adaptive pretraining, then task-adaptive pretraining, then task fine-tuning. If the model needs ongoing updates over time, the path runs through continual pretraining using LR re-warming, LR re-decaying, and replay, producing an updated base model that loops back into the same ongoing-updates question for the next cycle.</desc>
  <rect width="1560" height="780" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Where domain adaptation and continual pretraining fit relative to fine-tuning</text>
  <defs><marker id="arrow-7-4-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-7-4-refarch-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="590" y="90" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="127.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Pretrained base model</text><line x1="780" y1="160" x2="410" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><line x1="780" y1="160" x2="1150" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><rect x="200" y="220" width="420" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="410" y="267.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Gap is domain knowledge?</text><rect x="940" y="220" width="420" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1150" y="259.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Needs ongoing updates over</text><text x="1150" y="275.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">time?</text><line x1="410" y1="310" x2="410" y2="360" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><rect x="200" y="360" width="420" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="410" y="388.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Domain-adaptive</text><text x="410" y="404.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">pretraining</text><text x="410" y="428.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">unlabeled domain text</text><line x1="410" y1="440" x2="410" y2="480" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><rect x="200" y="480" width="420" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="410" y="516.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Task-adaptive pretraining</text><text x="410" y="539.975" text-anchor="middle" font-size="10.5" fill="#6b7280">unlabeled task text</text><line x1="410" y1="560" x2="410" y2="600" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><rect x="200" y="600" width="420" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="410" y="636.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Task fine-tuning</text><text x="410" y="659.975" text-anchor="middle" font-size="10.5" fill="#6b7280">Chapters 7.1-7.2</text><line x1="1150" y1="310" x2="1150" y2="360" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><rect x="940" y="360" width="420" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1150" y="399.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Continual pretraining: LR</text><text x="1150" y="415" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">re-warm, LR re-decay, replay</text><line x1="1150" y1="450" x2="1150" y2="500" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-refarch-main)"/><rect x="940" y="500" width="420" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1150" y="542.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Updated base model</text><path d="M 1360 540 L 1420 540 L 1420 265 L 1360 265" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-4-refarch-cross)"/><text x="1428" y="402.5" font-size="11.5" fill="#6b7280">next update cycle</text>
</svg>