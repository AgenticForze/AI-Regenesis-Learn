<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-2-selfcon desc-5-2-selfcon">
  <title id="title-5-2-selfcon">Self-consistency: sampling multiple paths and voting</title>
  <desc id="desc-5-2-selfcon">A diagram showing an ambiguous question feeding into three independently sampled reasoning paths, two of which reach the answer 42 and one of which reaches 17, converging into a majority vote that selects 42 as the final answer.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Self-consistency: sampling multiple paths and voting</text>
  <defs><marker id="arrow-5-2-selfcon" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="490" y="60" width="380" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="91.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Ambiguous question</text><rect x="110" y="200" width="340" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="280" y="240.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Sampled path A</text><text x="280" y="274.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">reasons through the problem,</text><text x="280" y="290.175" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">reaches: 42</text><line x1="607.3" y1="120.0" x2="413.3" y2="200.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><rect x="510" y="200" width="340" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="240.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Sampled path B</text><text x="680" y="274.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">a different valid route,</text><text x="680" y="290.175" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">reaches: 42</text><line x1="680.0" y1="120.0" x2="680.0" y2="200.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><rect x="910" y="200" width="340" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1080" y="240.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Sampled path C</text><text x="1080" y="274.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">a less careful route, reaches:</text><text x="1080" y="290.175" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">17</text><line x1="752.7" y1="120.0" x2="946.7" y2="200.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><rect x="440" y="380" width="480" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="409.575" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Majority vote</text><text x="680" y="445.675" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">42 appears in 2 of 3</text><text x="680" y="461.925" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">sampled paths</text><line x1="409.4" y1="310.0" x2="574.1" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><line x1="680.0" y1="310.0" x2="680.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><line x1="950.6" y1="310.0" x2="785.9" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><rect x="550" y="510" width="260" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="538.85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Final answer: 42</text><line x1="680.0" y1="470.0" x2="680.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-selfcon)"/><rect x="60" y="590" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="605" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Wang et al., 2022/2023: a genuinely correct answer tends to be reachable by multiple different valid</text><text x="680" y="622.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">lines of reasoning, so majority voting across independently sampled paths improves accuracy over a</text><text x="680" y="640" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">single greedily decoded path.</text>
</svg>