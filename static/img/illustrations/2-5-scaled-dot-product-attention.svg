<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-sdpa desc-sdpa">
  <title id="title-sdpa">The scaled dot-product attention pipeline: from queries, keys, and values to a weighted output</title>
  <desc id="desc-sdpa">A flow diagram showing query, key, and value vectors feeding a matrix multiply to produce similarity scores, which are scaled by one over the square root of the key dimension, passed through softmax to produce attention weights, and used to compute a weighted sum of the value vectors as the final output.</desc>
  <rect width="1200" height="800" fill="#fcfcfb"/><text x="600" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Scaled dot-product attention, step by step</text><rect x="325" y="110" width="110" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="380" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Q</text><rect x="545" y="110" width="110" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="600" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">K</text><rect x="765" y="110" width="110" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="820" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">V</text><rect x="290" y="201" width="620" height="70" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="600" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Q · K^T</text><text x="600" y="253" text-anchor="middle" font-size="12" fill="#52514e">similarity score between every query and key</text><line x1="600" y1="271" x2="600" y2="306" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowsd)"/><rect x="290" y="306" width="620" height="70" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="600" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">scale by 1/√d_k</text><text x="600" y="358" text-anchor="middle" font-size="12" fill="#52514e">keeps scores in a range where softmax gradients stay informative</text><line x1="600" y1="376" x2="600" y2="411" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowsd)"/><rect x="290" y="411" width="620" height="70" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="600" y="441" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">softmax (row-wise)</text><text x="600" y="463" text-anchor="middle" font-size="12" fill="#52514e">turns each row of scores into weights that sum to 1</text><line x1="600" y1="481" x2="600" y2="516" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowsd)"/><rect x="290" y="516" width="620" height="70" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="600" y="546" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">weighted sum with V</text><text x="600" y="568" text-anchor="middle" font-size="12" fill="#52514e">attention output: a blend of value vectors</text><line x1="380" y1="156" x2="350" y2="201" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrowsd)"/><line x1="600" y1="156" x2="850" y2="201" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrowsd)"/><line x1="820" y1="156" x2="870" y2="516" stroke="#104281" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowsd)"/><defs><marker id="arrowsd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="90" y="636" width="1020" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="600" y="669" text-anchor="middle" font-size="12.5" fill="#52514e">Attention(Q, K, V) = softmax(QK^T / √d_k) · V</text></svg>