<svg width="1500" height="920" viewBox="0 0 1500 920" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-5-refarch desc-6-5-refarch">
  <title id="title-6-5-refarch">Advanced patterns wrapped around the Chapter 6.4 pipeline</title>
  <desc id="desc-6-5-refarch">A two-column diagram: the left column moves a user query through optional decomposition, HyDE rewriting, retrieval, and reranking; the right column shows a GraphRAG index feeding global and local graph search into retrieval, and a reason-and-critique step, ReAct or Self-RAG, that either loops back to retrieval with a refined query or proceeds to grounded generation and a cited answer.</desc>
  <rect width="1500" height="920" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Advanced patterns wrapped around the Chapter 6.4 pipeline</text>
