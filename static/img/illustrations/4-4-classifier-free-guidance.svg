<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-cfg desc-cfg">
  <title id="title-cfg">Classifier-free guidance sharpens prompt adherence without a separate classifier</title>
  <desc id="desc-cfg">One diffusion model produces both a conditional prediction (text prompt present) and an unconditional prediction (text prompt dropped). At sampling time, the result extrapolates away from the unconditional prediction and toward the conditional one, by a tunable guidance strength.</desc>
  <defs><marker id="arr44c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">One model, two predictions, one sharpened result</text>
  <rect x="560" y="80" width="240" height="90" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Same diffusion model</text><text x="680" y="139" text-anchor="middle" font-size="11" fill="#cde2fb">trained both ways</text><rect x="200" y="260" width="320" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Conditional prediction</text><text x="360" y="319" text-anchor="middle" font-size="11" fill="#52514e">text prompt present</text><line x1="640" y1="170" x2="360" y2="260" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44c)"/><rect x="840" y="260" width="320" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1000" y="301" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Unconditional prediction</text><text x="1000" y="319" text-anchor="middle" font-size="11" fill="#52514e">text prompt dropped</text><line x1="720" y1="170" x2="1000" y2="260" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44c)"/><rect x="500" y="430" width="360" height="90" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="471" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Extrapolate away from unconditional,</text><text x="680" y="489" text-anchor="middle" font-size="11" fill="#cde2fb">toward conditional, by guidance strength</text><line x1="390" y1="350" x2="620" y2="430" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44c)"/><line x1="970" y1="350" x2="740" y2="430" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44c)"/><rect x="60" y="540" width="1240" height="50" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="558.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No separate classifier is trained or used; the same model simply learns both a conditional and</text><text x="680" y="576.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">unconditional denoising step.</text>
</svg>