<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-prefilldecode desc-prefilldecode">
  <title id="title-prefilldecode">Prefill and decode are two phases with two different cost profiles</title>
  <desc id="desc-prefilldecode">Two panels. The left panel shows prefill: the entire prompt processed at once, compute-bound, with cost growing quadratically with prompt length. The right panel shows decode: one new token generated at a time while reading an ever-growing KV cache of prior tokens, memory-bandwidth-bound, with cost growing linearly with sequence length.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two phases, two different bottlenecks</text>
  <rect x="80" y="120" width="560" height="340" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Prefill</text><rect x="120" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="182" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="244" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="306" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="368" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="430" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="492" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><rect x="554" y="180" width="48" height="34" rx="4" fill="#2a78d6"/><text x="360" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Entire prompt processed at once</text><text x="360" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Compute-bound: cost grows with the square</text><text x="360" y="309" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">of prompt length (quadratic self-attention)</text><rect x="720" y="120" width="560" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Decode</text><rect x="760" y="180" width="48" height="34" rx="4" fill="#898781"/><rect x="822" y="180" width="48" height="34" rx="4" fill="#898781"/><rect x="884" y="180" width="48" height="34" rx="4" fill="#898781"/><rect x="946" y="180" width="48" height="34" rx="4" fill="#898781"/><rect x="1008" y="180" width="48" height="34" rx="4" fill="#898781"/><rect x="1070" y="180" width="48" height="34" rx="4" fill="#184f95"/><text x="1000" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">One new token at a time (dark)</text><text x="1000" y="280" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Memory-bandwidth-bound: must read the whole</text><text x="1000" y="299" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">growing KV cache (gray) at every single step</text><rect x="60" y="520" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="540" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Both phases get more expensive as context grows, but for different reasons: prefill because</text><text x="680" y="557.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">attention compute scales quadratically, decode because the KV cache to read at every step grows</text><text x="680" y="575" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">linearly.</text>
</svg>