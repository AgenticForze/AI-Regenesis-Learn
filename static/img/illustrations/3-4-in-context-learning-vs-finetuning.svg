<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-icl desc-icl">
  <title id="title-icl">In-context learning adapts a GPT-family model at deployment time; BERT-family models require fine-tuning beforehand</title>
  <desc id="desc-icl">Left panel: a GPT-family model adapts to a new classification task from a few examples placed directly in the prompt, with no weight updates. Right panel: a BERT-family model requires collecting labeled examples, adding a task head, training, and deploying a fixed checkpoint before it can perform a new task.</desc>
  <defs></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two different points in time where adaptation happens</text>
  <rect x="90" y="130" width="520" height="340" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="350" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">GPT: in-context learning</text><rect x="120" y="190" width="460" height="150" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.2"/><text x="135" y="215" font-size="11.5" fill="#0b0b0b">"positive" -&gt; happy    example 1</text><text x="135" y="240" font-size="11.5" fill="#0b0b0b">"negative" -&gt; sad      example 2</text><text x="135" y="265" font-size="11.5" fill="#0b0b0b">"great service!" -&gt; ?  new input</text><text x="135" y="300" font-size="12" font-weight="700" fill="#184f95">all in ONE prompt, no weight updates</text><text x="350" y="410" text-anchor="middle" font-size="12" fill="#52514e">adapts to a new task format instantly</text><text x="350" y="430" text-anchor="middle" font-size="12" fill="#52514e">at deployment time, from the prompt alone</text><rect x="690" y="130" width="520" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="950" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">BERT: fine-tuning required</text><rect x="730" y="200" width="440" height="36" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1"/><text x="950" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">1. collect labeled examples</text><rect x="730" y="245" width="440" height="36" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1"/><text x="950" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">2. add task-specific head</text><rect x="730" y="290" width="440" height="36" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1"/><text x="950" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">3. train (update weights)</text><rect x="730" y="335" width="440" height="36" rx="8" fill="#fcfcfb" stroke="#898781" stroke-width="1"/><text x="950" y="357" text-anchor="middle" font-size="12" font-weight="600" fill="#0b0b0b">4. deploy fixed checkpoint</text><text x="950" y="410" text-anchor="middle" font-size="12" fill="#52514e">a new task means repeating this whole cycle,</text><text x="950" y="430" text-anchor="middle" font-size="12" fill="#52514e">before deployment, not at it</text><rect x="90" y="500" width="1120" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="513.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Neither approach is strictly better: fine-tuning gives a stable, validated, repeatable checkpoint; prompting</text><text x="650" y="531.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">trades that stability for zero-setup flexibility.</text>
</svg>