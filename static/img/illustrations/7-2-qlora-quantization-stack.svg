<svg width="1480" height="660" viewBox="0 0 1480 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-2-qlora desc-7-2-qlora">
  <title id="title-7-2-qlora">QLoRA's stack: quantize the base, keep the adapter at full precision</title>
  <desc id="desc-7-2-qlora">A diagram showing QLoRA's memory-saving stack applied only to the frozen base model: 4-bit NormalFloat quantization, then double quantization of the quantization constants themselves, then paged optimizers to absorb memory spikes during training. In parallel, the trainable LoRA adapter pair stays at full precision throughout, unaffected by any of the quantization steps. The combination lets a 65-billion-parameter model be fine-tuned on a single 48GB GPU.</desc>
  <rect width="1480" height="660" fill="#fbfaf7"/>
  <text x="740" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">QLoRA's stack: quantize the base, keep the adapter at full precision</text>
  <defs><marker id="arrow-7-2-qlora-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="140" y="100" width="460" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="370" y="128.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Frozen base model, full</text><text x="370" y="144.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">precision</text><text x="370" y="168.1" text-anchor="middle" font-size="10.5" fill="#6b7280">the starting checkpoint</text><line x1="370" y1="180" x2="370" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-qlora-main)"/><rect x="140" y="220" width="460" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="370" y="256.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">4-bit NormalFloat (NF4)</text><text x="370" y="279.97499999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">optimal for normally distributed weights (Dettmers et al.)</text><line x1="370" y1="300" x2="370" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-qlora-main)"/><rect x="140" y="340" width="460" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="370" y="376.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Double quantization</text><text x="370" y="399.97499999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">quantizes the quantization constants themselves</text><line x1="370" y1="420" x2="370" y2="460" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-qlora-main)"/><rect x="140" y="460" width="460" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="370" y="496.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Paged optimizers</text><text x="370" y="519.9749999999999" text-anchor="middle" font-size="10.5" fill="#6b7280">absorb memory spikes during training</text><rect x="800" y="220" width="460" height="240" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1030" y="327.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Trainable LoRA adapter</text><text x="1030" y="345.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">pair (A, B)</text><text x="1030" y="369.8" text-anchor="middle" font-size="10.5" fill="#6b7280">stays at full precision throughout, unaffected by quantization</text><line x1="370" y1="540" x2="660" y2="570" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-qlora-main)"/><line x1="1030" y1="460" x2="740" y2="570" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-qlora-main)"/><rect x="470" y="570" width="460" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="700" y="599.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Result: a 65B model fine-tunes</text><text x="700" y="615.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">on one 48GB GPU</text><rect x="20" y="260" width="100" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="70" y="285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">QUANTIZED</text><rect x="1290" y="320" width="160" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="1370" y="345" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">FULL PRECISION</text>
</svg>