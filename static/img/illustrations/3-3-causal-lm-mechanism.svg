<svg width="1300" height="520" viewBox="0 0 1300 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-causal desc-causal">
  <title id="title-causal">A causal language model predicts each next token using only tokens that came before it</title>
  <desc id="desc-causal">A sequence of tokens, the, account, was, feeding into a prediction of the next token, overdrawn, with attention arrows showing the final position attending back to every prior position but never forward.</desc>
  <defs><marker id="arr33a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1300" height="520" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Causal language modeling: predict left to right</text>
  <rect x="120" y="220" width="190" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="215" y="254.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">"the"</text><rect x="340" y="220" width="190" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="435" y="254.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">"account"</text><rect x="560" y="220" width="190" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="655" y="254.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">"was"</text><rect x="780" y="220" width="190" height="60" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="875" y="254.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">predict: "overdrawn"</text><path d="M 215 280 Q 545 350, 875 280" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr33a)"/><path d="M 435 280 Q 655 350, 875 280" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr33a)"/><path d="M 655 280 Q 765 350, 875 280" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr33a)"/><text x="1075" y="110" text-anchor="middle" font-size="12" fill="#a33a2f">(no future tokens exist yet)</text><text x="650" y="90" text-anchor="middle" font-size="14" fill="#52514e">"the account was" &#8594; predict next token, using only prior tokens</text><rect x="90" y="340" width="1120" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="363.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The causal mask sets the attention score to negative infinity for every later position before the</text><text x="650" y="381.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">softmax, so generation is inherently one token at a time.</text>
</svg>