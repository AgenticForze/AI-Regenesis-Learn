<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-3-archetypes desc-6-3-archetypes">
  <title id="title-6-3-archetypes">Four answers to who operates the system and where the data lives</title>
  <desc id="desc-6-3-archetypes">A four-panel diagram comparing four vector database deployment archetypes: fully managed serverless systems like Pinecone that separate storage and compute in a vendor's cloud; self-hosted distributed systems like Milvus that bring similar disaggregation to a team's own infrastructure; systems like pgvector that add vector search directly to a relational database a team already runs; and embedded, lightweight systems like Chroma that run in-process or as a local server.</desc>
  <defs></defs>
  <rect width="1560" height="700" fill="#fcfcfb"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Four answers to who operates the system and where the data lives</text>
  <rect x="50" y="130" width="330" height="74" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="215" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Pinecone</text><text x="215" y="184" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">Managed serverless</text><rect x="50" y="224" width="330" height="130" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><rect x="80" y="238" width="270" height="34" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.2"/><text x="215" y="259" text-anchor="middle" font-size="10" font-weight="700" fill="#184f95">compute (query executors)</text><rect x="70" y="294" width="290" height="50" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.2"/><text x="215" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="#184f95">object storage</text><rect x="86" y="320" width="40" height="16" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="134" y="320" width="40" height="16" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><rect x="182" y="320" width="40" height="16" rx="3" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><line x1="215" y1="272" x2="215" y2="294" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3 3"/><text x="215" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Storage and compute separated</text><text x="215" y="399.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">entirely</text><text x="215" y="431" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">"Virtually unlimited</text><text x="215" y="446.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">scalability" via object</text><text x="215" y="462" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">storage</text><text x="215" y="493.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">No infrastructure for a team</text><text x="215" y="509" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">to run</text><rect x="416" y="130" width="330" height="74" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="581" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Milvus</text><text x="581" y="184" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">Self-hosted</text><text x="581" y="199" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">distributed</text><rect x="416" y="224" width="330" height="130" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><rect x="424" y="232" width="314" height="114" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.3" stroke-dasharray="4 3"/><text x="581" y="248" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2a78d6">your infrastructure</text><rect x="444" y="266" width="84" height="44" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.2"/><text x="486" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#184f95">Stream</text><rect x="536" y="266" width="84" height="44" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.2"/><text x="578" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#184f95">Query</text><rect x="628" y="266" width="84" height="44" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.2"/><text x="670" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#184f95">Data</text><text x="581" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Disaggregated, but on your own</text><text x="581" y="399.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">cluster</text><text x="581" y="431" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Streaming, Query, and Data</text><text x="581" y="446.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">nodes split by workload</text><text x="581" y="478" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Full control, full operational</text><text x="581" y="493.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">responsibility</text><rect x="782" y="130" width="330" height="74" rx="8" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="947" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">pgvector</text><text x="947" y="184" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">Added to existing DB</text><rect x="782" y="224" width="330" height="130" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><rect x="794" y="238" width="306" height="102" rx="8" fill="#ffffff" stroke="#0d2c4e" stroke-width="1.4"/><text x="947" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#0d2c4e">Postgres</text><rect x="804" y="268" width="138" height="70" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="873" y="307" text-anchor="middle" font-size="10" font-weight="700" fill="#0d2c4e">tables</text><rect x="952" y="268" width="138" height="70" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1021" y="307" text-anchor="middle" font-size="10" font-weight="700" fill="#0d2c4e">vectors</text><text x="947" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">A Postgres extension, not a</text><text x="947" y="399.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">new system</text><text x="947" y="431" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Vectors and relational data in</text><text x="947" y="446.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">the same ACID store</text><text x="947" y="478" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Less specialized performance,</text><text x="947" y="493.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">less new infra</text><rect x="1148" y="130" width="330" height="74" rx="8" fill="#5598e7" stroke="#5598e7" stroke-width="1.5"/><text x="1313" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Chroma</text><text x="1313" y="184" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">Embedded, lightweight</text><rect x="1148" y="224" width="330" height="130" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><rect x="1164" y="238" width="298" height="102" rx="8" fill="none" stroke="#2a78d6" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1313" y="254" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2a78d6">your app process</text><rect x="1253" y="270" width="120" height="50" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.2"/><text x="1313" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">Chroma</text><text x="1313" y="384" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Runs in-process or as a local</text><text x="1313" y="399.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">server</text><text x="1313" y="431" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Built around cheap object</text><text x="1313" y="446.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">storage economics</text><text x="1313" y="478" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Ideal for prototyping and</text><text x="1313" y="493.5" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">small-scale use</text>
</svg>