<svg width="1520" height="640" viewBox="0 0 1520 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-2-library desc-7-2-library">
  <title id="title-7-2-library">Full fine-tuning vs. parameter-efficient fine-tuning</title>
  <desc id="desc-7-2-library">A side-by-side comparison: full fine-tuning shown as rewriting every book in an enormous library, at the cost of a full model copy per task. Parameter-efficient fine-tuning shown as slipping a small trainable insert into each relevant book, at the cost of a small swappable file per task, while every original page stays untouched.</desc>
  <rect width="1520" height="640" fill="#fbfaf7"/>
  <text x="760" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Full fine-tuning vs. parameter-efficient fine-tuning</text>
  <defs><marker id="lib-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="326" y="60" width="148" height="26" rx="13" fill="#6b7280" /><text x="400" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">FULL FINE-TUNING</text><rect x="1008.5" y="60" width="223" height="26" rx="13" fill="#5b8fc9" /><text x="1120" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">PARAMETER-EFFICIENT (PEFT)</text><rect x="140" y="110" width="520" height="160" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="400" y="177.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Rewrite every book in the</text><text x="400" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">library</text><text x="400" y="221.5" text-anchor="middle" font-size="10.5" fill="#6b7280">every weight updated · a full model copy per task · tens of GB each</text><rect x="860" y="110" width="520" height="160" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1120" y="177.25" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Slip a thin insert into each</text><text x="1120" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">relevant book</text><text x="1120" y="221.5" text-anchor="middle" font-size="10.5" fill="#6b7280">a small trainable pair added alongside frozen weights · a few MB per task</text><line x1="400" y1="270" x2="400" y2="320" stroke="#5b8fc9" stroke-width="2" marker-end="url(#lib-arrow)"/><rect x="140" y="320" width="520" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="400" y="358.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Cost: the whole library, every</text><text x="400" y="374.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">time</text><text x="400" y="398.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">multi-GPU training, tens of GB stored per downstream task</text><line x1="1120" y1="270" x2="1120" y2="320" stroke="#5b8fc9" stroke-width="2" marker-end="url(#lib-arrow)"/><rect x="860" y="320" width="520" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1120" y="358.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Cost: one small insert,</text><text x="1120" y="374.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">swappable per task</text><text x="1120" y="398.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">a single GPU for many models · a few MB stored per task</text><rect x="140" y="480" width="1240" height="100" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="760" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Not every original page gets reprinted</text><text x="760" y="548" text-anchor="middle" font-size="13.5" fill="#1f2d3d">PEFT trains a small addition alongside the frozen original weights, redirecting behavior without touching the base model itself.</text>
</svg>