<svg width="1360" height="600" viewBox="0 0 1360 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-specdecoding desc-specdecoding">
  <title id="title-specdecoding">Speculative decoding: a small draft model proposes, the full target model verifies</title>
  <desc id="desc-specdecoding">A pipeline where a small draft model proposes several tokens ahead cheaply, the full target model verifies all of them in a single forward pass, accepted tokens (matching what the target model would have chosen) are kept, and at the first mismatch the target model substitutes its own choice and drafting resumes.</desc>
  <defs><marker id="arr43b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="600" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Same output, fewer expensive forward passes</text>
  <rect x="100" y="120" width="280" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="240" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Small draft model</text><text x="240" y="184" text-anchor="middle" font-size="11" fill="#52514e">proposes several tokens ahead, cheaply</text><rect x="480" y="120" width="380" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="670" y="166" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Proposed tokens</text><text x="670" y="184" text-anchor="middle" font-size="11" fill="#52514e">"the" "cat" "sat" "down" "quickly"</text><line x1="380.0" y1="170.0" x2="480.0" y2="170.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43b)"/><rect x="960" y="120" width="300" height="100" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="1110" y="166" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Full target model</text><text x="1110" y="184" text-anchor="middle" font-size="11" fill="#cde2fb">verifies all proposed tokens in one pass</text><line x1="860.0" y1="170.0" x2="960.0" y2="170.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43b)"/><rect x="315" y="320" width="130" height="70" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="380" y="359.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">the</text><rect x="465" y="320" width="130" height="70" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="530" y="359.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">cat</text><rect x="615" y="320" width="130" height="70" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="359.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">sat</text><rect x="765" y="320" width="130" height="70" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="830" y="359.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">down</text><rect x="915" y="320" width="130" height="70" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="980" y="359.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">quickly</text><text x="540" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">Accepted (matched target model)</text><text x="840" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a33a2f">Rejected at first mismatch</text><text x="680" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Target model substitutes its own choice at the mismatch point,</text><text x="680" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">and drafting resumes from there.</text><rect x="60" y="480" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="510" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The accept/reject rule is constructed so the final output distribution is mathematically identical</text><text x="680" y="527.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">to decoding from the target model alone; only the number of expensive target-model forward passes</text><text x="680" y="545" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">changes, not what gets produced.</text>
</svg>