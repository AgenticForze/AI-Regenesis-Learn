<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-6-judge desc-5-6-judge">
  <title id="title-5-6-judge">How reliable is an LLM judge</title>
  <desc id="desc-5-6-judge">A bar chart showing human-versus-human agreement at 81 percent and GPT-4-versus-human agreement at 85 percent on paired preference judgments, alongside three documented biases in LLM-as-judge grading: position bias, verbosity bias, and self-enhancement bias.</desc>
  <defs></defs>
  <rect width="1400" height="720" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">How reliable is an LLM judge</text>
  <rect x="420" y="158" width="220" height="162" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="530" y="193" text-anchor="middle" font-size="22" font-weight="700" fill="#184f95">81%</text><text x="530" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">Human vs. human</text><text x="530" y="369" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">agreement</text><rect x="780" y="150" width="220" height="170" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="890" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">85%</text><text x="890" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">GPT-4 vs. human</text><text x="890" y="369" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">agreement</text><line x1="380" y1="320" x2="1040" y2="320" stroke="#898781" stroke-width="1.5"/><rect x="90" y="430" width="380" height="130" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="280" y="479.9" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Position bias</text><text x="280" y="514.9" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">favors certain answer</text><text x="280" y="530.5" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">positions over others</text><rect x="510" y="430" width="380" height="130" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="700" y="479.9" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Verbosity bias</text><text x="700" y="514.9" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">favors longer answers, even</text><text x="700" y="530.5" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">if not clearer or more</text><text x="700" y="546.1" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">accurate</text><rect x="930" y="430" width="380" height="130" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1120" y="479.9" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Self-enhancement bias</text><text x="1120" y="514.9" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">favors a model's own outputs</text><text x="1120" y="530.5" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">over other models'</text><rect x="60" y="600" width="1280" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Zheng et al., 2023: GPT-4 as a judge agreed with human preference in non-tied cases about as often</text><text x="700" y="642.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">as two independent human judges agreed with each other, while still exhibiting position, verbosity,</text><text x="700" y="660" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">and self-enhancement bias.</text>
</svg>