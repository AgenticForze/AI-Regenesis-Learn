<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-3-decision-flow desc-5-3-decision-flow">
  <title id="title-5-3-decision-flow">Choosing how to get structured output from a model</title>
  <desc id="desc-5-3-decision-flow">A decision-flow diagram branching from a task needing structured output into whether the target schema is known in advance, then whether one call or several in sequence are needed, then whether the API supports native tool calling and whether a downstream system requires a hard schema guarantee, with a separate branch on whether the values themselves, not just their shape, must be verified.</desc>
  <defs></defs>
  <rect width="1600" height="900" fill="#fcfcfb"/>
  <text x="800" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing how to get structured output from a model</text>
  <defs><marker id="arrow-5-3-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="630" y="80" width="340" height="75" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="800" y="110.35" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Task needs structured</text><text x="800" y="127.25" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">output</text><rect x="630" y="210" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="790" y="245.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Is the target schema</text><text x="790" y="261.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">known in advance?</text><line x1="797.2" y1="155.0" x2="793.1" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-decision)"/><rect x="1300" y="210" width="280" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1440" y="237.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Must values be</text><text x="1440" y="253.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">verified, not just</text><text x="1440" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">shape?</text><line x1="970.0" y1="153.4" x2="1300.0" y2="223.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-decision)"/><rect x="200" y="345" width="260" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="330" y="373.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use prompted JSON</text><text x="330" y="405.525" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">validate and retry on</text><text x="330" y="419.825" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">parse failure</text><line x1="645.2" y1="295.0" x2="460.0" y2="349.3" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-decision)"/><rect x="700" y="345" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="860" y="380.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">One call, or several</text><text x="860" y="396.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">in sequence?</text><line x1="812.0" y1="295.0" x2="838.0" y2="345.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-decision)"/><rect x="1300" y="345" width="280" height="95" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1440" y="378.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Add evaluation on top</text><text x="1440" y="410.525" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">schema enforcement alone</text><text x="1440" y="424.825" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">will not catch this</text><line x1="1440.0" y1="295.0" x2="1440.0" y2="345.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-decision)"/><rect x="1050" y="490" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1190" y="512.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use a ReAct-style</text><text x="1190" y="529" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">loop</text><text x="1190" y="561.15" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">call, observe, reason,</text><text x="1190" y="575.4499999999999" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">call again</text><line x1="955.1" y1="430.0" x2="1089.3" y2="490.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-decision)"/><rect x="520" y="490" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="525.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Does the API support</text><text x="680" y="541.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">native tool calling?</text><line x1="807.2" y1="430.0" x2="732.8" y2="490.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-decision)"/><rect x="200" y="620" width="260" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="330" y="661.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use prompted JSON</text><line x1="563.3" y1="575.0" x2="439.8" y2="620.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-decision)"/><rect x="520" y="620" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="647.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Does a downstream</text><text x="680" y="663.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">system need a hard</text><text x="680" y="680" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">guarantee?</text><line x1="680.0" y1="575.0" x2="680.0" y2="620.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-decision)"/><rect x="460" y="750" width="280" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="600" y="775" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use native</text><text x="600" y="791.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">function/tool</text><text x="600" y="807.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">calling</text><line x1="653.3" y1="705.0" x2="625.1" y2="750.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-decision)"/><rect x="780" y="750" width="280" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="920" y="783.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use constrained</text><text x="920" y="799.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">structured outputs</text><line x1="760.0" y1="705.0" x2="844.7" y2="750.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-decision)"/>
</svg>