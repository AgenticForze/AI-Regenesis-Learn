<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-7-three-layers desc-4-7-three-layers">
  <title id="title-4-7-three-layers">Three complementary layers of responsible GenAI</title>
  <desc id="desc-4-7-three-layers">A diagram showing three side-by-side layers: content safety, applied before and during deployment via red-teaming and runtime classifiers; watermarking, an embedded statistical signal that travels with the content; and provenance, a signed creation and edit record that can be stripped if its metadata is removed.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three complementary layers of responsible GenAI</text>
  <rect x="60" y="130" width="380" height="300" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="250" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">Content safety</text><text x="250" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#184f95">Red-teaming + runtime classifiers</text><text x="250" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Applied before deployment</text><text x="250" y="309" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">and continuously at runtime</text><rect x="490" y="130" width="380" height="300" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="680" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">Watermarking</text><text x="680" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#184f95">An embedded statistical signal</text><text x="680" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Applied at generation time,</text><text x="680" y="309" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">travels with the content</text><rect x="920" y="130" width="380" height="300" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1110" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">Provenance</text><text x="1110" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#184f95">A signed creation/edit record</text><text x="1110" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Attached as metadata,</text><text x="1110" y="309" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">can be stripped if removed</text><text x="680" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Each layer defends against a different failure mode; a production system typically layers more than one.</text>
</svg>