<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-unigramprune desc-unigramprune">
  <title id="title-unigramprune">The Unigram algorithm prunes a large candidate vocabulary down to size</title>
  <desc id="desc-unigramprune">Unlike BPE and WordPiece, which build a vocabulary up from characters through merges, the Unigram language model tokenizer starts from a large set of candidate subwords and repeatedly removes whichever tokens contribute least to the training corpus likelihood, using expectation-maximization, until it reaches the target vocabulary size.</desc>
  <defs><marker id="arr35c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Top-down pruning instead of bottom-up merging</text>
  <rect x="230" y="70" width="900" height="70" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Large candidate vocabulary (many possible</text><text x="680" y="120.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">subwords)</text><line x1="680" y1="140" x2="680" y2="190" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35c)"/><rect x="370" y="190" width="620" height="70" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Prune tokens contributing least to corpus</text><text x="680" y="240.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">likelihood</text><line x1="680" y1="260" x2="680" y2="310" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35c)"/><rect x="490" y="310" width="380" height="70" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Prune again, re-estimate probabilities (EM)</text><line x1="680" y1="380" x2="680" y2="430" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35c)"/><rect x="570" y="430" width="220" height="70" rx="8" fill="#184f95" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Final target vocabulary size</text><rect x="60" y="540" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="568.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Unigram works in the opposite direction from BPE and WordPiece: it prunes a large set down instead</text><text x="680" y="586.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">of merging a small set up.</text>
</svg>