<svg width="1560" height="760" viewBox="0 0 1560 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-5-refarch desc-7-5-refarch">
  <title id="title-7-5-refarch">How distillation, quantization, and pruning compose into one compressed model</title>
  <desc id="desc-7-5-refarch">A flow diagram starting from a large trained teacher model. One path runs through distillation to a smaller student model, then quantization, then pruning. A second path skips distillation and applies quantization directly to the teacher model, then pruning. Both paths converge on a compressed model that is smaller, faster, and cheaper to serve.</desc>
  <rect width="1560" height="760" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">How distillation, quantization, and pruning compose into one compressed model</text>
  <defs><marker id="arrow-7-5-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="590" y="80" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="117.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Large trained teacher model</text><path d="M 780 150
      L 780 157
      Q 780 165 772 165
      L 418 165
      Q 410 165 410 173
      L 410 200" fill="none" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="200" y="200" width="420" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="410" y="234.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Distillation: train student</text><text x="410" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">on teacher outputs</text><line x1="410" y1="280" x2="410" y2="320" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="200" y="320" width="420" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="410" y="351.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Smaller student model</text><text x="410" y="374.97499999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">same task capability band</text><line x1="410" y1="390" x2="410" y2="430" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="200" y="430" width="420" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="410" y="459.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Quantization: fewer bits</text><text x="410" y="475.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">per weight</text><line x1="410" y1="500" x2="410" y2="540" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="200" y="540" width="420" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="410" y="569.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Pruning: remove</text><text x="410" y="585" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">low-importance weights</text><line x1="780" y1="150" x2="1150" y2="320" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="940" y="320" width="420" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1150" y="343.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Quantization applied</text><text x="1150" y="359.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">directly</text><text x="1150" y="383.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">no distillation</text><line x1="1150" y1="390" x2="1150" y2="430" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="940" y="430" width="420" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1150" y="467.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Pruning applied directly</text><line x1="410" y1="610" x2="410" y2="630" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1150" y1="500" x2="1150" y2="630" stroke="#5b8fc9" stroke-width="1.4"/><line x1="410" y1="630" x2="1150" y2="630" stroke="#5b8fc9" stroke-width="1.4"/><line x1="780" y1="630" x2="780" y2="650" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-refarch-main)"/><rect x="570" y="650" width="420" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="780" y="686.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Compressed model</text><text x="780" y="711.0500000000001" text-anchor="middle" font-size="10.5" fill="#6b7280">smaller, faster, cheaper to serve</text>
</svg>