<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-cg desc-cg">
  <title id="title-cg">Reverse-mode automatic differentiation: a forward pass builds the graph, a backward pass walks it applying the chain rule</title>
  <desc id="desc-cg">A small computation graph with nodes for two inputs, a multiply operation, an addition operation, and an activation function producing the output. The forward pass runs left to right, computing values and recording each operation. The backward pass runs right to left over the same graph, computing a local gradient at each node and combining it with the gradient flowing in from later nodes, implementing the chain rule automatically.</desc>
  <rect width="1200" height="680" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Forward builds the graph; backward applies the chain rule</text><defs>
    <marker id="arrowfwd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
    <marker id="arrowbwd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33a2f"/></marker>
  </defs><text x="600" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95">forward pass: compute values, record every operation</text><line x1="195.0" y1="133.8" x2="305.0" y2="161.3" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowfwd)"/><line x1="195.0" y1="216.3" x2="305.0" y2="188.8" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowfwd)"/><line x1="415.0" y1="175.0" x2="535.0" y2="175.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowfwd)"/><line x1="415.0" y1="216.8" x2="535.0" y2="188.2" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowfwd)"/><line x1="645.0" y1="175.0" x2="765.0" y2="175.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowfwd)"/><line x1="875.0" y1="175.0" x2="995.0" y2="175.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowfwd)"/><rect x="85" y="92" width="110" height="56" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="140" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">x</text><rect x="85" y="202" width="110" height="56" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="140" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">w</text><rect x="305" y="147" width="110" height="56" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="360" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">x · w</text><rect x="305" y="202" width="110" height="56" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="360" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">b</text><rect x="535" y="147" width="110" height="56" rx="8" fill="#2a78d6" stroke="#184f95" stroke-width="1.5"/><text x="590" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">+</text><rect x="765" y="147" width="110" height="56" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="820" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">tanh</text><rect x="995" y="147" width="110" height="56" rx="8" fill="#104281" stroke="#184f95" stroke-width="1.5"/><text x="1050" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">output</text><text x="600" y="418" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2f">backward pass: chain rule runs right to left, a gradient computed at every node</text><line x1="995.0" y1="505.0" x2="875.0" y2="505.0" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrowbwd)"/><line x1="765.0" y1="505.0" x2="645.0" y2="505.0" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrowbwd)"/><line x1="535.0" y1="505.0" x2="415.0" y2="505.0" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrowbwd)"/><line x1="535.0" y1="518.2" x2="415.0" y2="546.8" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrowbwd)"/><line x1="305.0" y1="491.3" x2="195.0" y2="463.8" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrowbwd)"/><line x1="305.0" y1="518.8" x2="195.0" y2="546.3" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrowbwd)"/><rect x="85" y="422" width="110" height="56" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="140" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">x</text><rect x="85" y="532" width="110" height="56" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="140" y="565" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">w</text><rect x="305" y="477" width="110" height="56" rx="8" fill="#5598e7" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">x · w</text><rect x="305" y="532" width="110" height="56" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="565" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">b</text><rect x="535" y="477" width="110" height="56" rx="8" fill="#2a78d6" stroke="#a33a2f" stroke-width="1.5"/><text x="590" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">+</text><rect x="765" y="477" width="110" height="56" rx="8" fill="#184f95" stroke="#a33a2f" stroke-width="1.5"/><text x="820" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">tanh</text><rect x="995" y="477" width="110" height="56" rx="8" fill="#104281" stroke="#a33a2f" stroke-width="1.5"/><text x="1050" y="510" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">output</text></svg>