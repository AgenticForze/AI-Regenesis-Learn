<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-skipgram desc-skipgram">
  <title id="title-skipgram">Skip-gram trains an embedding by predicting nearby context words from a center word</title>
  <desc id="desc-skipgram">A center word bank feeds its embedding row into a projection, which is used to predict the probability of each nearby context word (the, savings, was, overdrawn) appearing within the training window, via a softmax scored against the whole vocabulary.</desc>
  <defs><marker id="arr32a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Skip-gram: predict context from a center word</text>
  <rect x="130" y="250" width="180" height="70" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="220" y="289.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">center word: "bank"</text><line x1="310.0" y1="285.0" x2="470.0" y2="285.0" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr32a)"/><rect x="470" y="250" width="180" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="560" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">embedding row</text><text x="560" y="299" text-anchor="middle" font-size="11" fill="#52514e">the value being trained</text><line x1="634.0" y1="250.0" x2="877.1" y2="135.0" stroke="#184f95" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr32a)"/><rect x="820" y="85" width="220" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="930" y="114.16666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">P("the" | "bank")</text><line x1="650.0" y1="269.2" x2="820.0" y2="239.3" stroke="#184f95" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr32a)"/><rect x="820" y="195" width="220" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="930" y="224.16666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">P("savings" | "bank")</text><line x1="650.0" y1="295.9" x2="820.0" y2="316.6" stroke="#184f95" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr32a)"/><rect x="820" y="305" width="220" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="930" y="334.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">P("was" | "bank")</text><line x1="643.5" y1="320.0" x2="870.3" y2="415.0" stroke="#184f95" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr32a)"/><rect x="820" y="415" width="220" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="930" y="444.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">P("overdrawn" | "bank")</text><text x="1000" y="90" font-size="12.5" font-weight="700" fill="#184f95">softmax over context window</text><text x="650" y="450" text-anchor="middle" font-size="13" fill="#52514e">window: "the savings [bank] was overdrawn"</text><rect x="90" y="470" width="1120" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="491.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Training pushes the center word's embedding row toward values that make the true nearby words score</text><text x="650" y="508.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">higher than the rest of the vocabulary.</text>
</svg>