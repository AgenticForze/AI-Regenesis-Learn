<svg width="1600" height="780" viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-7-decision-flow desc-4-7-decision-flow">
  <title id="title-4-7-decision-flow">Choosing responsible-GenAI controls for a given risk</title>
  <desc id="desc-4-7-decision-flow">A decision-flow diagram branching from a responsible-GenAI risk into whether harmful content could be generated, whether AI-generated content needs later identification, whether a verifiable edit history is needed, and whether a disclosure requirement applies, each leading to a corresponding control.</desc>
  <defs></defs>
  <rect width="1600" height="780" fill="#fcfcfb"/>
  <text x="800" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing responsible-GenAI controls for a given risk</text>
  <defs><marker id="arrow-4-7-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="630" y="60" width="340" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="800" y="99.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Responsible-GenAI risk to address</text><rect x="90" y="210" width="280" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="230" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Could harmful content</text><text x="230" y="269" text-anchor="middle" font-size="12" fill="#52514e">be generated or reach a user?</text><rect x="470" y="210" width="280" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="610" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does AI-generated content</text><text x="610" y="269" text-anchor="middle" font-size="12" fill="#52514e">need to be identifiable later?</text><rect x="850" y="210" width="280" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="990" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does a verifiable edit history</text><text x="990" y="269" text-anchor="middle" font-size="12" fill="#52514e">need to travel with it?</text><rect x="1230" y="210" width="280" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1370" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Is content subject to a</text><text x="1370" y="269" text-anchor="middle" font-size="12" fill="#52514e">disclosure requirement?</text><rect x="50" y="380" width="170" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="135" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Red-team before</text><text x="135" y="439" text-anchor="middle" font-size="11.5" fill="#52514e">deployment</text><rect x="240" y="380" width="170" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="325" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Apply a runtime</text><text x="325" y="439" text-anchor="middle" font-size="11.5" fill="#52514e">moderation classifier</text><rect x="430" y="380" width="170" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="515" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Watermark text output</text><text x="515" y="439" text-anchor="middle" font-size="11" fill="#52514e">e.g. SynthID, green/red-list</text><rect x="620" y="380" width="170" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="705" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Watermark image/video</text><text x="705" y="439" text-anchor="middle" font-size="11" fill="#52514e">output, e.g. SynthID</text><rect x="880" y="380" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="990" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Attach a C2PA-signed</text><text x="990" y="439" text-anchor="middle" font-size="11.5" fill="#52514e">Content Credentials manifest</text><rect x="1220" y="380" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1370" y="421" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Combine a durable watermark</text><text x="1370" y="439" text-anchor="middle" font-size="11.5" fill="#52514e">with a provenance manifest</text><line x1="675.3" y1="130.0" x2="370.0" y2="215.7" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="758.4" y1="130.0" x2="663.4" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="841.6" y1="130.0" x2="936.6" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="924.7" y1="130.0" x2="1230.0" y2="215.7" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="204.9" y1="300.0" x2="160.1" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="255.1" y1="300.0" x2="299.9" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="584.9" y1="300.0" x2="540.1" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="635.1" y1="300.0" x2="679.9" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="990.0" y1="300.0" x2="990.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/><line x1="1370.0" y1="300.0" x2="1370.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-decision)"/>
</svg>