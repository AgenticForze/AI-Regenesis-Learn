<svg width="1500" height="640" viewBox="0 0 1500 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-7-prompt desc-6-7-prompt">
  <title id="title-6-7-prompt">Prompt caching: an exact-match prefix, reused at a fraction of the price</title>
  <desc id="desc-6-7-prompt">A diagram showing two requests sharing an identical static prefix, a system prompt and document set: the first request is a cache write, processed in full at a price premium, and the second request is a cache read at roughly one-tenth of the base price because its prefix matches the first exactly up to the cache breakpoint, with only the varying question processed fresh each time.</desc>
  <rect width="1500" height="640" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Prompt caching: an exact-match prefix, reused at a fraction of the price</text>
  <defs><marker id="arrow-6-7-prompt-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="560" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="731.6" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="645.8" y="159.825" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Static prefix: system</text><text x="645.8" y="174.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">prompt + documents</text><rect x="1031.6" y="130" width="330.40000000000003" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1196.8" y="167.0125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Question A</text><rect x="1005.6" y="124" width="12" height="82" fill="#c98b3a"/><text x="870" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Request 1: cache WRITE, full processing, 1.25x base price on the prefix</text><rect x="20" y="145" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">WRITE</text><rect x="280" y="310" width="731.6" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="645.8" y="347.0125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Identical static prefix</text><rect x="1031.6" y="310" width="330.40000000000003" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1196.8" y="347.0125" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Question B</text><rect x="1005.6" y="304" width="12" height="82" fill="#c98b3a"/><text x="870" y="294" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Request 2: cache READ, 0.1x base price on the identical prefix</text><rect x="20" y="325" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="350" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">READ</text><line x1="645.8" y1="200" x2="645.8" y2="310" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4"/><text x="775.8" y="260" text-anchor="middle" font-size="10" fill="#c98b3a">byte-identical up to the breakpoint</text><rect x="280" y="440" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="472" text-anchor="middle" font-size="12.5" fill="#6b7280">The orange bar marks the cache breakpoint: everything to its left must match exactly, everything to its right, the varying question, is processed fresh every time.</text>
</svg>