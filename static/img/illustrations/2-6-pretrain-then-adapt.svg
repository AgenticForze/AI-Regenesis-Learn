<svg width="1300" height="640" viewBox="0 0 1300 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-pta desc-pta">
  <title id="title-pta">Pretraining happens once on a large source dataset; adaptation happens per target task on far less data</title>
  <desc id="desc-pta">A large source dataset feeds a pretraining phase producing a pretrained model with general-purpose representations. The pretrained model branches into two adaptation paths on a small target dataset: feature extraction, which freezes the pretrained weights and trains only a new head, and fine-tuning, which continues training some or all of the pretrained weights at a reduced learning rate. Both paths produce a target-task model.</desc>
  <rect width="1300" height="640" fill="#fcfcfb"/><text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Pretrain once, adapt per target task</text><rect x="500" y="75" width="300" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="650" y="106" text-anchor="middle" font-size="14" fill="#0b0b0b">Large source dataset</text><line x1="650" y1="125" x2="650" y2="160" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowpt)"/><rect x="460" y="160" width="380" height="60" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="2"/><text x="650" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Pretraining (once, expensive)</text><line x1="650" y1="220" x2="650" y2="255" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowpt)"/><rect x="460" y="255" width="380" height="60" rx="8" fill="#184f95"/><text x="650" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Pretrained model (general-purpose)</text><line x1="500" y1="315" x2="350" y2="360" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowpt)"/><line x1="800" y1="315" x2="950" y2="360" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowpt)"/><rect x="185" y="360" width="330" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="350" y="388" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Feature extraction</text><text x="350" y="408" text-anchor="middle" font-size="11.5" fill="#52514e">freeze pretrained weights,</text><text x="350" y="424" text-anchor="middle" font-size="11.5" fill="#52514e">train only a new head</text><rect x="785" y="360" width="330" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="950" y="388" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Fine-tuning</text><text x="950" y="408" text-anchor="middle" font-size="11.5" fill="#52514e">unfreeze some/all layers,</text><text x="950" y="424" text-anchor="middle" font-size="11.5" fill="#52514e">continue training at low learning rate</text><rect x="540" y="360" width="220" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3"/><text x="650" y="388" text-anchor="middle" font-size="12.5" fill="#52514e">Small target dataset</text><line x1="540" y1="383" x2="515" y2="405" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="760" y1="383" x2="785" y2="405" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="350" y1="450" x2="350" y2="490" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowpt)"/><line x1="950" y1="450" x2="950" y2="490" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowpt)"/><rect x="230" y="490" width="240" height="46" rx="8" fill="#104281"/><text x="350" y="518" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Target-task model</text><rect x="830" y="490" width="240" height="46" rx="8" fill="#104281"/><text x="950" y="518" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Target-task model</text><defs><marker id="arrowpt" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="90" y="565" width="1120" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="598" text-anchor="middle" font-size="12.5" fill="#52514e">Pretraining is the expensive, one-time step; adaptation is cheap and repeated per target task</text></svg>