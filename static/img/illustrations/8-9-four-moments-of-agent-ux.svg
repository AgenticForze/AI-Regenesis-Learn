<svg width="1560" height="640" viewBox="0 0 1560 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-9 desc-8-9"><title id="title-8-9">Four Moments, Not One: When Human-AI Interaction Guidelines Actually Apply</title><desc id="desc-8-9">A horizontal timeline runs through four moments of using an agent. Initially, before the first message, the interface must set accurate expectations about what the system can do and how often it makes mistakes. During the interaction, the interface must show status appropriate to how long each step takes and must gate consequential actions behind confirmation based on how reversible they are. When the system is wrong, the interface must make correction easy and explain why the mistake happened. Over time, across many sessions, the interface must remember recent context, adapt cautiously, and never silently change behavior the user has come to rely on. These four moments are Amershi et al.'s own organizing categories for the eighteen guidelines for human-AI interaction, extended in this chapter with agent-specific concerns: status timing thresholds and the reversibility-based confirmation gate that a text-only chatbot never needed but an acting agent does.</desc><rect width="1560" height="640" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="18.5" font-weight="700" fill="#1f2d3d">Four Moments, Not One: When Human-AI Interaction Guidelines Actually Apply</text><line x1="120" y1="130" x2="1440" y2="130" stroke="#c9c5ba" stroke-width="4"/><polygon points="1444,130 1426,122 1426,138" fill="#c9c5ba"/><circle cx="285.0" cy="130" r="8" fill="#c9975b"/><line x1="285.0" y1="130" x2="285.0" y2="170" stroke="#c9975b" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="135.0" y="170" width="300" height="150" rx="10" fill="#f5e9db" stroke="#c9975b" stroke-width="1.75"/><text x="285.0" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Initially</text><text x="285.0" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">Set accurate expectations</text><text x="285.0" y="246" text-anchor="middle" font-size="11.5" fill="#6b7280">What the system can do,</text><text x="285.0" y="264" text-anchor="middle" font-size="11.5" fill="#6b7280">how often it's wrong</text><text x="285.0" y="282" text-anchor="middle" font-size="11.5" fill="#6b7280">(G1, G2)</text><circle cx="615.0" cy="130" r="8" fill="#5b8fc9"/><line x1="615.0" y1="130" x2="615.0" y2="170" stroke="#5b8fc9" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="465.0" y="170" width="300" height="150" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="615.0" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">During</text><text x="615.0" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">Show status, gate actions</text><text x="615.0" y="246" text-anchor="middle" font-size="11.5" fill="#6b7280">Timing thresholds for waiting;</text><text x="615.0" y="264" text-anchor="middle" font-size="11.5" fill="#6b7280">confirm before irreversible steps</text><text x="615.0" y="282" text-anchor="middle" font-size="11.5" fill="#6b7280">(G3-G10)</text><circle cx="945.0" cy="130" r="8" fill="#c96fa8"/><line x1="945.0" y1="130" x2="945.0" y2="170" stroke="#c96fa8" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="795.0" y="170" width="300" height="150" rx="10" fill="#f5dde8" stroke="#c96fa8" stroke-width="1.75"/><text x="945.0" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">When Wrong</text><text x="945.0" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">Explain and correct</text><text x="945.0" y="246" text-anchor="middle" font-size="11.5" fill="#6b7280">Why it happened,</text><text x="945.0" y="264" text-anchor="middle" font-size="11.5" fill="#6b7280">easy to fix</text><text x="945.0" y="282" text-anchor="middle" font-size="11.5" fill="#6b7280">(G9, G11)</text><circle cx="1275.0" cy="130" r="8" fill="#5fae83"/><line x1="1275.0" y1="130" x2="1275.0" y2="170" stroke="#5fae83" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="1125.0" y="170" width="300" height="150" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.75"/><text x="1275.0" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Over Time</text><text x="1275.0" y="220" text-anchor="middle" font-size="12.5" font-weight="600" fill="#374151">Remember, adapt, don't surprise</text><text x="1275.0" y="246" text-anchor="middle" font-size="11.5" fill="#6b7280">Short-term memory,</text><text x="1275.0" y="264" text-anchor="middle" font-size="11.5" fill="#6b7280">cautious updates,</text><text x="1275.0" y="282" text-anchor="middle" font-size="11.5" fill="#6b7280">global controls (G12-G18)</text><text x="120" y="114" text-anchor="start" font-size="13" fill="#4b5563">a chatbot needs all four moments</text><text x="1440" y="114" text-anchor="end" font-size="13" fill="#4b5563">an acting agent adds the reversibility gate</text><rect x="120" y="380" width="1320" height="100" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="408" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Amershi et al.'s 18 guidelines already organize themselves this way.</text><text x="780.0" y="432" text-anchor="middle" font-size="12.5" fill="#1f2d3d">What changes for an agent, versus a text-only chatbot, is not the four moments themselves,</text><text x="780.0" y="452" text-anchor="middle" font-size="12.5" fill="#1f2d3d">but the During moment gaining a new question a chatbot never had to answer: should this specific action</text><text x="780.0" y="472" text-anchor="middle" font-size="12.5" fill="#1f2d3d">run on its own, or does it need to pause for a human first?</text></svg>