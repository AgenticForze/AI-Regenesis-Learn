<svg width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-ab desc-ab">
  <title id="title-ab">Four algorithm families, four different decision boundaries on the same data</title>
  <desc id="desc-ab">The same two-class scatter of points shown four times, each with a different decision boundary: a straight line for linear/logistic regression, a staircase of rectangles for a decision tree, an irregular boundary for k-nearest neighbors, and a smooth curved boundary for an ensemble.</desc>
  <rect width="1400" height="420" fill="#fcfcfb"/>

  <!-- shared point set (approx), replicated in each panel; blue class + orange-ish alert class -->
  <!-- panel template: 300x260 plot area -->

  <!-- Panel 1: Linear -->
  <g transform="translate(30,60)">
    <text x="150" y="-20" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Linear / Logistic</text>
    <rect x="0" y="0" width="300" height="260" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <polygon points="0,0 300,0 300,110 0,220" fill="#eaf2fc"/>
    <polygon points="0,220 300,110 300,260 0,260" fill="#fdecea"/>
    <line x1="0" y1="220" x2="300" y2="110" stroke="#184f95" stroke-width="3"/>
    <g fill="#2a78d6">
      <circle cx="50" cy="60" r="6"/><circle cx="90" cy="100" r="6"/><circle cx="130" cy="50" r="6"/>
      <circle cx="170" cy="90" r="6"/><circle cx="60" cy="140" r="6"/><circle cx="200" cy="40" r="6"/>
    </g>
    <g fill="#a33a2f">
      <circle cx="100" cy="220" r="6"/><circle cx="160" cy="200" r="6"/><circle cx="220" cy="230" r="6"/>
      <circle cx="250" cy="170" r="6"/><circle cx="190" cy="240" r="6"/><circle cx="270" cy="140" r="6"/>
    </g>
    <text x="150" y="285" text-anchor="middle" font-size="12.5" fill="#52514e">One straight boundary</text>
  </g>

  <!-- Panel 2: Decision tree -->
  <g transform="translate(370,60)">
    <text x="150" y="-20" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Decision Tree</text>
    <rect x="0" y="0" width="300" height="260" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="260" fill="#eaf2fc"/>
    <rect x="140" y="0" width="160" height="130" fill="#fdecea"/>
    <rect x="0" y="180" width="140" height="80" fill="#fdecea"/>
    <rect x="220" y="130" width="80" height="130" fill="#fdecea"/>
    <g stroke="#184f95" stroke-width="3">
      <line x1="140" y1="0" x2="140" y2="130"/>
      <line x1="140" y1="130" x2="300" y2="130"/>
      <line x1="220" y1="130" x2="220" y2="260"/>
      <line x1="0" y1="180" x2="140" y2="180"/>
    </g>
    <g fill="#2a78d6">
      <circle cx="50" cy="60" r="6"/><circle cx="90" cy="100" r="6"/><circle cx="60" cy="140" r="6"/>
      <circle cx="30" cy="150" r="6"/><circle cx="170" cy="200" r="6"/><circle cx="250" cy="230" r="6"/>
    </g>
    <g fill="#a33a2f">
      <circle cx="200" cy="60" r="6"/><circle cx="260" cy="40" r="6"/><circle cx="100" cy="220" r="6"/>
      <circle cx="40" cy="230" r="6"/><circle cx="260" cy="180" r="6"/><circle cx="230" cy="150" r="6"/>
    </g>
    <text x="150" y="285" text-anchor="middle" font-size="12.5" fill="#52514e">Axis-aligned rectangles</text>
  </g>

  <!-- Panel 3: kNN -->
  <g transform="translate(710,60)">
    <text x="150" y="-20" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">k-Nearest Neighbors</text>
    <rect x="0" y="0" width="300" height="260" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <path d="M 0 0 L 300 0 L 300 90 C 260 100, 240 90, 210 110 C 180 130, 190 160, 160 175
             C 130 190, 110 170, 90 190 C 70 210, 80 240, 60 260 L 0 260 Z" fill="#eaf2fc"/>
    <path d="M 0 260 L 60 260 C 80 240, 70 210, 90 190 C 110 170, 130 190, 160 175
             C 190 160, 180 130, 210 110 C 240 90, 260 100, 300 90 L 300 260 Z" fill="#fdecea"/>
    <path d="M 300 90 C 260 100, 240 90, 210 110 C 180 130, 190 160, 160 175 C 130 190, 110 170, 90 190 C 70 210, 80 240, 60 260"
          fill="none" stroke="#184f95" stroke-width="3"/>
    <g fill="#2a78d6">
      <circle cx="50" cy="60" r="6"/><circle cx="90" cy="100" r="6"/><circle cx="130" cy="70" r="6"/>
      <circle cx="60" cy="150" r="6"/><circle cx="150" cy="120" r="6"/><circle cx="30" cy="200" r="6"/>
    </g>
    <g fill="#a33a2f">
      <circle cx="220" cy="50" r="6"/><circle cx="260" cy="140" r="6"/><circle cx="200" cy="160" r="6"/>
      <circle cx="240" cy="220" r="6"/><circle cx="170" cy="230" r="6"/><circle cx="120" cy="210" r="6"/>
    </g>
    <text x="150" y="285" text-anchor="middle" font-size="12.5" fill="#52514e">Irregular, follows neighborhoods</text>
  </g>

  <!-- Panel 4: Ensemble -->
  <g transform="translate(1050,60)">
    <text x="150" y="-20" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Ensemble</text>
    <rect x="0" y="0" width="300" height="260" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <path d="M 0 0 L 300 0 L 300 100 L 280 100 L 280 115 L 260 115 L 260 130 L 240 130 L 240 145
             L 220 145 L 220 155 L 200 155 L 200 165 L 180 165 L 180 175 L 160 175 L 160 185
             L 140 185 L 140 195 L 120 195 L 120 205 L 100 205 L 100 215 L 80 215 L 80 225
             L 60 225 L 60 230 L 40 230 L 40 235 L 20 235 L 20 240 L 0 240 Z" fill="#eaf2fc"/>
    <path d="M 0 240 L 20 240 L 20 235 L 40 235 L 40 230 L 60 230 L 60 225 L 80 225 L 80 215
             L 100 215 L 100 205 L 120 205 L 120 195 L 140 195 L 140 185 L 160 185 L 160 175
             L 180 175 L 180 165 L 200 165 L 200 155 L 220 155 L 220 145 L 240 145 L 240 130
             L 260 130 L 260 115 L 280 115 L 280 100 L 300 100 L 300 260 L 0 260 Z" fill="#fdecea"/>
    <path d="M 300 100 L 280 100 L 280 115 L 260 115 L 260 130 L 240 130 L 240 145
             L 220 145 L 220 155 L 200 155 L 200 165 L 180 165 L 180 175 L 160 175 L 160 185
             L 140 185 L 140 195 L 120 195 L 120 205 L 100 205 L 100 215 L 80 215 L 80 225
             L 60 225 L 60 230 L 40 230 L 40 235 L 20 235 L 20 240 L 0 240"
          fill="none" stroke="#184f95" stroke-width="2.5"/>
    <g fill="#2a78d6">
      <circle cx="50" cy="60" r="6"/><circle cx="90" cy="100" r="6"/><circle cx="130" cy="60" r="6"/>
      <circle cx="60" cy="150" r="6"/><circle cx="170" cy="100" r="6"/><circle cx="30" cy="190" r="6"/>
    </g>
    <g fill="#a33a2f">
      <circle cx="220" cy="50" r="6"/><circle cx="260" cy="150" r="6"/><circle cx="200" cy="200" r="6"/>
      <circle cx="250" cy="220" r="6"/><circle cx="140" cy="220" r="6"/><circle cx="100" cy="240" r="6"/>
    </g>
    <text x="150" y="285" text-anchor="middle" font-size="12.5" fill="#52514e">Finely stepped, near-arbitrary shape</text>
  </g>

  <text x="700" y="400" text-anchor="middle" font-size="13" fill="#898781">Same underlying data in every panel. Only the algorithm's inductive bias changes what boundary it can draw.</text>
</svg>
