<svg width="1560" height="620" viewBox="0 0 1560 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-2-anatomy desc-8-2-anatomy"><title id="title-8-2-anatomy">Five Parts Inside One Decide Box</title><desc id="desc-8-2-anatomy">A horizontal chain: Environment feeds Perception, which assembles context for Reasoning. Reasoning reads from and writes to Memory, and hands its decision to Action, which calls Tools to actually change the Environment, closing the loop.</desc><rect width="1560" height="620" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">Five Parts Inside One Decide Box</text><defs><marker id="arrow-8-2-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-8-2-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5fae83"/></marker><marker id="arrow-8-2-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa3ad"/></marker></defs><rect x="125.0" y="90" width="1310" height="50" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="115.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Environment</text><rect x="260.0" y="250" width="230" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="375.0" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Perception</text><text x="375.0" y="314.0" text-anchor="middle" font-size="10.5" fill="#6b7280">turns raw environment</text><text x="375.0" y="327.0" text-anchor="middle" font-size="10.5" fill="#6b7280">state into context</text><rect x="530.0" y="250" width="230" height="100" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="645.0" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Reasoning (the LLM)</text><text x="645.0" y="314.0" text-anchor="middle" font-size="10.5" fill="#6b7280">plans over the</text><text x="645.0" y="327.0" text-anchor="middle" font-size="10.5" fill="#6b7280">assembled context</text><rect x="800.0" y="250" width="230" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="915.0" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Action</text><text x="915.0" y="314.0" text-anchor="middle" font-size="10.5" fill="#6b7280">turns a decision into</text><text x="915.0" y="327.0" text-anchor="middle" font-size="10.5" fill="#6b7280">a chosen call</text><rect x="1070.0" y="250" width="230" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1185.0" y="293.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Tools</text><text x="1185.0" y="314.0" text-anchor="middle" font-size="10.5" fill="#6b7280">executes the call,</text><text x="1185.0" y="327.0" text-anchor="middle" font-size="10.5" fill="#6b7280">produces a real effect</text><line x1="490.0" y1="300.0" x2="530.0" y2="300.0" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-2-blue)"/><line x1="760.0" y1="300.0" x2="800.0" y2="300.0" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-2-blue)"/><line x1="1030.0" y1="300.0" x2="1070.0" y2="300.0" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-2-blue)"/><line x1="375.0" y1="140" x2="375.0" y2="250" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-2-blue)"/><path d="M 1300.0 300.0 L 1500 300.0 L 1500 115 L 1435.0 115" fill="none" stroke="#9aa3ad" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#arrow-8-2-gray)"/><rect x="530.0" y="120" width="230" height="90" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="645.0" y="158.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Memory</text><text x="645.0" y="179.0" text-anchor="middle" font-size="10.5" fill="#6b7280">reads and writes state</text><text x="645.0" y="192.0" text-anchor="middle" font-size="10.5" fill="#6b7280">that outlives one turn</text><line x1="631.0" y1="210" x2="631.0" y2="250" stroke="#b7a37e" stroke-width="2" marker-end="url(#arrow-8-2-gray)"/><line x1="659.0" y1="250" x2="659.0" y2="210" stroke="#b7a37e" stroke-width="2" marker-end="url(#arrow-8-2-gray)"/><text x="645.0" y="230.0" text-anchor="middle" font-size="9.5" fill="#9aa3ad">read / write</text><rect x="60" y="405" width="1440" height="86" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="433" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Chapter 8.1's single "decide" box is five parts, not one.</text><text x="780.0" y="455" text-anchor="middle" font-size="13" fill="#1f2d3d">Perception and Action are the classical sensors and actuators from 8.1, still doing the same job.</text><text x="780.0" y="475" text-anchor="middle" font-size="13" fill="#1f2d3d">Reasoning, Memory, and Tools are what an LLM lets you build differently inside that same loop.</text></svg>