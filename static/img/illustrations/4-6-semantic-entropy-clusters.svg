<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-6-semantic-entropy desc-4-6-semantic-entropy">
  <title id="title-4-6-semantic-entropy">Semantic entropy: clustering sampled answers by meaning, not wording</title>
  <desc id="desc-4-6-semantic-entropy">A diagram contrasting low semantic entropy, where sampled answers cluster into one meaning, against high semantic entropy, where sampled answers split across several distinct meanings, flagging likely confabulation.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Semantic entropy: clustering sampled answers by meaning, not wording</text>
  <text x="260" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Low semantic entropy</text><circle cx="180" cy="180" r="16" fill="#2a78d6"/><circle cx="230" cy="210" r="16" fill="#2a78d6"/><circle cx="190" cy="240" r="16" fill="#2a78d6"/><circle cx="250" cy="170" r="16" fill="#2a78d6"/><circle cx="220" cy="260" r="16" fill="#2a78d6"/><circle cx="220" cy="215" r="90" fill="none" stroke="#184f95" stroke-width="2" stroke-dasharray="5 5"/><text x="260" y="340" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">All samples cluster to one meaning:</text><text x="260" y="358" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">likely a genuinely known fact</text><text x="1080" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">High semantic entropy</text><circle cx="950" cy="210" r="55" fill="none" stroke="#a33a2f" stroke-width="2" stroke-dasharray="5 5"/><circle cx="930" cy="195" r="16" fill="#a33a2f"/><circle cx="965" cy="220" r="16" fill="#a33a2f"/><circle cx="1090" cy="170" r="55" fill="none" stroke="#a33a2f" stroke-width="2" stroke-dasharray="5 5"/><circle cx="1075" cy="160" r="16" fill="#a33a2f"/><circle cx="1105" cy="180" r="16" fill="#a33a2f"/><circle cx="1150" cy="280" r="55" fill="none" stroke="#a33a2f" stroke-width="2" stroke-dasharray="5 5"/><circle cx="1135" cy="270" r="16" fill="#a33a2f"/><circle cx="1160" cy="295" r="16" fill="#a33a2f"/><text x="1080" y="360" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Samples split across different meanings:</text><text x="1080" y="378" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">flagged as likely confabulation</text><rect x="60" y="430" width="1240" height="100" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="456.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Farquhar et al., "Detecting hallucinations in large language models using semantic entropy" (Nature,</text><text x="680" y="473.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">2024): sampled outputs are clustered by whether they mean the same thing, not whether they are</text><text x="680" y="491.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">worded the same way, and entropy is measured over those meaning-based clusters rather than over raw</text><text x="680" y="508.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">token sequences.</text>
</svg>