<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-4-spectrum desc-7-4-spectrum">
  <title id="title-7-4-spectrum">A spectrum from retrieval to continual pretraining</title>
  <desc id="desc-7-4-spectrum">Five stages left to right: retrieval and prompting add facts at inference time without changing weights; task fine-tuning trains on labeled examples for one narrow task; domain-adaptive pretraining continues the original pretraining objective on unlabeled domain text; task-adaptive pretraining narrows that further to the task's own unlabeled text; continual pretraining repeatedly updates the model's full knowledge base over time. A gradient bar beneath shows forgetting risk increasing from left to right.</desc>
  <rect width="1600" height="520" fill="#fbfaf7"/>
  <text x="800" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">A spectrum from retrieval to continual pretraining</text>
  <defs><marker id="arrow-7-4-spectrum-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="40" y="100" width="280" height="120" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="180" y="156.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Retrieval / prompting</text><text x="180" y="180.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">facts added at inference time, no weight change</text><rect x="350" y="100" width="280" height="120" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="490" y="156.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Task fine-tuning</text><text x="490" y="180.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">labeled examples, one narrow task (Ch. 7.1-7.2)</text><line x1="320" y1="160" x2="350" y2="160" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-spectrum-main)"/><rect x="660" y="100" width="280" height="120" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="800" y="147.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Domain-adaptive</text><text x="800" y="164.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">pretraining</text><text x="800" y="188.95000000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">unlabeled domain text, same pretraining objective</text><line x1="630" y1="160" x2="660" y2="160" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-spectrum-main)"/><rect x="970" y="100" width="280" height="120" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1110" y="147.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Task-adaptive</text><text x="1110" y="164.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">pretraining</text><text x="1110" y="188.95000000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">unlabeled task text, narrower than DAPT</text><line x1="940" y1="160" x2="970" y2="160" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-spectrum-main)"/><rect x="1280" y="100" width="280" height="120" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1420" y="156.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Continual pretraining</text><text x="1420" y="180.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">repeated updates across the model’s full scope</text><line x1="1250" y1="160" x2="1280" y2="160" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-spectrum-main)"/><defs><linearGradient id="risk-gradient-7-4" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#dcf0e4"/>
    <stop offset="100%" stop-color="#f6c9d8"/>
  </linearGradient></defs><rect x="40" y="280" width="1520" height="26" rx="6" fill="url(#risk-gradient-7-4)" stroke="#b8b5ad" stroke-width="1"/><text x="40" y="328" font-size="12.5" fill="#6b7280">Lower forgetting risk</text><text x="1560" y="328" text-anchor="end" font-size="12.5" fill="#6b7280">Higher forgetting risk</text><rect x="40" y="360" width="1520" height="130" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="800" y="392" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="700">Each step further right reaches deeper into what the model already knows.</text><text x="800" y="418" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="400">Retrieval changes nothing about the model itself; continual pretraining changes everything, repeatedly.</text><text x="800" y="444" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="400">DAPT and TAPT sit in between: they extend pretraining, not fine-tuning, on progressively narrower unlabeled text.</text>
</svg>