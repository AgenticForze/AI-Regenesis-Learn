<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-7-watermark desc-4-7-watermark">
  <title id="title-4-7-watermark">Text watermarking: biasing sampling toward a detectable pattern</title>
  <desc id="desc-4-7-watermark">A diagram showing preceding tokens hashed to split the vocabulary into a green list, whose logits are boosted before sampling, and a red list that is not boosted, with detection performed as a statistical test on the fraction of green-list tokens observed.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Text watermarking: biasing sampling toward a detectable pattern</text>
  <defs><marker id="arrow-4-7-wm" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="100" width="280" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="220" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Preceding tokens</text><text x="220" y="159" text-anchor="middle" font-size="12" fill="#52514e">hashed to seed a split</text><rect x="460" y="100" width="240" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="580" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Pseudorandom hash</text><text x="580" y="159" text-anchor="middle" font-size="12" fill="#ffffff">splits the vocabulary</text><line x1="360.0" y1="145.0" x2="460.0" y2="145.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-wm)"/><rect x="300" y="280" width="340" height="130" rx="8" fill="#dcefe0" stroke="#2f8f4e" stroke-width="1.5"/><text x="470" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b39">Green list</text><text x="470" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#1f6b39">Logits boosted before</text><text x="470" y="357" text-anchor="middle" font-size="12" font-weight="400" fill="#1f6b39">sampling: favored tokens</text><rect x="700" y="280" width="340" height="130" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="870" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Red list</text><text x="870" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">Not boosted:</text><text x="870" y="357" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">disfavored tokens</text><line x1="555.3" y1="190.0" x2="505.8" y2="280.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-wm)"/><line x1="645.3" y1="190.0" x2="775.8" y2="280.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-wm)"/><rect x="380" y="470" width="600" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Detection: statistical test</text><text x="680" y="534" text-anchor="middle" font-size="12.5" fill="#52514e">on the fraction of green-list tokens observed</text><line x1="548.0" y1="410.0" x2="620.0" y2="470.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-wm)"/><line x1="799.4" y1="410.0" x2="734.3" y2="470.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-wm)"/><rect x="60" y="590" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="613.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Kirchenbauer et al., 2023: detection needs the same hash/key used at generation, not the model's</text><text x="680" y="631.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">weights or internals. Paraphrasing degrades detection; short passages are hard to test reliably.</text>
</svg>