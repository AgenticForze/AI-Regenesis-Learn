<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-2-word2sent desc-6-2-word2sent">
  <title id="title-6-2-word2sent">From individual word vectors to a single vector per sentence</title>
  <desc id="desc-6-2-word2sent">A diagram showing the progression from word2vec's individual word vectors, to naively averaging word vectors to represent a sentence, to Sentence-BERT's siamese network fine-tuning of BERT producing a single fixed-size sentence vector, with a callout that this cut the time to find the most similar pair among 10,000 sentences from 65 hours to about 5 seconds.</desc>
  <defs></defs>
  <rect width="1400" height="620" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">From individual word vectors to a single vector per sentence</text>
  <defs><marker id="arrow-6-2-word2sent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="40" y="140" width="280" height="130" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="180" y="189.575" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">word2vec</text><text x="180" y="224.32500000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Individual word vectors</text><text x="180" y="238.62500000000003" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">(Mikolov et al., 2013)</text><rect x="380" y="140" width="280" height="130" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="520" y="189.575" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Naive averaging</text><text x="520" y="224.32500000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Average word vectors to</text><text x="520" y="238.62500000000003" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">approximate a sentence,</text><text x="520" y="252.925" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">loses too much meaning</text><rect x="720" y="140" width="280" height="130" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="860" y="189.575" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">SBERT fine-tuning</text><text x="860" y="224.32500000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">Siamese/triplet network</text><text x="860" y="238.62500000000003" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">fine-tunes BERT (Reimers</text><text x="860" y="252.925" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">and Gurevych, 2019)</text><rect x="1060" y="140" width="280" height="130" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="1200" y="189.575" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Sentence vector</text><text x="1200" y="224.32500000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#cde2fb">One fixed-size vector</text><text x="1200" y="238.62500000000003" text-anchor="middle" font-size="11" font-weight="400" fill="#cde2fb">per sentence, comparable</text><text x="1200" y="252.925" text-anchor="middle" font-size="11" font-weight="400" fill="#cde2fb">directly</text><line x1="320.0" y1="205.0" x2="380.0" y2="205.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-word2sent)"/><line x1="660.0" y1="205.0" x2="720.0" y2="205.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-word2sent)"/><line x1="1000.0" y1="205.0" x2="1060.0" y2="205.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-word2sent)"/><rect x="260" y="360" width="880" height="160" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="700" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">Finding the most similar pair among 10,000 sentences: about 65</text><text x="700" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">hours with BERT, about 5 seconds with SBERT</text><text x="700" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">SBERT also scored 11.7 points above InferSent and 5.5 points above the</text><text x="700" y="487" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Universal Sentence Encoder on semantic textual similarity benchmarks</text><line x1="1200" y1="270" x2="700" y2="360" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-6-2-word2sent)"/>
</svg>