<svg width="950" height="420" viewBox="0 0 950 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-mp2 desc-mp2">
  <title id="title-mp2">Max pooling takes the maximum value from each 2x2 region</title>
  <desc id="desc-mp2">A 4x4 feature map is divided into four non-overlapping 2x2 blocks, each outlined in a different color. Max pooling replaces each block with its single maximum value, producing a smaller 2x2 output, color-matched to the block it came from.</desc>
