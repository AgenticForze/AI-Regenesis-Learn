<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-3-react desc-5-3-react">
  <title id="title-5-3-react">ReAct: interleaving reasoning, action, and observation</title>
  <desc id="desc-5-3-react">A diagram showing a repeating loop of three steps: thought, where the model reasons about what is known so far; action, where it calls a tool with specific arguments; and observation, where the tool's real-world result feeds back into the next thought step, repeating until the model has enough information to produce a final answer.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">ReAct: interleaving reasoning, action, and observation</text>
  <defs><marker id="arrow-5-3-react" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="230" y="200" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="229.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Thought</text><text x="360" y="264.45" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">reason about what is known</text><text x="360" y="279.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">so far</text><rect x="550" y="200" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="229.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Action</text><text x="680" y="264.45" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">call a tool with specific</text><text x="680" y="279.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">arguments</text><rect x="870" y="200" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1000" y="229.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Observation</text><text x="1000" y="264.45" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">the tool's real-world</text><text x="1000" y="279.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">result</text><line x1="490.0" y1="245.0" x2="550.0" y2="245.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-react)"/><line x1="810.0" y1="245.0" x2="870.0" y2="245.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-react)"/><path d="M 1000 290 L 1000 350 L 360 350 L 360 290" fill="none" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-react)"/><text x="680" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Repeats until the model has enough information to produce a final answer</text><rect x="60" y="420" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="450" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Yao et al., 2022: interleaving reasoning with tool actions and their observations raised task</text><text x="680" y="467.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">success by 34 percentage points on an interactive decision-making benchmark, and reduced</text><text x="680" y="485" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">hallucinated claims relative to chain-of-thought prompting on knowledge-intensive QA.</text>
</svg>