<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-6-compare desc-6-6-compare">
  <title id="title-6-6-compare">The same facts, three representations</title>
  <desc id="desc-6-6-compare">A three-panel comparison: a relational database representing facts as separate tables joined together at query time; a vector index representing facts as points in embedding space found by similarity with no explicit relationships; and a knowledge graph representing facts as nodes connected by labeled, stored relationships that can be traversed directly.</desc>
  <rect width="1560" height="700" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The same facts, three representations</text>
  <defs><marker id="arrow-6-6-compare-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="50" y="140" width="460" height="74" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="280" y="173.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Relational database</text><text x="280" y="199.125" text-anchor="middle" font-size="10.5" fill="#6b7280">joined at query time</text><rect x="560" y="140" width="460" height="74" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="790" y="173.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Vector index</text><text x="790" y="199.125" text-anchor="middle" font-size="10.5" fill="#6b7280">similarity, no explicit links</text><rect x="1070" y="140" width="460" height="74" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1300" y="173.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Knowledge graph</text><text x="1300" y="199.125" text-anchor="middle" font-size="10.5" fill="#6b7280">relationships stored as edges</text><rect x="50" y="238" width="460" height="380" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><rect x="560" y="238" width="460" height="380" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><rect x="1070" y="238" width="460" height="380" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><rect x="90" y="278" width="170" height="90" rx="4" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3"/><line x1="90" y1="308" x2="260" y2="308" stroke="#b8b5ad" stroke-width="1"/><line x1="90" y1="338" x2="260" y2="338" stroke="#b8b5ad" stroke-width="1"/><rect x="300" y="428" width="170" height="90" rx="4" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3"/><line x1="300" y1="458" x2="470" y2="458" stroke="#b8b5ad" stroke-width="1"/><line x1="300" y1="488" x2="470" y2="488" stroke="#b8b5ad" stroke-width="1"/><text x="175" y="268" text-anchor="middle" font-size="10.5" fill="#6b7280">customers table</text><text x="385" y="418" text-anchor="middle" font-size="10.5" fill="#6b7280">orders table</text><path d="M 260 323 L 300 473" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="4 3"/><text x="280" y="588" text-anchor="middle" font-size="10.5" fill="#c98b3a">JOIN computed fresh every query</text><circle cx="790" cy="408" r="7" fill="#5b8fc9"/><text x="790" y="392" text-anchor="middle" font-size="10.5" fill="#6b7280">query</text><circle cx="830" cy="348" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="860" cy="438" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="700" cy="418" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="760" cy="498" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="890" cy="368" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="720" cy="328" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="810" cy="518" r="5" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.2"/><circle cx="790" cy="408" r="95" fill="none" stroke="#5b8fc9" stroke-width="1" stroke-dasharray="3 3"/><text x="790" y="588" text-anchor="middle" font-size="10.5" fill="#6b7280">nearest by distance, no labeled relationships</text><circle cx="1230" cy="278" r="30" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.6"/><circle cx="1120" cy="438" r="30" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.6"/><circle cx="1440" cy="458" r="30" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.6"/><text x="1230" y="282" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Company</text><text x="1120" y="442" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Person</text><text x="1440" y="462" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2d3d">Filing</text><line x1="1230" y1="278" x2="1120" y2="438" stroke="#5b8fc9" stroke-width="2"/><line x1="1230" y1="278" x2="1440" y2="458" stroke="#5b8fc9" stroke-width="2"/><text x="1145" y="358" text-anchor="middle" font-size="9.5" fill="#5b8fc9">employs</text><text x="1370" y="368" text-anchor="middle" font-size="9.5" fill="#5b8fc9">filed</text><text x="1300" y="588" text-anchor="middle" font-size="10.5" fill="#6b7280">relationships stored as edges, traversed directly</text>
</svg>