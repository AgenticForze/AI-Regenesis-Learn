<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-1-decision desc-6-1-decision">
  <title id="title-6-1-decision">Deciding whether a question needs retrieval at all</title>
  <desc id="desc-6-1-decision">A decision-flow diagram: a user asks a question, and if answering it well requires current knowledge, a citable source, or a narrow fact unlikely to have been learned well during pretraining, the system retrieves relevant passages from an external, updatable knowledge store and generates a grounded, cited answer; otherwise it answers from parametric memory alone, risking a stale, uncited, or fluent-but-wrong guess.</desc>
  <defs></defs>
  <rect width="1400" height="760" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Deciding whether a question needs retrieval at all</text>
  <defs><marker id="arrow-6-1-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="480" y="90" width="440" height="80" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="131.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">A user asks a question</text><rect x="420" y="220" width="560" height="130" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Does it need knowledge that is</text><text x="700" y="270.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">current, needs a citable</text><text x="700" y="286.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">source, or is too narrow to</text><text x="700" y="301.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">have been learned well during</text><text x="700" y="317.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">pretraining?</text><line x1="700.0" y1="170.0" x2="700.0" y2="220.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-decision)"/><rect x="100" y="410" width="400" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="300" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Answer from</text><text x="300" y="456.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">parametric memory</text><text x="300" y="472.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">alone</text><line x1="547.1" y1="350.0" x2="405.9" y2="410.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-6-1-decision)"/><rect x="900" y="410" width="400" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1100" y="432.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Retrieve relevant</text><text x="1100" y="448.40000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">passages from an</text><text x="1100" y="464" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">external, updatable</text><text x="1100" y="479.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">knowledge store</text><line x1="852.9" y1="350.0" x2="994.1" y2="410.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-decision)"/><rect x="100" y="560" width="400" height="90" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="300" y="590.6" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">Risk: stale,</text><text x="300" y="606.2" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">uncited, or a</text><text x="300" y="621.8000000000001" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">fluent guess</text><line x1="300.0" y1="500.0" x2="300.0" y2="560.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-decision)"/><rect x="900" y="560" width="400" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1100" y="582.8" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Pass retrieved</text><text x="1100" y="598.4" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">passages into the</text><text x="1100" y="614" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">prompt and generate a</text><text x="1100" y="629.5999999999999" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">grounded, cited answer</text><line x1="1100.0" y1="500.0" x2="1100.0" y2="560.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-decision)"/>
</svg>