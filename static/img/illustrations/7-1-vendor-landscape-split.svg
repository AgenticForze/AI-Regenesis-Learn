<svg width="1500" height="640" viewBox="0 0 1500 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-1-vendor desc-7-1-vendor">
  <title id="title-7-1-vendor">Which fine-tuning path is actually reachable in 2026</title>
  <desc id="desc-7-1-vendor">A split diagram comparing two paths. The left column, closed model and vendor-managed, shows a self-serve fine-tuning API narrowing through a phased access wind-down into an assisted fine-tuning or custom models relationship. The right column, open-weight and self-hosted, shows a base model whose weights are downloadable today feeding directly into self-hosted parameter-efficient fine-tuning covered in Chapter 7.2, with no vendor gate. A note below states that the open-weight path stayed fully self-serve while the closed-model path narrowed to a vendor relationship.</desc>
  <rect width="1500" height="640" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Which fine-tuning path is actually reachable in 2026</text>
  <defs><marker id="arrow-7-1-vendor-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="261" y="60" width="238" height="26" rx="13" fill="#6b7280" /><text x="380" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">CLOSED MODEL, VENDOR-MANAGED</text><rect x="1016" y="60" width="208" height="26" rx="13" fill="#5b8fc9" /><text x="1120" y="77.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">OPEN-WEIGHT, SELF-HOSTED</text><rect x="150" y="120" width="460" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="380" y="161.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Self-serve fine-tuning API</text><text x="380" y="185.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">available on demand, no vendor relationship needed, through mid-2026</text><line x1="380" y1="210" x2="380" y2="250" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-1-vendor-main)"/><rect x="150" y="250" width="460" height="90" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="380" y="291.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Phased access wind-down</text><text x="380" y="315.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">May 2026 - Jan 2027: new-org, then inactive-org, then all-org limits</text><line x1="380" y1="340" x2="380" y2="380" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-vendor-main)"/><rect x="150" y="380" width="460" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="380" y="412.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Assisted fine-tuning / custom</text><text x="380" y="429.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">models</text><text x="380" y="453.95" text-anchor="middle" font-size="10.5" fill="#6b7280">a vendor relationship, not an on-demand API call</text><rect x="890" y="120" width="460" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1120" y="161.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Open-weight base model</text><text x="1120" y="185.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">Llama, Qwen, Mistral, and similar, weights you can download today</text><line x1="1120" y1="210" x2="1120" y2="250" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-vendor-main)"/><rect x="890" y="250" width="460" height="90" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1120" y="291.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Self-hosted PEFT fine-tuning</text><text x="1120" y="315.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">Ch. 7.2: your own compute, your own schedule, no vendor gate</text><rect x="150" y="500" width="1200" height="100" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">What changed in 2026</text><text x="750" y="566" text-anchor="middle" font-size="13.5" fill="#1f2d3d">The closed-model path narrowed to a vendor relationship. The open-weight path stayed fully self-serve,</text><text x="750" y="590" text-anchor="middle" font-size="13.5" fill="#1f2d3d">which is why Chapter 7.2's parameter-efficient techniques matter more now than they did a year earlier.</text>
</svg>