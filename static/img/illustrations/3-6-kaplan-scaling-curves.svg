<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-kaplancurves desc-kaplancurves">
  <title id="title-kaplancurves">Kaplan et al.: test loss falls as a smooth power law in each of three variables</title>
  <desc id="desc-kaplancurves">Three panels showing test loss decreasing as a smooth, predictable power-law curve as model size, dataset size, and total compute each independently increase, the core empirical finding of Kaplan et al.'s 2020 scaling laws paper.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three power-law curves, one consistent pattern</text>
  <rect x="60" y="110" width="380" height="330" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="250" y="142" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Loss vs. model size (N)</text><line x1="110" y1="400" x2="400" y2="400" stroke="#898781" stroke-width="1.5"/><line x1="110" y1="400" x2="110" y2="180" stroke="#898781" stroke-width="1.5"/><path d="M 120 390 L 131.3 386.6 L 142.5 383.2 L 153.8 379.6 L 165.0 376.0 L 176.3 372.2 L 187.5 368.4 L 198.8 364.4 L 210.0 360.2 L 221.3 356.0 L 232.5 351.5 L 243.8 346.9 L 255.0 342.0 L 266.3 336.9 L 277.5 331.5 L 288.8 325.8 L 300.0 319.8 L 311.3 313.2 L 322.5 306.1 L 333.8 298.3 L 345.0 289.5 L 356.3 279.3 L 367.5 266.9 L 378.8 250.0 L 390.0 200.0" fill="none" stroke="#2a78d6" stroke-width="2.5"/><text x="255" y="428" text-anchor="middle" font-size="11.5" fill="#52514e">more parameters →</text><text x="96" y="290" text-anchor="middle" font-size="11.5" fill="#52514e" transform="rotate(-90 96 290)">test loss</text><rect x="480" y="110" width="380" height="330" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="670" y="142" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Loss vs. dataset size (D)</text><line x1="530" y1="400" x2="820" y2="400" stroke="#898781" stroke-width="1.5"/><line x1="530" y1="400" x2="530" y2="180" stroke="#898781" stroke-width="1.5"/><path d="M 540 390 L 551.3 386.6 L 562.5 383.2 L 573.8 379.6 L 585.0 376.0 L 596.3 372.2 L 607.5 368.4 L 618.8 364.4 L 630.0 360.2 L 641.3 356.0 L 652.5 351.5 L 663.8 346.9 L 675.0 342.0 L 686.3 336.9 L 697.5 331.5 L 708.8 325.8 L 720.0 319.8 L 731.3 313.2 L 742.5 306.1 L 753.8 298.3 L 765.0 289.5 L 776.3 279.3 L 787.5 266.9 L 798.8 250.0 L 810.0 200.0" fill="none" stroke="#2a78d6" stroke-width="2.5"/><text x="675" y="428" text-anchor="middle" font-size="11.5" fill="#52514e">more tokens →</text><text x="516" y="290" text-anchor="middle" font-size="11.5" fill="#52514e" transform="rotate(-90 516 290)">test loss</text><rect x="900" y="110" width="380" height="330" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1090" y="142" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Loss vs. compute (C)</text><line x1="950" y1="400" x2="1240" y2="400" stroke="#898781" stroke-width="1.5"/><line x1="950" y1="400" x2="950" y2="180" stroke="#898781" stroke-width="1.5"/><path d="M 960 390 L 971.3 386.6 L 982.5 383.2 L 993.8 379.6 L 1005.0 376.0 L 1016.3 372.2 L 1027.5 368.4 L 1038.8 364.4 L 1050.0 360.2 L 1061.3 356.0 L 1072.5 351.5 L 1083.8 346.9 L 1095.0 342.0 L 1106.3 336.9 L 1117.5 331.5 L 1128.8 325.8 L 1140.0 319.8 L 1151.3 313.2 L 1162.5 306.1 L 1173.8 298.3 L 1185.0 289.5 L 1196.3 279.3 L 1207.5 266.9 L 1218.8 250.0 L 1230.0 200.0" fill="none" stroke="#2a78d6" stroke-width="2.5"/><text x="1095" y="428" text-anchor="middle" font-size="11.5" fill="#52514e">more compute →</text><text x="936" y="290" text-anchor="middle" font-size="11.5" fill="#52514e" transform="rotate(-90 936 290)">test loss</text><rect x="60" y="480" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="503.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">All three relationships hold as smooth power laws across many orders of magnitude, with no sign of</text><text x="680" y="521.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">the returns to scale disappearing at the sizes tested.</text>
</svg>