<svg width="1500" height="1040" viewBox="0 0 1500 1040" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-9-refarch desc-6-9-refarch">
  <title id="title-6-9-refarch">The full Phase 6 blueprint: ingestion, query, observability, and governance</title>
  <desc id="desc-6-9-refarch">A single-column flow diagram showing source documents entering an ingestion pipeline that builds a vector and graph index, feeding a query pipeline of retrieval, reranking, caching, and generation, watched continuously by an observability layer and periodically by evaluation, both feeding a production dashboard, which a governance layer reviews for context drift, routing corrections back into the ingestion pipeline to close the loop.</desc>
  <rect width="1500" height="1040" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The full Phase 6 blueprint: ingestion, query, observability, and governance</text>
  <defs><marker id="arrow-6-9-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="100" y="100" width="1300" height="64" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="134.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Source documents</text><rect x="100" y="186" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="220.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Ingestion pipeline: parse, chunk, embed, index (Ch. 6.1-6.3, 6.6)</text><line x1="750" y1="164" x2="750" y2="186" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="272" width="1300" height="64" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="750" y="306.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Vector + graph index</text><line x1="750" y1="250" x2="750" y2="272" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="358" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="392.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Retrieval + reranking + advanced patterns (Ch. 6.4-6.5)</text><line x1="750" y1="336" x2="750" y2="358" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="444" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="472.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Caching layer: prompt / semantic / tool-call (Ch. 6.7)</text><text x="750" y="495.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">hit: return cached answer | miss: continue</text><line x1="750" y1="422" x2="750" y2="444" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="530" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="564.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Generation</text><line x1="750" y1="508" x2="750" y2="530" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="616" width="1300" height="64" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="750" y="650.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Observability: chunk attribution, chunk utilization, latency</text><line x1="750" y1="594" x2="750" y2="616" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="702" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="728.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Evaluation: Faithfulness, Context Precision/Recall, Answer</text><text x="750" y="744" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Relevancy (Ch. 6.8)</text><line x1="750" y1="680" x2="750" y2="702" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="788" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="822.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Continuous production dashboard</text><line x1="750" y1="766" x2="750" y2="788" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><rect x="100" y="874" width="1300" height="64" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="750" y="902.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Governance: access controls, lineage, context-drift review</text><text x="750" y="925.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">corrections + drift findings feed back into ingestion</text><line x1="750" y1="852" x2="750" y2="874" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-refarch-main)"/><path d="M 100 906 C 40 906, 40 218, 100 218" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-refarch-main)"/>
</svg>