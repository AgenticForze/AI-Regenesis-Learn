<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-8-rag desc-5-8-rag">
  <title id="title-5-8-rag">RAG at a glance: retriever and generator working together</title>
  <desc id="desc-5-8-rag">A diagram showing a user query passed to a neural retriever, which searches a document index and returns relevant documents, which are then passed along with the original query to a generator model that produces a grounded, citable answer.</desc>
  <defs></defs>
  <rect width="1400" height="560" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">RAG at a glance: retriever and generator working together</text>
  <defs><marker id="arrow-5-8-rag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="60" y="220" width="230" height="110" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="175" y="268.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">A user query</text><text x="175" y="284.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">arrives</text><rect x="320" y="220" width="230" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="435" y="260.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Neural retriever</text><text x="435" y="276.20000000000005" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">searches a</text><text x="435" y="291.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">document index</text><line x1="290.0" y1="275.0" x2="320.0" y2="275.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-rag)"/><rect x="580" y="220" width="230" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="695" y="260.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Relevant</text><text x="695" y="276.20000000000005" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">documents are</text><text x="695" y="291.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">retrieved</text><line x1="550.0" y1="275.0" x2="580.0" y2="275.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-rag)"/><rect x="840" y="220" width="230" height="110" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="955" y="246.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Generator</text><text x="955" y="261.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">(seq2seq model)</text><text x="955" y="276.15" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">conditions on</text><text x="955" y="291.1" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">query and</text><text x="955" y="306.05" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">documents</text><line x1="810.0" y1="275.0" x2="840.0" y2="275.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-rag)"/><rect x="1100" y="220" width="230" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1215" y="268.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Grounded,</text><text x="1215" y="284.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">citable answer</text><line x1="1070.0" y1="275.0" x2="1100.0" y2="275.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-rag)"/><rect x="60" y="380" width="1280" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="410" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Lewis et al. (2020): a RAG model pairs "a pre-trained seq2seq model" (parametric memory) with "a</text><text x="700" y="427.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">dense vector index of Wikipedia, accessed with a pre-trained neural retriever" (non-parametric</text><text x="700" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">memory). Ingestion, chunking, and reranking are covered in full in Phase 6.</text>
</svg>