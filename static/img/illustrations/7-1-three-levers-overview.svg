<svg width="1500" height="720" viewBox="0 0 1500 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-1-overview desc-7-1-overview">
  <title id="title-7-1-overview">The diagnostic question comes before the tool choice</title>
  <desc id="desc-7-1-overview">A decision triage diagram: an observed gap between model behavior and desired behavior is first diagnosed as either a knowledge gap or a behavior gap. A knowledge gap routes to RAG. A behavior gap routes first to prompting, and only escalates to fine-tuning, shown as a dashed line, if prompting does not close the gap.</desc>
  <rect width="1500" height="720" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The diagnostic question comes before the tool choice</text>
  <defs><marker id="arrow-7-1-overview-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="560" y="60" width="380" height="80" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="87.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Observed gap between what the</text><text x="750" y="104.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">model does and what it should do</text><text x="750" y="128.95" text-anchor="middle" font-size="10.5" fill="#6b7280">Chapter 5.6 eval failure, not a vague impression</text><line x1="750" y1="140" x2="750" y2="190" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-overview-main)"/><rect x="530" y="190" width="440" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="750" y="218.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Diagnostic question: knowledge gap, or</text><text x="750" y="236.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">behavior gap?</text><line x1="750" y1="260" x2="750" y2="320" stroke="#5b8fc9" stroke-width="2"/><line x1="370" y1="320" x2="1130" y2="320" stroke="#5b8fc9" stroke-width="2"/><line x1="370" y1="320" x2="370" y2="360" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-overview-main)"/><line x1="1130" y1="320" x2="1130" y2="360" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-overview-main)"/><rect x="160" y="360" width="420" height="90" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="370" y="393.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Knowledge gap: model does not</text><text x="370" y="409.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">know a fact</text><text x="370" y="433.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">stale, missing, or unverifiable information</text><rect x="920" y="360" width="420" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1130" y="393.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Behavior gap: model knows it, is</text><text x="1130" y="409.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">not behaving right</text><text x="1130" y="433.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">wrong format, off tone, unreliable instruction-following</text><line x1="370" y1="450" x2="370" y2="500" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-overview-main)"/><rect x="190" y="500" width="360" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="370" y="536.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">RAG</text><text x="370" y="562.125" text-anchor="middle" font-size="10.5" fill="#6b7280">Phase 6: ground the answer in retrieved, current documents</text><line x1="1130" y1="450" x2="1130" y2="500" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-overview-main)"/><rect x="950" y="500" width="360" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1130" y="536.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Prompting first</text><text x="1130" y="562.125" text-anchor="middle" font-size="10.5" fill="#6b7280">Phase 5: revise the prompt and few-shot examples, re-measure</text><line x1="1130" y1="580" x2="1130" y2="620" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-1-overview-main)"/><rect x="950" y="620" width="360" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1130" y="643.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Fine-tuning, only if the gap still</text><text x="1130" y="659" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">persists</text><text x="1130" y="682.25" text-anchor="middle" font-size="10.5" fill="#6b7280">Phase 7: narrow, well-scoped tasks only</text><rect x="20" y="490" width="130" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="85" y="515" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">KNOWLEDGE</text><rect x="20" y="555" width="130" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="85" y="580" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">BEHAVIOR</text>
</svg>