<svg width="1560" height="760" viewBox="0 0 1560 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-7-overview desc-6-7-overview">
  <title id="title-6-7-overview">Three caching layers, three different tradeoffs</title>
  <desc id="desc-6-7-overview">A pipeline diagram showing a request passing through a prompt cache checking for an exact-match static prefix, a semantic cache checking for a similar past question, generation and agent tool calls, and a tool-call cache checking per-call freshness, with three cards below describing each layer's risk profile: prompt caching has no correctness risk, semantic caching can return a confidently wrong or stale answer, and tool-call caching requires a freshness check separate from idempotency.</desc>
  <rect width="1560" height="760" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Three caching layers, three different tradeoffs</text>
  <defs><marker id="arrow-6-7-overview-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="680" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="228.8" height="96" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="394.4" y="174.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Request arrives</text><text x="394.4" y="196.9" text-anchor="middle" font-size="10.5" fill="#6b7280">system prompt + docs + question</text><rect x="532.8" y="130" width="228.8" height="96" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="647.1999999999999" y="174.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Prompt cache</text><text x="647.1999999999999" y="196.9" text-anchor="middle" font-size="10.5" fill="#6b7280">exact-match static prefix</text><rect x="785.6" y="130" width="228.8" height="96" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="900" y="174.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Semantic cache</text><text x="900" y="196.9" text-anchor="middle" font-size="10.5" fill="#6b7280">similarity check on the question</text><rect x="1038.4" y="130" width="228.8" height="96" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1152.8000000000002" y="174.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Generation</text><text x="1152.8000000000002" y="196.9" text-anchor="middle" font-size="10.5" fill="#6b7280">+ agent tool calls</text><rect x="1291.2" y="130" width="228.8" height="96" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1405.6000000000001" y="174.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Tool-call cache</text><text x="1405.6000000000001" y="196.9" text-anchor="middle" font-size="10.5" fill="#6b7280">per-call freshness check</text><line x1="508.8" y1="178" x2="532.8" y2="178" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-overview-main)"/><line x1="761.5999999999999" y1="178" x2="785.6" y2="178" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-overview-main)"/><line x1="1014.4000000000001" y1="178" x2="1038.4" y2="178" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-overview-main)"/><line x1="1267.2" y1="178" x2="1291.2" y2="178" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-overview-main)"/><rect x="20" y="158" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="183" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">PIPELINE</text><rect x="280" y="316" width="393.3333333333333" height="150" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="476.66666666666663" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Prompt caching</text><text x="476.66666666666663" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">Exact match required. No</text><text x="476.66666666666663" y="388" text-anchor="middle" font-size="10.5" fill="#6b7280">correctness risk: a miss just</text><text x="476.66666666666663" y="404" text-anchor="middle" font-size="10.5" fill="#6b7280">costs full price.</text><rect x="703.3333333333333" y="316" width="393.3333333333333" height="150" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="899.9999999999999" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Semantic caching</text><text x="899.9999999999999" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">Similarity match. Can return a</text><text x="899.9999999999999" y="388" text-anchor="middle" font-size="10.5" fill="#6b7280">fluent, confidently wrong or</text><text x="899.9999999999999" y="404" text-anchor="middle" font-size="10.5" fill="#6b7280">stale answer.</text><rect x="1126.6666666666665" y="316" width="393.3333333333333" height="150" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1323.3333333333333" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Tool-call caching</text><text x="1323.3333333333333" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">Freshness match. Idempotent is</text><text x="1323.3333333333333" y="388" text-anchor="middle" font-size="10.5" fill="#6b7280">not the same as safe to cache.</text><line x1="647.1999999999999" y1="226" x2="647.1999999999999" y2="316" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-7-overview-main)"/><line x1="900" y1="226" x2="900" y2="316" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-7-overview-main)"/><line x1="1405.6000000000001" y1="226" x2="1405.6000000000001" y2="316" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-7-overview-main)"/><rect x="20" y="371" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">TRADEOFFS</text>
</svg>