<svg width="1360" height="600" viewBox="0 0 1360 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-modecollapse desc-modecollapse">
  <title id="title-modecollapse">Mode collapse: a generator that reproduces only a narrow slice of the true data's variety</title>
  <desc id="desc-modecollapse">Two panels. The left panel shows the true data distribution as many distinct scattered clusters of points. The right panel shows a mode-collapsed generator producing samples concentrated in only one or two clusters, missing most of the true diversity while still looking locally convincing.</desc>
  <defs></defs>
  <rect width="1360" height="600" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">A failure mode specific to implicit-density training</text>
  <rect x="100" y="110" width="520" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">True data distribution</text><circle cx="209.20363179446872" cy="191.93467490967492" r="5" fill="#5598e7"/><circle cx="220.96279239389926" cy="201.03504545628425" r="5" fill="#5598e7"/><circle cx="227.5785188992313" cy="206.16439623941932" r="5" fill="#5598e7"/><circle cx="225.94689836181763" cy="187.64363663561684" r="5" fill="#5598e7"/><circle cx="216.83344128292745" cy="216.52887531597094" r="5" fill="#5598e7"/><circle cx="204.51392560037453" cy="182.00000000817812" r="5" fill="#5598e7"/><circle cx="321.5911768247756" cy="191.3997456555534" r="5" fill="#5598e7"/><circle cx="309.67957085332023" cy="164.01655967954662" r="5" fill="#5598e7"/><circle cx="302.61002019327447" cy="197.95489056588875" r="5" fill="#5598e7"/><circle cx="303.6993593324528" cy="163.0081064504974" r="5" fill="#5598e7"/><circle cx="312.43650096142085" cy="193.25183613742522" r="5" fill="#5598e7"/><circle cx="324.72222377554" cy="172.65402752810004" r="5" fill="#5598e7"/><circle cx="427.61713067430185" cy="202.01762536033635" r="5" fill="#5598e7"/><circle cx="439.6578546458452" cy="236.8282072881955" r="5" fill="#5598e7"/><circle cx="447.16738464084915" cy="207.07626848854517" r="5" fill="#5598e7"/><circle cx="446.62246023266806" cy="226.90707307299672" r="5" fill="#5598e7"/><circle cx="438.2787446391244" cy="220.23843889937058" r="5" fill="#5598e7"/><circle cx="426.05087472583796" cy="212.65501825329255" r="5" fill="#5598e7"/><circle cx="505.1173889624776" cy="188.01302961089715" r="5" fill="#5598e7"/><circle cx="502.09306264344826" cy="198.90769996726175" r="5" fill="#5598e7"/><circle cx="507.470168077503" cy="175.62739529974542" r="5" fill="#5598e7"/><circle cx="518.7259185125666" cy="207.48853101128861" r="5" fill="#5598e7"/><circle cx="530.5794321748872" cy="172.25377073264832" r="5" fill="#5598