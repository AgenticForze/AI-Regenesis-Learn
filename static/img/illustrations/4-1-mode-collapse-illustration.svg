circle cx="440.07386709393154" cy="407.99929966963157" r="5" fill="#5598e7"/><circle cx="452.0655876351673" cy="373.5344183368354" r="5" fill="#5598e7"/><circle cx="463.08819250903167" cy="402.24082074287634" r="5" fill="#5598e7"/><circle cx="467.97018528678996" cy="383.9845117085814" r="5" fill="#5598e7"/><circle cx="464.4210721601093" cy="388.80701795446413" r="5" fill="#5598e7"/><text x="360" y="480" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Real data has many distinct clusters</text><text x="360" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">(e.g., many rare-but-legitimate transaction types)</text><rect x="740" y="110" width="520" height="340" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1000" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#a33a2f">Mode-collapsed generator</text><circle cx="1000" cy="305" r="5" fill="#a33a2f"/><circle cx="992.8619799037881" cy="226.33741116399497" r="5" fill="#a33a2f"/><circle cx="1014.0952952094888" cy="265.3631060951968" r="5" fill="#a33a2f"/><circle cx="979.3043429189684" cy="285.63876504193905" r="5" fill="#a33a2f"/><circle cx="1026.7719750110443" cy="216.27835142170392" r="5" fill="#a33a2f"/><circle cx="967.8296121504507" cy="299.7738518168825" r="5" fill="#a33a2f"/><circle cx="1036.7541999830264" cy="244.21538990558912" r="5" fill="#a33a2f"/><circle cx="959.5926573351344" cy="243.8417410517756" r="5" fill="#a33a2f"/><circle cx="1043.0373130437458" cy="299.9592246401787" r="5" fill="#a33a2f"/><circle cx="955.4224835305081" cy="216.37466120298453" r="5" fill="#a33a2f"/><circle cx="1044.9889527658434" cy="285.30930170450347" r="5" fill="#a33a2f"/><circle cx="955.7387962287291" cy="265.7597113745665" r="5" fill="#a33a2f"/><circle cx="1042.4126971418793" cy="226.07350737033678" r="5" fill="#a33a2f"/><circle cx="960.5097602634706" cy="304.99822516054934" r="5" fill="#a33a2f"/><circle cx="1035.5678323995357" cy="226.6039703216