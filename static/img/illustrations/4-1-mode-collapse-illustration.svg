ircle cx="1034.8373784490993" cy="274.590283877123" r="5" fill="#a33a2f"/><circle cx="1038.0063691545142" cy="273.4693667897592" r="5" fill="#a33a2f"/><circle cx="1049.0994016281627" cy="330.14144540977236" r="5" fill="#a33a2f"/><text x="1000" y="480" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Generator settles on only a narrow subset</text><text x="1000" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">of the true variety, fooling the discriminator anyway</text><rect x="60" y="540" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="563.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Mode collapse can look fine on aggregate similarity metrics while systematically missing the rare</text><text x="680" y="581.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">patterns that matter most operationally.</text>
