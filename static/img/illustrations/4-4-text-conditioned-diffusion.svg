<svg width="1360" height="700" viewBox="0 0 1360 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-crossattncond desc-crossattncond">
  <title id="title-crossattncond">A text encoder embedding steers diffusion via cross-attention at every denoising step</title>
  <desc id="desc-crossattncond">A text prompt is embedded by a text encoder such as CLIP or T5. A denoising network cross-attends to that embedding at every step, taking a noisy image as input and producing a slightly less noisy image as output, repeated across the full reverse diffusion process.</desc>
  <defs><marker id="arr44b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="700" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Conditioning diffusion on a text prompt</text>
  <rect x="100" y="240" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="210" y="289.8333333333333" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Text prompt</text><rect x="400" y="240" width="240" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="520" y="281" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Text encoder</text><text x="520" y="299" text-anchor="middle" font-size="11" fill="#52514e">CLIP or T5 (Imagen)</text><line x1="320.0" y1="285.0" x2="400.0" y2="285.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44b)"/><rect x="400" y="450" width="240" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="520" y="491" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Noisy image</text><text x="520" y="509" text-anchor="middle" font-size="11" fill="#52514e">at denoising step t</text><rect x="780" y="330" width="260" height="90" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="910" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Denoising network</text><text x="910" y="389" text-anchor="middle" font-size="11" fill="#cde2fb">cross-attends to text embedding</text><line x1="640.0" y1="312.7" x2="780.0" y2="345.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44b)"/><line x1="640.0" y1="458.1" x2="780.0" y2="415.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44b)"/><rect x="1130" y="330" width="200" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1230" y="371" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Slightly less</text><text x="1230" y="389" text-anchor="middle" font-size="11" fill="#52514e">noisy image</text><line x1="1040.0" y1="375.0" x2="1130.0" y2="375.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44b)"/><text x="910" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Repeated at every denoising step</text><rect x="60" y="580" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="610" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Cross-attention lets the denoising network attend to the text embedding at every step of the reverse</text><text x="680" y="627.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">diffusion process (4.2), steering generation toward the prompt rather than toward an arbitrary</text><text x="680" y="645" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">sample from the training distribution.</text>
</svg>