<svg width="1400" height="700" viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-2-tot desc-5-2-tot">
  <title id="title-5-2-tot">Tree-of-thought: searching and backtracking across partial solutions</title>
  <desc id="desc-5-2-tot">A diagram showing a problem state branching into two approaches, one of which is self-evaluated as violating a constraint and abandoned, with the search backtracking to continue from the surviving, promising branch through to a final answer.</desc>
  <defs></defs>
  <rect width="1400" height="700" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Tree-of-thought: searching and backtracking across partial solutions</text>
  <defs><marker id="arrow-5-2-tot" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="560" y="50" width="280" height="65" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="83.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Problem state</text><rect x="140" y="190" width="280" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="280" y="226.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Branch 1: approach A</text><rect x="980" y="190" width="280" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1120" y="226.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Branch 2: approach B</text><line x1="604.2" y1="115.0" x2="383.2" y2="190.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-tot)"/><line x1="795.8" y1="115.0" x2="1016.8" y2="190.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-tot)"/><rect x="140" y="340" width="280" height="90" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="280" y="369.9" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Abandoned</text><text x="280" y="404.90000000000003" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">Self-evaluated as violating</text><text x="280" y="420.50000000000006" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">a constraint</text><line x1="280.0" y1="260.0" x2="280.0" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-tot)"/><rect x="980" y="340" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1120" y="369.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Promising, continue</text><text x="1120" y="404.90000000000003" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Self-evaluated as likely on</text><text x="1120" y="420.50000000000006" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">track</text><line x1="1120.0" y1="260.0" x2="1120.0" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-tot)"/><line x1="420.0" y1="385.0" x2="980.0" y2="385.0" stroke="#898781" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-2-tot)"/><text x="700" y="400" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Backtrack: search continues</text><text x="700" y="417" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">from the surviving branch</text><rect x="980" y="490" width="280" height="65" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1120" y="523.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Final answer</text><line x1="1120.0" y1="430.0" x2="1120.0" y2="490.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-tot)"/><rect x="60" y="590" width="1280" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="620" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Yao et al., 2023: rather than committing to one linear path, the model maintains a tree of partial</text><text x="700" y="637.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">solutions, self-evaluates how promising each looks, and searches with backtracking, raising success</text><text x="700" y="655" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">on a constrained arithmetic puzzle from 4% under standard chain-of-thought prompting to 74%.</text>
</svg>