vec)"/><circle cx="900" cy="200" r="9" fill="#2a78d6" stroke="#0d2c4e" stroke-width="1.5"/><circle cx="940" cy="220" r="9" fill="#2a78d6" stroke="#0d2c4e" stroke-width="1.5"/><circle cx="915" cy="250" r="9" fill="#2a78d6" stroke="#0d2c4e" stroke-width="1.5"/><circle cx="960" cy="245" r="9" fill="#2a78d6" stroke="#0d2c4e" stroke-width="1.5"/><text x="930" y="300" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Two different titles, same</text><text x="930" y="316" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">topic, land close together</text><circle cx="1220" cy="440" r="9" fill="#a33a2f" stroke="#a33a2f" stroke-width="1.5"/><circle cx="1250" cy="460" r="9" fill="#a33a2f" stroke="#a33a2f" stroke-width="1.5"/><circle cx="1235" cy="490" r="9" fill="#a33a2f" stroke="#a33a2f" stroke-width="1.5"/><text x="1245" y="520" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">An unrelated topic lands</text><text x="1245" y="536" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">far away</text>
