<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-2-tovec desc-6-2-tovec">
  <title id="title-6-2-tovec">Text becomes a point in space</title>
  <desc id="desc-6-2-tovec">A diagram showing text passing through an embedding model and coming out as a point in a high-dimensional vector space, with texts of similar meaning landing near each other regardless of the specific words used, and texts of different meaning landing far apart.</desc>
  <defs></defs>
  <rect width="1400" height="640" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Text becomes a point in space</text>
