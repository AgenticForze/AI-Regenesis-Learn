<svg width="1500" height="680" viewBox="0 0 1500 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-8-ranking desc-6-8-ranking">
  <title id="title-6-8-ranking">Precision and recall miss what ranking-aware metrics catch</title>
  <desc id="desc-6-8-ranking">A diagram comparing two ranked result lists retrieving the same three relevant documents out of five results: ranking A places all three relevant documents first and scores a high Mean Reciprocal Rank and NDCG, while ranking B places the same three relevant documents lower in the list, scoring identical Precision at 5 and Recall at 5 but a much lower Mean Reciprocal Rank and NDCG.</desc>
  <rect width="1500" height="680" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Precision and recall miss what ranking-aware metrics catch</text>
  <line x1="230" y1="95" x2="230" y2="600" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="560" height="60" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="560" y="154.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Ranking A: relevant</text><text x="560" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">results first</text><rect x="900" y="130" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="154.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Ranking B: same relevant</text><text x="1180" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">results, buried</text><rect x="280" y="220" width="560" height="46" rx="7" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.3"/><text x="306" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">1</text><text x="340" y="248" font-size="12" fill="#1f2d3d">Relevant doc</text><rect x="280" y="276" width="560" height="46" rx="7" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.3"/><text x="306" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">2</text><text x="340" y="304" font-size="12" fill="#1f2d3d">Relevant doc</text><rect x="280" y="332" width="560" height="46" rx="7" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.3"/><text x="306" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">3</text><text x="340" y="360" font-size="12" fill="#1f2d3d">Relevant doc</text><rect x="280" y="388" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3"/><text x="306" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">4</text><text x="340" y="416" font-size="12" fill="#1f2d3d">Irrelevant</text><rect x="280" y="444" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3"/><text x="306" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">5</text><text x="340" y="472" font-size="12" fill="#1f2d3d">Irrelevant</text><rect x="900" y="220" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3"/><text x="926" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">1</text><text x="960" y="248" font-size="12" fill="#1f2d3d">Irrelevant</text><rect x="900" y="276" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3"/><text x="926" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">2</text><text x="960" y="304" font-size="12" fill="#1f2d3d">Irrelevant</text><rect x="900" y="332" width="560" height="46" rx="7" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="926" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">3</text><text x="960" y="360" font-size="12" fill="#1f2d3d">Relevant doc</text><rect x="900" y="388" width="560" height="46" rx="7" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="926" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">4</text><text x="960" y="416" font-size="12" fill="#1f2d3d">Relevant doc</text><rect x="900" y="444" width="560" height="46" rx="7" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3"/><text x="926" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">5</text><text x="960" y="472" font-size="12" fill="#1f2d3d">Relevant doc</text><text x="560" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#5fae83">Precision@5 = 0.6, Recall@5 = 1.0, MRR = 1.0, NDCG high</text><text x="1180" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#c96fa8">Precision@5 = 0.6, Recall@5 = 1.0, MRR = 0.33, NDCG low</text><rect x="280" y="570" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="602" text-anchor="middle" font-size="12.5" fill="#6b7280">Both rankings retrieve the identical three relevant documents, so Precision@5 and Recall@5 score them the same. Only MRR and NDCG detect that ranking B buries the relevant results.</text>
</svg>