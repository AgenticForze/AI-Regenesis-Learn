<svg width="1300" height="620" viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-eg desc-eg">
  <title id="title-eg">Eager execution runs each step immediately; graph or compiled execution traces first, then runs</title>
  <desc id="desc-eg">Two side-by-side panels. The left panel, eager execution, shows Python calling operation A, then operation B, then operation C, with each one running immediately and returning a real value before the next line executes. The right panel, graph or compiled execution, shows the same three operations first being traced into a single optimized graph, and only then run as one compiled unit, allowing the operations to be fused and scheduled together.</desc>
  <rect width="1300" height="620" fill="#fcfcfb"/><text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two execution philosophies, one underlying computation</text><defs>
    <marker id="arroweg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
  </defs><rect x="90" y="90" width="560" height="460" rx="12" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="370" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Eager execution</text><text x="370" y="150" text-anchor="middle" font-size="12" fill="#52514e">PyTorch default; TensorFlow 2 default</text><rect x="130" y="195" width="480" height="52" rx="8" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="370" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">op A runs, returns a real value</text><line x1="370" y1="251" x2="370" y2="269" stroke="#184f95" stroke-width="2.2" marker-end="url(#arroweg)"/><rect x="130" y="273" width="480" height="52" rx="8" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="370" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">op B runs, returns a real value</text><line x1="370" y1="329" x2="370" y2="347" stroke="#184f95" stroke-width="2.2" marker-end="url(#arroweg)"/><rect x="130" y="351" width="480" height="52" rx="8" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="370" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">op C runs, returns a real value</text><text x="370" y="449" text-anchor="middle" font-size="12" fill="#52514e">each line executes as ordinary Python, immediately</text><rect x="110" y="480" width="520" height="50" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1"/><text x="370" y="510" text-anchor="middle" font-size="12" fill="#52514e">easy to debug with print statements; framework cannot</text><text x="370" y="525" text-anchor="middle" font-size="12" fill="#52514e">see the whole computation ahead of time to optimize it</text><rect x="710" y="90" width="560" height="460" rx="12" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="990" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Graph or compiled execution</text><text x="990" y="150" text-anchor="middle" font-size="12" fill="#52514e">classic TensorFlow; @tf.function; JAX's jit</text><text x="990" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#52514e">1. trace</text><rect x="745" y="195" width="150" height="48" rx="8" fill="#86b6ef" stroke="#184f95" stroke-width="1.5"/><text x="820" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">op A</text><line x1="899" y1="219" x2="911" y2="219" stroke="#184f95" stroke-width="2" marker-end="url(#arroweg)"/><rect x="915" y="195" width="150" height="48" rx="8" fill="#86b6ef" stroke="#184f95" stroke-width="1.5"/><text x="990" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">op B</text><line x1="1069" y1="219" x2="1081" y2="219" stroke="#184f95" stroke-width="2" marker-end="url(#arroweg)"/><rect x="1085" y="195" width="150" height="48" rx="8" fill="#86b6ef" stroke="#184f95" stroke-width="1.5"/><text x="1160" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">op C</text><line x1="990" y1="249" x2="990" y2="283" stroke="#184f95" stroke-width="2.2" marker-end="url(#arroweg)"/><rect x="928" y="257" width="124" height="18" fill="#fcfcfb"/><text x="990" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#52514e">2. compile once</text><rect x="750" y="293" width="480" height="90" rx="10" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="990" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">A + B + C fused into one optimized graph</text><text x="990" y="351" text-anchor="middle" font-size="12" fill="#86b6ef">operations scheduled and fused ahead of time</text><line x1="990" y1="389" x2="990" y2="423" stroke="#184f95" stroke-width="2.2" marker-end="url(#arroweg)"/><rect x="918" y="397" width="144" height="18" fill="#fcfcfb"/><text x="990" y="409" text-anchor="middle" font-size="12.5" font-weight="700" fill="#52514e">3. run, repeatedly</text><rect x="730" y="492" width="520" height="38" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1"/><text x="990" y="516" text-anchor="middle" font-size="12" fill="#52514e">fast to run, one step removed from ordinary Python to debug</text></svg>