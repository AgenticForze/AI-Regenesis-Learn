<svg width="1150" height="560" viewBox="0 0 1150 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-cv desc-cv">
  <title id="title-cv">A 3x3 filter sliding across a 6x6 input produces a 4x4 feature map</title>
  <desc id="desc-cv">A 6x6 input grid with a vertical edge pattern (light on the left three columns, dark on the right three columns). A 3x3 filter window is highlighted straddling the edge. The filter's values are multiplied against the pixels underneath and summed into one output value, shown in the corresponding highlighted cell of a smaller 4x4 feature map. The same filter, unchanged, is reused at every position across the input to produce the entire feature map.</desc>
  <rect width="1150" height="560" fill="#fcfcfb"/>
  <text x="575" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">One filter, reused at every position</text>

  <text x="70" y="94" font-size="13" font-weight="700" fill="#0b0b0b">INPUT (6&#215;6)</text>
  <rect x="70" y="110" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="112" y="110" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="110" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="196" y="110" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="238" y="110" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="280" y="110" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="70" y="152" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="112" y="152" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="152" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="196" y="152" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="238" y="152" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="280" y="152" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="70" y="194" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="112" y="194" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="194" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="196" y="194" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="238" y="194" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="280" y="194" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="70" y="236" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="112" y="236" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="236" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="196" y="236" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="238" y="236" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="280" y="236" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="70" y="278" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="112" y="278" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="278" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="196" y="278" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="238" y="278" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="280" y="278" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="70" y="320" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="112" y="320" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="154" y="320" width="42" height="42" fill="#eaf2fc" stroke="#ffffff" stroke-width="1.5"/><rect x="196" y="320" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="238" y="320" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/><rect x="280" y="320" width="42" height="42" fill="#5598e7" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="154" y="152" width="126" height="126" fill="none" stroke="#a33a2f" stroke-width="4"/>

  <rect x="154" y="292" width="126" height="60" rx="6" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/>
  <text x="217" y="316" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a33a2f">3&#215;3 filter window,</text>
  <text x="217" y="334" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a33a2f">multiply + sum &#8594; 1 value</text>

  <defs>
    <marker id="arrCV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52514e"/>
    </marker>
  </defs>
  <line x1="352" y1="290" x2="610" y2="290" stroke="#52514e" stroke-width="2" marker-end="url(#arrCV)"/>
  <text x="481" y="270" text-anchor="middle" font-size="11" fill="#52514e">slide across</text>
  <text x="481" y="310" text-anchor="middle" font-size="11" fill="#52514e">every position</text>

  <text x="640" y="136" font-size="13" font-weight="700" fill="#0b0b0b">FEATURE MAP (4&#215;4)</text>
  <rect x="640" y="152" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="682" y="152" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="724" y="152" width="42" height="42" fill="#104281" stroke="#ffffff" stroke-width="1.5"/><rect x="766" y="152" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="640" y="194" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="682" y="194" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="724" y="194" width="42" height="42" fill="#104281" stroke="#ffffff" stroke-width="1.5"/><rect x="766" y="194" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="640" y="236" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="682" y="236" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="724" y="236" width="42" height="42" fill="#104281" stroke="#ffffff" stroke-width="1.5"/><rect x="766" y="236" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="640" y="278" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="682" y="278" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/><rect x="724" y="278" width="42" height="42" fill="#104281" stroke="#ffffff" stroke-width="1.5"/><rect x="766" y="278" width="42" height="42" fill="#f0efec" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="724" y="194" width="42" height="42" fill="none" stroke="#a33a2f" stroke-width="4"/>
  <text x="745" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>

  <rect x="640" y="350" width="168" height="70" rx="6" fill="#eaf2fc" stroke="#184f95" stroke-width="1.5"/>
  <text x="724" y="376" text-anchor="middle" font-size="10.5" font-weight="700" fill="#184f95">high values mark where</text>
  <text x="724" y="394" text-anchor="middle" font-size="10.5" font-weight="700" fill="#184f95">the vertical edge sits</text>
  <text x="724" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#184f95">in this specific image</text>
</svg>