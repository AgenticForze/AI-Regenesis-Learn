<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-bpesteps desc-bpesteps">
  <title id="title-bpesteps">BPE builds its vocabulary bottom-up, one frequency-driven merge at a time</title>
  <desc id="desc-bpesteps">Starting from individual characters, BPE repeatedly merges the most frequent adjacent pair into a new vocabulary entry, illustrated here turning the word lowest into lo, w, and est across three merge steps.</desc>
  <defs><marker id="arr35a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">BPE: merge the most frequent pair, repeat</text>
  <rect x="60" y="130" width="280" height="190" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="200" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Step 0</text><text x="200" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">corpus split into</text><text x="200" y="208.2" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">characters</text><rect x="80" y="258" width="240" height="42" rx="6" fill="#cde2fb" stroke="#e3e1db"/><text x="200" y="284" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d2c4e" font-family="monospace">l o w e s t</text><line x1="340" y1="225" x2="380" y2="225" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35a)"/><rect x="380" y="130" width="280" height="190" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="520" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Step 1</text><text x="520" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">merge most frequent pair:</text><text x="520" y="208.2" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">"e" + "s" → "es"</text><rect x="400" y="258" width="240" height="42" rx="6" fill="#cde2fb" stroke="#e3e1db"/><text x="520" y="284" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d2c4e" font-family="monospace">l o w es t</text><line x1="660" y1="225" x2="700" y2="225" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35a)"/><rect x="700" y="130" width="280" height="190" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="840" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Step 2</text><text x="840" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">merge next most frequent</text><text x="840" y="208.2" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">pair: "es" + "t" → "est"</text><rect x="720" y="258" width="240" height="42" rx="6" fill="#cde2fb" stroke="#e3e1db"/><text x="840" y="284" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d2c4e" font-family="monospace">l o w est</text><line x1="980" y1="225" x2="1020" y2="225" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35a)"/><rect x="1020" y="130" width="280" height="190" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1160" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Step 3</text><text x="1160" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">merge next most frequent</text><text x="1160" y="208.2" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">pair: "l" + "o" → "lo"</text><rect x="1040" y="258" width="240" height="42" rx="6" fill="#cde2fb" stroke="#e3e1db"/><text x="1160" y="284" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d2c4e" font-family="monospace">lo w est</text><rect x="60" y="430" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="458.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Each step merges whichever adjacent pair is most frequent across the whole corpus, purely by count,</text><text x="680" y="476.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">with no notion of what the pair means.</text>
</svg>