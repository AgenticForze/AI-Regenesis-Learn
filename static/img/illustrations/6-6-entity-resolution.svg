<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-6-resolve desc-6-6-resolve">
  <title id="title-6-6-resolve">Entity resolution: one real entity, one node</title>
  <desc id="desc-6-6-resolve">A before-and-after diagram: three separate mention nodes for the same person extracted from three different documents under three different name variants, feeding into an entity resolution step, which merges them into a single resolved node linked to one reference identifier.</desc>
  <rect width="1500" height="620" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Entity resolution: one real entity, one node</text>
  <defs><marker id="arrow-6-6-resolve-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="540" stroke="#1f3a5f" stroke-width="3"/><circle cx="357.79999999999995" cy="170" r="40" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.6"/><text x="357.79999999999995" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2d3d">"Elena Ruiz"</text><text x="357.79999999999995" y="184" text-anchor="middle" font-size="9" fill="#6b7280">Doc A</text><circle cx="527.8" cy="170" r="40" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.6"/><text x="527.8" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2d3d">"Ms. Ruiz"</text><text x="527.8" y="184" text-anchor="middle" font-size="9" fill="#6b7280">Doc B</text><circle cx="697.8" cy="170" r="40" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.6"/><text x="697.8" y="168" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2d3d">"Elena"</text><text x="697.8" y="184" text-anchor="middle" font-size="9" fill="#6b7280">Doc C</text><rect x="20" y="150" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">BEFORE</text><text x="527.8" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Three disconnected mentions</text><rect x="785.5999999999999" y="125" width="130" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="850.5999999999999" y="158.825" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">Entity</text><text x="850.5999999999999" y="173.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">resolution</text><text x="850.5999999999999" y="195.54999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">link to one reference ID</text><line x1="397.79999999999995" y1="170" x2="785.5999999999999" y2="170" stroke="#5b8fc9" stroke-width="1.6" marker-end="url(#arrow-6-6-resolve-main)"/><line x1="567.8" y1="170" x2="785.5999999999999" y2="170" stroke="#5b8fc9" stroke-width="1.6" marker-end="url(#arrow-6-6-resolve-main)"/><line x1="737.8" y1="170" x2="785.5999999999999" y2="170" stroke="#5b8fc9" stroke-width="1.6" marker-end="url(#arrow-6-6-resolve-main)"/><line x1="915.5999999999999" y1="170" x2="1007.5999999999999" y2="170" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-resolve-main)"/><circle cx="1055.6" cy="170" r="48" fill="#dcf0e4" stroke="#5fae83" stroke-width="2"/><text x="1055.6" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">Elena Ruiz</text><text x="1055.6" y="183" text-anchor="middle" font-size="9" fill="#6b7280">one node, all 3 docs</text><rect x="20" y="330" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="355" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">AFTER</text><text x="1055.6" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">One resolved entity</text><rect x="280" y="340" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="372" text-anchor="middle" font-size="12.5" fill="#6b7280">Named-entity recognition alone treats each mention as separate; named-entity linking maps every mention to the same target identifier, merging them into one node.</text>
</svg>