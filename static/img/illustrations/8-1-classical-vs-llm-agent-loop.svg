<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-1-loop desc-8-1-loop"><title id="title-8-1-loop">The Same Loop, Two Different Deciders</title><desc id="desc-8-1-loop">Two side-by-side perceive-decide-act loops. In the classical loop, decide is a hand-coded rule engine or symbolic planner. In the LLM loop, decide is a large language model reasoning in natural language. Environment, perceive/sensors, and act/actuators are the same shape on both sides; only what sits inside decide changes.</desc><rect width="1560" height="700" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">The Same Loop, Two Different Deciders</text><defs><marker id="arrow-8-1-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-8-1-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9aa3ad"/></marker></defs><text x="320.0" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Classical Agent (pre-LLM)</text><rect x="90" y="90" width="460" height="84" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="320.0" y="126.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Environment</text><text x="320.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#6b7280">the room, the road, the chat, the codebase</text><rect x="90" y="220" width="460" height="84" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="320.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Perceive (Sensors)</text><text x="320.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#6b7280">turns raw state into a percept</text><rect x="90" y="350" width="460" height="84" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="320.0" y="386.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Decide</text><text x="320.0" y="410.0" text-anchor="middle" font-size="10.5" fill="#6b7280">hand-coded rule engine or</text><text x="320.0" y="424.0" text-anchor="middle" font-size="10.5" fill="#6b7280">symbolic planner</text><rect x="90" y="480" width="460" height="84" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="320.0" y="516.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Act (Actuators)</text><text x="320.0" y="540.0" text-anchor="middle" font-size="10.5" fill="#6b7280">changes the environment</text><line x1="320.0" y1="174" x2="320.0" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-1-blue)"/><line x1="320.0" y1="304" x2="320.0" y2="350" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-1-blue)"/><line x1="320.0" y1="434" x2="320.0" y2="480" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-1-blue)"/><path d="M 90 522.0 L 44 522.0 L 44 132.0 L 90 132.0" fill="none" stroke="#9aa3ad" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#arrow-8-1-gray)"/><text x="30" y="327.0" text-anchor="end" font-size="10" fill="#9aa3ad" transform="rotate(-90 30 327.0)">loop repeats every timestep</text><text x="900.0" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">LLM Agent</text><rect x="670" y="90" width="460" height="84" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="900.0" y="126.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Environment</text><text x="900.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#6b7280">the room, the road, the chat, the codebase</text><rect x="670" y="220" width="460" height="84" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="900.0" y="256.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Perceive (Sensors)</text><text x="900.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#6b7280">turns raw state into a percept</text><rect x="670" y="350" width="460" height="84" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="900.0" y="386.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Decide</text><text x="900.0" y="410.0" text-anchor="middle" font-size="10.5" fill="#6b7280">LLM reasoning in natural</text><text x="900.0" y="424.0" text-anchor="middle" font-size="10.5" fill="#6b7280">language, in-context</text><rect x="670" y="480" width="460" height="84" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="900.0" y="516.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Act (Actuators)</text><text x="900.0" y="540.0" text-anchor="middle" font-size="10.5" fill="#6b7280">changes the environment</text><line x1="900.0" y1="174" x2="900.0" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-1-blue)"/><line x1="900.0" y1="304" x2="900.0" y2="350" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-1-blue)"/><line x1="900.0" y1="434" x2="900.0" y2="480" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-8-1-blue)"/><path d="M 1130 522.0 L 1176 522.0 L 1176 132.0 L 1130 132.0" fill="none" stroke="#9aa3ad" stroke-width="1.75" stroke-dasharray="4,3" marker-end="url(#arrow-8-1-gray)"/><text x="1190" y="327.0" text-anchor="start" font-size="10" fill="#9aa3ad" transform="rotate(-90 1190 327.0)">loop repeats every timestep</text><rect x="60" y="594" width="1440" height="86" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="624" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Only the inside of the Decide box changes.</text><text x="780.0" y="648" text-anchor="middle" font-size="13" fill="#1f2d3d">Environment, Perceive, and Act keep the same job on both sides of this diagram.</text><text x="780.0" y="668" text-anchor="middle" font-size="13" fill="#1f2d3d">What Chapter 8.1 argues is that this is a real change in what can go in that one box, not a new loop.</text></svg>