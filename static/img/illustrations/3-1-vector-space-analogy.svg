<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-analogy desc-analogy">
  <title id="title-analogy">Analogical structure in embedding space: the man-to-king offset resembles the woman-to-queen offset</title>
  <desc id="desc-analogy">A simplified 2D projection of an embedding space showing four points, man, king, woman, and queen, where the vector offset from man to king points in a similar direction and magnitude as the offset from woman to queen.</desc>
  <defs><marker id="arr31c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33a2f"/></marker><marker id="arr31c2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#86b6ef"/></marker></defs>
  <rect width="1200" height="620" fill="#fcfcfb"/>
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The king - man + woman is approximately queen analogy, geometrically</text>
  <line x1="250" y1="480" x2="1050" y2="480" stroke="#e3e1db" stroke-width="1"/><line x1="250" y1="480" x2="250" y2="80" stroke="#e3e1db" stroke-width="1"/><line x1="420" y1="400" x2="470" y2="190" stroke="#a33a2f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr31c)"/><line x1="760" y1="420" x2="810" y2="210" stroke="#a33a2f" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr31c)"/><text x="375" y="295" font-size="12.5" font-weight="700" fill="#a33a2f">+royalty</text><text x="805" y="315" font-size="12.5" font-weight="700" fill="#a33a2f">+royalty</text><line x1="250" y1="480" x2="420" y2="400" stroke="#86b6ef" stroke-width="1.5" marker-end="url(#arr31c2)"/><line x1="250" y1="480" x2="470" y2="190" stroke="#86b6ef" stroke-width="1.5" marker-end="url(#arr31c2)"/><line x1="250" y1="480" x2="760" y2="420" stroke="#86b6ef" stroke-width="1.5" marker-end="url(#arr31c2)"/><line x1="250" y1="480" x2="810" y2="210" stroke="#86b6ef" stroke-width="1.5" marker-end="url(#arr31c2)"/><circle cx="420" cy="400" r="9" fill="#ffffff" stroke="#104281" stroke-width="1.5"/><text x="420" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">man</text><circle cx="470" cy="190" r="9" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="470" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">king</text><circle cx="760" cy="420" r="9" fill="#ffffff" stroke="#104281" stroke-width="1.5"/><text x="760" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">woman</text><circle cx="810" cy="210" r="9" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="810" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">queen</text><text x="240" y="502" text-anchor="end" font-size="11" fill="#898781">origin</text><rect x="90" y="540" width="1020" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="600" y="561.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">vec(king) - vec(man) + vec(woman) is approximately vec(queen): the same offset direction recurs</text><text x="600" y="578.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">across an unrelated pair, a statistical tendency, not an exact guarantee.</text>
</svg>