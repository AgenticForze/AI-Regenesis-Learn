<svg width="1560" height="640" viewBox="0 0 1560 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-5-levers desc-7-5-levers">
  <title id="title-7-5-levers">Three levers for compressing a model</title>
  <desc id="desc-7-5-levers">A large trained model feeds into three separate compression levers: distillation trains a smaller student model to mimic the teacher, changing the architecture; quantization stores each weight with fewer bits, changing storage but not architecture; pruning removes low-importance weights, changing how many weights exist. All three feed into a compressed model that can use any combination of the three, stacked together.</desc>
  <rect width="1560" height="640" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Three levers for compressing a model</text>
  <defs><marker id="arrow-7-5-levers-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="590" y="90" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="127.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Large trained model</text><line x1="780" y1="160" x2="290" y2="210" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-levers-main)"/><rect x="80" y="210" width="420" height="110" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="290" y="261.5375" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Distillation</text><text x="290" y="286.58750000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">train a smaller student to mimic the teacher: changes the architecture</text><line x1="780" y1="160" x2="750" y2="210" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-levers-main)"/><rect x="540" y="210" width="420" height="110" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="750" y="261.5375" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Quantization</text><text x="750" y="286.58750000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">store each weight with fewer bits: changes storage, not architecture</text><line x1="780" y1="160" x2="1210" y2="210" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-levers-main)"/><rect x="1000" y="210" width="420" height="110" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1210" y="261.5375" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Pruning</text><text x="1210" y="286.58750000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">remove low-importance weights: changes how many weights exist</text><line x1="290" y1="320" x2="290" y2="370" stroke="#5b8fc9" stroke-width="1.4"/><line x1="750" y1="320" x2="750" y2="370" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1210" y1="320" x2="1210" y2="370" stroke="#5b8fc9" stroke-width="1.4"/><line x1="290" y1="370" x2="1210" y2="370" stroke="#5b8fc9" stroke-width="1.4"/><line x1="780" y1="370" x2="780" y2="400" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-5-levers-main)"/><rect x="560" y="400" width="440" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="780" y="436.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">A compressed model</text><text x="780" y="461.05" text-anchor="middle" font-size="10.5" fill="#6b7280">any combination of the three, stacked</text><rect x="80" y="520" width="1340" height="90" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="554" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">The three levers touch different things, so they compose rather than compete.</text><text x="750" y="582" text-anchor="middle" font-size="13" fill="#1f2d3d">A distilled model can still be quantized; a quantized model can still be pruned.</text>
</svg>