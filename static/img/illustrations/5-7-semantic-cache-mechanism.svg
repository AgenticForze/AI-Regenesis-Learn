<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-7-cache desc-5-7-cache">
  <title id="title-5-7-cache">How a semantic cache decides to reuse a response</title>
  <desc id="desc-5-7-cache">A diagram showing a new query being embedded into a vector, searched against a vector index of previously answered queries, and checked against a similarity threshold: above the threshold, a cached response is returned with no model call; below the threshold, the model is called and the new query and response are stored for future reuse.</desc>
  <defs></defs>
  <rect width="1400" height="900" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">How a semantic cache decides to reuse a response</text>
  <defs><marker id="arrow-5-7-cache" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="530" y="90" width="340" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="126.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">A new query arrives</text><rect x="510" y="210" width="380" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="247.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Embed the query into a</text><text x="700" y="264.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">vector</text><line x1="700.0" y1="160.0" x2="700.0" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-cache)"/><rect x="480" y="360" width="440" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="397.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Search the vector index</text><text x="700" y="414.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">for similar prior queries</text><line x1="700.0" y1="300.0" x2="700.0" y2="360.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-cache)"/><rect x="500" y="510" width="400" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="547.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Similarity above the</text><text x="700" y="564.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">threshold?</text><line x1="700.0" y1="450.0" x2="700.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-cache)"/><rect x="300" y="660" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="450" y="690" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Return the cached</text><text x="450" y="706.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">response, no model</text><text x="450" y="722.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">call needed</text><rect x="800" y="660" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="950" y="690" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Call the model, then</text><text x="950" y="706.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">store this query and</text><text x="950" y="722.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">its response</text><line x1="625.0" y1="600.0" x2="525.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-cache)"/><line x1="775.0" y1="600.0" x2="875.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-cache)"/><rect x="60" y="800" width="1280" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="820" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">GPTCache: an incoming query is embedded and compared against previously answered queries by</text><text x="700" y="837.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">similarity, not exact text match, so differently worded questions with the same meaning can still</text><text x="700" y="855" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">hit the cache.</text>
</svg>