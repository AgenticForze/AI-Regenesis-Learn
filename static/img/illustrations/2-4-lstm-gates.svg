<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-lstm desc-lstm">
  <title id="title-lstm">Inside an LSTM cell: forget, input, and output gates control an additive cell state</title>
  <desc id="desc-lstm">A diagram of one LSTM cell. A horizontal cell-state line runs across the top, modified by a forget gate that multiplies it and an input gate that adds a new candidate value to it. The hidden state and cell state from the previous step and the current input feed three sigmoid gates and one tanh candidate branch. The output gate controls how much of the updated cell state, passed through tanh, becomes the new hidden state.</desc>
  <rect width="1200" height="760" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Inside an LSTM cell: gates control an additive cell state</text><rect x="90" y="80" width="1020" height="540" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><line x1="110" y1="150" x2="1090" y2="150" stroke="#104281" stroke-width="3.5"/><text x="100" y="136" font-size="12.5" font-weight="700" fill="#104281">c_(t-1)</text><text x="1100" y="136" text-anchor="end" font-size="12.5" font-weight="700" fill="#104281">c_t</text><circle cx="350" cy="150" r="16" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="350" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">x</text><circle cx="650" cy="150" r="16" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="650" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">+</text><rect x="285" y="300" width="130" height="56" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="350" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">forget gate</text><text x="350" y="343" text-anchor="middle" font-size="11" fill="#ffffff">f_t = σ(...)</text><line x1="350" y1="300" x2="350" y2="166" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrowg)"/><rect x="495" y="300" width="130" height="56" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="560" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">input gate</text><text x="560" y="343" text-anchor="middle" font-size="11" fill="#ffffff">i_t = σ(...)</text><line x1="560" y1="300" x2="650" y2="166" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrowg)"/><rect x="675" y="300" width="130" height="56" rx="8" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="740" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">candidate</text><text x="740" y="343" text-anchor="middle" font-size="11" fill="#ffffff">c~_t = tanh(...)</text><line x1="740" y1="300" x2="650" y2="166" stroke="#5598e7" stroke-width="2" marker-end="url(#arrowg)"/><rect x="915" y="300" width="130" height="56" rx="8" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="980" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">output gate</text><text x="980" y="343" text-anchor="middle" font-size="11" fill="#ffffff">o_t = σ(...)</text><circle cx="650" cy="460" r="20" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="650" y="465" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">tanh</text><line x1="650" y1="166" x2="650" y2="440" stroke="#104281" stroke-width="2" marker-end="url(#arrowg)"/><circle cx="980" cy="460" r="16" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="980" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">x</text><line x1="670" y1="460" x2="964" y2="460" stroke="#184f95" stroke-width="2" marker-end="url(#arrowg)"/><line x1="980" y1="300" x2="980" y2="476" stroke="#184f95" stroke-width="2" marker-end="url(#arrowg)"/><line x1="980" y1="476" x2="980" y2="580" stroke="#104281" stroke-width="3" marker-end="url(#arrowg)"/><text x="995" y="572" font-size="13" font-weight="700" fill="#104281">h_t</text><rect x="130" y="570" width="110" height="40" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><text x="185" y="595" text-anchor="middle" font-size="12.5" fill="#52514e">h_(t-1)</text><rect x="260" y="570" width="90" height="40" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><text x="305" y="595" text-anchor="middle" font-size="12.5" fill="#52514e">x_t</text><text x="410" y="595" font-size="11.5" fill="#898781">h_(t-1) and x_t together feed all four gates below (arrows omitted for clarity)</text><defs><marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="90" y="650" width="1020" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="600" y="683" text-anchor="middle" font-size="12.5" fill="#52514e">The cell state (top line) is updated by multiply-then-add, not by a fresh nonlinearity, so gradients pass through it with far less shrinkage</text></svg>