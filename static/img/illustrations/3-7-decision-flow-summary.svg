<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-decisionflow37 desc-decisionflow37">
  <title id="title-decisionflow37">Choosing a base model means checking four things, not one</title>
  <desc id="desc-decisionflow37">A four-step flow from task capability requirement, through a data residency and privacy check, a cost/latency/vendor-risk check, and a license terms check, to a final base model decision.</desc>
  <defs><marker id="arr37d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Four checks feed one decision</text>
  <rect x="40" y="240" width="220" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="150" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">Task capability</text><text x="150" y="302.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">requirement</text><line x1="260" y1="290" x2="284" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr37d)"/><rect x="284" y="240" width="220" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="394" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">Data residency /</text><text x="394" y="302.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">privacy check</text><line x1="504" y1="290" x2="528" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr37d)"/><rect x="528" y="240" width="220" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="638" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">Cost, latency,</text><text x="638" y="302.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">vendor-risk check</text><line x1="748" y1="290" x2="772" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr37d)"/><rect x="772" y="240" width="220" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="882" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">License terms</text><text x="882" y="302.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">check</text><line x1="992" y1="290" x2="1016" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr37d)"/><rect x="1016" y="240" width="220" height="100" rx="8" fill="#184f95" stroke="#2a78d6" stroke-width="1.5"/><text x="1126" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Base model</text><text x="1126" y="302.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">decision</text><rect x="60" y="400" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="428.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No single axis determines the right answer; a model that wins on capability can still be the wrong</text><text x="680" y="446.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">choice on licensing, latency, or vendor-risk grounds.</text>
</svg>