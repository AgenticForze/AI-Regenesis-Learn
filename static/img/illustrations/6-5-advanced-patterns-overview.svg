<svg width="1560" height="880" viewBox="0 0 1560 880" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-5-overview desc-6-5-overview">
  <title id="title-6-5-overview">Three patterns, three attachment points on the Chapter 6.4 pipeline</title>
  <desc id="desc-6-5-overview">A diagram showing the base retrieval pipeline, query, retrieval, reranking, generation, in the center, with HyDE attached above the query rewriting it before search, a GraphRAG index attached above retrieval as a second structural index, and an agentic loop attached below wrapping generation back around to the query with a dashed feedback path.</desc>
  <rect width="1560" height="880" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Three patterns, three attachment points</text>
  <defs><marker id="arrow-6-5-overview-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-6-5-overview-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><line x1="230" y1="95" x2="230" y2="820" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="380" width="290.5" height="90" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="425.25" y="427.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Query</text><rect x="596.5" y="380" width="290.5" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="741.75" y="421.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Retrieval</text><text x="741.75" y="445.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">Ch. 6.3 vector database</text><rect x="913" y="380" width="290.5" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1058.25" y="421.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Reranking</text><text x="1058.25" y="445.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">Ch. 6.4 cross-encoder</text><rect x="1229.5" y="380" width="290.5" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1374.75" y="421.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Generation</text><text x="1374.75" y="445.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">grounded, Ch. 6.4</text><line x1="570.5" y1="425" x2="596.5" y2="425" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-overview-main)"/><line x1="887" y1="425" x2="913" y2="425" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-overview-main)"/><line x1="1203.5" y1="425" x2="1229.5" y2="425" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-overview-main)"/><rect x="20" y="405" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">BASE PIPELINE</text><rect x="280" y="110" width="290.5" height="78" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="425.25" y="145.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">HyDE</text><text x="425.25" y="169.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">rewrites the query</text><path d="M 425.25 188 L 425.25 380" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-5-overview-cross)"/><rect x="20" y="129" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">HYDE</text><rect x="596.5" y="110" width="290.5" height="78" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="741.75" y="145.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">GraphRAG index</text><text x="741.75" y="169.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">communities + summaries</text><path d="M 741.75 188 L 741.75 380" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-5-overview-cross)"/><rect x="280" y="610" width="1240" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="900" y="656.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Agentic loop</text><text x="900" y="682.125" text-anchor="middle" font-size="10.5" fill="#6b7280">query decomposition, ReAct, Self-RAG: reason, retrieve again, or stop</text><path d="M 1374.75 470
      L 1374.75 532
      Q 1374.75 540 1366.75 540
      L 908 540
      Q 900 540 900 548
      L 900 610" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-5-overview-cross)"/><path d="M 466 610 L 466 730 Q 466 750 446 750 L 445.25 750 Q 425.25 750 425.25 730 L 425.25 470" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-5-overview-cross)"/><rect x="20" y="640" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="665" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">AGENTIC</text><rect x="280" y="760" width="1240" height="46" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="900" y="787" text-anchor="middle" font-size="12.5" fill="#6b7280">HyDE and GraphRAG attach before and beside the base pipeline; the agentic loop wraps around all of it and can repeat.</text>
</svg>