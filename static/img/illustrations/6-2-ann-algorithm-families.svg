<svg width="1400" height="700" viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-2-annfamilies desc-6-2-annfamilies">
  <title id="title-6-2-annfamilies">Three families of shortcuts, each avoiding a full scan a different way</title>
  <desc id="desc-6-2-annfamilies">A three-panel diagram comparing the three families of approximate nearest-neighbor algorithms: graph-based methods like HNSW, which navigate a multi-layer proximity graph from sparse long-range connections down to dense local ones; cluster-based methods like IVF, which partition the vector space into Voronoi cells searched selectively via an nprobe parameter; and quantization-based methods like product quantization, which compress each vector into a short code built from independently quantized subvectors.</desc>
  <defs></defs>
  <rect width="1400" height="700" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three families of shortcuts, each avoiding a full scan a different way</text>
  <rect x="60" y="130" width="400" height="64" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="260" y="163.45" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">HNSW, graph-based</text><rect x="60" y="214" width="400" height="110" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><line x1="120" y1="244" x2="210" y2="234" stroke="#86b6ef" stroke-width="1.5"/><line x1="210" y1="234" x2="290" y2="259" stroke="#86b6ef" stroke-width="1.5"/><line x1="290" y1="259" x2="380" y2="244" stroke="#86b6ef" stroke-width="1.5"/><line x1="120" y1="244" x2="160" y2="294" stroke="#86b6ef" stroke-width="1.5"/><line x1="160" y1="294" x2="320" y2="299" stroke="#86b6ef" stroke-width="1.5"/><line x1="320" y1="299" x2="290" y2="259" stroke="#86b6ef" stroke-width="1.5"/><line x1="210" y1="234" x2="380" y2="244" stroke="#86b6ef" stroke-width="1.5"/><circle cx="120" cy="244" r="7" fill="#184f95"/><circle cx="210" cy="234" r="7" fill="#184f95"/><circle cx="290" cy="259" r="7" fill="#184f95"/><circle cx="380" cy="244" r="7" fill="#184f95"/><circle cx="160" cy="294" r="7" fill="#184f95"/><circle cx="320" cy="299" r="7" fill="#184f95"/><text x="260" y="358" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Multi-layer proximity graph,</text><text x="260" y="374" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">sparse long-range links on top,</text><text x="260" y="390" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">dense local links below</text><text x="260" y="424" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">"Allows a logarithmic complexity</text><text x="260" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">scaling" (Malkov and Yashunin)</text><text x="260" y="474" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Structurally similar to a skip</text><text x="260" y="490" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">list, so it distributes well</text><text x="260" y="524" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Strong recall, but graph edges add</text><text x="260" y="540" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">memory overhead</text><rect x="520" y="130" width="400" height="64" rx="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><text x="720" y="163.45" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">IVF, cluster-based</text><rect x="520" y="214" width="400" height="110" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><rect x="524" y="224" width="127.33333333333334" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><circle cx="587.6666666666666" cy="269" r="6" fill="#2a78d6"/><rect x="660.3333333333334" y="224" width="127.33333333333334" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><circle cx="724" cy="269" r="6" fill="#2a78d6"/><rect x="796.6666666666667" y="224" width="127.33333333333334" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.2"/><circle cx="860.3333333333334" cy="269" r="6" fill="#2a78d6"/><text x="720" y="358" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Partitions the space into</text><text x="720" y="374" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Voronoi-style cells around</text><text x="720" y="390" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">centroids</text><text x="720" y="424" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">nprobe controls how many cells get</text><text x="720" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">searched, speed versus recall</text><text x="720" y="474" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">~1-9ms queries at 0.7-0.95 recall</text><text x="720" y="490" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">on a 1M-vector benchmark, versus</text><text x="720" y="506" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">~18ms exhaustive</text><text x="720" y="540" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Simple to reason about and tune</text><rect x="980" y="130" width="400" height="64" rx="8" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1180" y="163.45" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Product quantization</text><rect x="980" y="214" width="400" height="110" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><rect x="990" y="244" width="50" height="40" rx="4" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1015" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">01</text><rect x="1050" y="244" width="50" height="40" rx="4" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1075" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">11</text><rect x="1110" y="244" width="50" height="40" rx="4" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1135" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">00</text><rect x="1170" y="244" width="50" height="40" rx="4" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1195" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">10</text><rect x="1230" y="244" width="50" height="40" rx="4" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1255" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">01</text><rect x="1290" y="244" width="50" height="40" rx="4" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="1315" y="269" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">11</text><text x="1180" y="358" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Splits each vector into m</text><text x="1180" y="374" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">subvectors, quantizes each</text><text x="1180" y="390" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">independently</text><text x="1180" y="424" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Refines distance estimates from</text><text x="1180" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">short codes, avoids reading full</text><text x="1180" y="456" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">vectors</text><text x="1180" y="490" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Demonstrated on a public</text><text x="1180" y="506" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">1-billion-vector, 128-dimensional</text><text x="1180" y="522" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">dataset</text><text x="1180" y="556" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">The most memory-efficient of the</text><text x="1180" y="572" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">three, usually paired with a</text><text x="1180" y="588" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">re-rank step</text>
</svg>