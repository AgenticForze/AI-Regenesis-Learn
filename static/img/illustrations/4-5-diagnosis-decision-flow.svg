<svg width="1360" height="700" viewBox="0 0 1360 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-diagflow45 desc-diagflow45">
  <title id="title-diagflow45">Diagnosing and addressing a context-length cost or latency problem</title>
  <desc id="desc-diagflow45">A decision flow branching on which phase is the bottleneck (prefill favors FlashAttention, decode favors a grouped-query-attention model), whether the task needs more tokens than the model supports well (moderately beyond favors RoPE/ALiBi extrapolation, far beyond favors retrieval), and whether relevant information is getting missed in the middle of the context, favoring reordering critical information near the start or end.</desc>
  <defs><marker id="arr45" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="700" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Matching the fix to the actual bottleneck</text>
  <rect x="540" y="40" width="280" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="79.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Context-length cost/latency problem</text><rect x="140" y="170" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="310" y="219.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Which phase is the bottleneck?</text><line x1="600" y1="110" x2="310" y2="170" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/><rect x="60" y="320" width="280" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="200" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Apply FlashAttention</text><text x="200" y="379" text-anchor="middle" font-size="11" fill="#52514e">exact, less memory traffic</text><line x1="180" y1="260" x2="200" y2="320" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/><text x="160" y="290" font-size="11.5" font-weight="700" fill="#184f95">Prefill slow</text><rect x="400" y="320" width="280" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="540" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Consider a GQA model</text><text x="540" y="379" text-anchor="middle" font-size="11" fill="#52514e">shrinks the KV cache</text><line x1="440" y1="260" x2="540" y2="320" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/><text x="510" y="290" font-size="11.5" font-weight="700" fill="#184f95">Decode slow</text><rect x="780" y="170" width="300" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="930" y="211" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Task needs more tokens</text><text x="930" y="229" text-anchor="middle" font-size="11" fill="#52514e">than the model supports well?</text><line x1="780" y1="110" x2="930" y2="170" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/><rect x="720" y="320" width="280" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="860" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Rely on RoPE/ALiBi</text><text x="860" y="379" text-anchor="middle" font-size="11" fill="#52514e">expect gradual degradation</text><line x1="820" y1="260" x2="860" y2="320" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/><text x="810" y="290" font-size="11" font-weight="700" fill="#184f95">Moderately beyond</text><rect x="1040" y="320" width="260" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1170" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Use retrieval instead</text><text x="1170" y="379" text-anchor="middle" font-size="11" fill="#52514e">Phase 6</text><line x1="1050" y1="260" x2="1170" y2="320" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/><text x="1120" y="290" font-size="11" font-weight="700" fill="#184f95">Far exceeds</text><rect x="460" y="480" width="340" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="630" y="524.1666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Is relevant info getting missed mid-context?</text><line x1="680" y1="115" x2="630" y2="480" stroke="#898781" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arr45)"/><rect x="480" y="610" width="300" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="630" y="654.3333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Place critical info near start/end</text><line x1="630.0" y1="560.0" x2="630.0" y2="610.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr45)"/>
</svg>