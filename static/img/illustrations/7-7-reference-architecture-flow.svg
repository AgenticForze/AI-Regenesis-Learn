      L 1032 250
      Q 1040 250 1040 258
      L 1040 290" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-7-refarch-main)"/><rect x="290" y="290" width="460" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="520" y="331.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Merge into base weights</text><text x="520" y="354.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">one tenant, max throughput, zero extra latency</text><rect x="810" y="290" width="460" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1040" y="323.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Serve adapters unmerged</text><text x="1040" y="339" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">(S-LoRA style)</text><text x="1040" y="362.25" text-anchor="middle" font-size="10.5" fill="#6b7280">many tenants share one base deployment</text><line x1="520" y1="380" x2="520" y2="400" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1040" y1="380" x2="1040" y2="400" stroke="#5b8fc9" stroke-width="1.4"/><line x1="520" y1="400" x2="1040" y2="400" stroke="#5b8fc9" stroke-width="1.4"/><line x1="780" y1="400" x2="780" y2="430" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-refarch-main)"/><rect x="550" y="430" width="460" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="780" y="466.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Shadow deployment</text><text x="780" y="489.97499999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">mirrors production traffic; no user impact</text><line x1="780" y1="510" x2="780" y2="560" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-refarch-main)"/><rect x="550" y="560" width="460" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="780" y="596.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Canary rel