<svg width="1560" height="900" viewBox="0 0 1560 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-7-refarch desc-7-7-refarch">
  <title id="title-7-7-refarch">Where serving architecture and safe rollout fit for a custom model</title>
  <desc id="desc-7-7-refarch">A fine-tuned model that has passed the Chapter 7.6 evaluation gate is recorded in a model registry as a versioned artifact. From there it takes one of two serving-architecture paths: merged into the base weights for a single tenant at maximum throughput, or served unmerged in S-LoRA style so many tenants share one base deployment. Both paths converge on a shadow deployment that mirrors production traffic with no user impact, then a canary release that ramps a small and growing share of real users. A decision at each stage checks whether the challenger has regressed against the champion beyond a threshold; if so, traffic rolls back to the previous registered version, otherwise the rollout ramps to 100% and the new version becomes the champion of record.</desc>
  <rect width="1560" height="900" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Where serving architecture and safe rollout fit for a custom model</text>
  <defs><marker id="arrow-7-7-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-7-7-refarch-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="560" y="70" width="440" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="98.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Fine-tuned model, passed the</text><text x="780" y="115.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Chapter 7.6 gate</text><line x1="780" y1="140" x2="780" y2="180" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-refarch-main)"/><rect x="560" y="180" width="440" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="780" y="211.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Model registry</text><text x="780" y="234.975" text-anchor="middle" font-size="10.5" fill="#6b7280">versioned artifact; records the current champion</text><path d="M 780 250
      L 780 242
      Q 780 250 772 250
      L 528 250
      Q 520 250 520 258
      L 520 290" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-7-refarch-main)"/><path d="M 780 250
      L 780 242
