<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-6-geval desc-5-6-geval">
  <title id="title-5-6-geval">G-Eval's chain-of-thought and form-filling procedure</title>
  <desc id="desc-5-6-geval">A diagram showing G-Eval's grading procedure: starting from a task description and evaluation criteria, the judge model first generates its own chain-of-thought of detailed evaluation steps, then combines that reasoning with the response under review, and produces a structured, form-filled score reported to correlate with human judgment at 0.514 Spearman correlation on a summarization benchmark.</desc>
  <defs></defs>
  <rect width="1400" height="520" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">G-Eval's chain-of-thought and form-filling procedure</text>
  <defs><marker id="arrow-5-6-geval" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="40" y="180" width="290" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="185" y="223.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Task description +</text><text x="185" y="239.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">evaluation criteria</text><rect x="380" y="180" width="290" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="525" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Model generates its</text><text x="525" y="231.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">own chain-of-thought</text><text x="525" y="247.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">of evaluation steps</text><rect x="720" y="180" width="290" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="865" y="206.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Response under</text><text x="865" y="223.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">review + the</text><text x="865" y="239.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">generated</text><text x="865" y="255.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">chain-of-thought</text><rect x="1060" y="180" width="300" height="100" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1210" y="207.1" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Structured,</text><text x="1210" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">form-filled score</text><text x="1210" y="256.8" text-anchor="middle" font-size="11" font-weight="400" fill="#ffffff">0.514 Spearman correlation</text><text x="1210" y="271.1" text-anchor="middle" font-size="11" font-weight="400" fill="#ffffff">with humans</text><line x1="330.0" y1="230.0" x2="380.0" y2="230.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-geval)"/><line x1="670.0" y1="230.0" x2="720.0" y2="230.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-geval)"/><line x1="1010.0" y1="230.0" x2="1060.0" y2="230.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-geval)"/><rect x="60" y="350" width="1280" height="100" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="376.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Liu et al., 2023 (G-Eval): asking the judge model to generate its own evaluation steps before</text><text x="700" y="393.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">scoring, rather than asking for a score directly, reported a Spearman correlation of 0.514 with</text><text x="700" y="411.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">human judgment on a summarization benchmark, described as outperforming prior automatic metrics by a</text><text x="700" y="428.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">large margin.</text>
</svg>