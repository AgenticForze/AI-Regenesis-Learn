<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-7-pipeline desc-7-7-pipeline">
  <title id="title-7-7-pipeline">The safe-rollout pipeline for a fine-tuned model</title>
  <desc id="desc-7-7-pipeline">A model that has already passed the Chapter 7.6 evaluation gate first runs as a shadow deployment, mirroring production traffic with no user-facing impact, then moves to a canary release exposing a small and growing share of real users. At each stage a decision checks whether the challenger has regressed against the current champion beyond a set threshold. If it has, traffic is rolled back to the previous version. If not, the rollout ramps to 100% and the new version becomes the champion.</desc>
  <rect width="1200" height="800" fill="#fbfaf7"/>
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The safe-rollout pipeline for a fine-tuned model</text>
  <defs><marker id="arrow-7-7-pipeline-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-7-7-pipeline-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="340" y="90" width="520" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="600" y="118.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Model that passed the Chapter 7.6</text><text x="600" y="136.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">evaluation gate</text><line x1="600" y1="160" x2="600" y2="230" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-pipeline-main)"/><rect x="340" y="230" width="520" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="600" y="266.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Shadow deployment</text><text x="600" y="291.05" text-anchor="middle" font-size="10.5" fill="#6b7280">mirrors production traffic; no user sees the output</text><line x1="600" y1="310" x2="600" y2="380" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-pipeline-main)"/><rect x="340" y="380" width="520" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="600" y="416.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Canary release</text><text x="600" y="441.05" text-anchor="middle" font-size="10.5" fill="#6b7280">a small, then growing, share of real users</text><line x1="600" y1="460" x2="600" y2="530" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-pipeline-main)"/><rect x="340" y="530" width="520" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="600" y="563.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Regression vs. champion beyond</text><text x="600" y="581.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">threshold?</text><line x1="530" y1="610" x2="310" y2="670" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-7-pipeline-cross)"/><line x1="670" y1="610" x2="890" y2="670" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-7-pipeline-main)"/><rect x="100" y="670" width="420" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="310" y="711.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Rollback</text><text x="310" y="735.5124999999999" text-anchor="middle" font-size="10.5" fill="#6b7280">yes: reroute traffic back to the previous version</text><rect x="680" y="670" width="420" height="90" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="890" y="711.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Ramp to 100%</text><text x="890" y="735.5124999999999" text-anchor="middle" font-size="10.5" fill="#6b7280">no: the new version becomes the champion</text>
</svg>