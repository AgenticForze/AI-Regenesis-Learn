<svg width="1400" height="960" viewBox="0 0 1400 960" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-4-refarch desc-6-4-refarch">
  <title id="title-6-4-refarch">From a raw document to a grounded answer</title>
  <desc id="desc-6-4-refarch">A two-column flow diagram in a streamlined, layered style: the write path on the left moves a raw document through ingestion, chunking, embedding, and storage in the vector database; the query path on the right moves a user query through query embedding and, at the row aligned with the vector database, into retrieval, then reranking, then prompt assembly, ending in a grounded generation step below.</desc>
  <rect width="1400" height="960" fill="#fbfaf7"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">From a raw document to a grounded answer</text>
  <defs><marker id="arrow-6-4-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-6-4-refarch-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="258.5" y="80" width="103" height="26" rx="13" fill="#1f3a5f" /><text x="310" y="97.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">WRITE PATH</text><rect x="958.5" y="80" width="103" height="26" rx="13" fill="#4a8f7b" /><text x="1010" y="97.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">QUERY PATH</text><rect x="100" y="130" width="420" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="310" y="167.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Raw document</text><rect x="100" y="230" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="310" y="259.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Ingestion: parse, clean,</text><text x="310" y="275" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">extract</text><line x1="310" y1="200" x2="310" y2="230" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><rect x="100" y="330" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="310" y="367.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Chunking</text><line x1="310" y1="300" x2="310" y2="330" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><rect x="100" y="430" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="310" y="467.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Embedding (Ch. 6.2)</text><line x1="310" y1="400" x2="310" y2="430" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><rect x="100" y="530" width="420" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="310" y="567.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Vector database (Ch. 6.3)</text><line x1="310" y1="500" x2="310" y2="530" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><rect x="800" y="130" width="420" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1010" y="167.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">User query</text><rect x="800" y="230" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="267.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Query embedding</text><rect x="800" y="530" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="567.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Retrieval: ANN search</text><rect x="800" y="630" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="667.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Reranking: cross-encoder</text><rect x="800" y="730" width="420" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="767.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Prompt assembly</text><line x1="1010" y1="200" x2="1010" y2="230" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><line x1="1010" y1="300" x2="1010" y2="530" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><line x1="1010" y1="600" x2="1010" y2="630" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><line x1="1010" y1="700" x2="1010" y2="730" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/><line x1="520" y1="565" x2="800" y2="565" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-4-refarch-cross)"/><rect x="800" y="840" width="420" height="76" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1010" y="880.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Generation (grounded)</text><line x1="1010" y1="800" x2="1010" y2="840" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-refarch-main)"/>
</svg>