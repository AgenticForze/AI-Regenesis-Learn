<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-landscapegrid desc-landscapegrid">
  <title id="title-landscapegrid">The model landscape along two independent dimensions: openness and size class</title>
  <desc id="desc-landscapegrid">A two-by-three grid with closed and open-weight access as rows and frontier, mid-size, and small/edge as columns, placing representative model families such as GPT, Claude, Gemini, Llama, DeepSeek, Qwen, and Mistral into the appropriate cells.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two independent choices, not one</text>
  <text x="430" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Frontier / flagship</text><text x="770" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Mid-size</text><text x="1110" y="96" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Small / edge</text><text x="240" y="190" text-anchor="end" font-size="14.5" font-weight="700" fill="#184f95">Closed (API only)</text><text x="240" y="320" text-anchor="end" font-size="14.5" font-weight="700" fill="#184f95">Open-weight</text><rect x="270" y="130" width="320" height="110" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="430" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">OpenAI GPT</text><text x="430" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Anthropic Claude</text><text x="430" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Google Gemini</text><rect x="610" y="130" width="320" height="110" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="770" y="177" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">(narrower API-only tiers</text><text x="770" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">from the same vendors)</text><rect x="950" y="130" width="320" height="110" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1110" y="177" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">(smaller API-only tiers</text><text x="1110" y="195" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">from the same vendors)</text><rect x="270" y="260" width="320" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="430" y="299" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">Llama, DeepSeek,</text><text x="430" y="317" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">Qwen, Mistral</text><text x="430" y="335" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">(frontier-scale)</text><rect x="610" y="260" width="320" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="770" y="307" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">Mid-size variants of</text><text x="770" y="325" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">the same families</text><rect x="950" y="260" width="320" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1110" y="307" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">Small variants, single-GPU</text><text x="1110" y="325" text-anchor="middle" font-size="12" font-weight="400" fill="#0b0b0b">or on-device deployable</text><rect x="60" y="420" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="448.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Openness and size class are independent choices; the actual license terms of whichever open-weight</text><text x="680" y="466.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">model is chosen still have to be checked separately.</text>
</svg>