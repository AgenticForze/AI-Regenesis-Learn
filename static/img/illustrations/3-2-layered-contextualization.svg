<svg width="1250" height="560" viewBox="0 0 1250 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-layers desc-layers">
  <title id="title-layers">Earlier Transformer layers tend to encode more syntax, later layers more semantics</title>
  <desc id="desc-layers">A stack of five encoder layers processing input tokens from bottom to top, shaded from lighter blue at the bottom, more syntactic, to darker blue at the top, more semantic, ending in the contextual output representation.</desc>
  <defs><marker id="arr32e" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#104281"/></marker></defs>
  <rect width="1250" height="560" fill="#fcfcfb"/>
  <text x="625" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">What different layers of a contextual encoder tend to specialize in</text>
  <rect x="280" y="380" width="700" height="55" rx="8" fill="rgb(24,79,149)" stroke="#104281" stroke-width="1"/><text x="630" y="412.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">layer 1</text><rect x="280" y="313" width="700" height="55" rx="8" fill="rgb(39,105,172)" stroke="#104281" stroke-width="1"/><text x="630" y="345.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">layer 2</text><line x1="630" y1="368" x2="630" y2="380" stroke="#184f95" stroke-width="2" marker-end="url(#arr32e)"/><rect x="280" y="246" width="700" height="55" rx="8" fill="rgb(55,131,194)" stroke="#104281" stroke-width="1"/><text x="630" y="278.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">layer 3</text><line x1="630" y1="301" x2="630" y2="313" stroke="#184f95" stroke-width="2" marker-end="url(#arr32e)"/><rect x="280" y="179" width="700" height="55" rx="8" fill="rgb(70,156,217)" stroke="#104281" stroke-width="1"/><text x="630" y="211.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">layer 4</text><line x1="630" y1="234" x2="630" y2="246" stroke="#184f95" stroke-width="2" marker-end="url(#arr32e)"/><rect x="280" y="112" width="700" height="55" rx="8" fill="rgb(85,182,239)" stroke="#104281" stroke-width="1"/><text x="630" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">layer 5</text><line x1="630" y1="167" x2="630" y2="179" stroke="#184f95" stroke-width="2" marker-end="url(#arr32e)"/><text x="250" y="450" text-anchor="end" font-size="13" font-weight="700" fill="#184f95">input tokens</text><line x1="630" y1="465" x2="630" y2="435" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr32e)"/><text x="1020" y="139.5" font-size="13" font-weight="700" fill="#184f95">&#8592; contextual output</text><text x="270" y="490" text-anchor="start" font-size="12.5" fill="#52514e">Lower layers: more syntactic (part-of-speech, dependencies)</text><text x="270" y="70" text-anchor="start" font-size="12.5" fill="#52514e">Higher layers: more semantic (task-relevant meaning)</text><rect x="90" y="505" width="1070" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="625" y="518.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">An empirical finding from probing studies, not something explicitly designed into the</text><text x="625" y="536.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">architecture.</text>
</svg>