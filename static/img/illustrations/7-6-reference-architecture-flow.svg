<svg width="1560" height="820" viewBox="0 0 1560 820" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-6-refarch desc-7-6-refarch">
  <title id="title-7-6-refarch">Where each evaluation check fits before a fine-tuned model ships</title>
  <desc id="desc-7-6-refarch">A flow diagram starting from a fine-tuned model candidate through a contamination check. If contamination is found, the eval must be replaced before trusting any score. If the check passes, the model proceeds through a task-specific held-out eval, a general-capability benchmark against the base model, and an LLM-as-judge or human evaluation, all three running in parallel. If all three checks pass their thresholds, the model ships; otherwise the team iterates on the fine-tuning data or technique.</desc>
  <rect width="1560" height="820" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Where each evaluation check fits before a fine-tuned model ships</text>
  <defs><marker id="arrow-7-6-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-7-6-refarch-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="590" y="80" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="117.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Fine-tuned model candidate</text><line x1="780" y1="150" x2="780" y2="190" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-6-refarch-main)"/><rect x="550" y="190" width="460" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="780" y="226.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Contamination check</text><text x="780" y="249.975" text-anchor="middle" font-size="10.5" fill="#6b7280">does the eval overlap training data?</text><line x1="1010" y1="230" x2="1120" y2="230" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-6-refarch-cross)"/><rect x="1120" y="190" width="360" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1300" y="224.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Fails: find or build a</text><text x="1300" y="239.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">clean eval</text><path d="M 780 270
      L 780 277
      Q 780 285 772 285
      L 298 285
      Q 290 285 290 293
      L 290 330" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-refarch-main)"/><rect x="80" y="330" width="420" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="290" y="369.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Task-specific held-out</text><text x="290" y="385.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">eval</text><path d="M 780 270
      L 780 277
      Q 780 285 772 285
      L 758 285
      Q 750 285 750 293
      L 750 330" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-refarch-main)"/><rect x="540" y="330" width="420" height="90" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="750" y="369.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">General-capability</text><text x="750" y="385.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">benchmark vs. base model</text><path d="M 780 270
      L 780 277
      Q 780 285 788 285
      L 1202 285
      Q 1210 285 1210 293
      L 1210 330" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-refarch-main)"/><rect x="1000" y="330" width="420" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1210" y="377.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">LLM-as-judge / human eval</text><line x1="290" y1="420" x2="290" y2="450" stroke="#5b8fc9" stroke-width="1.4"/><line x1="750" y1="420" x2="750" y2="450" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1210" y1="420" x2="1210" y2="450" stroke="#5b8fc9" stroke-width="1.4"/><line x1="290" y1="450" x2="1210" y2="450" stroke="#5b8fc9" stroke-width="1.4"/><line x1="780" y1="450" x2="780" y2="480" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-6-refarch-main)"/><rect x="560" y="480" width="440" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="780" y="513.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">All three checks pass</text><text x="780" y="530.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">thresholds?</text><line x1="720" y1="560" x2="490" y2="620" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-6-refarch-main)"/><line x1="840" y1="560" x2="1090" y2="620" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-6-refarch-cross)"/><rect x="300" y="620" width="380" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="490" y="656.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Ship the fine-tuned model</text><text x="490" y="680.5124999999999" text-anchor="middle" font-size="10.5" fill="#6b7280">yes</text><rect x="900" y="620" width="380" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1090" y="648.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Iterate: revisit data or</text><text x="1090" y="664.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">technique</text><text x="1090" y="688.1" text-anchor="middle" font-size="10.5" fill="#6b7280">no</text>
</svg>