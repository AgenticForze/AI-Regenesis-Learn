<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-gptfamily desc-gptfamily">
  <title id="title-gptfamily">The GPT family: same objective and architecture, unlocking new capability at each scale step</title>
  <desc id="desc-gptfamily">A timeline from GPT-1 in 2018 through GPT-2 in 2019, GPT-3 in 2020, to GPT-4 in 2023, each labeled with the capability that scale unlocked at that step, while the underlying causal language modeling objective and decoder-only architecture remained the same.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The GPT family, evolving on the same foundation</text>
  <line x1="90" y1="260" x2="1270" y2="260" stroke="#898781" stroke-width="2"/><circle cx="200" cy="260" r="11" fill="#184f95" stroke="#ffffff" stroke-width="2.5"/><text x="200" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">2018</text><rect x="60" y="295" width="280" height="100" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="200" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">GPT-1</text><text x="200" y="350" text-anchor="middle" font-size="12" fill="#52514e">pretrain + fine-tune beats</text><text x="200" y="368" text-anchor="middle" font-size="12" fill="#52514e">prior architectures</text><circle cx="520" cy="260" r="11" fill="#184f95" stroke="#ffffff" stroke-width="2.5"/><text x="520" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">2019</text><rect x="380" y="295" width="280" height="100" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="520" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">GPT-2</text><text x="520" y="350" text-anchor="middle" font-size="12" fill="#52514e">zero-shot task transfer</text><text x="520" y="368" text-anchor="middle" font-size="12" fill="#52514e">from scale</text><circle cx="840" cy="260" r="11" fill="#184f95" stroke="#ffffff" stroke-width="2.5"/><text x="840" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">2020</text><rect x="700" y="295" width="280" height="100" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="840" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">GPT-3</text><text x="840" y="350" text-anchor="middle" font-size="12" fill="#52514e">in-context / few-shot</text><text x="840" y="368" text-anchor="middle" font-size="12" fill="#52514e">learning emerges</text><circle cx="1160" cy="260" r="11" fill="#184f95" stroke="#ffffff" stroke-width="2.5"/><text x="1160" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">2023</text><rect x="1020" y="295" width="280" height="100" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="1160" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">GPT-4</text><text x="1160" y="350" text-anchor="middle" font-size="12" fill="#52514e">multimodal, RLHF-aligned</text><text x="680" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95">Same objective (causal LM), same decoder-only architecture, throughout</text><rect x="90" y="450" width="1180" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="473.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Scale, data, and training changed at each step; the causal language modeling objective and</text><text x="680" y="491.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">decoder-only architecture did not.</text>
</svg>