<svg width="1560" height="960" viewBox="0 0 1560 960" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-1-refarch desc-7-1-refarch">
  <title id="title-7-1-refarch">The decision path from a failing eval to the right fix</title>
  <desc id="desc-7-1-refarch">A top-to-bottom decision flow diagram matching the chapter's reference architecture. An eval failure is diagnosed as a knowledge gap, routing to retrieval-augmented generation, or a behavior gap, routing to prompt revision. A prompt revision is measured against the eval set: if the gap closes, the change ships; if not, a scope check asks whether the task is narrow and well-scoped enough, looping back to prompting if not. A task that passes the scope check proceeds to an access check, splitting into self-hosted parameter-efficient fine-tuning for open-weight models or vendor-assisted fine-tuning for closed models.</desc>
  <rect width="1560" height="960" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The decision path from a failing eval to the right fix</text>
  <defs><marker id="arrow-7-1-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="580" y="100" width="400" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="128.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Eval failure or observed gap (Ch.</text><text x="780" y="145.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">5.6)</text><line x1="780" y1="170" x2="780" y2="210" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><rect x="560" y="210" width="440" height="60" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="780" y="242.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Knowledge gap, or behavior gap?</text><line x1="780" y1="270" x2="780" y2="320" stroke="#5b8fc9" stroke-width="2"/><line x1="330" y1="320" x2="1130" y2="320" stroke="#5b8fc9" stroke-width="2"/><line x1="330" y1="320" x2="330" y2="360" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><line x1="1130" y1="320" x2="1130" y2="360" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><rect x="140" y="360" width="380" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="330" y="389.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Retrieval-augmented generation</text><text x="330" y="405.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">(Phase 6)</text><rect x="940" y="360" width="380" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1130" y="389.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Revise prompt + few-shot</text><text x="1130" y="405.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">examples (Phase 5)</text><line x1="1130" y1="430" x2="1130" y2="470" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><rect x="940" y="470" width="380" height="60" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1130" y="502.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Gap closed against the eval set?</text><line x1="1130" y1="530" x2="1130" y2="550" stroke="#5b8fc9" stroke-width="2"/><line x1="830" y1="550" x2="1190" y2="550" stroke="#5b8fc9" stroke-width="2"/><line x1="830" y1="550" x2="830" y2="570" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><line x1="1190" y1="550" x2="1190" y2="570" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><rect x="700" y="570" width="260" height="60" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="830" y="594.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Yes: ship the prompt</text><text x="830" y="610" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">change</text><rect x="1000" y="570" width="380" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1190" y="592.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">No: is this one narrow,</text><text x="1190" y="607.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">well-scoped task with 10+</text><text x="1190" y="622.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">examples?</text><path d="M 1380 605 L 1460 605 L 1460 395 L 1320 395" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-1-refarch-main)"/><text x="1450" y="465" text-anchor="end" font-size="11" fill="#6b7280">no, task too broad</text><line x1="1190" y1="640" x2="1190" y2="700" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><rect x="940" y="700" width="380" height="60" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1130" y="732.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Open-weight model available?</text><line x1="1130" y1="760" x2="1130" y2="790" stroke="#5b8fc9" stroke-width="2"/><line x1="850" y1="790" x2="1210" y2="790" stroke="#5b8fc9" stroke-width="2"/><line x1="850" y1="790" x2="850" y2="810" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><line x1="1210" y1="790" x2="1210" y2="810" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-refarch-main)"/><rect x="700" y="810" width="300" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="850" y="839.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Self-hosted PEFT fine-tuning</text><text x="850" y="855" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">(Ch. 7.2)</text><rect x="1040" y="810" width="340" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1210" y="839.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Vendor-assisted fine-tuning</text><text x="1210" y="855" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">/ custom models</text>
</svg>