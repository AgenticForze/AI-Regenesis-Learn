<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-1-close desc-6-1-close">
  <title id="title-6-1-close">The same four limits, each one answered</title>
  <desc id="desc-6-1-close">A diagram mapping each of the four limits of parametric knowledge, staleness, no provenance, uneven coverage, and costly updates, to how retrieval-augmented generation addresses it: staleness is answered by updating the knowledge store directly, provenance is answered by citing the retrieved passage, uneven coverage is answered by curating the knowledge store's contents directly, and update cost and risk are answered by adding or replacing a document instead of retraining or editing the model.</desc>
  <defs></defs>
  <rect width="1400" height="640" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The same four limits, each one answered</text>
  <defs><marker id="arrow-6-1-close" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="110" width="540" height="100" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="350" y="161.4" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Staleness</text><rect x="780" y="110" width="540" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Update the knowledge store</text><text x="1050" y="161.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">directly, the moment a source</text><text x="1050" y="177.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">changes</text><line x1="620.0" y1="160.0" x2="780.0" y2="160.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-close)"/><rect x="80" y="240" width="540" height="100" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="350" y="291.4" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">No provenance</text><rect x="780" y="240" width="540" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="283.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Cite the specific retrieved</text><text x="1050" y="299.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">passage an answer drew on</text><line x1="620.0" y1="290.0" x2="780.0" y2="290.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-close)"/><rect x="80" y="370" width="540" height="100" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="350" y="421.4" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Uneven coverage</text><rect x="780" y="370" width="540" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="405" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Curate the knowledge store's</text><text x="1050" y="421.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">contents directly, including</text><text x="1050" y="437.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">rare facts</text><line x1="620.0" y1="420.0" x2="780.0" y2="420.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-close)"/><rect x="80" y="500" width="540" height="100" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="350" y="542.3" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Costly, risky</text><text x="350" y="560.5" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">updates</text><rect x="780" y="500" width="540" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="535" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Add or replace a document, no</text><text x="1050" y="551.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">retraining or weight-editing</text><text x="1050" y="567.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">involved</text><line x1="620.0" y1="550.0" x2="780.0" y2="550.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-1-close)"/>
</svg>