<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-cm desc-cm">
  <title id="title-cm">The confusion matrix and how precision and recall are derived from it</title>
  <desc id="desc-cm">A two-by-two grid with predicted class as columns and actual class as rows, labeling the four cells true positive, false positive, false negative, and true negative. Precision is highlighted as a ratio across the predicted-positive column and recall is highlighted as a ratio across the actual-positive row.</desc>
  <rect width="1200" height="620" fill="#fcfcfb"/>

  <text x="600" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The confusion matrix: every metric in this chapter comes from these four counts</text>

  <!-- column headers -->
  <text x="430" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#52514e">PREDICTED: POSITIVE</text>
  <text x="650" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#52514e">PREDICTED: NEGATIVE</text>

  <!-- row headers -->
  <text x="175" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#52514e" transform="rotate(-90 175 215)">ACTUAL: POSITIVE</text>
  <text x="175" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#52514e" transform="rotate(-90 175 410)">ACTUAL: NEGATIVE</text>

  <!-- grid cells -->
  <rect x="320" y="115" width="220" height="180" rx="10" fill="#184f95"/>
  <text x="430" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">True Positive</text>
  <text x="430" y="210" text-anchor="middle" font-size="13" fill="#cde2fb">correctly flagged</text>

  <rect x="550" y="115" width="220" height="180" rx="10" fill="#fdecea"/>
  <text x="660" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#a33a2f">False Negative</text>
  <text x="660" y="210" text-anchor="middle" font-size="13" fill="#a33a2f">a miss</text>

  <rect x="320" y="310" width="220" height="180" rx="10" fill="#fdecea"/>
  <text x="430" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#a33a2f">False Positive</text>
  <text x="430" y="405" text-anchor="middle" font-size="13" fill="#a33a2f">a false alarm</text>

  <rect x="550" y="310" width="220" height="180" rx="10" fill="#86b6ef"/>
  <text x="660" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">True Negative</text>
  <text x="660" y="405" text-anchor="middle" font-size="13" fill="#184f95">correctly rejected</text>

  <!-- precision bracket: down the predicted-positive column (TP + FP) -->
  <path d="M 300 115 L 285 115 L 285 490 L 300 490" fill="none" stroke="#184f95" stroke-width="2.5"/>
  <text x="255" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95" transform="rotate(-90 255 305)">PRECISION</text>

  <!-- recall bracket: across the actual-positive row -->
  <path d="M 320 100 L 320 85 L 770 85 L 770 100" fill="none" stroke="#a33a2f" stroke-width="2.5"/>
  <text x="545" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2f">RECALL</text>

  <!-- formulas -->
  <rect x="850" y="115" width="300" height="180" rx="10" fill="#0d2c4e"/>
  <text x="1000" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Precision</text>
  <text x="1000" y="180" text-anchor="middle" font-size="16" fill="#cde2fb">TP / (TP + FP)</text>
  <text x="1000" y="215" text-anchor="middle" font-size="12" fill="#9fb8d6">Of what was flagged,</text>
  <text x="1000" y="233" text-anchor="middle" font-size="12" fill="#9fb8d6">how much was correct?</text>
  <text x="1000" y="265" text-anchor="middle" font-size="11.5" fill="#9fb8d6">Denominator: predicted positives</text>

  <rect x="850" y="310" width="300" height="180" rx="10" fill="#0d2c4e"/>
  <text x="1000" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Recall</text>
  <text x="1000" y="375" text-anchor="middle" font-size="16" fill="#cde2fb">TP / (TP + FN)</text>
  <text x="1000" y="410" text-anchor="middle" font-size="12" fill="#9fb8d6">Of what was actually positive,</text>
  <text x="1000" y="428" text-anchor="middle" font-size="12" fill="#9fb8d6">how much did we find?</text>
  <text x="1000" y="460" text-anchor="middle" font-size="11.5" fill="#9fb8d6">Denominator: actual positives</text>

  <text x="600" y="565" text-anchor="middle" font-size="14" fill="#52514e">Different denominators are why a model can score high on one and low on the other.</text>
</svg>
