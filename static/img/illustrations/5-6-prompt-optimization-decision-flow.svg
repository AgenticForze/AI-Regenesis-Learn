<svg width="1400" height="1130" viewBox="0 0 1400 1130" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-6-decision desc-5-6-decision">
  <title id="title-5-6-decision">Evaluating and rolling out a prompt change</title>
  <desc id="desc-5-6-decision">A decision-flow diagram branching from a proposed prompt change into whether a golden dataset already exists, building one from real failures if not; what kind of correctness the task has, determining code-based, LLM-as-judge, or human grading; running a regression test against the dataset, revising and re-running on failure or tagging the version for staged rollout on success; and whether the tagged version is being compared against a live incumbent, requiring a properly powered A/B test.</desc>
  <defs></defs>
  <rect width="1400" height="1130" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Evaluating and rolling out a prompt change</text>
  <defs><marker id="arrow-5-6-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="530" y="90" width="340" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="117.3" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">A prompt change is</text><text x="700" y="135.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">proposed</text><rect x="530" y="210" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="247.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does a golden dataset</text><text x="700" y="264.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">already exist?</text><line x1="700.0" y1="160.0" x2="700.0" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><rect x="260" y="360" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="400" y="390.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Build one from</text><text x="400" y="406.20000000000005" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">real failures, 20</text><text x="400" y="421.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">to 50 to start</text><rect x="680" y="360" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="850" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">What kind of</text><text x="850" y="406.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">correctness does</text><text x="850" y="422.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">this task have?</text><line x1="610.0" y1="300.0" x2="490.0" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-6-decision)"/><line x1="745.0" y1="300.0" x2="805.0" y2="360.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><line x1="540.0" y1="405.0" x2="680.0" y2="405.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><rect x="330" y="510" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="440" y="548.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Code-based</text><text x="440" y="564" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">grading</text><rect x="590" y="510" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="548.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">LLM-as-judge,</text><text x="700" y="564" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">bias-controlled</text><rect x="850" y="510" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="960" y="556.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Human grading</text><line x1="727.0" y1="450.0" x2="550.0" y2="514.8" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><line x1="805.0" y1="450.0" x2="745.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><line x1="883.0" y1="450.0" x2="927.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><rect x="510" y="660" width="380" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="697.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Run as a regression test</text><text x="700" y="714.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">against the dataset</text><line x1="518.0" y1="600.0" x2="622.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><line x1="700.0" y1="600.0" x2="700.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><line x1="882.0" y1="600.0" x2="778.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><rect x="320" y="810" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="450" y="848.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Revise the prompt</text><text x="450" y="864.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">and re-run</text><rect x="760" y="810" width="300" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="910" y="848.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Tag the version</text><text x="910" y="864.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">for staged rollout</text><line x1="625.0" y1="750.0" x2="525.0" y2="810.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-6-decision)"/><line x1="763.0" y1="750.0" x2="847.0" y2="810.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><line x1="525.0" y1="810.0" x2="625.0" y2="750.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-6-decision)"/><rect x="550" y="960" width="320" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="710" y="998.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Comparing against</text><text x="710" y="1014.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">a live incumbent?</text><line x1="850.0" y1="900.0" x2="770.0" y2="960.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-decision)"/><rect x="60" y="1070" width="1280" height="50" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="1080" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Whether a golden dataset already exists and what kind of correctness the task has determine the</text><text x="700" y="1097.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">grading method; passing a regression test is what earns a version its tag, and only a properly</text><text x="700" y="1115" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">powered comparison decides a live A/B test.</text>
</svg>