<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-bi desc-bi">
  <title id="title-bi">A bidirectional RNN runs a forward pass and a backward pass over the sequence and concatenates their hidden states</title>
  <desc id="desc-bi">A diagram showing three time steps of a sequence. A forward RNN chain runs left to right across the top, and a separate backward RNN chain runs right to left across the bottom, both reading the same three inputs. At each position, the forward and backward hidden states are concatenated into a combined representation that reflects context from both directions.</desc>
  <rect width="1200" height="620" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Bidirectional RNN: forward and backward passes, concatenated</text><rect x="220" y="160" width="130" height="70" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="2"/><text x="285" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">fwd h→_1</text><line x1="350" y1="195" x2="480" y2="195" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowb)"/><rect x="220" y="380" width="130" height="70" rx="8" fill="#104281" stroke="#104281" stroke-width="2"/><text x="285" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">bwd h←_1</text><line x1="480" y1="415" x2="350" y2="415" stroke="#104281" stroke-width="2.5" marker-end="url(#arrowb)"/><rect x="255" y="288" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="285" y="310" text-anchor="middle" font-size="12" fill="#52514e">x_1</text><line x1="285" y1="288" x2="285" y2="230" stroke="#898781" stroke-width="2" marker-end="url(#arrowgray2)"/><line x1="285" y1="322" x2="285" y2="380" stroke="#898781" stroke-width="2" marker-end="url(#arrowgray2)"/><rect x="230" y="85" width="110" height="40" rx="6" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="1.5"/><text x="285" y="110" text-anchor="middle" font-size="11.5" fill="#ffffff">[h→_1 ; h←_1]</text><line x1="285" y1="125" x2="285" y2="160" stroke="#52514e" stroke-width="2" marker-end="url(#arrowgray2)"/><rect x="480" y="160" width="130" height="70" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="2"/><text x="545" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">fwd h→_2</text><line x1="610" y1="195" x2="740" y2="195" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowb)"/><rect x="480" y="380" width="130" height="70" rx="8" fill="#104281" stroke="#104281" stroke-width="2"/><text x="545" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">bwd h←_2</text><line x1="740" y1="415" x2="610" y2="415" stroke="#104281" stroke-width="2.5" marker-end="url(#arrowb)"/><rect x="515" y="288" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="545" y="310" text-anchor="middle" font-size="12" fill="#52514e">x_2</text><line x1="545" y1="288" x2="545" y2="230" stroke="#898781" stroke-width="2" marker-end="url(#arrowgray2)"/><line x1="545" y1="322" x2="545" y2="380" stroke="#898781" stroke-width="2" marker-end="url(#arrowgray2)"/><rect x="490" y="85" width="110" height="40" rx="6" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="1.5"/><text x="545" y="110" text-anchor="middle" font-size="11.5" fill="#ffffff">[h→_2 ; h←_2]</text><line x1="545" y1="125" x2="545" y2="160" stroke="#52514e" stroke-width="2" marker-end="url(#arrowgray2)"/><rect x="740" y="160" width="130" height="70" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="2"/><text x="805" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">fwd h→_3</text><rect x="740" y="380" width="130" height="70" rx="8" fill="#104281" stroke="#104281" stroke-width="2"/><text x="805" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">bwd h←_3</text><rect x="775" y="288" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="805" y="310" text-anchor="middle" font-size="12" fill="#52514e">x_3</text><line x1="805" y1="288" x2="805" y2="230" stroke="#898781" stroke-width="2" marker-end="url(#arrowgray2)"/><line x1="805" y1="322" x2="805" y2="380" stroke="#898781" stroke-width="2" marker-end="url(#arrowgray2)"/><rect x="750" y="85" width="110" height="40" rx="6" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="1.5"/><text x="805" y="110" text-anchor="middle" font-size="11.5" fill="#ffffff">[h→_3 ; h←_3]</text><line x1="805" y1="125" x2="805" y2="160" stroke="#52514e" stroke-width="2" marker-end="url(#arrowgray2)"/><text x="90" y="200" font-size="12.5" font-weight="700" fill="#184f95">forward</text><text x="90" y="420" font-size="12.5" font-weight="700" fill="#104281">backward</text><defs>
    <marker id="arrowb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
    <marker id="arrowgray2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#898781"/></marker>
  </defs><rect x="90" y="490" width="1020" height="65" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="600" y="515" text-anchor="middle" font-size="12.5" fill="#52514e">Only usable when the whole sequence is available at once, not while generating one step at a time</text><text x="600" y="534" text-anchor="middle" font-size="12.5" fill="#52514e">Each position's combined representation reflects context from both before and after it</text></svg>