<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-2-landscape desc-7-2-landscape">
  <title id="title-7-2-landscape">Matching benchmark scores, structurally different weights</title>
  <desc id="desc-7-2-landscape">A diagram illustrating that LoRA and full fine-tuning can reach similar benchmark scores while producing structurally different weight matrices. Full fine-tuning shows no intruder dimensions in its singular value decomposition, while LoRA-trained weights show new high-ranking singular vectors called intruder dimensions, which the same research links to localized forgetting.</desc>
  <rect width="1500" height="620" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Matching benchmark scores, structurally different weights</text>
  <defs><marker id="arrow-7-2-landscape-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="580" y="90" width="340" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="118.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Same pretrained model, same</text><text x="750" y="135.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">benchmark target</text><line x1="750" y1="160" x2="750" y2="240" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-landscape-main)"/><line x1="750" y1="160" x2="1080" y2="240" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-landscape-main)"/><rect x="160" y="240" width="520" height="130" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="420" y="301.5375" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Full fine-tuning</text><text x="420" y="326.58750000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">updates the full weight matrix; SVD shows no intruder dimensions</text><rect x="820" y="240" width="520" height="130" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1080" y="301.5375" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">LoRA fine-tuning</text><text x="1080" y="326.58750000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">SVD reveals new high-ranking singular vectors: "intruder dimensions"</text><line x1="420" y1="370" x2="420" y2="420" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-landscape-main)"/><line x1="1080" y1="370" x2="1080" y2="420" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-landscape-main)"/><rect x="160" y="420" width="520" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="420" y="457.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Similar benchmark score</text><rect x="820" y="420" width="520" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1080" y="449.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Similar benchmark score,</text><text x="1080" y="465.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">different structure</text><rect x="160" y="530" width="1180" height="70" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="558" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="700">Intruder dimensions were shown to cause forgetting exactly where they appear</text><text x="750" y="580" text-anchor="middle" font-size="12.5" fill="#1f2d3d">Matching scores are not proof of matching solutions.</text>
</svg>