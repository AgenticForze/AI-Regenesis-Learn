<svg width="1500" height="700" viewBox="0 0 1500 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-3-approaches desc-5-3-approaches">
  <title id="title-5-3-approaches">Three approaches to structured output compared</title>
  <desc id="desc-5-3-approaches">A diagram comparing prompted JSON with no enforcement, which can return malformed or prose-wrapped output, native function or tool calling, which reliably returns a correctly shaped tool call with typed arguments, and constrained structured-output decoding, which excludes invalid tokens at every decoding step to guarantee schema validity.</desc>
  <defs></defs>
  <rect width="1500" height="700" fill="#fcfcfb"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three approaches to structured output compared</text>
  <defs><marker id="arrow-5-3-approaches" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="30" y="100" width="440" height="55" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="250" y="132.5" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Prompted JSON</text><rect x="530" y="100" width="440" height="55" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="750" y="132.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Native function/tool calling</text><rect x="1030" y="100" width="440" height="55" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1250" y="132.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Constrained structured outputs</text><rect x="90" y="200" width="320" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="250" y="228.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">"Please respond in JSON"</text><rect x="130" y="290" width="240" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="250" y="316.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Model generates freely</text><line x1="250.0" y1="255.0" x2="250.0" y2="290.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-approaches)"/><rect x="90" y="380" width="320" height="70" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="250" y="400.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Maybe valid JSON</text><text x="250" y="433.025" text-anchor="middle" font-size="11" font-weight="400" fill="#a33a2f">or prose-wrapped, malformed,</text><text x="250" y="447.325" text-anchor="middle" font-size="11" font-weight="400" fill="#a33a2f">wrong type</text><line x1="250.0" y1="340.0" x2="250.0" y2="380.0" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrow-5-3-approaches)"/><text x="250" y="495" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">No enforcement; downstream</text><text x="250" y="512" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">code must defend itself</text><rect x="590" y="200" width="320" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="750" y="228.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Tool schemas supplied</text><rect x="630" y="290" width="240" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="750" y="316.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Model selects a tool</text><line x1="750.0" y1="255.0" x2="750.0" y2="290.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-approaches)"/><rect x="590" y="380" width="320" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="750" y="400.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Structured tool call</text><text x="750" y="433.025" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">typed arguments, correct shape</text><line x1="750.0" y1="340.0" x2="750.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-approaches)"/><text x="750" y="495" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Shape is reliable; values are</text><text x="750" y="512" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">not independently checked</text><rect x="1090" y="200" width="320" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1250" y="228.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Target JSON schema</text><rect x="1090" y="290" width="320" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1250" y="310.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Invalid tokens excluded</text><text x="1250" y="343.025" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">at every decoding step</text><line x1="1250.0" y1="255.0" x2="1250.0" y2="290.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-approaches)"/><rect x="1090" y="400" width="320" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1250" y="426.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Guaranteed schema-valid</text><line x1="1250.0" y1="360.0" x2="1250.0" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-approaches)"/><text x="1250" y="495" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Shape is guaranteed; values</text><text x="1250" y="512" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">can still be wrong</text><rect x="30" y="545" width="1440" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="575" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Each approach narrows the gap between what the model is asked for and what it reliably returns, from</text><text x="750" y="592.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">a plain request to a decoding-time guarantee; none of them verifies that the values inside a</text><text x="750" y="610" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">structured response are actually correct.</text>
</svg>