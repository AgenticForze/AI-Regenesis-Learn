<svg width="1360" height="600" viewBox="0 0 1360 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-flashattention desc-flashattention">
  <title id="title-flashattention">FlashAttention avoids materializing the full attention matrix in slow memory</title>
  <desc id="desc-flashattention">Two panels. The left panel shows standard attention writing the full attention score matrix to slow GPU memory and reading it back, with repeated read/write traffic dominating cost. The right panel shows FlashAttention processing small tiles in fast on-chip memory without ever fully materializing the score matrix, producing the same exact output with far less memory traffic.</desc>
  <defs></defs>
  <rect width="1360" height="600" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Same math, much less memory traffic</text>
  <rect x="80" y="130" width="560" height="320" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#a33a2f">Standard attention</text><rect x="140" y="170" width="440" height="90" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Slow GPU memory</text><text x="360" y="229" text-anchor="middle" font-size="11" fill="#52514e">full n x n score matrix written, then read back</text><text x="360" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Repeated read/write traffic dominates cost</text><rect x="720" y="130" width="560" height="320" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">FlashAttention</text><rect x="780" y="170" width="440" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Fast on-chip memory</text><text x="1000" y="229" text-anchor="middle" font-size="11" fill="#52514e">small tiles processed, never fully materialized</text><text x="1000" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">Same exact output, far less memory traffic</text><rect x="60" y="510" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="533.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">FlashAttention (Dao et al., 2022) is exact, not an approximation: it produces mathematically</text><text x="680" y="551.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">identical attention output, just with dramatically reduced memory reads and writes.</text>
</svg>