<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-computefrontier desc-computefrontier">
  <title id="title-computefrontier">The Chinchilla-optimal frontier balances model size and data size for a fixed compute budget</title>
  <desc id="desc-computefrontier">A chart contrasting the Kaplan-era heuristic, which favored growing model size faster than training data, with the Chinchilla-corrected compute-optimal frontier, which scales model size and data size roughly together. Gopher (280 billion parameters, roughly 300 billion tokens) sits off the corrected frontier; Chinchilla (70 billion parameters, 1.4 trillion tokens), trained with the same compute, sits on it and outperformed Gopher.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Same compute budget, two different splits between model size and data</text>
  <line x1="140" y1="480" x2="1040" y2="480" stroke="#898781" stroke-width="2"/><line x1="140" y1="480" x2="140" y2="140" stroke="#898781" stroke-width="2"/><text x="590" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#52514e">Training data size (tokens) →</text><text x="50" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#52514e" transform="rotate(-90 50 310)">Model size (parameters) →</text><line x1="1100" y1="120" x2="1140" y2="120" stroke="#a33a2f" stroke-width="3"/><text x="1155" y="124" text-anchor="start" font-size="12.5" font-weight="400" fill="#a33a2f">Kaplan-era heuristic</text><text x="1155" y="143" text-anchor="start" font-size="12.5" font-weight="400" fill="#a33a2f">(favors model size)</text><line x1="1100" y1="180" x2="1140" y2="180" stroke="#2a78d6" stroke-width="3.5"/><text x="1155" y="184" text-anchor="start" font-size="12.5" font-weight="400" fill="#184f95">Chinchilla-optimal frontier</text><text x="1155" y="203" text-anchor="start" font-size="12.5" font-weight="400" fill="#184f95">(balances model and data size)</text><polyline points="180,440 320,290 480,140" fill="none" stroke="#a33a2f" stroke-width="3"/><polyline points="180,440 400,250 700,140" fill="none" stroke="#2a78d6" stroke-width="3.5"/><circle cx="480" cy="140" r="7" fill="#a33a2f"/><text x="480" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Gopher</text><text x="480" y="134" text-anchor="middle" font-size="11" fill="#52514e">280B params, ~300B tokens</text><circle cx="700" cy="140" r="7" fill="#184f95"/><text x="700" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">Chinchilla</text><text x="700" y="134" text-anchor="middle" font-size="11" fill="#52514e">70B params, 1.4T tokens</text><rect x="60" y="550" width="1240" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="571.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Both models used roughly the same training compute; Chinchilla, with far fewer parameters but far</text><text x="680" y="588.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">more data, outperformed Gopher.</text>
</svg>