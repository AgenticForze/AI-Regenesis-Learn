<svg width="1360" height="600" viewBox="0 0 1360 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-vaearch desc-vaearch">
  <title id="title-vaearch">A VAE encodes to a latent distribution, then decodes back, trained via a lower bound on the likelihood</title>
  <desc id="desc-vaearch">A pipeline diagram: an input passes through an encoder producing the parameters of a latent distribution (mean and variance), from which a latent vector z is sampled; a decoder reconstructs an output from that sampled z. New samples are generated by sampling z directly from the prior distribution and decoding, without an input.</desc>
  <defs><marker id="arr42a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="600" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Encoder, latent distribution, decoder</text>
  <rect x="80" y="250" width="180" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="170" y="304.8333333333333" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Input x</text><rect x="340" y="250" width="200" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="440" y="296" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Encoder</text><text x="440" y="314" text-anchor="middle" font-size="11" fill="#52514e">q(z given x)</text><rect x="630" y="220" width="220" height="160" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="740" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">Latent distribution</text><text x="740" y="282" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">mean μ, variance σ²</text><text x="740" y="302" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">sample z from this</text><text x="740" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">distribution</text><rect x="940" y="250" width="200" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1040" y="296" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Decoder</text><text x="1040" y="314" text-anchor="middle" font-size="11" fill="#52514e">p(x given z)</text><rect x="1140" y="250" width="180" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1230" y="304.3333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Reconstruction</text><line x1="260.0" y1="300.0" x2="340.0" y2="300.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42a)"/><line x1="540.0" y1="300.0" x2="630.0" y2="300.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42a)"/><line x1="850.0" y1="300.0" x2="940.0" y2="300.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42a)"/><line x1="1140.0" y1="300.0" x2="1140.0" y2="300.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42a)"/><text x="740" y="420" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">New samples: skip the encoder, draw a fresh z</text><text x="740" y="440" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">from the prior, and decode it.</text><rect x="60" y="460" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="490" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Trained by maximizing the evidence lower bound (ELBO): a reconstruction term plus a term pulling the</text><text x="680" y="507.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">encoder's output toward a simple prior, so new samples can be generated by decoding a fresh draw</text><text x="680" y="525" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">from that prior.</text>
</svg>