<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-3-reliability desc-5-3-reliability">
  <title id="title-5-3-reliability">OpenAI's reported schema-validity rates</title>
  <desc id="desc-5-3-reliability">A bar chart showing schema-valid output rates: under 40% for an older model prompted without enforcement, approximately 93% for a newer model prompted without enforcement, and 100% for the newer model using Structured Outputs mode with decoding-time schema constraints.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">OpenAI's reported schema-validity rates</text>
  <defs><marker id="arrow-5-3-reliability" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="260" y="390" width="280" height="90" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="400" y="435" text-anchor="middle" font-size="22" font-weight="700" fill="#a33a2f">&lt; 40%</text><text x="400" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Prompted, gpt-4-0613</text><rect x="640" y="250" width="280" height="230" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="780" y="295" text-anchor="middle" font-size="22" font-weight="700" fill="#184f95">~ 93%</text><text x="780" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Prompted, newer model</text><rect x="1020" y="220" width="280" height="260" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1160" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">100%</text><text x="1160" y="515" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Structured Outputs</text><line x1="230" y1="480" x2="1330" y2="480" stroke="#898781" stroke-width="1.5"/><rect x="60" y="520" width="1240" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="545" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">OpenAI, 2024: schema-valid-output rate across evaluations, comparing an older model prompted without</text><text x="680" y="562.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">enforcement, a newer model prompted without enforcement, and the same newer model using Structured</text><text x="680" y="580" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Outputs mode with decoding-time schema constraints.</text>
