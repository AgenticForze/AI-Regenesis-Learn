<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Five layers of the AI taxonomy, narrowing from rule-based systems to agentic AI</title>
  <desc id="desc2">A pyramid diagram with five stacked trapezoid bands. From bottom to top: Rule-Based AI (widest), Machine Learning, Deep Learning, Generative AI, and Agentic AI (narrowest), each a specialization of the one below it.</desc>

  <rect x="0" y="0" width="1000" height="620" rx="12" fill="#fcfcfb"/>

  <!-- band 0: Rule-Based AI -->
  <polygon points="70,560 930,560 850,470 150,470" fill="#86b6ef"/>
  <text x="500" y="505" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">Rule-Based AI</text>
  <text x="500" y="528" text-anchor="middle" font-size="13" fill="#0b0b0b">Explicit human-authored logic — e.g. an if/then fraud rule</text>

  <!-- band 1: Machine Learning -->
  <polygon points="150,470 850,470 770,380 230,380" fill="#5598e7"/>
  <text x="500" y="415" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Machine Learning</text>
  <text x="500" y="438" text-anchor="middle" font-size="13" fill="#ffffff">Parameters learned from data — e.g. a logistic-regression scorecard</text>

  <!-- band 2: Deep Learning -->
  <polygon points="230,380 770,380 690,290 310,290" fill="#2a78d6"/>
  <text x="500" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Deep Learning</text>
  <text x="500" y="347" text-anchor="middle" font-size="12.5" fill="#ffffff">Learned features, no manual engineering — e.g. a CNN classifier</text>

  <!-- band 3: Generative AI -->
  <polygon points="310,290 690,290 610,200 390,200" fill="#1c5cab"/>
  <text x="500" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Generative AI</text>
  <text x="500" y="250" text-anchor="middle" font-size="12" fill="#ffffff">Models a distribution</text>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#ffffff">over outputs</text>
  <text x="500" y="283" text-anchor="middle" font-size="11" fill="#cde2fb">e.g. a text generator</text>

  <!-- band 4: Agentic AI (too narrow for inline text — external label) -->
  <polygon points="390,200 610,200 530,110 470,110" fill="#104281"/>
  <line x1="570" y1="140" x2="760" y2="105" stroke="#898781" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="760" cy="105" r="3" fill="#898781"/>
  <text x="775" y="100" font-size="16" font-weight="700" fill="#0b0b0b">Agentic AI</text>
  <text x="775" y="122" font-size="12.5" fill="#52514e">Chooses its own next action —</text>
  <text x="775" y="140" font-size="12.5" fill="#52514e">e.g. a tool-using LLM agent</text>

  <text x="500" y="600" text-anchor="middle" font-size="13" fill="#898781">Each layer is a specialization of the one beneath it, narrower in scope, not a rival approach.</text>
</svg>
