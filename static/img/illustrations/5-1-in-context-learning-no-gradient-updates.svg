<svg width="1360" height="600" viewBox="0 0 1360 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-1-icl desc-5-1-icl">
  <title id="title-5-1-icl">In-context learning: everything happens within the prompt</title>
  <desc id="desc-5-1-icl">A diagram showing a prompt containing a task description and K worked examples feeding into a model whose weights remain entirely fixed, producing an output inferred purely from the prompt, applying identically whether K is zero, one, or a handful of examples.</desc>
  <defs></defs>
  <rect width="1360" height="600" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">In-context learning: everything happens within the prompt</text>
  <defs><marker id="arrow-5-1-icl" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="100" y="130" width="320" height="140" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="260" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Prompt</text><text x="260" y="214" text-anchor="middle" font-size="12.5" fill="#52514e">task description + K examples</text><rect x="520" y="130" width="320" height="140" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="680" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Model weights</text><text x="680" y="214" text-anchor="middle" font-size="12.5" fill="#ffffff">entirely fixed, no updates</text><rect x="940" y="130" width="320" height="140" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1100" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Output</text><text x="1100" y="214" text-anchor="middle" font-size="12.5" fill="#52514e">inferred from the prompt alone</text><line x1="420.0" y1="200.0" x2="520.0" y2="200.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-icl)"/><line x1="840.0" y1="200.0" x2="940.0" y2="200.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-icl)"/><text x="680" y="340" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">This applies identically whether K = 0 (zero-shot), K = 1 (one-shot), or K is a handful of examples (few-shot).</text><rect x="60" y="400" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="421.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Brown et al., 2020: zero-shot, one-shot, and few-shot are defined purely by how many worked examples</text><text x="680" y="438.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">appear in the prompt. No gradient updates happen in any case, this is in-context learning, a</text><text x="680" y="456.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">fundamentally different mechanism from fine-tuning, which does update weights on a task-specific</text><text x="680" y="473.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">dataset.</text>
</svg>