<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-2-refarch desc-6-2-refarch">
  <title id="title-6-2-refarch">From raw text to a ranked set of nearby vectors</title>
  <desc id="desc-6-2-refarch">A linear flow diagram: document or query text goes into an embedding model, producing a fixed-size dense vector, which is normalized and compared using a chosen similarity metric, searched against an ANN index built with HNSW, IVF, product quantization, or a combination, producing ranked candidate vectors mapped back to their source documents.</desc>
  <defs></defs>
  <rect width="1400" height="760" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">From raw text to a ranked set of nearby vectors</text>
  <defs><marker id="arrow-6-2-refarch" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="480" y="90" width="440" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="126.4" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Document or query text</text><rect x="480" y="195" width="440" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="231.4" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Embedding model</text><line x1="700.0" y1="160.0" x2="700.0" y2="195.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-refarch)"/><rect x="480" y="300" width="440" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="336.4" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Fixed-size dense vector</text><line x1="700.0" y1="265.0" x2="700.0" y2="300.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-refarch)"/><rect x="440" y="405" width="520" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="443.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Normalize, choose a</text><text x="700" y="459.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">similarity metric</text><line x1="700.0" y1="370.0" x2="700.0" y2="405.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-refarch)"/><rect x="440" y="530" width="520" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="568.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">ANN index: HNSW, IVF, product</text><text x="700" y="584" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">quantization, or a combination</text><line x1="700.0" y1="495.0" x2="700.0" y2="530.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-refarch)"/><rect x="480" y="655" width="440" height="80" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="688.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Ranked candidates, mapped</text><text x="700" y="704.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">back to source documents</text><line x1="700.0" y1="620.0" x2="700.0" y2="655.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-2-refarch)"/>
</svg>