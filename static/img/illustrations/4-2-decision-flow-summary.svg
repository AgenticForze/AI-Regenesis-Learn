<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-decisionflow42 desc-decisionflow42">
  <title id="title-decisionflow42">Choosing a generative model family for a task</title>
  <desc id="desc-decisionflow42">A decision flow starting from what the output needs, branching on whether it is primarily sequential text or code (favoring an autoregressive LLM) versus image, video, or audio, which further branches on whether quality and diversity matter more than sampling speed (favoring a diffusion model) versus speed mattering most, which further branches on whether a structured, interpolatable latent space is needed (favoring a VAE) versus not (favoring a GAN, accepting mode-collapse risk).</desc>
  <defs><marker id="arr42f" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">From output requirement to model family</text>
  <rect x="560" y="40" width="240" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="79.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">What does the output need?</text><rect x="520" y="150" width="320" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Primarily sequential</text><text x="680" y="204" text-anchor="middle" font-size="11" fill="#52514e">text or code?</text><line x1="680.0" y1="110.0" x2="680.0" y2="150.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><rect x="110" y="290" width="300" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="260" y="326" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Autoregressive LLM</text><text x="260" y="344" text-anchor="middle" font-size="11" fill="#52514e">exact tractable density</text><line x1="540" y1="230" x2="260" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><text x="360" y="260" font-size="12.5" font-weight="700" fill="#184f95">Yes</text><rect x="560" y="290" width="320" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="720" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Quality/diversity matter</text><text x="720" y="344" text-anchor="middle" font-size="11" fill="#52514e">more than sampling speed?</text><line x1="820" y1="230" x2="720" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><text x="780" y="260" font-size="12.5" font-weight="700" fill="#184f95">No, image/video/audio</text><rect x="940" y="300" width="320" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1100" y="341" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Diffusion model</text><text x="1100" y="359" text-anchor="middle" font-size="11" fill="#52514e">optionally distilled for speed</text><line x1="880" y1="310" x2="940" y2="320" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><text x="910" y="290" font-size="12.5" font-weight="700" fill="#184f95">Yes</text><rect x="560" y="430" width="320" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="720" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Structured, interpolatable</text><text x="720" y="484" text-anchor="middle" font-size="11" fill="#52514e">latent space needed?</text><line x1="720" y1="370" x2="720" y2="430" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><text x="740" y="390" font-size="12.5" font-weight="700" fill="#184f95">No, speed matters most</text><rect x="940" y="430" width="320" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1100" y="466" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">VAE</text><text x="1100" y="484" text-anchor="middle" font-size="11" fill="#52514e">or a VAE component inside latent diffusion</text><line x1="880" y1="450" x2="940" y2="450" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><text x="895" y="430" font-size="12.5" font-weight="700" fill="#184f95">Yes</text><rect x="940" y="540" width="320" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1100" y="576" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">GAN</text><text x="1100" y="594" text-anchor="middle" font-size="11" fill="#52514e">accepting mode-collapse risk</text><line x1="720" y1="510" x2="1100" y2="540" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42f)"/><text x="660" y="565" font-size="12.5" font-weight="700" fill="#184f95">No</text>
</svg>