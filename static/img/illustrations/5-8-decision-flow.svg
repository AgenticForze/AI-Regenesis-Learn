<svg width="1500" height="1000" viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-8-decision desc-5-8-decision">
  <title id="title-5-8-decision">Choosing (and combining) an approach for a new LLM use case</title>
  <desc id="desc-5-8-decision">A decision-flow diagram branching from a new LLM use case into whether the answer must cite specific, current source documents, routing to retrieval-augmented generation if so; whether a few examples already demonstrate the desired behavior, routing to prompting if so or checking task volume otherwise; whether the task is narrow and very high-volume, routing to fine-tuning if so or back to continued prompt iteration otherwise; and, on the RAG path, whether the model reliably cites retrieved context, routing to shipping the RAG-based approach if so or to first fine-tuning the model to use retrieved context better if not.</desc>
  <defs></defs>
  <rect width="1500" height="1000" fill="#fcfcfb"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing (and combining) an approach for a new LLM use case</text>
  <defs><marker id="arrow-5-8-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="560" y="90" width="380" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="750" y="117.85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A new LLM use case needs</text><text x="750" y="134.75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">an approach</text><rect x="540" y="210" width="420" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="750" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Must the answer cite</text><text x="750" y="256.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">specific, current source</text><text x="750" y="272.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">documents?</text><line x1="750.0" y1="160.0" x2="750.0" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><rect x="210" y="360" width="340" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="380" y="390.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Retrieve documents</text><text x="380" y="406.20000000000005" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">and pass them into</text><text x="380" y="421.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">the prompt</text><line x1="639.0" y1="300.0" x2="491.0" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-decision)"/><rect x="210" y="510" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="380" y="540.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Does the model</text><text x="380" y="556.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">reliably cite the</text><text x="380" y="571.8000000000001" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">retrieved context?</text><line x1="380.0" y1="450.0" x2="380.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><rect x="70" y="660" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="200" y="683.725" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Fine-tune the</text><text x="200" y="698.6750000000001" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">model to use</text><text x="200" y="713.625" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">retrieved context</text><text x="200" y="728.575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">better</text><rect x="360" y="660" width="260" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="490" y="690.6" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Ship the</text><text x="490" y="706.2" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">RAG-based</text><text x="490" y="721.8000000000001" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">approach</text><line x1="326.0" y1="600.0" x2="254.0" y2="660.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-decision)"/><line x1="413.0" y1="600.0" x2="457.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><line x1="330.0" y1="705.0" x2="360.0" y2="705.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><rect x="950" y="360" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1120" y="382.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Do a few examples</text><text x="1120" y="398.40000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">already</text><text x="1120" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">demonstrate the</text><text x="1120" y="429.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">behavior?</text><line x1="861.0" y1="300.0" x2="1009.0" y2="360.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><rect x="830" y="510" width="260" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="960" y="540.6" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Ship a</text><text x="960" y="556.2" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">prompting-based</text><text x="960" y="571.8000000000001" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">approach</text><rect x="1120" y="510" width="260" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1250" y="540.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Is this narrow</text><text x="1250" y="556.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">and very</text><text x="1250" y="571.8000000000001" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">high-volume?</text><line x1="1072.0" y1="450.0" x2="1008.0" y2="510.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-decision)"/><line x1="1159.0" y1="450.0" x2="1211.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><rect x="1120" y="660" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1250" y="683.725" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Fine-tune a model</text><text x="1250" y="698.6750000000001" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">on labeled</text><text x="1250" y="713.625" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">examples of the</text><text x="1250" y="728.575" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">task</text><rect x="830" y="660" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="960" y="691.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Keep iterating on</text><text x="960" y="706.1500000000001" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">the prompt as the</text><text x="960" y="721.1" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">task grows</text><line x1="1250.0" y1="600.0" x2="1250.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-decision)"/><line x1="1163.0" y1="600.0" x2="1047.0" y2="660.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-decision)"/><path d="M 960 750 L 960 850 L 1440 850 L 1440 405 L 1290 405" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-decision)"/><rect x="60" y="900" width="1380" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="916.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Whether the answer needs a citable source, whether a few examples already demonstrate the behavior,</text><text x="750" y="933.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">and whether the task is narrow and high-volume determine the path; a RAG-based answer that is not</text><text x="750" y="951.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">reliably grounded gets fine-tuned to use retrieved context better, then still ships as the RAG-based</text><text x="750" y="968.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">approach.</text>
</svg>