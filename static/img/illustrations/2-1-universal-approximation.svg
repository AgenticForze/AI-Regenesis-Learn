<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-ua desc-ua">
  <title id="title-ua">Three hidden-unit sigmoid contributions summing into one complex output curve</title>
  <desc id="desc-ua">A large curve at the top shows a hump-shaped function that is exactly the weighted sum of three simple sigmoid step functions, shown as three small curves at the bottom, each contributed by one hidden unit with its own weight, center, and steepness. This is the mechanism behind the universal approximation theorem: enough weighted sigmoid steps summed together can trace an arbitrarily complex curve.</desc>
  <rect width="1000" height="700" fill="#fcfcfb"/>
  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Enough hidden units, summed, can trace any curve</text>

  <rect x="100" y="65" width="800" height="405" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/>
  <text x="120" y="90" font-size="12.5" font-weight="700" fill="#0b0b0b">Network output = weighted sum of 3 hidden-unit activations</text>
  <line x1="100" y1="470" x2="900" y2="470" stroke="#c9c7c1" stroke-width="1.2"/>

  <polyline fill="none" stroke="#104281" stroke-width="3.5"
    points="100.0,470.0 108.0,469.1 116.0,468.1 124.0,466.8 132.0,465.2 140.0,463.4 148.0,461.1 156.0,458.5 164.0,455.3 172.0,451.6 180.0,447.3 188.0,442.2 196.0,436.3 204.0,429.6 212.0,422.0 220.0,413.6 228.0,404.4 236.0,394.4 244.0,383.8 252.0,372.7 260.0,361.4 268.0,350.1 276.0,338.9 284.0,328.1 292.0,317.8 300.0,308.2 308.0,299.2 316.0,291.0 324.0,283.6 332.0,276.8 340.0,270.7 348.0,265.1 356.0,260.0 364.0,255.2 372.0,250.7 380.0,246.3 388.0,242.0 396.0,237.8 404.0,233.5 412.0,229.0 420.0,224.4 428.0,219.5 436.0,214.4 444.0,209.0 452.0,203.3 460.0,197.4 468.0,191.2 476.0,184.7 484.0,178.1 492.0,171.4 500.0,164.7 508.0,158.0 516.0,151.3 524.0,144.9 532.0,138.6 540.0,132.7 548.0,127.0 556.0,121.8 564.0,116.9 572.0,112.4 580.0,108.3 588.0,104.6 596.0,101.3 604.0,98.5 612.0,96.0 620.0,94.0 628.0,92.3 636.0,91.1 644.0,90.3 652.0,90.0 660.0,90.3 668.0,91.2 676.0,92.9 684.0,95.5 692.0,99.1 700.0,103.9 708.0,109.8 716.0,117.0 724.0,125.3 732.0,134.4 740.0,143.9 748.0,153.6 756.0,162.8 764.0,171.3 772.0,178.7 780.0,185.1 788.0,190.4 796.0,194.6 804.0,198.0 812.0,200.6 820.0,202.6 828.0,204.1 836.0,205.2 844.0,206.1 852.0,206.7 860.0,207.2 868.0,207.5 876.0,207.8 884.0,207.9 892.0,208.1 900.0,208.2"/>

  <!-- three mini contribution panels -->
  <g>
    <rect x="120" y="500" width="230" height="150" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/>
    <text x="235" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#86b6ef">Hidden unit 1</text>
    <path d="M 140 610 C 190 610, 200 550, 330 545" fill="none" stroke="#86b6ef" stroke-width="3"/>
    <text x="235" y="638" text-anchor="middle" font-size="10" fill="#52514e">large weight, gentle rise near x=2</text>
  </g>
  <g>
    <rect x="385" y="500" width="230" height="150" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/>
    <text x="500" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#5598e7">Hidden unit 2</text>
    <path d="M 405 605 C 460 604, 480 545, 595 542" fill="none" stroke="#5598e7" stroke-width="3"/>
    <text x="500" y="638" text-anchor="middle" font-size="10" fill="#52514e">medium weight, rise near x=5</text>
  </g>
  <g>
    <rect x="650" y="500" width="230" height="150" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/>
    <text x="765" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">Hidden unit 3</text>
    <path d="M 670 545 C 750 546, 770 605, 860 606" fill="none" stroke="#a33a2f" stroke-width="3"/>
    <text x="765" y="638" text-anchor="middle" font-size="10" fill="#52514e">negative weight, falls near x=8</text>
  </g>

  <text x="365" y="583" text-anchor="middle" font-size="22" font-weight="700" fill="#898781">+</text>
  <text x="630" y="583" text-anchor="middle" font-size="22" font-weight="700" fill="#898781">+</text>

  <text x="500" y="676" text-anchor="middle" font-size="11.5" fill="#52514e">Cybenko (1989) and Hornik, Stinchcombe, and White (1989): enough sigmoid units, summed with the</text>
  <text x="500" y="693" text-anchor="middle" font-size="11.5" fill="#52514e">right weights, approximate any continuous function on a bounded region</text>
</svg>
