<svg width="1300" height="620" viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-staticctx desc-staticctx">
  <title id="title-staticctx">The same word "bank" gets one vector under a static embedding but two under a contextual encoder</title>
  <desc id="desc-staticctx">Two sentences each containing the word bank in a different sense feed into two comparisons: a static embedding path where both sentences point to the same single stored vector, and a contextual path where each sentence produces its own distinct vector.</desc>
  <defs><marker id="arr32c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#898781"/></marker><marker id="arr32d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs>
  <rect width="1300" height="620" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Static: one vector per word. Contextual: one vector per occurrence.</text>
  <rect x="90" y="120" width="520" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="110" y="155" font-size="15" fill="#0b0b0b">"the river <tspan font-weight="700" fill="#184f95">bank</tspan> was flooded"</text><text x="110" y="185" font-size="12" fill="#52514e">sense: a river's edge</text><rect x="90" y="380" width="520" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="110" y="415" font-size="15" fill="#0b0b0b">"she opened a <tspan font-weight="700" fill="#184f95">bank</tspan> account"</text><text x="110" y="445" font-size="12" fill="#52514e">sense: a financial institution</text><line x1="610" y1="165" x2="950" y2="260" stroke="#898781" stroke-width="2" marker-end="url(#arr32c)"/><line x1="610" y1="425" x2="950" y2="290" stroke="#898781" stroke-width="2" marker-end="url(#arr32c)"/><rect x="950" y="240" width="240" height="70" rx="8" fill="#898781" stroke="#52514e" stroke-width="1.5"/><text x="1070" y="279.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">static: one vector for "bank"</text><text x="1070" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#898781">STATIC (3.1 embeddings)</text><text x="1070" y="70" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">CONTEXTUAL (this chapter)</text><line x1="610" y1="150" x2="950" y2="120" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr32d)"/><rect x="950" y="90" width="240" height="60" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="1070" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">vector A ("riverbank" sense)</text><line x1="610" y1="440" x2="950" y2="430" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr32d)"/><rect x="950" y="400" width="240" height="60" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="1070" y="434" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">vector B ("financial" sense)</text><rect x="90" y="520" width="1120" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="548.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Same written word, two different sentences: a contextual encoder computes two distinct vectors; a</text><text x="650" y="566.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">static lookup table can only ever return one.</text>
</svg>