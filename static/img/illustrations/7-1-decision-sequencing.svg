<svg width="1560" height="520" viewBox="0 0 1560 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-1-sequencing desc-7-1-sequencing">
  <title id="title-7-1-sequencing">Fine-tuning is the last step, not the first</title>
  <desc id="desc-7-1-sequencing">A four-step sequencing diagram: write an eval set first, then prompt and measure against it, then check whether a real gap persists at real volume, then only fine-tune if a gap remains. A note below lists concrete thresholds: at least 10 training examples, 50 to 100 recommended, one task per fine-tuned model, and matching prompts between training and production.</desc>
  <rect width="1560" height="520" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Fine-tuning is the last step, not the first</text>
  <defs><marker id="arrow-7-1-seq-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="60" y="140" width="320" height="100" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="220" y="186.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Write the eval set</text><text x="220" y="211.04999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">Ch. 5.6 golden-dataset discipline, before touching a prompt</text><rect x="426" y="140" width="320" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="586" y="186.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Prompt + few-shot, measure</text><text x="586" y="211.04999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">the cheapest experiment, tried first, re-measured against the eval</text><line x1="380" y1="190" x2="426" y2="190" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-seq-main)"/><rect x="792" y="140" width="320" height="100" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="952" y="177.7" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Gap persists at real</text><text x="952" y="195.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">volume?</text><text x="952" y="219.79999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">narrow task, real cost/latency pressure, not just "seems off"</text><line x1="746" y1="190" x2="792" y2="190" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-seq-main)"/><rect x="1158" y="140" width="320" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1318" y="186.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Fine-tune, only now</text><text x="1318" y="211.04999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">10+ examples, 50-100 typical, one task per model</text><line x1="1112" y1="190" x2="1158" y2="190" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-1-seq-main)"/><rect x="60" y="320" width="1418" height="130" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="769" y="360" text-anchor="middle" font-size="13.5" fill="#1f2d3d" font-weight="700">Concrete thresholds, not a vague sense the model "isn't quite right yet":</text><text x="769" y="390" text-anchor="middle" font-size="13.5" fill="#1f2d3d" font-weight="400">at least 10 training examples, 50-100 recommended once a task is well-scoped · one fine-tuned model per task, not one model for several unrelated behaviors</text><text x="769" y="420" text-anchor="middle" font-size="13.5" fill="#1f2d3d" font-weight="400">· the production prompt template must match the training prompt template, or the fine-tune loses much of what it was built to buy</text>
</svg>