<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-3-idxvdb desc-6-3-idxvdb">
  <title id="title-6-3-idxvdb">An ANN index is not a database</title>
  <desc id="desc-6-3-idxvdb">A diagram contrasting a bare ANN index, which only answers nearest-neighbor queries over a fixed set of vectors, with a full vector database, which wraps that index with insert and delete support, metadata filtering, multi-tenant isolation, persistence, and an operational deployment model.</desc>
  <defs></defs>
  <rect width="1400" height="640" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">An ANN index is not a database</text>
  <rect x="60" y="130" width="600" height="70" rx="8" fill="#a33a2f" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="166.6" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">A bare ANN index</text><rect x="60" y="220" width="600" height="310" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="360" y="262" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Answers one question: which stored vectors are</text><text x="360" y="279" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">nearest to this query vector</text><text x="360" y="318" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No support for inserting, updating, or</text><text x="360" y="335" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">deleting without a rebuild</text><text x="360" y="374" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No metadata filtering, everything is searched</text><text x="360" y="391" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">together</text><text x="360" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No tenant isolation, no persistence</text><text x="360" y="447" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">guarantees, no deployment model</text><rect x="800" y="130" width="600" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="1100" y="166.6" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">A full vector database</text><rect x="800" y="220" width="600" height="310" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1100" y="262" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Wraps an ANN index (HNSW, IVF, product</text><text x="1100" y="279" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">quantization) with production needs</text><text x="1100" y="318" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Insert, update, and delete vectors without</text><text x="1100" y="335" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">rebuilding the whole structure</text><text x="1100" y="374" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Metadata filtering alongside similarity, and</text><text x="1100" y="391" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">multi-tenant isolation</text><text x="1100" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">A concrete deployment model: managed,</text><text x="1100" y="447" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">self-hosted, embedded, or added to an existing</text><text x="1100" y="464" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">DB</text><rect x="60" y="560" width="1280" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="592.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">An ANN index answers one question well; a vector database is everything production wraps around it.</text>
</svg>