<svg width="1500" height="680" viewBox="0 0 1500 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-9-ivq desc-6-9-ivq">
  <title id="title-6-9-ivq">Two systems, two clocks: ingestion runs on a schedule, query runs per request</title>
  <desc id="desc-6-9-ivq">A diagram contrasting the ingestion pipeline, running on a scheduled or continuous cadence through parse, chunk, embed, and index steps, against the query pipeline, running once per user request through retrieve, rerank, generate, and return-answer steps, with a note that a defect introduced during ingestion surfaces later as a query-time symptom rather than an ingestion-time error.</desc>
  <rect width="1500" height="680" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Two systems, two clocks: ingestion runs on a schedule, query runs per request</text>
  <defs><marker id="arrow-6-9-ivq-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="600" stroke="#1f3a5f" stroke-width="3"/><text x="560" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">INGESTION: on a schedule</text><rect x="280" y="140" width="560" height="60" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="560" y="172.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Parse documents</text><rect x="280" y="220" width="560" height="60" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="560" y="252.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Chunk</text><rect x="280" y="300" width="560" height="60" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="560" y="332.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Embed</text><rect x="280" y="380" width="560" height="60" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="560" y="412.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Write to index</text><line x1="560" y1="200" x2="560" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-ivq-main)"/><line x1="560" y1="280" x2="560" y2="300" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-ivq-main)"/><line x1="560" y1="360" x2="560" y2="380" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-ivq-main)"/><text x="1180" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">QUERY: once per request</text><rect x="900" y="140" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="172.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Retrieve from index</text><rect x="900" y="220" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="252.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Rerank</text><rect x="900" y="300" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="332.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Generate</text><rect x="900" y="380" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="412.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Return answer</text><line x1="1180" y1="200" x2="1180" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-ivq-main)"/><line x1="1180" y1="280" x2="1180" y2="300" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-ivq-main)"/><line x1="1180" y1="360" x2="1180" y2="380" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-ivq-main)"/><line x1="840" y1="410" x2="900" y2="170" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-ivq-main)"/><rect x="280" y="480" width="1180" height="76" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="504" text-anchor="middle" font-size="12" fill="#6b7280">A defect introduced during ingestion, such as a bad chunking change, does not appear as an ingestion</text><text x="870" y="523" text-anchor="middle" font-size="12" fill="#6b7280">error. It surfaces days or weeks later as a query-time symptom, like a retrieval-quality regression,</text><text x="870" y="542" text-anchor="middle" font-size="12" fill="#6b7280">that looks unrelated unless the two pipelines are monitored separately.</text>
</svg>