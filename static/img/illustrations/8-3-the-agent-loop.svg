<svg width="1560" height="980" viewBox="0 0 1560 980" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-3-loop desc-8-3-loop"><title id="title-8-3-loop">One Task, Run Through the Loop More Than Once</title><desc id="desc-8-3-loop">A four-stage cycle: Plan decides the next action from everything observed so far, Act turns that decision into a tool call, Observe folds the result back into context. A check after Observe either continues the loop, exits to Done, or, after a failed attempt, routes through Reflect before a fresh attempt begins.</desc><rect width="1560" height="980" fill="#fbfaf7"/><text x="780" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2d3d">One Task, Run Through the Loop More Than Once</text><defs><marker id="a83-blue" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b8fc9"/></marker><marker id="a83-green" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5fae83"/></marker><marker id="a83-amber" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c9975b"/></marker><marker id="a83-pink" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c96fa8"/></marker></defs><rect x="170" y="150" width="230" height="100" rx="12" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="285.0" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d3d">1. Plan</text><text x="285.0" y="206" text-anchor="middle" font-size="11.5" fill="#6b7280">Reasoning decides the next</text><text x="285.0" y="221" text-anchor="middle" font-size="11.5" fill="#6b7280">action from the whole</text><text x="285.0" y="236" text-anchor="middle" font-size="11.5" fill="#6b7280">trajectory so far</text><rect x="760" y="150" width="230" height="100" rx="12" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="875.0" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d3d">2. Act</text><text x="875.0" y="206" text-anchor="middle" font-size="11.5" fill="#6b7280">Turn the decision into</text><text x="875.0" y="221" text-anchor="middle" font-size="11.5" fill="#6b7280">a specific tool call</text><rect x="760" y="470" width="230" height="100" rx="12" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.75"/><text x="875.0" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d3d">3. Observe</text><text x="875.0" y="526" text-anchor="middle" font-size="11.5" fill="#6b7280">The tool's result becomes</text><text x="875.0" y="541" text-anchor="middle" font-size="11.5" fill="#6b7280">part of the trajectory</text><rect x="170" y="470" width="230" height="100" rx="12" fill="#f6dced" stroke="#c96fa8" stroke-width="1.75"/><text x="285.0" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2d3d">4. Reflect (if needed)</text><text x="285.0" y="526" text-anchor="middle" font-size="11.5" fill="#6b7280">After a failed attempt: judge</text><text x="285.0" y="541" text-anchor="middle" font-size="11.5" fill="#6b7280">it and note what to try</text><text x="285.0" y="556" text-anchor="middle" font-size="11.5" fill="#6b7280">differently next time</text><path d="M 400 200.0 L 760 200.0" fill="none" stroke="#5b8fc9" stroke-width="2.25" marker-end="url(#a83-blue)"/><path d="M 875.0 250 L 875.0 470" fill="none" stroke="#5b8fc9" stroke-width="2.25" marker-end="url(#a83-blue)"/><path d="M 760 520.0 L 670.0 520.0" fill="none" stroke="#5b8fc9" stroke-width="2.25" marker-end="url(#a83-blue)"/><polygon points="575.0,465.0 670.0,520.0 575.0,575.0 480.0,520.0" fill="#fff6df" stroke="#c9975b" stroke-width="1.75"/><text x="575.0" y="514.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">Done, or step</text><text x="575.0" y="529.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">limit reached?</text><path d="M 575.0 465.0 L 575.0 90 L 285.0 90 L 285.0 150" fill="none" stroke="#5b8fc9" stroke-width="2.25" marker-end="url(#a83-blue)"/><text x="430.0" y="80" text-anchor="middle" font-size="12.5" fill="#5b8fc9">not yet: loop again</text><path d="M 575.0 575.0 L 575.0 660" fill="none" stroke="#5fae83" stroke-width="2.25" marker-end="url(#a83-green)"/><rect x="480.0" y="660" width="190" height="70" rx="12" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.75"/><text x="575.0" y="694" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Done</text><text x="575.0" y="716" text-anchor="middle" font-size="11" fill="#6b7280">return the result</text><text x="591.0" y="617.5" text-anchor="start" font-size="12.5" fill="#5fae83">yes, succeeded</text><path d="M 480.0 520.0 L 445 520.0 L 445 495 L 400 495" fill="none" stroke="#c96fa8" stroke-width="2.25" stroke-dasharray="5,4" marker-end="url(#a83-pink)"/><text x="402.5" y="481" text-anchor="middle" font-size="12" fill="#c96fa8">yes, but failed</text><path d="M 285.0 470 L 285.0 250" fill="none" stroke="#c96fa8" stroke-width="2.25" marker-end="url(#a83-blue)"/><text x="271.0" y="360.0" text-anchor="end" font-size="12" fill="#c96fa8">fresh attempt</text><rect x="60" y="780" width="1440" height="150" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="812" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Plan, Act, and Observe are one attempt at the task, run as many times as needed.</text><text x="780.0" y="838" text-anchor="middle" font-size="13.5" fill="#1f2d3d">ReAct is this inner cycle: reasoning renewed after every observation, within a single attempt.</text><text x="780.0" y="862" text-anchor="middle" font-size="13.5" fill="#1f2d3d">Reflect is a separate, outer cycle, in Reflexion's sense: it judges a whole finished attempt,</text><text x="780.0" y="884" text-anchor="middle" font-size="13.5" fill="#1f2d3d">not one step inside it, and hands a fresh attempt a written reason the last one fell short.</text><text x="780.0" y="908" text-anchor="middle" font-size="13.5" fill="#1f2d3d">Nothing here stops on its own. Something outside the loop always has to decide when to stop.</text></svg>