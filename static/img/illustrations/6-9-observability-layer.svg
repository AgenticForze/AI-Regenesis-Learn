<svg width="1500" height="700" viewBox="0 0 1500 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-9-obs desc-6-9-obs">
  <title id="title-6-9-obs">Observability watches continuously; evaluation samples periodically</title>
  <desc id="desc-6-9-obs">A diagram showing an observability layer branching into three tracked signal groups: retrieval signals like chunk attribution and chunk utilization, generation signals like context adherence, and system signals like latency and resource utilization, contrasted at the bottom with a comparison between continuous observability and the periodic, fixed-sample evaluation covered in Chapter 6.8.</desc>
  <rect width="1500" height="700" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Observability watches continuously; evaluation samples periodically</text>
  <defs><marker id="arrow-6-9-obs-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="620" stroke="#1f3a5f" stroke-width="3"/><rect x="670" y="130" width="400" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="870" y="161.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Observability layer</text><text x="870" y="185.51250000000002" text-anchor="middle" font-size="10.5" fill="#6b7280">continuous, in production</text><rect x="280" y="260" width="373.3333333333333" height="130" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="466.66666666666663" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Retrieval signals</text><text x="466.66666666666663" y="310" text-anchor="middle" font-size="10.5" fill="#6b7280">Chunk Attribution: which</text><text x="466.66666666666663" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">chunks were used</text><text x="466.66666666666663" y="344" text-anchor="middle" font-size="10.5" fill="#6b7280">Chunk Utilization: how much</text><text x="466.66666666666663" y="359" text-anchor="middle" font-size="10.5" fill="#6b7280">retrieved text was actually</text><text x="466.66666666666663" y="374" text-anchor="middle" font-size="10.5" fill="#6b7280">used</text><line x1="870" y1="200" x2="466.66666666666663" y2="260" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-obs-main)"/><rect x="683.3333333333333" y="260" width="373.3333333333333" height="130" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="869.9999999999999" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Generation signals</text><text x="869.9999999999999" y="310" text-anchor="middle" font-size="10.5" fill="#6b7280">Context Adherence: does the</text><text x="869.9999999999999" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">response align with the</text><text x="869.9999999999999" y="340" text-anchor="middle" font-size="10.5" fill="#6b7280">provided context</text><line x1="870" y1="200" x2="869.9999999999999" y2="260" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-obs-main)"/><rect x="1086.6666666666665" y="260" width="373.3333333333333" height="130" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1273.3333333333333" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">System signals</text><text x="1273.3333333333333" y="310" text-anchor="middle" font-size="10.5" fill="#6b7280">Latency (retrieval +</text><text x="1273.3333333333333" y="325" text-anchor="middle" font-size="10.5" fill="#6b7280">generation)</text><text x="1273.3333333333333" y="344" text-anchor="middle" font-size="10.5" fill="#6b7280">Resource utilization (CPU,</text><text x="1273.3333333333333" y="359" text-anchor="middle" font-size="10.5" fill="#6b7280">memory)</text><line x1="870" y1="200" x2="1273.3333333333333" y2="260" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-obs-main)"/><rect x="280" y="460" width="570" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="565" y="491.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Observability: continuous</text><text x="565" y="514.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">every request, every intervening step</text><rect x="890" y="460" width="570" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1175" y="491.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Evaluation (Ch. 6.8): periodic</text><text x="1175" y="514.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">a fixed or rotating sample, on a schedule</text>
</svg>