<svg width="1500" height="600" viewBox="0 0 1500 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-6-t2c desc-6-6-t2c">
  <title id="title-6-6-t2c">Text2Cypher: querying the graph directly</title>
  <desc id="desc-6-6-t2c">A five-step flow: a natural-language question, together with the graph schema, is passed to an LLM that generates a Cypher query, which executes live against the graph database, returning a query result that the LLM assembles into a grounded answer with citations back to that result.</desc>
  <rect width="1500" height="600" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Text2Cypher: querying the graph directly</text>
  <defs><marker id="arrow-6-6-t2c-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-6-6-t2c-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><line x1="230" y1="95" x2="230" y2="520" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="220" width="215.2" height="100" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="387.6" y="264.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Natural-language</text><text x="387.6" y="279.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">question</text><rect x="521.2" y="220" width="215.2" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="628.8000000000001" y="266.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">LLM + graph schema</text><text x="628.8000000000001" y="288.90000000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">generates a Cypher query</text><rect x="762.4" y="220" width="215.2" height="100" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="870" y="266.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Graph database</text><text x="870" y="288.90000000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">query executes live</text><rect x="1003.5999999999999" y="220" width="215.2" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1111.1999999999998" y="272.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Query result</text><rect x="1244.8" y="220" width="215.2" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1352.3999999999999" y="266.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Grounded answer</text><text x="1352.3999999999999" y="288.90000000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">with citations to the result</text><line x1="495.2" y1="270" x2="521.2" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-t2c-main)"/><line x1="736.4000000000001" y1="270" x2="762.4" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-t2c-main)"/><line x1="977.5999999999999" y1="270" x2="1003.5999999999999" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-t2c-main)"/><line x1="1218.8" y1="270" x2="1244.8" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-t2c-main)"/><rect x="20" y="250" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="275" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">TEXT2CYPHER</text><rect x="280" y="390" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="422" text-anchor="middle" font-size="12.5" fill="#6b7280">A schema too large or too unfamiliar can "overload the context and confuse the LLM," producing a query that fails or silently omits part of what it should match.</text>
</svg>