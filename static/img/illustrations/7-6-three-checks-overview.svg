<svg width="1560" height="620" viewBox="0 0 1560 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-6-checks desc-7-6-checks">
  <title id="title-7-6-checks">Three checks for evaluating a fine-tuned model</title>
  <desc id="desc-7-6-checks">A fine-tuned model candidate feeds into three evaluation checks: a task-specific held-out eval measuring whether the targeted behavior improved; a general-capability benchmark measuring whether anything outside that behavior regressed; and an LLM-as-judge or human evaluation measuring open-ended output quality. All three feed into a contamination check, which cuts across all of them, since a benchmark that leaked into training data invalidates the score it produces.</desc>
  <rect width="1560" height="620" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Three checks for evaluating a fine-tuned model</text>
  <defs><marker id="arrow-7-6-checks-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="590" y="90" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="780" y="127.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Fine-tuned model candidate</text><path d="M 780 160
      L 780 157
      Q 780 165 772 165
      L 298 165
      Q 290 165 290 173
      L 290 210" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-checks-main)"/><rect x="80" y="210" width="420" height="110" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="290" y="261.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Task-specific held-out eval</text><text x="290" y="286.05" text-anchor="middle" font-size="10.5" fill="#6b7280">did the targeted behavior improve?</text><path d="M 780 160
      L 780 157
      Q 780 165 772 165
      L 758 165
      Q 750 165 750 173
      L 750 210" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-checks-main)"/><rect x="540" y="210" width="420" height="110" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="750" y="261.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">General-capability benchmark</text><text x="750" y="286.05" text-anchor="middle" font-size="10.5" fill="#6b7280">did anything outside the task regress?</text><path d="M 780 160
      L 780 157
      Q 780 165 788 165
      L 1202 165
      Q 1210 165 1210 173
      L 1210 210" fill="none" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-checks-main)"/><rect x="1000" y="210" width="420" height="110" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1210" y="261.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">LLM-as-judge / human eval</text><text x="1210" y="286.05" text-anchor="middle" font-size="10.5" fill="#6b7280">how good is open-ended output quality?</text><line x1="290" y1="320" x2="290" y2="370" stroke="#c98b3a" stroke-width="1.4"/><line x1="750" y1="320" x2="750" y2="370" stroke="#c98b3a" stroke-width="1.4"/><line x1="1210" y1="320" x2="1210" y2="370" stroke="#c98b3a" stroke-width="1.4"/><line x1="290" y1="370" x2="1210" y2="370" stroke="#c98b3a" stroke-width="1.4"/><line x1="780" y1="370" x2="780" y2="400" stroke="#c98b3a" stroke-width="2" marker-end="url(#arrow-7-6-checks-main)"/><rect x="520" y="400" width="520" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="780" y="441.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Contamination check</text><text x="780" y="466.05" text-anchor="middle" font-size="10.5" fill="#6b7280">cuts across all three: a leaked benchmark invalidates its own score</text><rect x="80" y="530" width="1340" height="60" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="566" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">None of the three checks substitutes for the others, and none means anything if contaminated.</text>
</svg>