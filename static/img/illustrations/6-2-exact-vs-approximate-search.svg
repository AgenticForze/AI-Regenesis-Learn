<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-2-exactvapprox desc-6-2-exactvapprox">
  <title id="title-6-2-exactvapprox">Exact search checks everything, approximate search trades precision for speed</title>
  <desc id="desc-6-2-exactvapprox">A diagram contrasting exact nearest-neighbor search, which must compare a query against every stored vector and becomes impractical as a collection scales into the millions, with approximate nearest-neighbor search, which accepts a small, controllable amount of imprecision in exchange for search that stays fast and memory-efficient at scale.</desc>
  <defs></defs>
  <rect width="1400" height="640" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Exact search checks everything, approximate search trades precision for speed</text>
  <rect x="60" y="130" width="600" height="70" rx="8" fill="#a33a2f" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="156.75" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Exact nearest-neighbor</text><text x="360" y="176.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">search</text><rect x="60" y="220" width="600" height="310" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="360" y="260" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Compares the query against every stored</text><text x="360" y="277" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">vector, one by one</text><text x="360" y="316" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Guaranteed correct, but query time grows</text><text x="360" y="333" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">linearly with collection size</text><text x="360" y="372" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Classic indexing structures "provide little</text><text x="360" y="389" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">improvement over the brute-force algorithm" in</text><text x="360" y="406" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">high dimensions (Indyk and Motwani)</text><text x="360" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Becomes impractical once a collection reaches</text><text x="360" y="462" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">millions of vectors</text><rect x="800" y="130" width="600" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="1100" y="156.75" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Approximate</text><text x="1100" y="176.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">nearest-neighbor search</text><rect x="800" y="220" width="600" height="310" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1100" y="260" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Accepts a point within a small, controllable</text><text x="1100" y="277" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">factor of the true nearest neighbor's distance</text><text x="1100" y="316" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Trades a small amount of exactness for search</text><text x="1100" y="333" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">that stays fast at scale</text><text x="1100" y="372" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Implemented by graph-based (HNSW),</text><text x="1100" y="389" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">cluster-based (IVF), and quantization-based</text><text x="1100" y="406" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">(product quantization) methods</text><text x="1100" y="445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">What every production vector search system</text><text x="1100" y="462" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">actually runs</text><rect x="60" y="560" width="1280" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="583.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Exact search checks everything; approximate search trades a small, controllable amount of precision</text><text x="700" y="601.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">for speed that survives scale.</text>
</svg>