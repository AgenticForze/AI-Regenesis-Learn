<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-2-scale desc-5-2-scale">
  <title id="title-5-2-scale">Chain-of-thought's benefit is scale-dependent</title>
  <desc id="desc-5-2-scale">A diagram showing two panels: a large model of roughly 100 billion or more parameters, where chain-of-thought prompting substantially improves accuracy over standard prompting, and a smaller model, where chain-of-thought prompting instead produces fluent but illogical reasoning chains with no reliable gain.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Chain-of-thought's benefit is scale-dependent</text>
  <defs><marker id="arrow-5-2-scale" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="110" width="560" height="400" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Large model (roughly 100B+ parameters)</text><rect x="720" y="110" width="560" height="400" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1000" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Smaller model (below roughly 100B)</text><rect x="140" y="190" width="440" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="226.35" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Standard prompting</text><rect x="140" y="350" width="440" height="130" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="360" y="400.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Chain-of-thought prompting</text><text x="360" y="434.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Substantially improves</text><text x="360" y="450.175" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">multi-step accuracy</text><line x1="360.0" y1="260.0" x2="360.0" y2="350.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-scale)"/><rect x="780" y="190" width="440" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1000" y="226.35" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Standard prompting</text><rect x="780" y="350" width="440" height="130" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="1000" y="391.45" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a33a2f">Chain-of-thought</text><text x="1000" y="409" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a33a2f">prompting</text><text x="1000" y="443.35" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">Fluent but illogical</text><text x="1000" y="458.95000000000005" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">chains, no reliable gain</text><line x1="1000.0" y1="260.0" x2="1000.0" y2="350.0" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrow-5-2-scale)"/><rect x="80" y="540" width="1200" height="100" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="575" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Wei et al., 2022: chain-of-thought prompting "does not positively impact performance for small</text><text x="680" y="592.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">models, and only yields performance gains when used with models of approximately 100 billion</text><text x="680" y="610" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">parameters." Below that scale, models tend to produce "fluent but illogical chains of thought."</text>
</svg>