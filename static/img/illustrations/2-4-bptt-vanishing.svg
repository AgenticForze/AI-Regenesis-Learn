<svg width="1100" height="560" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-bptt desc-bptt">
  <title id="title-bptt">Gradient magnitude by how many steps back through time: a plain RNN shrinks toward zero, an LSTM stays more sustained</title>
  <desc id="desc-bptt">A grouped bar chart with six positions, from the current time step back to six steps earlier. For a plain RNN, gradient magnitude shrinks sharply the further back the step, nearly reaching zero six steps back, the same vanishing-gradient effect from chapter 2.2 but across time rather than layers. For an LSTM, gradient magnitude decays much more slowly across the same six steps because the cell state provides a more direct additive path.</desc>
  <rect width="1100" height="560" fill="#fcfcfb"/><text x="550" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Backpropagation through time: gradient magnitude by steps back</text><rect x="100" y="70" width="900" height="380" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><line x1="100" y1="410" x2="1000" y2="410" stroke="#898781" stroke-width="1.2"/><text x="80" y="95" text-anchor="end" font-size="10" fill="#898781">high</text><text x="80" y="410" text-anchor="end" font-size="10" fill="#898781">0</text><text x="550" y="440" text-anchor="middle" font-size="12" fill="#52514e">steps back through time (0 = current step, 6 = six steps earlier)</text><rect x="150" y="120" width="45" height="290" fill="#a33a2f"/><rect x="200" y="130" width="45" height="280" fill="#184f95"/><text x="197" y="428" text-anchor="middle" font-size="11" fill="#52514e">0</text><rect x="270" y="185" width="45" height="225" fill="#a33a2f"/><rect x="320" y="150" width="45" height="260" fill="#184f95"/><text x="317" y="428" text-anchor="middle" font-size="11" fill="#52514e">1</text><rect x="390" y="250" width="45" height="160" fill="#a33a2f"/><rect x="440" y="170" width="45" height="240" fill="#184f95"/><text x="437" y="428" text-anchor="middle" font-size="11" fill="#52514e">2</text><rect x="510" y="310" width="45" height="100" fill="#a33a2f"/><rect x="560" y="188" width="45" height="222" fill="#184f95"/><text x="557" y="428" text-anchor="middle" font-size="11" fill="#52514e">3</text><rect x="630" y="355" width="45" height="55" fill="#a33a2f"/><rect x="680" y="205" width="45" height="205" fill="#184f95"/><text x="677" y="428" text-anchor="middle" font-size="11" fill="#52514e">4</text><rect x="750" y="385" width="45" height="25" fill="#a33a2f"/><rect x="800" y="220" width="45" height="190" fill="#184f95"/><text x="797" y="428" text-anchor="middle" font-size="11" fill="#52514e">5</text><rect x="870" y="402" width="45" height="8" fill="#a33a2f"/><rect x="920" y="234" width="45" height="176" fill="#184f95"/><text x="917" y="428" text-anchor="middle" font-size="11" fill="#52514e">6</text><rect x="720" y="90" width="16" height="16" fill="#a33a2f"/><text x="742" y="103" font-size="12" fill="#0b0b0b">Plain RNN</text><rect x="720" y="112" width="16" height="16" fill="#184f95"/><text x="742" y="125" font-size="12" fill="#0b0b0b">LSTM</text><rect x="100" y="475" width="900" height="65" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="550" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">A plain RNN's gradient has nearly vanished by six steps back</text><text x="550" y="519" text-anchor="middle" font-size="11.5" fill="#a33a2f">it cannot learn to connect information across long gaps, no matter how much data it sees</text></svg>