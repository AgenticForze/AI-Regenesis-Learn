<svg width="1360" height="600" viewBox="0 0 1360 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-temperature desc-temperature">
  <title id="title-temperature">Temperature reshapes the same underlying distribution: sharper, unchanged, or flatter</title>
  <desc id="desc-temperature">Three bar charts of the same six-token probability distribution at low temperature (sharply concentrated on the top tokens), at temperature 1 (the model's original distribution), and at high temperature (flattened, giving lower-probability tokens meaningfully more chance of being sampled).</desc>
  <defs></defs>
  <rect width="1360" height="600" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The same distribution, three temperatures</text>
  <rect x="70" y="140" width="380" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="260" y="120" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Low temperature (below 1)</text><rect x="93" y="191.5" width="44" height="218.5" fill="#5598e7" rx="2"/><rect x="151" y="375.5" width="44" height="34.5" fill="#5598e7" rx="2"/><rect x="209" y="391.6" width="44" height="18.400000000000002" fill="#5598e7" rx="2"/><rect x="267" y="400.8" width="44" height="9.200000000000001" fill="#5598e7" rx="2"/><rect x="325" y="405.4" width="44" height="4.6000000000000005" fill="#5598e7" rx="2"/><rect x="383" y="407.7" width="44" height="2.3000000000000003" fill="#5598e7" rx="2"/><line x1="90" y1="410" x2="430" y2="410" stroke="#898781" stroke-width="1.5"/><text x="260" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">sharper: concentrates on the</text><text x="260" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">top token(s)</text><rect x="490" y="140" width="380" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="120" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">Temperature = 1 (unscaled)</text><rect x="513" y="313.4" width="44" height="96.6" fill="#5598e7" rx="2"/><rect x="571" y="345.6" width="44" height="64.4" fill="#5598e7" rx="2"/><rect x="629" y="377.8" width="44" height="32.2" fill="#5598e7" rx="2"/><rect x="687" y="391.6" width="44" height="18.400000000000002" fill="#5598e7" rx="2"/><rect x="745" y="398.5" width="44" height="11.5" fill="#5598e7" rx="2"/><rect x="803" y="403.1" width="44" height="6.8999999999999995" fill="#5598e7" rx="2"/><line x1="510" y1="410" x2="850" y2="410" stroke="#898781" stroke-width="1.5"/><text x="680" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">the model's original</text><text x="680" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">distribution</text><rect x="910" y="140" width="380" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1100" y="120" text-anchor="middle" font-size="14.5" font-weight="700" fill="#184f95">High temperature (above 1)</text><rect x="933" y="359.4" width="44" height="50.6" fill="#5598e7" rx="2"/><rect x="991" y="364" width="44" height="46" fill="#5598e7" rx="2"/><rect x="1049" y="368.6" width="44" height="41.4" fill="#5598e7" rx="2"/><rect x="1107" y="375.5" width="44" height="34.5" fill="#5598e7" rx="2"/><rect x="1165" y="380.1" width="44" height="29.900000000000002" fill="#5598e7" rx="2"/><rect x="1223" y="382.4" width="44" height="27.599999999999998" fill="#5598e7" rx="2"/><line x1="930" y1="410" x2="1270" y2="410" stroke="#898781" stroke-width="1.5"/><text x="1100" y="470" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">flatter: low-probability</text><text x="1100" y="488" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">tokens more likely</text><rect x="60" y="530" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="553.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Temperature scales the logits before the softmax; it does not change which token is most probable,</text><text x="680" y="571.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">only how concentrated or spread out the resulting probabilities are.</text>
</svg>