<svg width="1500" height="800" viewBox="0 0 1500 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-6-decision-flow desc-4-6-decision-flow">
  <title id="title-4-6-decision-flow">Choosing a hallucination detection or mitigation approach</title>
  <desc id="desc-4-6-decision-flow">A decision-flow diagram branching from hallucination risk into whether an external source exists, whether multiple sampled generations are affordable, whether the answer depends on a rare fact, and whether evaluation scoring penalizes abstention.</desc>
  <defs></defs>
  <rect width="1500" height="800" fill="#fcfcfb"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing a hallucination detection or mitigation approach</text>
  <defs><marker id="arrow-4-6-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="580" y="60" width="340" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="750" y="99.66666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Hallucination risk in an LLM app</text><rect x="200" y="210" width="300" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="350" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Is there an external source</text><text x="350" y="269" text-anchor="middle" font-size="12" fill="#52514e">to ground the answer in?</text><rect x="600" y="210" width="300" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="750" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Can the app afford</text><text x="750" y="269" text-anchor="middle" font-size="12" fill="#52514e">multiple sampled generations?</text><rect x="1000" y="210" width="300" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1150" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does the answer depend on</text><text x="1150" y="269" text-anchor="middle" font-size="12" fill="#52514e">a rare, long-tail fact?</text><rect x="220" y="380" width="260" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="350" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Use retrieval-augmented</text><text x="350" y="434" text-anchor="middle" font-size="12" fill="#52514e">generation (Phase 6)</text><rect x="490" y="380" width="240" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="610" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Apply SelfCheckGPT or</text><text x="610" y="434" text-anchor="middle" font-size="12" fill="#52514e">semantic entropy</text><rect x="770" y="380" width="240" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="890" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Apply Chain-of-Verification</text><text x="890" y="434" text-anchor="middle" font-size="12" fill="#52514e">before returning the answer</text><rect x="1020" y="380" width="260" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1150" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Expect a nonzero baseline</text><text x="1150" y="434" text-anchor="middle" font-size="12" fill="#52514e">hallucination rate regardless</text><rect x="530" y="560" width="440" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="750" y="601" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does scoring penalize abstention</text><text x="750" y="619" text-anchor="middle" font-size="12" fill="#52514e">as harshly as a wrong answer?</text><rect x="570" y="690" width="360" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="750" y="721" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Revise scoring to reward</text><text x="750" y="739" text-anchor="middle" font-size="12" fill="#52514e">calibrated "I don't know" answers</text><line x1="662.5" y1="130.0" x2="462.5" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="750.0" y1="130.0" x2="750.0" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="837.5" y1="130.0" x2="1037.5" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="350.0" y1="300.0" x2="350.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="711.8" y1="300.0" x2="643.9" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="788.2" y1="300.0" x2="856.1" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="1150.0" y1="300.0" x2="1150.0" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><line x1="750.0" y1="130.0" x2="750.0" y2="560.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-4-6-decision)"/><line x1="750.0" y1="650.0" x2="750.0" y2="690.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-decision)"/><text x="350" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">Yes</text><text x="580" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">Can sample</text><text x="920" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">Single-pass only</text><text x="1150" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">Yes</text>
</svg>