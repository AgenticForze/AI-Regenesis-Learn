<svg width="1300" height="520" viewBox="0 0 1300 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-fb desc-fb">
  <title id="title-fb">Forward pass computes a prediction and loss; the backward pass computes a gradient for every weight</title>
  <desc id="desc-fb">A row of four boxes, input, hidden layer 1, hidden layer 2, and output, connected by blue arrows pointing right showing the forward pass producing a loss value. Below, red arrows pointing left show the backward pass carrying a gradient from the loss back through each layer to the input, and an optimizer box at the bottom uses every gradient to update the weights, which feed back into the next forward pass.</desc>
  <rect width="1300" height="520" fill="#fcfcfb"/>
  <text x="650" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">One training step: forward, then backward, then update</text>

  <defs>
    <marker id="arrFB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2a78d6"/>
    </marker>
    <marker id="arrBK" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a33a2f"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="60" y="110" width="200" height="90" rx="10" fill="#86b6ef"/>
  <text x="160" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Input</text>
  <text x="160" y="165" text-anchor="middle" font-size="10" fill="#184f95">feature vector</text>

  <rect x="330" y="110" width="200" height="90" rx="10" fill="#5598e7"/>
  <text x="430" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Hidden 1</text>
  <text x="430" y="165" text-anchor="middle" font-size="10" fill="#eaf2fc">z = Wx+b, ReLU</text>

  <rect x="600" y="110" width="200" height="90" rx="10" fill="#2a78d6"/>
  <text x="700" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Hidden 2</text>
  <text x="700" y="165" text-anchor="middle" font-size="10" fill="#cde2fb">z = Wh+b, ReLU</text>

  <rect x="870" y="110" width="200" height="90" rx="10" fill="#184f95"/>
  <text x="970" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Output</text>
  <text x="970" y="165" text-anchor="middle" font-size="10" fill="#9fb8d6">prediction</text>

  <rect x="1140" y="110" width="130" height="90" rx="10" fill="#0d2c4e"/>
  <text x="1205" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Loss</text>
  <text x="1205" y="170" text-anchor="middle" font-size="10" fill="#9fb8d6">L(&#375;, y)</text>

  <!-- forward arrows (top) -->
  <text x="680" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#2a78d6">FORWARD PASS (2.1)</text>
  <line x1="260" y1="135" x2="325" y2="135" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrFB)"/>
  <line x1="530" y1="135" x2="595" y2="135" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrFB)"/>
  <line x1="800" y1="135" x2="865" y2="135" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrFB)"/>
  <line x1="1070" y1="135" x2="1135" y2="135" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrFB)"/>

  <!-- backward arrows (bottom) -->
  <text x="680" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">BACKWARD PASS: chain rule, right to left</text>
  <line x1="1135" y1="225" x2="1075" y2="225" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrBK)"/>
  <line x1="865" y1="225" x2="805" y2="225" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrBK)"/>
  <line x1="595" y1="225" x2="535" y2="225" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrBK)"/>
  <line x1="325" y1="225" x2="265" y2="225" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrBK)"/>
  <text x="970" y="215" text-anchor="middle" font-size="9.5" fill="#a33a2f">&#8706;L/&#8706;w</text>
  <text x="700" y="215" text-anchor="middle" font-size="9.5" fill="#a33a2f">&#8706;L/&#8706;w</text>
  <text x="430" y="215" text-anchor="middle" font-size="9.5" fill="#a33a2f">&#8706;L/&#8706;w</text>

  <rect x="330" y="320" width="540" height="80" rx="10" fill="#0d2c4e"/>
  <text x="600" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Optimizer (SGD, Momentum, or Adam)</text>
  <text x="600" y="374" text-anchor="middle" font-size="10.5" fill="#9fb8d6">turns every weight's gradient into an actual update</text>

  <line x1="430" y1="260" x2="430" y2="315" stroke="#a33a2f" stroke-width="1.5" marker-end="url(#arrBK)"/>
  <line x1="700" y1="260" x2="600" y2="315" stroke="#a33a2f" stroke-width="1.5" marker-end="url(#arrBK)"/>
  <line x1="970" y1="260" x2="770" y2="315" stroke="#a33a2f" stroke-width="1.5" marker-end="url(#arrBK)"/>

  <path d="M 330 355 C 150 420, 150 250, 155 205" fill="none" stroke="#184f95" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrFB)"/>
  <text x="130" y="450" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">updated</text>
  <text x="130" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#184f95">weights</text>
  <text x="130" y="482" text-anchor="middle" font-size="10" fill="#184f95">next step's forward pass</text>
</svg>
