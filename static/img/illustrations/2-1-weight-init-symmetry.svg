<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-wi desc-wi">
  <title id="title-wi">Identical weight initialization keeps hidden units identical forever; random initialization lets them specialize</title>
  <desc id="desc-wi">Left: three hidden units all initialized to the same weight compute the same output and receive the same gradient update every training step, so they remain identical indefinitely, a failure called the symmetry problem. Right: three hidden units initialized to small random weights compute different outputs, receive different gradients, and specialize to different patterns over training.</desc>
  <rect width="1200" height="560" fill="#fcfcfb"/>
  <text x="600" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Why weights start small and random, not identical</text>

  <!-- LEFT: identical init -->
  <text x="60" y="80" font-size="14" font-weight="700" fill="#a33a2f">ALL WEIGHTS = 0.5 (broken)</text>
  <rect x="40" y="100" width="540" height="380" rx="10" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/>

  <circle cx="110" cy="180" r="18" fill="#86b6ef"/>
  <text x="110" y="185" text-anchor="middle" font-size="10" font-weight="700">x</text>

  <g font-size="10.5" font-weight="700" fill="#ffffff">
    <rect x="220" y="140" width="140" height="55" rx="8" fill="#a33a2f"/>
    <text x="290" y="163" text-anchor="middle">h1: w=0.5</text>
    <text x="290" y="180" text-anchor="middle">out = 0.62</text>
    <rect x="220" y="207" width="140" height="55" rx="8" fill="#a33a2f"/>
    <text x="290" y="230" text-anchor="middle">h2: w=0.5</text>
    <text x="290" y="247" text-anchor="middle">out = 0.62</text>
    <rect x="220" y="274" width="140" height="55" rx="8" fill="#a33a2f"/>
    <text x="290" y="297" text-anchor="middle">h3: w=0.5</text>
    <text x="290" y="314" text-anchor="middle">out = 0.62</text>
  </g>
  <line x1="128" y1="180" x2="215" y2="167" stroke="#898781" stroke-width="1.3"/>
  <line x1="128" y1="180" x2="215" y2="234" stroke="#898781" stroke-width="1.3"/>
  <line x1="128" y1="180" x2="215" y2="301" stroke="#898781" stroke-width="1.3"/>

  <rect x="410" y="207" width="140" height="55" rx="8" fill="#0d2c4e"/>
  <text x="480" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">identical</text>
  <text x="480" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">gradient &#8594; each</text>
  <line x1="360" y1="167" x2="405" y2="220" stroke="#a33a2f" stroke-width="1.3"/>
  <line x1="360" y1="234" x2="405" y2="234" stroke="#a33a2f" stroke-width="1.3"/>
  <line x1="360" y1="301" x2="405" y2="248" stroke="#a33a2f" stroke-width="1.3"/>

  <rect x="70" y="400" width="480" height="60" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/>
  <text x="310" y="425" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">Every training step updates h1, h2, h3 identically</text>
  <text x="310" y="443" text-anchor="middle" font-size="11" fill="#a33a2f">they never differentiate, wasting 2 of the 3 units forever</text>

  <!-- RIGHT: random init -->
  <text x="640" y="80" font-size="14" font-weight="700" fill="#184f95">SMALL RANDOM WEIGHTS (works)</text>
  <rect x="620" y="100" width="540" height="380" rx="10" fill="#eaf2fc" stroke="#184f95" stroke-width="1.5"/>

  <circle cx="690" cy="180" r="18" fill="#86b6ef"/>
  <text x="690" y="185" text-anchor="middle" font-size="10" font-weight="700">x</text>

  <g font-size="10.5" font-weight="700" fill="#ffffff">
    <rect x="800" y="140" width="140" height="55" rx="8" fill="#2a78d6"/>
    <text x="870" y="163" text-anchor="middle">h1: w=0.31</text>
    <text x="870" y="180" text-anchor="middle">out = 0.58</text>
    <rect x="800" y="207" width="140" height="55" rx="8" fill="#5598e7"/>
    <text x="870" y="230" text-anchor="middle">h2: w=-0.18</text>
    <text x="870" y="247" text-anchor="middle">out = 0.45</text>
    <rect x="800" y="274" width="140" height="55" rx="8" fill="#184f95"/>
    <text x="870" y="297" text-anchor="middle">h3: w=0.09</text>
    <text x="870" y="314" text-anchor="middle">out = 0.52</text>
  </g>
  <line x1="708" y1="180" x2="795" y2="167" stroke="#898781" stroke-width="1.3"/>
  <line x1="708" y1="180" x2="795" y2="234" stroke="#898781" stroke-width="1.3"/>
  <line x1="708" y1="180" x2="795" y2="301" stroke="#898781" stroke-width="1.3"/>

  <rect x="990" y="207" width="140" height="55" rx="8" fill="#0d2c4e"/>
  <text x="1060" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">distinct</text>
  <text x="1060" y="253" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">gradient &#8594; each</text>
  <line x1="940" y1="167" x2="985" y2="220" stroke="#184f95" stroke-width="1.3"/>
  <line x1="940" y1="234" x2="985" y2="234" stroke="#184f95" stroke-width="1.3"/>
  <line x1="940" y1="301" x2="985" y2="248" stroke="#184f95" stroke-width="1.3"/>

  <rect x="650" y="400" width="480" height="60" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/>
  <text x="890" y="425" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">Different starting weights produce different gradients</text>
  <text x="890" y="443" text-anchor="middle" font-size="11" fill="#184f95">each unit specializes to a different pattern over training</text>
</svg>
