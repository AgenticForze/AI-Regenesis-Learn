<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-spwhitespace desc-spwhitespace">
  <title id="title-spwhitespace">SentencePiece treats whitespace as an ordinary symbol instead of a pre-split boundary</title>
  <desc id="desc-spwhitespace">BPE and WordPiece typically pre-split input on whitespace before segmenting each chunk, discarding the space itself. SentencePiece instead replaces each space with a reserved meta-symbol and segments the entire string as one stream, keeping tokenization fully reversible and language-independent.</desc>
  <defs><marker id="arr35b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two different treatments of the same input string</text>
  <rect x="520" y="40" width="320" height="60" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.5"/><text x="680" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#0d2c4e" font-family="monospace">"Hello world"</text><text x="290" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">BPE / WordPiece</text><line x1="580" y1="100" x2="290" y2="190" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35b)"/><rect x="140" y="210" width="130" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><rect x="300" y="210" width="130" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="205" y="245" text-anchor="middle" font-size="14" font-family="monospace" fill="#0b0b0b">"Hello"</text><text x="365" y="245" text-anchor="middle" font-size="14" font-family="monospace" fill="#0b0b0b">"world"</text><text x="290" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">split on whitespace first,</text><text x="290" y="326.2" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">space itself is discarded</text><line x1="290" y1="340" x2="290" y2="390" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35b)"/><rect x="140" y="400" width="300" height="60" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="290" y="435" text-anchor="middle" font-size="13" font-family="monospace" fill="#0d2c4e">Hel|lo   wor|ld</text><text x="1050" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">SentencePiece</text><line x1="780" y1="100" x2="1050" y2="190" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35b)"/><rect x="880" y="210" width="340" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="245" text-anchor="middle" font-size="14" font-family="monospace" fill="#0b0b0b">"Hello▁world"</text><text x="1050" y="310" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">space replaced by ▁,</text><text x="1050" y="326.2" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">kept as one symbol stream</text><line x1="1050" y1="340" x2="1050" y2="390" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr35b)"/><rect x="880" y="400" width="340" height="60" rx="8" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="1050" y="435" text-anchor="middle" font-size="13" font-family="monospace" fill="#0d2c4e">Hel|lo|▁world</text><rect x="60" y="480" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="503.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The space between the two words survives as an ordinary token on the right, so the exact original</text><text x="680" y="521.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">spacing can be reconstructed from the tokens alone.</text>
</svg>