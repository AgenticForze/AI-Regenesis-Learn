<svg width="1500" height="940" viewBox="0 0 1500 940" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-6-refarch desc-6-6-refarch">
  <title id="title-6-6-refarch">One graph, three ways to consume it</title>
  <desc id="desc-6-6-refarch">A two-column diagram: the left column builds a knowledge graph from raw documents through text splitting, schema-guided LLM extraction, and entity resolution; the right column shows three ways to use the finished graph in response to a user question, knowledge graph embeddings for link prediction, Text2Cypher for a direct live query, or GraphRAG-style community search from Chapter 6.5, all converging on a grounded, cited answer.</desc>
  <rect width="1500" height="940" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">One graph, three ways to consume it</text>
  <defs><marker id="arrow-6-6-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-6-6-refarch-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="277.25" y="80" width="65.5" height="26" rx="13" fill="#1f3a5f" /><text x="310" y="97.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">BUILD</text><rect x="969.75" y="80" width="80.5" height="26" rx="13" fill="#4a8f7b" /><text x="1010" y="97.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">CONSUME</text><rect x="100" y="130" width="420" height="68" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="310" y="166.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Raw documents</text><rect x="100" y="224" width="420" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="310" y="260.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Text splitting</text><line x1="310" y1="198" x2="310" y2="224" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-refarch-main)"/><rect x="100" y="318" width="420" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="310" y="354.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Schema-guided LLM extraction</text><line x1="310" y1="292" x2="310" y2="318" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-refarch-main)"/><rect x="100" y="412" width="420" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="310" y="448.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Entity resolution</text><line x1="310" y1="386" x2="310" y2="412" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-refarch-main)"/><rect x="100" y="506" width="420" height="68" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="310" y="536.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Knowledge graph</text><text x="310" y="558.9" text-anchor="middle" font-size="10.5" fill="#6b7280">property graph or RDF</text><line x1="310" y1="480" x2="310" y2="506" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-refarch-main)"/><rect x="800" y="130" width="420" height="68" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1010" y="166.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">User question</text><rect x="800" y="224" width="420" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="252.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">KG embeddings: link</text><text x="1010" y="267.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">prediction</text><rect x="800" y="318" width="420" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="346.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Text2Cypher: LLM generates a</text><text x="1010" y="361.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">query</text><rect x="800" y="412" width="420" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1010" y="440.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">GraphRAG community search</text><text x="1010" y="455.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">(Ch. 6.5)</text><path d="M 520 540 L 560 540 L 560 258 L 800 258" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-6-refarch-cross)"/><path d="M 520 540 L 560 540 L 560 352 L 800 352" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-6-refarch-cross)"/><path d="M 52