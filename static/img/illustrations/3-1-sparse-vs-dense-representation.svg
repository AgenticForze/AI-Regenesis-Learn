<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-sparse-dense desc-sparse-dense">
  <title id="title-sparse-dense">A sparse one-hot vector only identifies a token; a dense embedding also encodes its relationships to other tokens</title>
  <desc id="desc-sparse-dense">Side by side comparison of a one-hot vector, mostly zeros with a single one, against a dense embedding vector where every dimension holds a learned real number.</desc>
  <defs></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Sparse identity versus dense meaning</text>
  <text x="368" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">One-hot vector (sparse)</text><rect x="130" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="145.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="164" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="179.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="198" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="213.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="232" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="247.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="266" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="281.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="300" y="190" width="31" height="34" fill="#184f95" stroke="#898781" stroke-width="1"/><text x="315.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text><rect x="334" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="349.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="368" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="383.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="402" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="417.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="436" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="451.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="470" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="485.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="504" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="519.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="538" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="553.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><rect x="572" y="190" width="31" height="34" fill="#ffffff" stroke="#898781" stroke-width="1"/><text x="587.5" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#898781">0</text><text x="368" y="258" text-anchor="middle" font-size="12.5" fill="#52514e">dimensionality = vocabulary size (often 30,000+); 13 zeros for every 1</text><text x="1020" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Dense embedding (learned)</text><rect x="780" y="190" width="57" height="34" fill="rgb(45,95,159)" stroke="#898781" stroke-width="1"/><text x="808.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">0.82</text><rect x="840" y="190" width="57" height="34" fill="rgb(123,155,195)" stroke="#898781" stroke-width="1"/><text x="868.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">0.14</text><rect x="900" y="190" width="57" height="34" fill="rgb(203,215,231)" stroke="#898781" stroke-width="1"/><text x="928.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">-0.55</text><rect x="960" y="190" width="57" height="34" fill="rgb(104,140,186)" stroke="#898781" stroke-width="1"/><text x="988.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">0.31</text><rect x="1020" y="190" width="57" height="34" fill="rgb(51,99,161)" stroke="#898781" stroke-width="1"/><text x="1048.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">0.77</text><rect x="1080" y="190" width="57" height="34" fill="rgb(165,186,214)" stroke="#898781" stroke-width="1"/><text x="1108.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">-0.22</text><rect x="1140" y="190" width="57" height="34" fill="rgb(129,159,197)" stroke="#898781" stroke-width="1"/><text x="1168.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">0.09</text><rect x="1200" y="190" width="57" height="34" fill="rgb(218,227,238)" stroke="#898781" stroke-width="1"/><text x="1228.5" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">-0.68</text><text x="1020" y="258" text-anchor="middle" font-size="12.5" fill="#52514e">dimensionality is chosen (commonly 128-4096); every entry usually nonzero</text><rect x="90" y="310" width="1120" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="338.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The one-hot vector only records which token this is. The dense vector's specific values are learned</text><text x="650" y="356.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">so that vectors for tokens used in similar contexts end up close together.</text>
</svg>