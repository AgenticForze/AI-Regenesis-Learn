<svg width="1560" height="760" viewBox="0 0 1560 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-9-overview desc-6-9-overview">
  <title id="title-6-9-overview">The full RAG blueprint: four systems, four clocks</title>
  <desc id="desc-6-9-overview">A diagram showing a RAG system blueprint as four connected parts: an ingestion pipeline running on its own schedule, a query pipeline running per request, an observability layer watching both continuously, and a governance and feedback loop that reviews for drift and routes corrections back into the ingestion pipeline, forming a loop.</desc>
  <rect width="1560" height="760" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The full RAG blueprint: four systems, four clocks</text>
  <defs><marker id="arrow-6-9-overview-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="680" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="600" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="580" y="176.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Ingestion pipeline</text><text x="580" y="201.04999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">runs on its own schedule: parse, chunk, embed, index</text><rect x="920" y="130" width="600" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1220" y="176.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Query pipeline</text><text x="1220" y="201.04999999999998" text-anchor="middle" font-size="10.5" fill="#6b7280">runs per request: retrieve, rerank, cache, generate</text><line x1="880" y1="180" x2="920" y2="180" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4"/><rect x="20" y="160" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">SYSTEMS</text><rect x="280" y="300" width="1240" height="80" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="900" y="336.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Observability layer</text><text x="900" y="360.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">watches both pipelines continuously in production</text><line x1="580" y1="230" x2="580" y2="300" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-overview-main)"/><line x1="1220" y1="230" x2="1220" y2="300" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-overview-main)"/><rect x="20" y="320" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="345" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">WATCH</text><rect x="280" y="450" width="1240" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="900" y="486.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Governance and feedback loop</text><text x="900" y="510.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">access controls, lineage, drift review, routes corrections back to ingestion</text><line x1="900" y1="380" x2="900" y2="450" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-9-overview-main)"/><path d="M 320 530 C 200 570, 200 100, 580 130" fill="none" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-9-overview-main)"/><rect x="20" y="470" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="495" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">GOVERN</text>
</svg>