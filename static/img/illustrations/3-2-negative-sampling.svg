<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-negsample desc-negsample">
  <title id="title-negsample">Negative sampling replaces an expensive full-vocabulary softmax with cheap binary classification</title>
  <desc id="desc-negsample">Side by side: a full softmax normalizing scores across the entire vocabulary versus negative sampling, which only scores the true context word against a handful of randomly sampled negative words.</desc>
  <defs></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Making the training objective computationally tractable</text>
  <rect x="90" y="140" width="520" height="340" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="350" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Full softmax</text><text x="350" y="197" text-anchor="middle" font-size="12" fill="#52514e">normalize over the entire vocabulary</text><rect x="130" y="220" width="34.183828625968424" height="16" fill="#86b6ef" /><rect x="130" y="244" width="47.64008588070955" height="16" fill="#86b6ef" /><rect x="130" y="268" width="40.92814531812057" height="16" fill="#86b6ef" /><rect x="130" y="292" width="410" height="16" fill="#184f95" /><rect x="130" y="316" width="53.3457543273276" height="16" fill="#86b6ef" /><rect x="130" y="340" width="67.35987297347708" height="16" fill="#86b6ef" /><rect x="130" y="364" width="35.56566180454843" height="16" fill="#86b6ef" /><rect x="130" y="388" width="85.07010257380736" height="16" fill="#86b6ef" /><rect x="130" y="412" width="30.24595488613518" height="16" fill="#86b6ef" /><rect x="130" y="436" width="70.60217339860611" height="16" fill="#86b6ef" /><text x="350" y="470" text-anchor="middle" font-size="12" fill="#a33a2f">expensive: recomputed over 30,000+ words, every step</text><rect x="690" y="140" width="520" height="340" rx="8" fill="#ffffff" stroke="#104281" stroke-width="2"/><text x="950" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Negative sampling</text><text x="950" y="197" text-anchor="middle" font-size="12" fill="#52514e">binary classification vs. a few sampled words</text><rect x="730" y="230" width="200" height="50" rx="8" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="830" y="259.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">true pair: score high</text><rect x="730" y="300" width="200" height="34" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="830" y="320.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">"spreadsheet": score low</text><rect x="730" y="342" width="200" height="34" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="830" y="362.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">"guitar": score low</text><rect x="730" y="384" width="200" height="34" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="830" y="404.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">"weather": score low</text><rect x="730" y="426" width="200" height="34" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="830" y="446.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">"sock": score low</text><text x="950" y="470" text-anchor="middle" font-size="12" fill="#184f95">cheap: only a handful of comparisons per step</text><rect x="90" y="500" width="1120" height="45" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="516.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Same training goal, far less computation per step: this is what makes training embeddings on</text><text x="650" y="533.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">large vocabularies practical.</text>
</svg>