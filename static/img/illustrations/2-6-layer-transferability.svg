<svg width="1100" height="580" viewBox="0 0 1100 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-lt desc-lt">
  <title id="title-lt">Feature transferability decreases as layer depth increases</title>
  <desc id="desc-lt">A bar chart with six layers from earliest (layer 1) to latest (layer 6), showing how well features transfer to a related target task versus a very different target task. Transferability is high for early layers under both conditions and drops off for later layers, with the drop much steeper for a very different target task.</desc>
  <rect width="1100" height="580" fill="#fcfcfb"/><text x="550" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Feature transferability drops off in later layers</text><rect x="100" y="70" width="900" height="380" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><line x1="100" y1="410" x2="1000" y2="410" stroke="#898781" stroke-width="1.2"/><text x="80" y="95" text-anchor="end" font-size="10" fill="#898781">high</text><text x="80" y="410" text-anchor="end" font-size="10" fill="#898781">low</text><text x="550" y="440" text-anchor="middle" font-size="12" fill="#52514e">layer (1 = earliest / most general, 6 = latest / most task-specific)</text><rect x="150" y="40" width="50" height="370" fill="#2a78d6"/><rect x="205" y="55" width="50" height="355" fill="#a33a2f"/><text x="202" y="428" text-anchor="middle" font-size="11" fill="#52514e">1</text><rect x="290" y="50" width="50" height="360" fill="#2a78d6"/><rect x="345" y="90" width="50" height="320" fill="#a33a2f"/><text x="342" y="428" text-anchor="middle" font-size="11" fill="#52514e">2</text><rect x="430" y="80" width="50" height="330" fill="#2a78d6"/><rect x="485" y="160" width="50" height="250" fill="#a33a2f"/><text x="482" y="428" text-anchor="middle" font-size="11" fill="#52514e">3</text><rect x="570" y="130" width="50" height="280" fill="#2a78d6"/><rect x="625" y="250" width="50" height="160" fill="#a33a2f"/><text x="622" y="428" text-anchor="middle" font-size="11" fill="#52514e">4</text><rect x="710" y="190" width="50" height="220" fill="#2a78d6"/><rect x="765" y="320" width="50" height="90" fill="#a33a2f"/><text x="762" y="428" text-anchor="middle" font-size="11" fill="#52514e">5</text><rect x="850" y="240" width="50" height="170" fill="#2a78d6"/><rect x="905" y="370" width="50" height="40" fill="#a33a2f"/><text x="902" y="428" text-anchor="middle" font-size="11" fill="#52514e">6</text><rect x="700" y="90" width="16" height="16" fill="#2a78d6"/><text x="722" y="103" font-size="12" fill="#0b0b0b">Related target task</text><rect x="700" y="112" width="16" height="16" fill="#a33a2f"/><text x="722" y="125" font-size="12" fill="#0b0b0b">Very different target task</text><rect x="100" y="475" width="900" height="65" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="550" y="500" text-anchor="middle" font-size="12.5" fill="#52514e">Early layers transfer well even to dissimilar tasks; later layers transfer well only to related tasks</text><text x="550" y="519" text-anchor="middle" font-size="12.5" fill="#52514e">This is why fine-tuning often starts by unfreezing only the later layers</text></svg>