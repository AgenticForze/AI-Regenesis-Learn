<svg width="1560" height="980" viewBox="0 0 1560 980" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-10 desc-8-10"><title id="title-8-10">Every Prior Chapter Is One Layer of This Blueprint</title><desc id="desc-8-10">A vertical stack of six layers represents one single agent's architecture, read top to bottom in the order a request actually flows through them. The UX and interaction layer from Chapter 8.9 shows status and gates confirmation. Guardrails validate inputs and outputs against policy. The planning strategy layer from Chapter 8.7 decides what happens next. Memory and context engineering from Chapters 8.5 and 8.6 determine what persists and what is assembled into context this turn. Tool use from Chapter 8.4 executes the chosen action against the real world. At the bottom, the augmented LLM core from Chapter 8.2, the model plus its instructions, is the one reasoning primitive every other layer extends. A looping arrow beside the stack states that the agent loop from Chapter 8.3 cycles through all six layers once per step, not once per entire task.</desc><rect width="1560" height="980" fill="#fbfaf7"/><text x="780" y="46" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2d3d">Every Prior Chapter Is One Layer of This Blueprint</text><rect x="160" y="100" width="900" height="110" rx="12" fill="#f5dde8" stroke="#c96fa8" stroke-width="2"/><text x="194" y="142" text-anchor="start" font-size="18" font-weight="700" fill="#1f2d3d">UX and Interaction Layer</text><text x="194" y="170" text-anchor="start" font-size="13.5" fill="#374151">Status updates, confirmation gate (Ch. 8.9)</text><line x1="610.0" y1="212" x2="610.0" y2="222" stroke="#9aa0a6" stroke-width="2"/><polygon points="605.0,222 615.0,222 610.0,229" fill="#9aa0a6"/><rect x="160" y="224" width="900" height="110" rx="12" fill="#ede4d3" stroke="#b7a37e" stroke-width="2"/><text x="194" y="266" text-anchor="start" font-size="18" font-weight="700" fill="#1f2d3d">Guardrails</text><text x="194" y="294" text-anchor="start" font-size="13.5" fill="#374151">Input/output validation against policy (new this chapter)</text><line x1="610.0" y1="336" x2="610.0" y2="346" stroke="#9aa0a6" stroke-width="2"/><polygon points="605.0,346 615.0,346 610.0,353" fill="#9aa0a6"/><rect x="160" y="348" width="900" height="110" rx="12" fill="#dcf0e4" stroke="#5fae83" stroke-width="2"/><text x="194" y="390" text-anchor="start" font-size="18" font-weight="700" fill="#1f2d3d">Planning Strategy</text><text x="194" y="418" text-anchor="start" font-size="13.5" fill="#374151">Decides the next action: reactive, deliberative, or branching (Ch. 8.7)</text><line x1="610.0" y1="460" x2="610.0" y2="470" stroke="#9aa0a6" stroke-width="2"/><polygon points="605.0,470 615.0,470 610.0,477" fill="#9aa0a6"/><rect x="160" y="472" width="900" height="110" rx="12" fill="#f5e9db" stroke="#c9975b" stroke-width="2"/><text x="194" y="514" text-anchor="start" font-size="18" font-weight="700" fill="#1f2d3d">Memory and Context Engineering</text><text x="194" y="542" text-anchor="start" font-size="13.5" fill="#374151">What persists; what's assembled into context this turn (Ch. 8.5, 8.6)</text><line x1="610.0" y1="584" x2="610.0" y2="594" stroke="#9aa0a6" stroke-width="2"/><polygon points="605.0,594 615.0,594 610.0,601" fill="#9aa0a6"/><rect x="160" y="596" width="900" height="110" rx="12" fill="#fff6df" stroke="#c9975b" stroke-width="2"/><text x="194" y="638" text-anchor="start" font-size="18" font-weight="700" fill="#1f2d3d">Tool Use</text><text x="194" y="666" text-anchor="start" font-size="13.5" fill="#374151">Executes the chosen action against the real world (Ch. 8.4)</text><line x1="610.0" y1="708" x2="610.0" y2="718" stroke="#9aa0a6" stroke-width="2"/><polygon points="605.0,718 615.0,718 610.0,725" fill="#9aa0a6"/><rect x="160" y="720" width="900" height="110" rx="12" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="2"/><text x="194" y="762" text-anchor="start" font-size="18" font-weight="700" fill="#1f2d3d">Augmented LLM Core</text><text x="194" y="790" text-anchor="start" font-size="13.5" fill="#374151">Model + instructions: the one reasoning primitive every layer extends (Ch. 8.2)</text><circle cx="1200" cy="465.0" r="150" fill="none" stroke="#5b8fc9" stroke-width="3" stroke-dasharray="10,7"/><polygon points="1350,455.0 1366,465.0 1350,475.0" fill="#5b8fc9"/><text x="1200" y="451.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d">The Agent Loop</text><text x="1200" y="475.0" text-anchor="middle" font-size="13" fill="#374151">Plan, Act, Observe</text><text x="1200" y="495.0" text-anchor="middle" font-size="13" fill="#374151">(Ch. 8.3)</text><text x="1200" y="521.0" text-anchor="middle" font-size="12.5" fill="#6b7280">cycles through all six layers</text><text x="1200" y="539.0" text-anchor="middle" font-size="12.5" fill="#6b7280">once per step, not once per task</text><rect x="160" y="870" width="900" height="80" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="610.0" y="898" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">What this system is called (Ch. 8.8) depends on how the top two layers are configured,</text><text x="610.0" y="920" text-anchor="middle" font-size="12.5" fill="#1f2d3d">not on which of the six layers are present. The blueprint underneath a chatbot, a copilot,</text><text x="610.0" y="940" text-anchor="middle" font-size="12.5" fill="#1f2d3d">and an agent can be, and often is, this exact same stack.</text></svg>