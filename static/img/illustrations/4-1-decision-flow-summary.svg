<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-decisionflow41 desc-decisionflow41">
  <title id="title-decisionflow41">Choosing between a discriminative and a generative model for a task</title>
  <desc id="desc-decisionflow41">A decision flow starting from what the task needs, branching on whether a fixed label must be assigned to existing input (discriminative model) or new content must be produced matching a learned distribution (generative model), which further branches on whether a computable probability per output is required, leading to either an explicit-density model such as an autoregressive LLM or an implicit-density model such as a GAN.</desc>
  <defs><marker id="arr41b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">From task requirement to model type</text>
  <rect x="560" y="40" width="240" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="79.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">What does the task need?</text><rect x="520" y="150" width="320" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Assign a fixed label</text><text x="680" y="204" text-anchor="middle" font-size="11" fill="#52514e">to existing input?</text><line x1="680.0" y1="110.0" x2="680.0" y2="150.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41b)"/><rect x="110" y="290" width="300" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="260" y="326" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Discriminative model</text><text x="260" y="344" text-anchor="middle" font-size="11" fill="#52514e">learn P(label given input) directly</text><line x1="540" y1="230" x2="260" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41b)"/><text x="360" y="260" font-size="12.5" font-weight="700" fill="#184f95">Yes</text><rect x="560" y="290" width="320" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="720" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Produce new content</text><text x="720" y="344" text-anchor="middle" font-size="11" fill="#52514e">matching a learned distribution?</text><line x1="820" y1="230" x2="720" y2="290" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41b)"/><text x="780" y="260" font-size="12.5" font-weight="700" fill="#184f95">No</text><rect x="560" y="420" width="320" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="720" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Need a computable</text><text x="720" y="474" text-anchor="middle" font-size="11" fill="#52514e">probability per output?</text><line x1="720.0" y1="370.0" x2="720.0" y2="420.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41b)"/><rect x="940" y="300" width="320" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1100" y="341" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Explicit-density model</text><text x="1100" y="359" text-anchor="middle" font-size="11" fill="#52514e">e.g., an autoregressive LLM</text><line x1="880" y1="440" x2="940" y2="380" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41b)"/><text x="910" y="420" font-size="12.5" font-weight="700" fill="#184f95">Yes</text><rect x="940" y="420" width="320" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1100" y="461" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Implicit-density model</text><text x="1100" y="479" text-anchor="middle" font-size="11" fill="#52514e">e.g., a GAN</text><line x1="880" y1="480" x2="940" y2="450" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41b)"/><text x="910" y="510" font-size="12.5" font-weight="700" fill="#184f95">No</text><rect x="60" y="540" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="563.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Only tasks that need a fixed decision about existing input stay discriminative; everything else is</text><text x="680" y="581.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">generative, split further by whether a computable probability is required.</text>
</svg>