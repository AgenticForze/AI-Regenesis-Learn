<svg width="1560" height="640" viewBox="0 0 1560 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-6-pipeline desc-6-6-pipeline">
  <title id="title-6-6-pipeline">From raw documents to a knowledge graph</title>
  <desc id="desc-6-6-pipeline">A five-step pipeline: raw documents are split into text chunks, an LLM constrained by a fixed schema extracts entities and relationships, entity resolution merges every mention of a real-world entity into a single node, and the result is written into a knowledge graph, either a property graph or an RDF triple store.</desc>
  <rect width="1560" height="640" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">From raw documents to a knowledge graph</text>
  <defs><marker id="arrow-6-6-pipeline-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="560" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="220" width="227.2" height="100" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="393.6" y="272.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Raw documents</text><rect x="533.2" y="220" width="227.2" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="646.8000000000001" y="272.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Text splitting</text><rect x="786.4" y="220" width="227.2" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="900" y="258.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Schema-guided</text><text x="900" y="273.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">LLM extraction</text><text x="900" y="296.40000000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">entities + relationships</text><rect x="1039.6" y="220" width="227.2" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1153.1999999999998" y="258.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Entity</text><text x="1153.1999999999998" y="273.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">resolution</text><text x="1153.1999999999998" y="296.40000000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">one node per real entity</text><rect x="1292.8" y="220" width="227.2" height="100" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1406.3999999999999" y="266.1" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Knowledge graph</text><text x="1406.3999999999999" y="288.90000000000003" text-anchor="middle" font-size="10.5" fill="#6b7280">property graph or RDF</text><line x1="507.2" y1="270" x2="533.2" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-pipeline-main)"/><line x1="760.4000000000001" y1="270" x2="786.4" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-pipeline-main)"/><line x1="1013.5999999999999" y1="270" x2="1039.6" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-pipeline-main)"/><line x1="1266.8" y1="270" x2="1292.8" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-6-pipeline-main)"/><rect x="20" y="250" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="275" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">BUILD</text><rect x="280" y="390" width="1240" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="900" y="422" text-anchor="middle" font-size="12.5" fill="#6b7280">A schema of "allowed nodes and relationships" constrains extraction to a fixed vocabulary; entity resolution then merges every mention of one real entity into a single node.</text>
</svg>