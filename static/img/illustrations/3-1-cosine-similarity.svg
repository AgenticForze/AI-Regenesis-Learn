<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-cosine desc-cosine">
  <title id="title-cosine">Cosine similarity measures the angle between two embedding vectors, not their length</title>
  <desc id="desc-cosine">Two vectors from a shared origin, x for the token dog and y for the token puppy, with a small angle theta between them. A formula panel shows cosine similarity as the dot product divided by the product of both vector norms.</desc>
  <defs><marker id="arr31d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs>
  <rect width="1200" height="620" fill="#fcfcfb"/>
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Similarity as an angle, not a distance</text>
  <line x1="300" y1="460" x2="780" y2="400" stroke="#184f95" stroke-width="3" marker-end="url(#arr31d)"/><text x="795" y="400" font-size="14" font-weight="700" fill="#184f95">x (dog)</text><line x1="300" y1="460" x2="700" y2="200" stroke="#2a78d6" stroke-width="3" marker-end="url(#arr31d)"/><text x="715" y="200" font-size="14" font-weight="700" fill="#2a78d6">y (puppy)</text><path d="M 370 460 A 70 70 0 0 0 355 394" fill="none" stroke="#a33a2f" stroke-width="2"/><text x="395" y="420" font-size="14" font-weight="700" fill="#a33a2f">&#952;</text><circle cx="300" cy="460" r="4" fill="#0b0b0b"/><text x="290" y="484" text-anchor="end" font-size="11" fill="#898781">origin</text><rect x="820" y="140" width="320" height="210" rx="8" fill="#0d2c4e" stroke="#104281" stroke-width="1.5"/><text x="980" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Cosine similarity</text><text x="980" y="220" text-anchor="middle" font-size="16" fill="#cde2fb">cos(&#952;) = (x . y) / (||x|| ||y||)</text><text x="980" y="258" text-anchor="middle" font-size="12" fill="#9fb8d6">Divides out both vectors' length,</text><text x="980" y="276" text-anchor="middle" font-size="12" fill="#9fb8d6">leaving only the angle between them.</text><text x="980" y="312" text-anchor="middle" font-size="12" fill="#9fb8d6">Small &#952; (vectors point the same way)</text><text x="980" y="330" text-anchor="middle" font-size="12" fill="#9fb8d6">means high similarity.</text><rect x="90" y="530" width="700" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="440" y="550" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Raw dot product x . y also grows with each vector's magnitude,</text><text x="440" y="567.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">which tends to track token frequency, not meaning; cosine</text><text x="440" y="585" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">similarity isolates direction alone.</text>
</svg>