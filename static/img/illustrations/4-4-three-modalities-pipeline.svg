<svg width="1360" height="700" viewBox="0 0 1360 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-threemodalities desc-threemodalities">
  <title id="title-threemodalities">The same text prompt feeds three structurally different generation pipelines</title>
  <desc id="desc-threemodalities">One text prompt branches into three pipelines: text-to-image using diffusion with cross-attention to a text embedding producing a still image, text-to-video using diffusion over spacetime patches producing a short video, and text-to-speech using an autoregressive model over audio tokens producing speech audio.</desc>
  <defs><marker id="arr44a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="700" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">One prompt, three generation mechanisms</text>
  <rect x="580" y="40" width="200" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Text prompt</text><line x1="680" y1="110" x2="240" y2="190" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44a)"/><line x1="680" y1="110" x2="680" y2="190" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44a)"/><line x1="680" y1="110" x2="1120" y2="190" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44a)"/><rect x="50" y="190" width="380" height="130" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="240" y="222" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">Text-to-image</text><text x="240" y="260" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">Diffusion + cross-attention to</text><text x="240" y="279" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">text embedding</text><rect x="50" y="380" width="380" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="240" y="419.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Still image</text><line x1="240.0" y1="320.0" x2="240.0" y2="380.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44a)"/><rect x="490" y="190" width="380" height="130" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="222" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">Text-to-video</text><text x="680" y="260" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">Diffusion over spacetime patches</text><rect x="490" y="380" width="380" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="419.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Short video</text><line x1="680.0" y1="320.0" x2="680.0" y2="380.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44a)"/><rect x="930" y="190" width="380" height="130" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1120" y="222" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">Text-to-speech</text><text x="1120" y="260" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">Autoregressive model over audio</text><text x="1120" y="279" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">tokens</text><rect x="930" y="380" width="380" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1120" y="419.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Speech audio</text><line x1="1120.0" y1="320.0" x2="1120.0" y2="380.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44a)"/><rect x="60" y="520" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="550" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The same text prompt feeds three structurally different generation pipelines: two share a diffusion</text><text x="680" y="567.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">mechanism (extended across time for video), while speech borrows the autoregressive, token-based</text><text x="680" y="585" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">mechanism from text generation instead.</text>
</svg>