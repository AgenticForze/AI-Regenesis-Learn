<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-gqa desc-gqa">
  <title id="title-gqa">Grouped-query attention shrinks the KV cache by sharing key/value groups across heads</title>
  <desc id="desc-gqa">Two panels. The left panel shows standard multi-head attention where every one of four heads stores its own separate keys and values, multiplying KV cache size by the number of heads. The right panel shows grouped-query attention where the same four query heads instead share one common key/value group, directly shrinking the KV cache.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Fewer stored keys and values, per token</text>
  <rect x="80" y="130" width="560" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">Standard multi-head attention</text><rect x="120" y="180" width="100" height="60" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="170" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 1</text><text x="170" y="225" text-anchor="middle" font-size="11" fill="#52514e">own K/V</text><rect x="240" y="180" width="100" height="60" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="290" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 2</text><text x="290" y="225" text-anchor="middle" font-size="11" fill="#52514e">own K/V</text><rect x="360" y="180" width="100" height="60" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="410" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 3</text><text x="410" y="225" text-anchor="middle" font-size="11" fill="#52514e">own K/V</text><rect x="480" y="180" width="100" height="60" rx="4" fill="#cde2fb" stroke="#2a78d6"/><text x="530" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 4</text><text x="530" y="225" text-anchor="middle" font-size="11" fill="#52514e">own K/V</text><text x="360" y="300" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Every head stores its own separate keys and values:</text><text x="360" y="319" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">KV cache size multiplied by the number of heads</text><rect x="720" y="130" width="560" height="340" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">Grouped-query attention</text><rect x="760" y="180" width="100" height="40" rx="4" fill="#ffffff" stroke="#2a78d6"/><text x="810" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 1</text><rect x="880" y="180" width="100" height="40" rx="4" fill="#ffffff" stroke="#2a78d6"/><text x="930" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 2</text><rect x="1000" y="180" width="100" height="40" rx="4" fill="#ffffff" stroke="#2a78d6"/><text x="1050" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 3</text><rect x="1120" y="180" width="100" height="40" rx="4" fill="#ffffff" stroke="#2a78d6"/><text x="1170" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Head 4</text><rect x="850" y="250" width="260" height="60" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="980" y="284.3333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">One shared K/V group</text><line x1="810" y1="220" x2="980" y2="250" stroke="#2a78d6" stroke-width="1.5"/><line x1="930" y1="220" x2="980" y2="250" stroke="#2a78d6" stroke-width="1.5"/><line x1="1050" y1="220" x2="980" y2="250" stroke="#2a78d6" stroke-width="1.5"/><line x1="1170" y1="220" x2="980" y2="250" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="350" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Multiple query heads share fewer key/value groups:</text><text x="1000" y="369" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">KV cache shrinks directly</text><rect x="60" y="530" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="553.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Grouped-query attention (Ainslie et al., 2023) sits between full multi-head attention and</text><text x="680" y="571.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">single-shared-head multi-query attention, and existing checkpoints can often be adapted into it.</text>
</svg>