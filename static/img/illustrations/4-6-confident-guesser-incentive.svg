<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-6-confident-guesser desc-4-6-confident-guesser">
  <title id="title-4-6-confident-guesser">Why confident guessing is statistically favored over abstaining</title>
  <desc id="desc-4-6-confident-guesser">Three outcomes of a scoring scheme: a correct confident answer scores one point, a wrong confident answer scores zero, and an honest expression of uncertainty also scores zero, illustrating why guessing is favored over abstaining.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Why confident guessing is statistically favored over abstaining</text>
  <rect x="110" y="150" width="340" height="160" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="280" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Correct, confident answer</text><text x="280" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Scores +1</text><rect x="510" y="150" width="340" height="160" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="680" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Wrong, confident answer</text><text x="680" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">(hallucination)</text><text x="680" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Scores 0</text><rect x="910" y="150" width="340" height="160" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1080" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Honest "I don't know"</text><text x="1080" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#52514e">Scores 0</text><text x="680" y="370" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">A wrong, confident answer scores exactly as poorly as an honest "I don't know."</text><text x="680" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">That scoring pattern statistically favors confident guessing over calibrated abstention.</text><rect x="60" y="440" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="461.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Kalai, Nachum, Vempala, and Zhang, "Why Language Models Hallucinate" (2025), argue this scoring</text><text x="680" y="478.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">pattern, not just imperfect training data, is a key reason hallucination persists in deployed</text><text x="680" y="496.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">systems, and that fixing it means revising how benchmarks score abstention, not adding more</text><text x="680" y="513.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">hallucination-specific evaluations.</text>
</svg>