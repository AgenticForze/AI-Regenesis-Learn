<svg width="1360" height="590" viewBox="0 0 1360 590" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-7-gateway desc-5-7-gateway">
  <title id="title-5-7-gateway">The LLM gateway pattern</title>
  <desc id="desc-5-7-gateway">A diagram showing an app backend sending its request to an LLM gateway, which routes to a primary provider by default when healthy, and automatically falls back to a secondary provider when the primary one fails, without the app backend needing to know which provider actually served the request.</desc>
  <defs></defs>
  <rect width="1360" height="590" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The LLM gateway pattern</text>
  <defs><marker id="arrow-5-7-gateway" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="60" y="240" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="190" y="269.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">App backend</text><text x="190" y="304.90000000000003" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">sends the request once</text><rect x="460" y="240" width="280" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="600" y="269.9" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LLM gateway</text><text x="600" y="304.90000000000003" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">LiteLLM, Portkey, or</text><text x="600" y="320.50000000000006" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">similar</text><rect x="940" y="100" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1090" y="130.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Primary provider</text><text x="1090" y="163.79999999999998" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">used by default, when</text><text x="1090" y="178.74999999999997" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">healthy</text><rect x="940" y="380" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1090" y="410.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Fallback provider</text><text x="1090" y="443.8" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">used automatically on</text><text x="1090" y="458.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">failure</text><line x1="320.0" y1="285.0" x2="460.0" y2="285.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-gateway)"/><line x1="740.0" y1="245.0" x2="940.0" y2="187.9" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-gateway)"/><line x1="740.0" y1="325.0" x2="940.0" y2="382.1" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-7-gateway)"/><text x="900" y="165" text-anchor="middle" font-size="11.5" font-weight="600" fill="#52514e">default</text><text x="860" y="440" text-anchor="middle" font-size="11.5" font-weight="600" fill="#a33a2f">primary unavailable</text><rect x="60" y="500" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="520" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Portkey: "Fallback to another provider or model on failed requests using the LLM gateway." The app</text><text x="680" y="537.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">backend only ever talks to the gateway; which provider actually serves the request is the gateway's</text><text x="680" y="555" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">decision.</text>
</svg>