<svg width="1900" height="700" viewBox="0 0 1900 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-5-decision-flow desc-5-5-decision-flow">
  <title id="title-5-5-decision-flow">Defending an LLM application against prompt injection</title>
  <desc id="desc-5-5-decision-flow">A decision-flow diagram branching from building an LLM application into whether it ingests third-party or tool-returned content, leading to privilege separation and checking for a hierarchy-trained model; whether it is still user-facing with a system prompt, leading to a check for confidential content and minimizing what the system prompt contains; and whether defense in depth is required, leading to an external guardrail layer for input and output classification.</desc>
  <defs></defs>
  <rect width="1900" height="700" fill="#fcfcfb"/>
  <text x="950" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Defending an LLM application against prompt injection</text>
  <defs><marker id="arrow-5-5-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="790" y="50" width="340" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="960" y="77.85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Building an LLM</text><text x="960" y="94.75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">application</text><rect x="240" y="170" width="340" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="410" y="205.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Ingests third-party or</text><text x="410" y="221.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">tool-returned content?</text><line x1="809.0" y1="120.0" x2="580.0" y2="173.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="880" y="170" width="300" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1030" y="197.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Still user-facing</text><text x="1030" y="213.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">with a system</text><text x="1030" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">prompt?</text><line x1="979.2" y1="120.0" x2="1006.7" y2="170.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="1430" y="170" width="300" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1580" y="197.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Defense in depth</text><text x="1580" y="213.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">required for this</text><text x="1580" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">risk level?</text><line x1="1130.0" y1="120.0" x2="1430.0" y2="181.7" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="120" y="310" width="280" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="260" y="330.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Apply privilege</text><text x="260" y="346.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">separation</text><text x="260" y="378.65" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">treat content as typed</text><text x="260" y="392.95" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">data, never instructions</text><line x1="364.5" y1="255.0" x2="305.5" y2="310.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="420" y="310" width="280" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="560" y="337.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Is a</text><text x="560" y="353.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">hierarchy-trained</text><text x="560" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">model available?</text><line x1="400.0" y1="352.5" x2="420.0" y2="352.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="120" y="460" width="280" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="260" y="493.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use it as the</text><text x="260" y="509.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">foundation layer</text><line x1="473.6" y1="395.0" x2="341.4" y2="460.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-5-decision)"/><rect x="420" y="460" width="280" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="560" y="485" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Treat the model as</text><text x="560" y="501.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">having no built-in</text><text x="560" y="517.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">defense</text><line x1="560.0" y1="395.0" x2="560.0" y2="460.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="880" y="310" width="300" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1030" y="337.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">System prompt</text><text x="1030" y="353.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">contains anything</text><text x="1030" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">confidential?</text><line x1="1030.0" y1="255.0" x2="1030.0" y2="310.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-5-decision)"/><rect x="790" y="460" width="230" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="905" y="493.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Avoid secrets in the</text><text x="905" y="509" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">system prompt</text><line x1="994.0" y1="395.0" x2="938.9" y2="460.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-5-decision)"/><rect x="1030" y="460" width="230" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1145" y="493.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Leakage risk is</text><text x="1145" y="509" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">lower, not zero</text><line x1="1063.1" y1="395.0" x2="1113.8" y2="460.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-decision)"/><rect x="1420" y="310" width="320" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1580" y="335" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Add an external</text><text x="1580" y="351.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">guardrail: input and</text><text x="1580" y="367.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">output classification</text><line x1="1580.0" y1="255.0" x2="1580.0" y2="310.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-5-decision)"/>
</svg>