<svg width="1400" height="660" viewBox="0 0 1400 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-5-direct-indirect desc-5-5-direct-indirect">
  <title id="title-5-5-direct-indirect">Direct versus indirect prompt injection</title>
  <desc id="desc-5-5-direct-indirect">A diagram comparing direct prompt injection, where a user types a malicious instruction straight into the model, with indirect prompt injection, where hidden instructions are planted inside a webpage or document, and a legitimate user's unrelated question triggers the model retrieving and reading that compromised content.</desc>
  <defs></defs>
  <rect width="1400" height="660" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Direct versus indirect prompt injection</text>
  <defs><marker id="arrow-5-5-direct-indirect" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="60" y="90" width="600" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="109.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Direct prompt</text><text x="360" y="128.75" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">injection</text><rect x="140" y="190" width="440" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="223.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">User types the malicious</text><text x="360" y="239.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">instruction directly</text><rect x="200" y="330" width="320" height="65" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="360" y="363.8" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Model</text><line x1="360.0" y1="270.0" x2="360.0" y2="330.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-direct-indirect)"/><text x="360" y="460" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">The user is the attacker;</text><text x="360" y="477" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">nothing hidden, no third party</text><text x="360" y="494" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">involved</text><rect x="740" y="90" width="600" height="55" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1040" y="109.25" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Indirect prompt</text><text x="1040" y="128.75" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">injection</text><rect x="750" y="190" width="260" height="90" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="880" y="221.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">A webpage or document,</text><text x="880" y="236.14999999999998" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">planted with hidden</text><text x="880" y="251.1" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a33a2f">instructions</text><rect x="1070" y="190" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1200" y="228.675" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Legitimate user asks</text><text x="1200" y="243.625" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">an unrelated question</text><rect x="880" y="330" width="320" height="65" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1040" y="355.9" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Model retrieves and</text><text x="1040" y="371.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">reads the document</text><line x1="936.5" y1="280.0" x2="999.2" y2="330.0" stroke="#a33a2f" stroke-width="2.2" marker-end="url(#arrow-5-5-direct-indirect)"/><line x1="1143.5" y1="280.0" x2="1080.8" y2="330.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-direct-indirect)"/><text x="1040" y="460" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">The user never sees anything</text><text x="1040" y="477" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">suspicious; the attack arrives</text><text x="1040" y="494" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">through fetched content</text><rect x="60" y="545" width="1280" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="570" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Greshake et al., 2023: indirect prompt injection hides instructions inside third-party content a</text><text x="700" y="587.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">model retrieves and reads, demonstrated against a GPT-4-powered Bing Chat and other LLM-integrated</text><text x="700" y="605" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">applications.</text>
</svg>