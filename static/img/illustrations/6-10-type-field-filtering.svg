<svg width="1500" height="660" viewBox="0 0 1500 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-10-type desc-6-10-type">
  <title id="title-6-10-type">The type field alone is enough to filter a bundle</title>
  <desc id="desc-6-10-type">A diagram showing an OKF bundle of many concept files, each with a type field, being filtered by a directory walk and YAML parser into a smaller subset matching a chosen type, such as BigQuery Table, before that subset is passed on to an ingestion pipeline, illustrating how the required type field enables structured filtering without a database.</desc>
  <rect width="1500" height="660" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The type field alone is enough to filter a bundle</text>
  <defs><marker id="arrow-6-10-type-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="580" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="495.59999999999997" height="200" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="527.8" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Full OKF bundle</text><rect x="296" y="166" width="463.59999999999997" height="22" rx="5" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.2"/><text x="304" y="182" font-size="10.5" font-family="monospace" fill="#1f2d3d">type: BigQuery Table</text><rect x="296" y="193" width="463.59999999999997" height="22" rx="5" fill="#ffffff" stroke="#b8b5ad" stroke-width="1.2"/><text x="304" y="209" font-size="10.5" font-family="monospace" fill="#6b7280">type: Wiki Page</text><rect x="296" y="220" width="463.59999999999997" height="22" rx="5" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.2"/><text x="304" y="236" font-size="10.5" font-family="monospace" fill="#1f2d3d">type: BigQuery Table</text><rect x="296" y="247" width="463.59999999999997" height="22" rx="5" fill="#ffffff" stroke="#b8b5ad" stroke-width="1.2"/><text x="304" y="263" font-size="10.5" font-family="monospace" fill="#6b7280">type: API Endpoint</text><rect x="296" y="274" width="463.59999999999997" height="22" rx="5" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.2"/><text x="304" y="290" font-size="10.5" font-family="monospace" fill="#1f2d3d">type: BigQuery Table</text><rect x="296" y="301" width="463.59999999999997" height="22" rx="5" fill="#ffffff" stroke="#b8b5ad" stroke-width="1.2"/><text x="304" y="317" font-size="10.5" font-family="monospace" fill="#6b7280">type: Runbook</text><rect x="855.5999999999999" y="195" width="180" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="945.5999999999999" y="224.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Filter: type = BigQuery</text><text x="945.5999999999999" y="239.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Table</text><line x1="527.8" y1="330" x2="527.8" y2="195" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-type-main)"/><line x1="775.5999999999999" y1="230" x2="855.5999999999999" y2="230" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-type-main)"/><rect x="1115.6" y="160" width="344.4000000000001" height="140" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1287.8" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Filtered subset</text><text x="1287.8" y="214" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#6b7280">type: BigQuery Table</text><text x="1287.8" y="236" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#6b7280">type: BigQuery Table</text><text x="1287.8" y="258" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#6b7280">type: BigQuery Table</text><line x1="1035.6" y1="230" x2="1115.6" y2="230" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-type-main)"/><rect x="280" y="390" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="412" text-anchor="middle" font-size="11.5" fill="#6b7280">type is the only field OKF requires on every concept. A directory walk plus a YAML parser is enough to</text><text x="870" y="430" text-anchor="middle" font-size="11.5" fill="#6b7280">filter a large bundle down to a relevant subset, no database or ingestion step required.</text>
</svg>