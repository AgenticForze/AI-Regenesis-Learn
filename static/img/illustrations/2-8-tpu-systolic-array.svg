idth="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="763" y="602" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="808" y="560" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="845" y="602" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><line x1="435" y1="638" x2="435" y2="662" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="517" y1="638" x2="517" y2="662" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="599" y1="638" x2="599" y2="662" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="681" y1="638" x2="681" y2="662" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="763" y1="638" x2="763" y2="662" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="845" y1="638" x2="845" y2="662" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><text x="640" y="689" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">partial sums accumulate and exit as the product matrix</text><rect x="90" y="724" width="1020" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="600" y="757" text-anchor="middle" font-size="12.5" fill="#52514e">An ASIC built for exactly this operation, not orchestrated instruction by instruction like a GPU's cores</text></svg>