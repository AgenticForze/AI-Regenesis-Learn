<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-tpu desc-tpu">
  <title id="title-tpu">A systolic array: a grid of processing elements that a matrix multiplication flows through in a pipelined wave</title>
  <desc id="desc-tpu">A grid of small processing elements arranged in rows and columns. Input values from a weight matrix and an activation matrix flow into the grid from the top and left edges. Each processing element multiplies the two values flowing through it, adds the running partial sum, and passes results to its neighbors, so the full matrix multiplication result emerges from the grid without being orchestrated instruction by instruction.</desc>
  <rect width="1200" height="820" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">TPU: a systolic array purpose-built for matrix multiplication</text><defs>
    <marker id="arrowtpu" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#184f95"/></marker>
  </defs><text x="640" y="85" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">weight values flow down</text><line x1="435" y1="105" x2="435" y2="142" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="517" y1="105" x2="517" y2="142" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="599" y1="105" x2="599" y2="142" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="681" y1="105" x2="681" y2="142" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="763" y1="105" x2="763" y2="142" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="845" y1="105" x2="845" y2="142" stroke="#184f95" stroke-width="2" marker-end="url(#arrowtpu)"/><text x="303" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f" transform="rotate(-90 303 392)">activation values flow right</text><line x1="353" y1="187" x2="390" y2="187" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="353" y1="269" x2="390" y2="269" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="353" y1="351" x2="390" y2="351" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="353" y1="433" x2="390" y2="433" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="353" y1="515" x2="390" y2="515" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrowtpu)"/><line x1="353" y1="597" x2="390" y2="597" stroke="#a33a2f" stroke-width="2" marker-end="url(#arrowtpu)"/><rect x="398" y="150" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="435" y="192" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="480" y="150" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="517" y="192" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="562" y="150" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="599" y="192" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="644" y="150" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="681" y="192" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="726" y="150" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="763" y="192" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="808" y="150" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="845" y="192" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="398" y="232" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="435" y="274" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="480" y="232" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="517" y="274" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="562" y="232" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="599" y="274" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="644" y="232" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="681" y="274" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="726" y="232" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="763" y="274" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="808" y="232" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="845" y="274" text-anchor="middle" font-size="10" fill="#ffffff">x·w+</text><rect x="398" y="314" width="74" height="74" rx="6" fill="#5598e7" stroke="#104281" stroke-width="1.25"/><text x="435" y="356" text-anchor="middle" font-size="10" fill="#ffffff">x·w