<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-6-lifecycle desc-5-6-lifecycle">
  <title id="title-5-6-lifecycle">The prompt evaluation and rollout loop</title>
  <desc id="desc-5-6-lifecycle">A diagram showing a prompt lifecycle: drafting or editing a prompt, running it against a versioned golden dataset, grading it via code, LLM-as-judge, or human review, and checking for regressions; a failed regression check loops back to editing the prompt, while a passing check promotes the version to a tagged staging or production label, from which it either enters a statistically powered A/B test against a live incumbent or deploys directly.</desc>
  <defs></defs>
  <rect width="1400" height="720" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The prompt evaluation and rollout loop</text>
  <defs><marker id="arrow-5-6-lifecycle" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="60" y="110" width="280" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="200" y="145.35" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Draft or edit the</text><text x="200" y="162.25" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">prompt</text><rect x="400" y="110" width="280" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="540" y="136.9" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Run against the</text><text x="540" y="153.8" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">versioned golden</text><text x="540" y="170.70000000000002" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">dataset</text><rect x="740" y="110" width="280" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="880" y="145.35" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Grade: code,</text><text x="880" y="162.25" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">LLM-as-judge, or human</text><rect x="1060" y="110" width="280" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1200" y="137.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Regression check:</text><text x="1200" y="153.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">still passes what it</text><text x="1200" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">used to?</text><line x1="340.0" y1="152.5" x2="400.0" y2="152.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-lifecycle)"/><line x1="680.0" y1="152.5" x2="740.0" y2="152.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-lifecycle)"/><line x1="1020.0" y1="152.5" x2="1060.0" y2="152.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-lifecycle)"/><path d="M 1200 195 L 1200 250 L 200 250 L 200 195" fill="none" stroke="#a33a2f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-5-6-lifecycle)"/><text x="700" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#a33a2f">regression found: revise the prompt</text><rect x="560" y="330" width="320" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="720" y="349.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Promote to a tagged</text><text x="720" y="366.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">version</text><text x="720" y="399.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">staging / production</text><line x1="1107.3" y1="195.0" x2="812.7" y2="330.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-lifecycle)"/><text x="1111" y="218.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#52514e">passes</text><rect x="260" y="500" width="340" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="430" y="522.1" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Compare against the</text><text x="430" y="539" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">live incumbent</text><text x="430" y="572.25" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">a properly powered A/B</text><text x="430" y="587.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">test</text><rect x="780" y="500" width="340" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="950" y="522.1" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Deploy the tagged</text><text x="950" y="539" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">version directly</text><text x="950" y="572.25" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">no incumbent to compare</text><text x="950" y="587.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">against</text><line x1="648.6" y1="415.0" x2="505.7" y2="500.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-lifecycle)"/><line x1="776.7" y1="415.0" x2="890.0" y2="500.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-6-lifecycle)"/><rect x="60" y="620" width="1280" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="645" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Prompt engineering as a closed loop: a version only advances once it has cleared the same golden</text><text x="700" y="662.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">dataset every previous version had to clear, and a live comparison against an incumbent still needs</text><text x="700" y="680" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">proper statistical power before it decides anything.</text>
</svg>