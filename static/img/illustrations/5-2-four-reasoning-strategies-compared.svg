<svg width="1500" height="720" viewBox="0 0 1500 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-2-four-strategies desc-5-2-four-strategies">
  <title id="title-5-2-four-strategies">Four prompting strategies compared</title>
  <desc id="desc-5-2-four-strategies">A diagram comparing four prompting strategies: standard prompting with no shown reasoning, chain-of-thought prompting with one linear reasoning path shown, self-consistency sampling several independent reasoning paths and taking a majority vote, and tree-of-thought exploring a branching tree of partial reasoning steps with backtracking, one branch marked abandoned.</desc>
  <defs></defs>
  <rect width="1500" height="720" fill="#fcfcfb"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Four prompting strategies compared</text>
  <defs><marker id="arrow-5-2-four" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="30" y="100" width="330" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="195" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Standard prompting</text><rect x="400" y="100" width="330" height="50" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="565" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Chain-of-thought</text><rect x="770" y="100" width="330" height="50" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="935" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Self-consistency</text><rect x="1140" y="100" width="330" height="50" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1305" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Tree-of-thought</text><rect x="105" y="220" width="180" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="195" y="246.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Question</text><rect x="105" y="400" width="180" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="195" y="426.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Direct answer</text><line x1="195.0" y1="270.0" x2="195.0" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><text x="195" y="500" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">No intermediate</text><text x="195" y="517" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">reasoning shown</text><rect x="465" y="210" width="200" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="565" y="231.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Question</text><rect x="455" y="270" width="220" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="565" y="291.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Step 1</text><rect x="455" y="330" width="220" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="565" y="351.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Step 2</text><rect x="455" y="390" width="220" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="565" y="411.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Step 3</text><rect x="465" y="450" width="200" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="565" y="471.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Answer</text><line x1="565.0" y1="250.0" x2="565.0" y2="270.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><line x1="565.0" y1="310.0" x2="565.0" y2="330.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><line x1="565.0" y1="370.0" x2="565.0" y2="390.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><line x1="565.0" y1="430.0" x2="565.0" y2="450.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><text x="565" y="500" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Reasoning written out</text><text x="565" y="517" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">before the final answer</text><rect x="845" y="200" width="180" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="935" y="221.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Question</text><rect x="778" y="265" width="96" height="45" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="826" y="288.65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Path A</text><line x1="902.7" y1="240.0" x2="862.3" y2="265.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><rect x="887" y="265" width="96" height="45" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="935" y="288.65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Path B</text><line x1="935.0" y1="240.0" x2="935.0" y2="265.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><rect x="996" y="265" width="96" height="45" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1044" y="288.65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Path C</text><line x1="967.3" y1="240.0" x2="1007.7" y2="265.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><rect x="805" y="350" width="260" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="935" y="378.8" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Majority vote</text><line x1="853.3" y1="310.0" x2="901.7" y2="350.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><line x1="935.0" y1="310.0" x2="935.0" y2="350.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><line x1="1016.8" y1="310.0" x2="968.3" y2="350.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><rect x="845" y="440" width="180" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="935" y="461.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Answer</text><line x1="935.0" y1="405.0" x2="935.0" y2="440.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><text x="935" y="500" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Several sampled paths</text><text x="935" y="517" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">vote on the final answer</text><rect x="1225" y="200" width="160" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1305" y="221.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Problem</text><rect x="1150" y="265" width="140" height="45" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1220" y="288.7" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Branch 1</text><rect x="1320" y="265" width="140" height="45" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1390" y="288.7" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Branch 2</text><line x1="1279.8" y1="240.0" x2="1248.3" y2="265.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><line x1="1330.2" y1="240.0" x2="1361.7" y2="265.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><rect x="1150" y="335" width="140" height="55" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1220" y="348.7" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">Abandoned</text><text x="1220" y="380.65000000000003" text-anchor="middle" font-size="11.5" font-weight="400" fill="#a33a2f">backtrack</text><line x1="1220.0" y1="310.0" x2="1220.0" y2="335.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-2-four)"/><rect x="1320" y="335" width="140" height="55" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1390" y="363.65" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Promising, continue</text><line x1="1390.0" y1="310.0" x2="1390.0" y2="335.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><rect x="1225" y="440" width="160" height="40" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1305" y="461.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Answer</text><line x1="1366.0" y1="390.0" x2="1322.4" y2="440.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-four)"/><text x="1305" y="500" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Search abandons weak</text><text x="1305" y="517" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">branches and backtracks</text><rect x="30" y="545" width="1440" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="750" y="583.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Each strategy adds more deliberate reasoning and more inference cost, moving from a single direct</text><text x="750" y="601.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">answer toward a searched, backtracking tree of partial solutions.</text>
</svg>