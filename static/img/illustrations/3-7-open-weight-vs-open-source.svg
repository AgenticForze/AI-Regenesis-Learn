<svg width="1360" height="720" viewBox="0 0 1360 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-openvsopensource desc-openvsopensource">
  <title id="title-openvsopensource">Open-weight publishes the trained result; open-source would require publishing how it was made</title>
  <desc id="desc-openvsopensource">A checklist contrasting what is typically published for an open-weight model, the trained weights and inference code, against what is usually withheld: the training data, training code, and full training methodology, which a stricter open-source definition would require.</desc>
  <defs></defs>
  <rect width="1360" height="720" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">What "open" actually includes, item by item</text>
  <rect x="330" y="130" width="700" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="176" font-size="15" font-weight="700" fill="#0b0b0b">Trained weights</text><text x="1000" y="176" text-anchor="end" font-size="13" font-weight="700" fill="#184f95">Published (open-weight)</text><rect x="330" y="220" width="700" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="266" font-size="15" font-weight="700" fill="#0b0b0b">Inference code</text><text x="1000" y="266" text-anchor="end" font-size="13" font-weight="700" fill="#184f95">Published (open-weight)</text><rect x="330" y="310" width="700" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="356" font-size="15" font-weight="700" fill="#0b0b0b">Training data</text><text x="1000" y="356" text-anchor="end" font-size="13" font-weight="700" fill="#a33a2f">Usually NOT published</text><rect x="330" y="400" width="700" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="446" font-size="15" font-weight="700" fill="#0b0b0b">Training code</text><text x="1000" y="446" text-anchor="end" font-size="13" font-weight="700" fill="#a33a2f">Usually NOT published</text><rect x="330" y="490" width="700" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="360" y="536" font-size="15" font-weight="700" fill="#0b0b0b">Full training methodology</text><text x="1000" y="536" text-anchor="end" font-size="13" font-weight="700" fill="#a33a2f">Usually NOT published</text><rect x="60" y="600" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="623.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">A model can be genuinely open-weight while still withholding the training data and methodology a</text><text x="680" y="641.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">stricter open-source definition would require.</text>
</svg>