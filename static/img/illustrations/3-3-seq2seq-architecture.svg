<svg width="1300" height="600" viewBox="0 0 1300 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-seq2seq desc-seq2seq">
  <title id="title-seq2seq">A seq2seq model pairs a bidirectional encoder with a causal decoder connected by cross-attention</title>
  <desc id="desc-seq2seq">An input sequence feeds a bidirectional encoder. Prior output tokens feed a causal decoder. Cross-attention connects the decoder to the encoder output, letting each generated token condition on the full input. The decoder produces the next output token.</desc>
  <defs><marker id="arr33c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker><marker id="arr33d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33a2f"/></marker></defs>
  <rect width="1300" height="600" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two attention mechanisms, two different jobs</text>
  <rect x="110" y="150" width="420" height="140" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="2"/><text x="320" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Bidirectional encoder</text><text x="320" y="234" text-anchor="middle" font-size="11" fill="#52514e">reads full input, both directions</text><rect x="780" y="150" width="420" height="140" rx="8" fill="#ffffff" stroke="#104281" stroke-width="2"/><text x="990" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Causal decoder</text><text x="990" y="234" text-anchor="middle" font-size="11" fill="#52514e">generates output, one token at a time</text><rect x="110" y="60" width="420" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="320" y="89.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Input sequence (e.g. English sentence)</text><line x1="320.0" y1="110.0" x2="320.0" y2="150.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arr33c)"/><rect x="780" y="60" width="420" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="990" y="89.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Prior output tokens (teacher-forced)</text><line x1="990.0" y1="110.0" x2="990.0" y2="150.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arr33c)"/><path d="M 530 220 C 670 210, 640 210, 780 220" fill="none" stroke="#a33a2f" stroke-width="2.5" marker-end="url(#arr33d)"/><text x="655" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2f">cross-attention</text><text x="655" y="200" text-anchor="middle" font-size="11.5" fill="#a33a2f">decoder queries attend over encoder keys/values</text><rect x="780" y="400" width="420" height="60" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="990" y="434.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Next output token</text><line x1="990.0" y1="290.0" x2="990.0" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arr33c)"/><rect x="90" y="490" width="1120" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="518.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Self-attention (2.5) connects positions within the same sequence. Cross-attention connects the</text><text x="650" y="536.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">decoder to a different sequence entirely, the encoder's output.</text>
</svg>