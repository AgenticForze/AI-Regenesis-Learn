<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-6 desc-8-6"><title id="title-8-6">The Context Window Is a Fixed Budget, Not a Free List</title><desc id="desc-8-6">A context window holds four kinds of content competing for the same fixed token budget: a system prompt pitched at the right altitude, a curated, non-overlapping set of tool definitions, content retrieved just-in-time rather than pre-loaded wholesale, and conversation history kept small via compaction and persisted notes. Below, a curve shows why this curation matters: as the number of tokens in the context window increases, recall accuracy over that context decreases, a pattern called context rot. Context engineering is the discipline of deciding what actually earns a place in that fixed budget.</desc><rect width="1560" height="700" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">The Context Window Is a Fixed Budget, Not a Free List</text><rect x="84" y="94" width="1392" height="142" rx="16" fill="none" stroke="#1f2d3d" stroke-width="2" stroke-dasharray="2,4"/><text x="780.0" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">The context window: a fixed token budget</text><rect x="90" y="100" width="220.8" height="130" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="200.4" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">System Prompt</text><text x="200.4" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">right altitude:</text><text x="200.4" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">not brittle, not vague</text><rect x="310.8" y="100" width="276.0" height="130" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.75"/><text x="448.8" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Tool Definitions</text><text x="448.8" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">curated, non-overlapping,</text><text x="448.8" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">unambiguous</text><rect x="586.8" y="100" width="441.6" height="130" fill="#fff6df" stroke="#c9975b" stroke-width="1.75"/><text x="807.5999999999999" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Retrieved Content</text><text x="807.5999999999999" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">loaded just-in-time,</text><text x="807.5999999999999" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">not all up front</text><rect x="1028.4" y="100" width="441.6" height="130" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.75"/><text x="1249.2" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">History + Notes</text><text x="1249.2" y="154" text-anchor="middle" font-size="11.5" fill="#4b5563">compacted, plus a</text><text x="1249.2" y="170" text-anchor="middle" font-size="11.5" fill="#4b5563">persisted scratchpad</text><text x="640.0" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2d3d">Why curation matters: context rot</text><line x1="190" y1="330" x2="190" y2="590" stroke="#9aa3ad" stroke-width="1.5"/><line x1="190" y1="590" x2="1090" y2="590" stroke="#9aa3ad" stroke-width="1.5"/><text x="176" y="342" text-anchor="end" font-size="12" fill="#6b7280">high</text><text x="176" y="590" text-anchor="end" font-size="12" fill="#6b7280">low</text><text x="144" y="460.0" text-anchor="middle" font-size="12.5" fill="#4b5563" transform="rotate(-90 144 460.0)">recall accuracy</text><text x="1050" y="616" text-anchor="end" font-size="12" fill="#6b7280">more tokens in context</text><path d="M 190.0 356.0 L 212.5 356.5 L 235.0 357.6 L 257.5 359.1 L 280.0 360.9 L 302.5 363.0 L 325.0 365.4 L 347.5 368.0 L 370.0 370.8 L 392.5 373.9 L 415.0 377.2 L 437.5 380.7 L 460.0 384.4 L 482.5 388.3 L 505.0 392.4 L 527.5 396.6 L 550.0 401.0 L 572.5 405.6 L 595.0 410.3 L 617.5 415.3 L 640.0 420.3 L 662.5 425.5 L 685.0 430.9 L 707.5 436.4 L 730.0 442.1 L 752.5 447.9 L 775.0 453.9 L 797.5 460.0 L 820.0 466.2 L 842.5 472.6 L 865.0 479.1 L 887.5 485.7 L 910.0 492.5 L 932.5 499.3 L 955.0 506.4 L 977.5 513.5 L 1000.0 520.7 L 1022.5 528.1 L 1045.0 535.6 L 1067.5 543.3 L 1090.0 551.0" fill="none" stroke="#c96f6f" stroke-width="3"/><text x="640.0" y="491.20000000000005" text-anchor="middle" font-size="12.5" fill="#a04f4f">even when every added token is technically relevant</text><rect x="1150" y="330" width="320" height="260" rx="12" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1310.0" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">An attention budget</text><text x="1310.0" y="392" text-anchor="middle" font-size="12.5" fill="#4b5563">Self-attention forms a</text><text x="1310.0" y="412" text-anchor="middle" font-size="12.5" fill="#4b5563">relationship between every</text><text x="1310.0" y="432" text-anchor="middle" font-size="12.5" fill="#4b5563">pair of tokens: n² pairs for n</text><text x="1310.0" y="452" text-anchor="middle" font-size="12.5" fill="#4b5563">tokens, all competing for</text><text x="1310.0" y="472" text-anchor="middle" font-size="12.5" fill="#4b5563">the same fixed capacity.</text><text x="1310.0" y="492" text-anchor="middle" font-size="12.5" fill="#4b5563"></text><text x="1310.0" y="512" text-anchor="middle" font-size="12.5" fill="#4b5563">More tokens does not mean</text><text x="1310.0" y="532" text-anchor="middle" font-size="12.5" fill="#4b5563">more room; it means more</text><text x="1310.0" y="552" text-anchor="middle" font-size="12.5" fill="#4b5563">competition for the same</text><text x="1310.0" y="572" text-anchor="middle" font-size="12.5" fill="#4b5563">room.</text><rect x="90" y="620" width="1380" height="60" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Context engineering is deciding what earns a place in this fixed budget.</text><text x="780.0" y="668" text-anchor="middle" font-size="13" fill="#1f2d3d">Not more context, the right context, at the right time.</text></svg>