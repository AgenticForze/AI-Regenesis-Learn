<svg width="1500" height="720" viewBox="0 0 1500 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-1-decision-flow desc-5-1-decision-flow">
  <title id="title-5-1-decision-flow">Choosing a prompting strategy for the model and task at hand</title>
  <desc id="desc-5-1-decision-flow">A decision-flow diagram branching from needing to prompt an LLM into whether the model is instruction-tuned, leading to zero-shot or few-shot prompting, with few-shot prompting further branching into testing example order, selecting semantically similar examples, and checking whether accuracy varies enough to warrant calibration.</desc>
  <defs></defs>
  <rect width="1500" height="720" fill="#fcfcfb"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing a prompting strategy for the model and task at hand</text>
  <defs><marker id="arrow-5-1-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="590" y="50" width="320" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="750" y="89.66666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Need to prompt an LLM</text><rect x="590" y="190" width="320" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="750" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Is the model instruction-tuned</text><text x="750" y="249" text-anchor="middle" font-size="12" fill="#52514e">or RLHF-trained?</text><rect x="350" y="340" width="260" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="480" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Try zero-shot</text><text x="480" y="394" text-anchor="middle" font-size="12" fill="#52514e">prompting first</text><rect x="890" y="340" width="260" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1020" y="376" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Use few-shot prompting</text><text x="1020" y="394" text-anchor="middle" font-size="12" fill="#52514e">with worked examples</text><line x1="750.0" y1="120.0" x2="750.0" y2="190.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/><line x1="666.2" y1="280.0" x2="554.5" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/><line x1="833.8" y1="280.0" x2="945.5" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/><rect x="350" y="470" width="260" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="480" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Is zero-shot output</text><text x="480" y="524" text-anchor="middle" font-size="12" fill="#52514e">reliable enough?</text><line x1="480.0" y1="420.0" x2="480.0" y2="470.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/><line x1="610.0" y1="478.7" x2="890.0" y2="411.3" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-1-decision)"/><rect x="780" y="470" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="890" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Test example order,</text><text x="890" y="524" text-anchor="middle" font-size="11.5" fill="#52514e">do not assume it is neutral</text><rect x="1020" y="470" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1130" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Select semantically</text><text x="1130" y="524" text-anchor="middle" font-size="11.5" fill="#52514e">similar examples</text><line x1="980.0" y1="420.0" x2="930.0" y2="470.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/><line x1="1053.8" y1="420.0" x2="1096.2" y2="470.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/><rect x="900" y="590" width="340" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1070" y="626" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does accuracy vary a lot</text><text x="1070" y="644" text-anchor="middle" font-size="12" fill="#52514e">across example sets?</text><line x1="1028.0" y1="420.0" x2="1062.0" y2="590.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-1-decision)"/>
</svg>