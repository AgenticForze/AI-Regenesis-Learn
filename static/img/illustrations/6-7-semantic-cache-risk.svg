<svg width="1500" height="680" viewBox="0 0 1500 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-7-sem desc-6-7-sem">
  <title id="title-6-7-sem">A similarity score cannot tell a paraphrase from a different question</title>
  <desc id="desc-6-7-sem">A diagram comparing two query pairs scored by a semantic cache: the first pair, two ways of asking about Q3 revenue guidance, scores 0.97 similarity and correctly triggers a cache hit; the second pair, "my left arm hurts" and "my right arm hurts," scores 0.91 similarity, above a loosely-set threshold, and incorrectly triggers a cache hit despite describing opposite conditions.</desc>
  <rect width="1500" height="680" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">A similarity score cannot tell a paraphrase from a different question</text>
  <defs><marker id="arrow-6-7-sem-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="600" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="140" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="470" y="170.05" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">"What is Q3 revenue</text><text x="470" y="183.8" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">guidance?"</text><rect x="1080" y="140" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1270" y="170.05" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">"What was Q3 revenue</text><text x="1270" y="183.8" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">guidance?"</text><line x1="660" y1="175" x2="810" y2="175" stroke="#5fae83" stroke-width="2"/><line x1="930" y1="175" x2="1080" y2="175" stroke="#5fae83" stroke-width="2"/><rect x="810" y="153" width="120" height="44" rx="8" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.6"/><text x="870" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">0.97</text><text x="870" y="188" text-anchor="middle" font-size="8.5" fill="#6b7280">similarity</text><text x="870" y="232" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5fae83">TRUE PARAPHRASE</text><text x="870" y="250" text-anchor="middle" font-size="10" fill="#6b7280">Correct hit: same question, different tense</text><rect x="280" y="380" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="470" y="416.925" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">"My left arm hurts"</text><rect x="1080" y="380" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="1270" y="416.925" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2d3d">"My right arm hurts"</text><line x1="660" y1="415" x2="810" y2="415" stroke="#c96fa8" stroke-width="2"/><line x1="930" y1="415" x2="1080" y2="415" stroke="#c96fa8" stroke-width="2"/><rect x="810" y="393" width="120" height="44" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.6"/><text x="870" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">0.91</text><text x="870" y="428" text-anchor="middle" font-size="8.5" fill="#6b7280">similarity</text><text x="870" y="472" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c96fa8">FALSE HIT</text><text x="870" y="490" text-anchor="middle" font-size="10" fill="#6b7280">False hit: opposite conditions, both above threshold</text><rect x="20" y="160" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">SAFE</text><rect x="20" y="400" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="425" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">RISKY</text>
</svg>