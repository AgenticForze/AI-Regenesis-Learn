<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-4-ewc desc-7-4-ewc">
  <title id="title-7-4-ewc">Elastic Weight Consolidation: slow learning only where it matters</title>
  <desc id="desc-7-4-ewc">A flow diagram: a model that has already learned Task A has each weight's importance to Task A estimated. Important weights have further changes penalized during Task B training, while other, less important weights train normally. Both paths feed into a model that learns Task B while retaining Task A performance.</desc>
  <rect width="1500" height="620" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">EWC slows learning only on the weights that mattered before</text>
  <defs><marker id="arrow-7-4-ewc-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-7-4-ewc-cross" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><rect x="560" y="90" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="118.925" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Model has already learned</text><text x="750" y="135.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Task A</text><line x1="750" y1="160" x2="750" y2="210" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-ewc-main)"/><rect x="560" y="210" width="380" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="239.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Estimate each weight’s</text><text x="750" y="255.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">importance to Task A</text><line x1="750" y1="280" x2="750" y2="330" stroke="#5b8fc9" stroke-width="2"/><line x1="420" y1="330" x2="1080" y2="330" stroke="#5b8fc9" stroke-width="2"/><line x1="420" y1="330" x2="420" y2="370" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-ewc-main)"/><line x1="1080" y1="330" x2="1080" y2="370" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-ewc-main)"/><rect x="220" y="370" width="400" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="420" y="409.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Important weights: changes</text><text x="420" y="425.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">penalized (EWC)</text><rect x="880" y="370" width="400" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1080" y="409.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Other weights: train</text><text x="1080" y="425.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">normally on Task B</text><line x1="420" y1="460" x2="420" y2="490" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1080" y1="460" x2="1080" y2="490" stroke="#5b8fc9" stroke-width="1.4"/><line x1="420" y1="490" x2="1080" y2="490" stroke="#5b8fc9" stroke-width="1.4"/><line x1="750" y1="490" x2="750" y2="510" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-4-ewc-main)"/><rect x="560" y="510" width="380" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="750" y="546.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Model learns Task B</text><text x="750" y="571.0500000000001" text-anchor="middle" font-size="10.5" fill="#6b7280">and retains Task A performance</text>
</svg>