<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-t5bart desc-t5bart">
  <title id="title-t5bart">T5 and BART share an encoder-decoder shape but differ in what the decoder must reconstruct</title>
  <desc id="desc-t5bart">T5 corrupts a contiguous span of the input and its decoder generates only that missing span. BART corrupts the input with several kinds of noise (masking, shuffling) and its decoder must reconstruct the entire original document. Both use the same bidirectional encoder plus causal decoder architecture.</desc>
  <defs></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two pretraining recipes, one shared architecture</text>
  <text x="340" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">T5: span corruption</text><rect x="130" y="150" width="110" height="46" rx="6" fill="#ffffff" stroke="#104281" stroke-width="1.2"/><text x="185" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">the</text><rect x="250" y="150" width="110" height="46" rx="6" fill="#ffffff" stroke="#104281" stroke-width="1.2"/><text x="305" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">quick</text><rect x="370" y="150" width="110" height="46" rx="6" fill="#184f95" stroke="#104281" stroke-width="1.2"/><text x="425" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">[X]</text><rect x="490" y="150" width="110" height="46" rx="6" fill="#ffffff" stroke="#104281" stroke-width="1.2"/><text x="545" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">over</text><text x="340" y="230" text-anchor="middle" font-size="12" fill="#52514e">decoder generates ONLY the missing span:</text><rect x="190" y="245" width="300" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.5"/><text x="340" y="271.3333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">"brown fox jumps"</text><text x="340" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">BART: denoising autoencoder</text><rect x="100" y="340" width="92" height="46" rx="6" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="146" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">jumps</text><rect x="200" y="340" width="92" height="46" rx="6" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="246" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">the</text><rect x="300" y="340" width="92" height="46" rx="6" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="346" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">[MASK]</text><rect x="400" y="340" width="92" height="46" rx="6" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="446" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">fox</text><rect x="500" y="340" width="92" height="46" rx="6" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="546" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">..</text><text x="290" y="332" text-anchor="middle" font-size="11" fill="#a33a2f">shuffled + masked (multiple noise types)</text><text x="340" y="420" text-anchor="middle" font-size="12" fill="#52514e">decoder reconstructs the WHOLE original document:</text><rect x="130" y="435" width="420" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.5"/><text x="340" y="461.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">"the quick brown fox jumps over"</text><rect x="800" y="200" width="420" height="160" rx="8" fill="#0d2c4e" stroke="#104281" stroke-width="1.5"/><text x="1010" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Same architecture shape</text><text x="1010" y="265" text-anchor="middle" font-size="12.5" fill="#cde2fb">Both: bidirectional encoder +</text><text x="1010" y="285" text-anchor="middle" font-size="12.5" fill="#cde2fb">causal decoder (3.3)</text><text x="1010" y="315" text-anchor="middle" font-size="12" fill="#9fb8d6">The difference is what the decoder</text><text x="1010" y="333" text-anchor="middle" font-size="12" fill="#9fb8d6">is trained to reconstruct, not the shape.</text>
</svg>