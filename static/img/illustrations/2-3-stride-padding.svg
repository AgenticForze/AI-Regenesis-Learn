  <rect x="90" y="400" width="1020" height="55" rx="8" fill="#eaf2fc" stroke="#184f95" stroke-width="1.5"/>
  <text x="600" y="425" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">out = floor((W - F + 2P) / S) + 1</text>
