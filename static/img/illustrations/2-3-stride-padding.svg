<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-sp desc-sp">
  <title id="title-sp">Stride and padding both change a convolution's output size</title>
  <desc id="desc-sp">Left: same padding adds a border of zeros (shown light gray) around a 6x6 input so a stride-1 convolution's output stays 6x6. Right: valid padding adds no border, and a stride of 2 skips every other position on a 7x7 input, producing a smaller 3x3 output.</desc>
  <rect width="1200" height="480" fill="#fcfcfb"/>
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Stride and padding both change the output size</text>

