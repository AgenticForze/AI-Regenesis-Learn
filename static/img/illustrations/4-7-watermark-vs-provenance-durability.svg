<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-7-durability desc-4-7-durability">
  <title id="title-4-7-durability">Durability under editing: watermark versus provenance metadata</title>
  <desc id="desc-4-7-durability">A side-by-side comparison showing a watermark surviving editing and re-export on the left, against a C2PA provenance manifest being silently stripped by a screenshot or re-export on the right.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Durability under editing: watermark versus provenance metadata</text>
  <defs><marker id="arrow-4-7-durability" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker><marker id="arrow-4-7-durability-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33a2f"/></marker></defs><rect x="100" y="130" width="260" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="230" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Original content</text><text x="230" y="189" text-anchor="middle" font-size="11.5" fill="#52514e">watermark embedded</text><rect x="100" y="300" width="260" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="230" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Edited / re-exported</text><text x="230" y="359" text-anchor="middle" font-size="11.5" fill="#52514e">watermark still detectable</text><line x1="230.0" y1="220.0" x2="230.0" y2="300.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-durability)"/><text x="400" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#184f95">Signal survives</text><rect x="620" y="130" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="770" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Original content</text><text x="770" y="189" text-anchor="middle" font-size="11.5" fill="#52514e">C2PA manifest attached</text><rect x="620" y="300" width="300" height="90" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="770" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Screenshot / re-export</text><text x="770" y="359" text-anchor="middle" font-size="11.5" fill="#52514e">manifest silently stripped</text><line x1="770" y1="220" x2="770" y2="300" stroke="#a33a2f" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-4-7-durability-red)"/><text x="970" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Metadata can be lost</text><rect x="60" y="450" width="1240" height="110" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="490" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">A watermark embedded in pixel data or token choices travels with the content through most common</text><text x="680" y="507.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">editing. A C2PA manifest is metadata attached alongside the content: a screenshot, re-export, or</text><text x="680" y="525" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">platform re-encoding pipeline can strip it entirely while leaving the underlying content unchanged.</text>
</svg>