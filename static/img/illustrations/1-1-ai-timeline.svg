<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Six eras of AI history, 1950s to present</title>
  <desc id="desc">A horizontal timeline showing six eras — rule-based AI, expert systems, statistical machine learning, deep learning, generative AI, and agentic AI — with two AI winters marked as dips between the first three eras.</desc>

  <rect x="0" y="0" width="1000" height="380" rx="12" fill="#fcfcfb" />

  <!-- baseline -->
  <line x1="40" y1="230" x2="960" y2="230" stroke="#c3c2b7" stroke-width="2" />

  <!-- era blocks: ordinal sequential-blue steps, no lighter than step 250 -->
  <!-- Era 1: Rule-Based AI -->
  <rect x="40" y="150" width="130" height="80" rx="6" fill="#86b6ef" />
  <text x="105" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Rule-Based</text>
  <text x="105" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">AI</text>
  <text x="105" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">1950s&#8211;early 70s</text>

  <!-- Winter 1 -->
  <line x1="185" y1="180" x2="185" y2="280" stroke="#898781" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="245" y1="180" x2="245" y2="280" stroke="#898781" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="215" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#898781">AI Winter I</text>
  <text x="215" y="295" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781">1974&#8211;1980</text>

  <!-- Era 2: Expert Systems -->
  <rect x="260" y="150" width="130" height="80" rx="6" fill="#5598e7" />
  <text x="325" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Expert</text>
  <text x="325" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Systems</text>
  <text x="325" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">1980s</text>

  <!-- Winter 2 -->
  <line x1="405" y1="180" x2="405" y2="280" stroke="#898781" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="465" y1="180" x2="465" y2="280" stroke="#898781" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="435" y="140" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#898781">AI Winter II</text>
  <text x="435" y="295" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#898781">1987&#8211;1993</text>

  <!-- Era 3: Statistical ML -->
  <rect x="480" y="150" width="130" height="80" rx="6" fill="#2a78d6" />
  <text x="545" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Statistical</text>
  <text x="545" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">ML</text>
  <text x="545" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">1990s&#8211;2010</text>

  <!-- Era 4: Deep Learning -->
  <rect x="620" y="150" width="115" height="80" rx="6" fill="#1c5cab" />
  <text x="677" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Deep</text>
  <text x="677" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Learning</text>
  <text x="677" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">2012&#8211;2017</text>

  <!-- Era 5: Generative AI -->
  <rect x="745" y="150" width="115" height="80" rx="6" fill="#184f95" />
  <text x="802" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Generative</text>
  <text x="802" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">AI</text>
  <text x="802" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">2017&#8211;2022</text>

  <!-- Era 6: Agentic AI -->
  <rect x="870" y="150" width="90" height="80" rx="6" fill="#104281" />
  <text x="915" y="185" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Agentic</text>
  <text x="915" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff">AI</text>
  <text x="915" y="255" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">2023&#8211;present</text>

  <!-- axis arrow -->
  <path d="M 955 230 L 965 230 L 958 225 M 965 230 L 958 235" stroke="#c3c2b7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- legend note -->
  <text x="40" y="340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#898781">Darker step = later era, same hue family (ordinal progression). Dashed spans mark AI winters.</text>
</svg>
