<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-speechgen desc-speechgen">
  <title id="title-speechgen">Text-to-speech: a neural audio codec plus an autoregressive language model over audio tokens</title>
  <desc id="desc-speechgen">A reference voice clip is compressed by a neural audio codec into discrete audio tokens. An autoregressive language model, conditioned on both the input text and the reference-voice tokens, predicts new audio tokens one at a time, producing speech in the reference voice, the same causal generation mechanism used for text.</desc>
  <defs><marker id="arr44d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Speech generation via audio tokens, not diffusion</text>
  <rect x="80" y="240" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="190" y="281" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Raw audio</text><text x="190" y="299" text-anchor="middle" font-size="11" fill="#52514e">reference voice clip</text><rect x="380" y="240" width="240" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="500" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Neural audio codec</text><text x="500" y="299" text-anchor="middle" font-size="11" fill="#52514e">audio to discrete tokens</text><line x1="300.0" y1="285.0" x2="380.0" y2="285.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44d)"/><rect x="80" y="400" width="220" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="190" y="449.8333333333333" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0b0b0b">Input text</text><rect x="720" y="320" width="280" height="100" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="860" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Autoregressive LM</text><text x="860" y="384" text-anchor="middle" font-size="11" fill="#cde2fb">predicts audio tokens one at a time</text><line x1="620.0" y1="313.3" x2="720.0" y2="336.9" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44d)"/><line x1="300.0" y1="432.7" x2="720.0" y2="385.7" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44d)"/><rect x="1080" y="320" width="200" height="100" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1180" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">New audio tokens</text><text x="1180" y="384" text-anchor="middle" font-size="11" fill="#52514e">in the reference voice</text><line x1="1000.0" y1="370.0" x2="1080.0" y2="370.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr44d)"/><text x="860" y="480" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Conditioned on both the text and the reference-voice tokens,</text><text x="860" y="500" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">the same causal mechanism (3.3) an LLM uses for text tokens</text><rect x="60" y="540" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="568.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The neural codec plays the same structural role for audio that a tokenizer (3.5) plays for text: it</text><text x="680" y="586.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">defines the discrete vocabulary the autoregressive model actually predicts over.</text>
</svg>