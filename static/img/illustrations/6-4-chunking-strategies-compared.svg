<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-4-chunking desc-6-4-chunking">
  <title id="title-6-4-chunking">Four chunking strategies, four different tradeoffs</title>
  <desc id="desc-6-4-chunking">A four-panel diagram comparing four chunking strategies: fixed-size and recursive splitting, which breaks on a list of separators such as paragraph, line, and word boundaries; semantic chunking, which places boundaries where embedding similarity between sentences drops; parent-document (small-to-big) retrieval, which indexes small chunks but returns larger parent context; and structure-aware chunking, which respects table, code, and list element boundaries identified during ingestion.</desc>
  <rect width="1560" height="700" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Four chunking strategies, four different tradeoffs</text>
  <rect x="50" y="130" width="330" height="76" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="215" y="164.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Fixed-size / recursive</text><text x="215" y="190.125" text-anchor="middle" font-size="10.5" fill="#6b7280">Split on separators</text><rect x="50" y="226" width="330" height="130" rx="8" fill="#fbfaf7" stroke="#e3e1db" stroke-width="1.5"/><rect x="70" y="276" width="54" height="34" rx="4" fill="#ffffff" stroke="#5b8fc9" stroke-width="1.2"/><rect x="128" y="276" width="54" height="34" rx="4" fill="#ffffff" stroke="#5b8fc9" stroke-width="1.2"/><rect x="186" y="276" width="54" height="34" rx="4" fill="#ffffff" stroke="#5b8fc9" stroke-width="1.2"/><rect x="244" y="276" width="54" height="34" rx="4" fill="#ffffff" stroke="#5b8fc9" stroke-width="1.2"/><rect x="302" y="276" width="54" height="34" rx="4" fill="#ffffff" stroke="#5b8fc9" stroke-width="1.2"/><text x="215" y="248" text-anchor="middle" font-size="9.5" fill="#6b7280">equal-length segments</text><text x="215" y="386" text-anchor="middle" font-size="11" fill="#6b7280">Tries "\n\n", "\n", " ", "" in</text><text x="215" y="401.5" text-anchor="middle" font-size="11" fill="#6b7280">order</text><text x="215" y="433" text-anchor="middle" font-size="11" fill="#6b7280">Fast, predictable chunk sizes</text><text x="215" y="464.5" text-anchor="middle" font-size="11" fill="#6b7280">Meaning-blind: paragraph</text><text x="215" y="480" text-anchor="middle" font-size="11" fill="#6b7280">breaks are not topic breaks</text><rect x="416" y="130" width="330" height="76" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="581" y="164.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Semantic</text><text x="581" y="190.125" text-anchor="middle" font-size="10.5" fill="#6b7280">Split on meaning shift</text><rect x="416" y="226" width="330" height="130" rx="8" fill="#fbfaf7" stroke="#e3e1db" stroke-width="1.5"/><rect x="436" y="286" width="36.6" height="34" rx="4" fill="#eaf2fb" stroke="#5b8fc9" stroke-width="1.2"/><rect x="476.6" y="286" width="83" height="34" rx="4" fill="#c9dff5" stroke="#5b8fc9" stroke-width="1.2"/><rect x="563.6" y="286" width="42.4" height="34" rx="4" fill="#8fb9e8" stroke="#5b8fc9" stroke-width="1.2"/><rect x="610" y="286" width="112" height="34" rx="4" fill="#5b8fc9" stroke="#5b8fc9" stroke-width="1.2"/><text x="581" y="248" text-anchor="middle" font-size="9.5" fill="#6b7280">boundaries follow topic shifts</text><text x="581" y="386" text-anchor="middle" font-size="11" fill="#6b7280">Splits where</text><text x="581" y="401.5" text-anchor="middle" font-size="11" fill="#6b7280">sentence-embedding similarity</text><text x="581" y="417" text-anchor="middle" font-size="11" fill="#6b7280">drops</text><text x="581" y="448.5" text-anchor="middle" font-size="11" fill="#6b7280">Chunk boundaries track topic</text><text x="581" y="464" text-anchor="middle" font-size="11" fill="#6b7280">shifts</text><text x="581" y="495.5" text-anchor="middle" font-size="11" fill="#6b7280">An embedding call per</text><text x="581" y="511" text-anchor="middle" font-size="11" fill="#6b7280">sentence; size is</text><text x="581" y="526.5" text-anchor="middle" font-size="11" fill="#6b7280">unpredictable</text><rect x="782" y="130" width="330" height="76" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="947" y="164.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Parent-document</text><text x="947" y="190.125" text-anchor="middle" font-size="10.5" fill="#6b7280">Small-to-big lookup</text><rect x="782" y="226" width="330" height="130" rx="8" fill="#fbfaf7" stroke="#e3e1db" stroke-width="1.5"/><rect x="798" y="240" width="298" height="70" rx="8" fill="none" stroke="#5fae83" stroke-width="1.3" stroke-dasharray="4 3"/><text x="947" y="256" text-anchor="middle" font-size="9.5" fill="#5fae83" font-weight="700">parent document</text><rect x="892" y="272" width="110" height="34" rx="6" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.4"/><text x="947" y="293" text-anchor="middle" font-size="10" fill="#1f2d3d" font-weight="700">small chunk</text><text x="947" y="386" text-anchor="middle" font-size="11" fill="#6b7280">Indexes small chunks, stores a</text><text x="947" y="401.5" text-anchor="middle" font-size="11" fill="#6b7280">parent pointer</text><text x="947" y="433" text-anchor="middle" font-size="11" fill="#6b7280">Precise match, full context on</text><text x="947" y="448.5" text-anchor="middle" font-size="11" fill="#6b7280">retrieval</text><text x="947" y="480" text-anchor="middle" font-size="11" fill="#6b7280">Extra storage and a parent</text><text x="947" y="495.5" text-anchor="middle" font-size="11" fill="#6b7280">lookup at query time</text><rect x="1148" y="130" width="330" height="76" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1313" y="164.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Structure-aware</text><text x="1313" y="190.125" text-anchor="middle" font-size="10.5" fill="#6b7280">Split on elements</text><rect x="1148" y="226" width="330" height="130" rx="8" fill="#fbfaf7" stroke="#e3e1db" stroke-width="1.5"/><rect x="1188" y="244" width="83.33333333333333" height="30" fill="#f6dced" stroke="#c96fa8" stroke-width="1"/><rect x="1271.3333333333333" y="244" width="83.33333333333333" height="30" fill="#f6dced" stroke="#c96fa8" stroke-width="1"/><rect x="1354.6666666666667" y="244" width="83.33333333333333" height="30" fill="#f6dced" stroke="#c96fa8" stroke-width="1"/><rect x="1188" y="274" width="83.33333333333333" height="30" fill="#ffffff" stroke="#c96fa8" stroke-width="1"/><rect x="1271.3333333333333" y="274" width="83.33333333333333" height="30" fill="#ffffff" stroke="#c96fa8" stroke-width="1"/><rect x="1354.6666666666667" y="274" width="83.33333333333333" height="30" fill="#ffffff" stroke="#c96fa8" stroke-width="1"/><rect x="1188" y="304" width="83.33333333333333" height="30" fill="#ffffff" stroke="#c96fa8" stroke-width="1"/><rect x="1271.3333333333333" y="304" width="83.33333333333333" height="30" fill="#ffffff" stroke="#c96fa8" stroke-width="1"/><rect x="1354.6666666666667" y="304" width="83.33333333333333" height="30" fill="#ffffff" stroke="#c96fa8" stroke-width="1"/><rect x="1188" y="244" width="250" height="90" rx="4" fill="none" stroke="#c96fa8" stroke-width="2"/><text x="1313" y="386" text-anchor="middle" font-size="11" fill="#6b7280">Never splits a table row, code</text><text x="1313" y="401.5" text-anchor="middle" font-size="11" fill="#6b7280">block, or list item</text><text x="1313" y="433" text-anchor="middle" font-size="11" fill="#6b7280">Preserves structure plain-text</text><text x="1313" y="448.5" text-anchor="middle" font-size="11" fill="#6b7280">splitters destroy</text><text x="1313" y="480" text-anchor="middle" font-size="11" fill="#6b7280">Needs the richer element-aware</text><text x="1313" y="495.5" text-anchor="middle" font-size="11" fill="#6b7280">ingestion pass</text>
</svg>