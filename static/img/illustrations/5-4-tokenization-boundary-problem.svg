<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-4-boundary desc-5-4-boundary">
  <title id="title-5-4-boundary">The tokenization-boundary problem</title>
  <desc id="desc-5-4-boundary">A diagram showing the target string composed of three open brackets, which can tokenize as three separate single-bracket tokens or as one combined token, both resolved by compiling a tokenizer-specific concrete grammar rather than relying on a character-level grammar alone.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The tokenization-boundary problem</text>
  <defs><marker id="arrow-5-4-boundary" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="100" y="110" width="420" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="310" y="130.8" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Character-level</text><text x="310" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">grammar</text><text x="310" y="184" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">reasons about "[", "[",</text><text x="310" y="199.6" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">"["</text><rect x="620" y="110" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="770" y="156.4" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Target string: "[[["</text><rect x="100" y="280" width="500" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="350" y="315.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Tokenization A</text><text x="350" y="349.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">three tokens: [ , [ , [</text><rect x="700" y="280" width="500" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="950" y="315.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Tokenization B</text><text x="950" y="349.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">one combined token: [[[</text><line x1="662.0" y1="200.0" x2="470.0" y2="280.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-boundary)"/><line x1="816.3" y1="200.0" x2="898.6" y2="280.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-boundary)"/><rect x="420" y="440" width="520" height="100" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="466.45" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Tokenizer-specific</text><text x="680" y="484" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">concrete grammar</text><text x="680" y="518.35" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">compiled once per tokenizer,</text><text x="680" y="533.95" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">resolves the ambiguity</text><line x1="453.1" y1="380.0" x2="576.9" y2="440.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-boundary)"/><line x1="865.6" y1="380.0" x2="764.4" y2="440.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-boundary)"/><rect x="60" y="570" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="590" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Geng et al., 2023: the same string can tokenize more than one way under BPE-style tokenizers, so a</text><text x="680" y="607.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">purely character-level grammar cannot alone determine which token-level completions the model's own</text><text x="680" y="625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">vocabulary supports.</text>
</svg>