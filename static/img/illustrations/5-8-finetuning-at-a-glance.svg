<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-8-ft desc-5-8-ft">
  <title id="title-5-8-ft">Fine-tuning at a glance: training updates the weights themselves</title>
  <desc id="desc-5-8-ft">A diagram showing a pretrained base model and a set of labeled training examples of the target task both feeding into an additional training step that updates the model's own weights, producing a model that no longer needs the target behavior re-explained in every request.</desc>
  <defs></defs>
  <rect width="1400" height="560" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Fine-tuning at a glance: training updates the weights themselves</text>
  <defs><marker id="arrow-5-8-ft" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="130" width="320" height="110" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="240" y="162.1" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Pretrained base</text><text x="240" y="179" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">model</text><text x="240" y="212.25" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">general-purpose</text><text x="240" y="227.2" text-anchor="middle" font-size="11.5" font-weight="400" fill="#ffffff">weights</text><rect x="480" y="130" width="320" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="640" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Labeled training</text><text x="640" y="186.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">examples of the</text><text x="640" y="202.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">target task</text><rect x="440" y="330" width="320" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="600" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Additional training</text><text x="600" y="386.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">updates the model's</text><text x="600" y="402.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">weights</text><line x1="339.0" y1="240.0" x2="501.0" y2="330.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-ft)"/><line x1="629.0" y1="240.0" x2="611.0" y2="330.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-ft)"/><rect x="1040" y="330" width="300" height="110" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1190" y="362.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">A model that no</text><text x="1190" y="378.40000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">longer needs the</text><text x="1190" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">behavior</text><text x="1190" y="409.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">re-explained</text><line x1="760.0" y1="385.0" x2="1040.0" y2="385.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-ft)"/><rect x="60" y="470" width="1280" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="491.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">LoRA (Hu et al., 2021) is a lower-cost variant: it "freezes the pre-trained model weights and</text><text x="700" y="508.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">injects trainable rank decomposition matrices," reporting a 10,000x reduction in trainable</text><text x="700" y="526.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">parameters against full fine-tuning of GPT-3 175B. How LoRA and full fine-tuning actually work is</text><text x="700" y="543.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">covered in Phase 7.</text>
</svg>