<svg width="1600" height="930" viewBox="0 0 1600 930" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-2-decision-flow desc-5-2-decision-flow">
  <title id="title-5-2-decision-flow">Choosing a reasoning-elicitation pattern for a task</title>
  <desc id="desc-5-2-decision-flow">A decision-flow diagram branching from a task needing multi-step reasoning into whether the model is large enough for chain-of-thought to help, then whether worked examples are available, then whether a single reasoning path is reliable enough to warrant self-consistency or tree-of-thought, with a separate branch on whether a reviewer needs to trust the reasoning trace itself.</desc>
  <defs></defs>
  <rect width="1600" height="930" fill="#fcfcfb"/>
  <text x="800" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing a reasoning-elicitation pattern for a task</text>
  <defs><marker id="arrow-5-2-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="630" y="90" width="340" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="800" y="117.85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Task needs multi-step</text><text x="800" y="134.75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">reasoning</text><rect x="630" y="215" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="790" y="250.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Is the model roughly</text><text x="790" y="266.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">100B+ parameters?</text><line x1="797.4" y1="160.0" x2="793.2" y2="215.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-decision)"/><rect x="1300" y="215" width="280" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1440" y="242.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Must a reviewer</text><text x="1440" y="258.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">trust the trace</text><text x="1440" y="275" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">itself?</text><line x1="969.1" y1="160.0" x2="1300.0" y2="228.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-decision)"/><rect x="200" y="350" width="260" height="85" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="330" y="370.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use standard</text><text x="330" y="386.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">prompting</text><text x="330" y="418.65" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">CoT may not help, or</text><text x="330" y="432.95" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">could hurt</text><line x1="645.2" y1="300.0" x2="460.0" y2="354.3" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-2-decision)"/><rect x="700" y="350" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="860" y="385.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Are worked reasoning</text><text x="860" y="401.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">examples available?</text><line x1="812.0" y1="300.0" x2="838.0" y2="350.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-decision)"/><rect x="1300" y="350" width="280" height="95" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1440" y="375.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Treat the trace as a</text><text x="1440" y="391.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">coaching tool</text><text x="1440" y="423.65" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">not proof of faithful</text><text x="1440" y="437.95" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">reasoning</text><line x1="1440.0" y1="300.0" x2="1440.0" y2="350.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-2-decision)"/><rect x="520" y="485" width="260" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="650" y="510.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Try zero-shot CoT</text><text x="650" y="543.025" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">"Let's think step by</text><text x="650" y="557.3249999999999" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">step"</text><line x1="792.6" y1="435.0" x2="713.4" y2="485.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-2-decision)"/><rect x="830" y="485" width="260" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="960" y="518.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use few-shot</text><text x="960" y="534.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">chain-of-thought</text><line x1="892.1" y1="435.0" x2="929.8" y2="485.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-decision)"/><rect x="830" y="615" width="320" height="85" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="990" y="650.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Is a single reasoning</text><text x="990" y="666.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">path reliable enough?</text><line x1="969.1" y1="565.0" x2="980.4" y2="615.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-decision)"/><rect x="650" y="750" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="790" y="772.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Apply</text><text x="790" y="789" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">self-consistency</text><text x="790" y="821.15" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">sample paths, majority</text><text x="790" y="835.4499999999999" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">vote</text><line x1="928.2" y1="700.0" x2="855.5" y2="750.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-2-decision)"/><rect x="980" y="750" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1120" y="772.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Apply</text><text x="1120" y="789" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">tree-of-thought</text><text x="1120" y="821.15" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">search with backtracking</text><line x1="1030.2" y1="700.0" x2="1077.5" y2="750.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-2-decision)"/>
</svg>