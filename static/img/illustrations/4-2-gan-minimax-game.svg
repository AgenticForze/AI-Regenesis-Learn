<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-ganminimax desc-ganminimax">
  <title id="title-ganminimax">A GAN trains a generator and discriminator against each other in a minimax game</title>
  <desc id="desc-ganminimax">A generator turns random noise into a fake sample, which along with real training samples is fed to a discriminator that tries to classify each as real or fake. A dashed feedback path, routed clear of the other boxes, shows the generator being trained to better fool the discriminator over time.</desc>
  <defs><marker id="arr42b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker><marker id="arr42c" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33a2f"/></marker></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Generator and discriminator, trained against each other</text>
  <rect x="80" y="190" width="160" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="160" y="239.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Random noise</text><rect x="340" y="190" width="200" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="440" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Generator</text><text x="440" y="249" text-anchor="middle" font-size="11" fill="#52514e">produces a fake sample</text><rect x="640" y="90" width="200" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="740" y="139.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Fake sample</text><rect x="640" y="290" width="200" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="740" y="339.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Real training sample</text><rect x="940" y="190" width="220" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1050" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Discriminator</text><text x="1050" y="249" text-anchor="middle" font-size="11" fill="#52514e">real or fake?</text><line x1="240.0" y1="235.0" x2="340.0" y2="235.0" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42b)"/><line x1="540.0" y1="201.7" x2="640.0" y2="168.3" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42b)"/><line x1="840.0" y1="167.3" x2="940.0" y2="199.5" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42b)"/><line x1="840.0" y1="302.7" x2="940.0" y2="270.5" stroke="#898781" stroke-width="2.2" marker-end="url(#arr42b)"/><path d="M 1050 380 L 1050 450 L 440 450 L 440 280" fill="none" stroke="#a33a2f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr42c)"/><text x="770" y="474" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Train generator to fool the discriminator</text><rect x="60" y="500" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="530" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">At the game's theoretical equilibrium, the generator's output distribution matches the real data</text><text x="680" y="547.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">distribution exactly; in practice this equilibrium is hard to reach reliably, which is the deeper</text><text x="680" y="565" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">source of mode collapse and training instability.</text>
</svg>