<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-wpscore desc-wpscore">
  <title id="title-wpscore">WordPiece and BPE can rank the same candidate pairs in a different order</title>
  <desc id="desc-wpscore">BPE ranks candidate merges purely by how often the pair occurs. WordPiece ranks by how much merging the pair increases the training data likelihood, a criterion close to pointwise mutual information, which can promote a rarer but more mutually predictive pair ahead of a more frequent one.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two different scoring rules over the same candidate pairs</text>
  <text x="340" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">BPE: rank by raw frequency</text><text x="1020" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">WordPiece: rank by likelihood gain</text><rect x="60" y="120" width="560" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><circle cx="96" cy="165" r="18" fill="#2a78d6"/><text x="96" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="130" y="154" font-size="15" font-weight="700" fill="#0b0b0b" font-family="monospace">"t" + "h"</text><text x="130" y="180" font-size="12" fill="#52514e">count = 9,400</text><rect x="60" y="226" width="560" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><circle cx="96" cy="271" r="18" fill="#cde2fb"/><text x="96" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#0d2c4e">2</text><text x="130" y="260" font-size="15" font-weight="700" fill="#0b0b0b" font-family="monospace">"i" + "n"</text><text x="130" y="286" font-size="12" fill="#52514e">count = 8,100</text><rect x="60" y="332" width="560" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><circle cx="96" cy="377" r="18" fill="#cde2fb"/><text x="96" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#0d2c4e">6</text><text x="130" y="366" font-size="15" font-weight="700" fill="#0b0b0b" font-family="monospace">"q" + "u"</text><text x="130" y="392" font-size="12" fill="#52514e">count = 410</text><rect x="740" y="120" width="560" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><circle cx="776" cy="165" r="18" fill="#2a78d6"/><text x="776" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="810" y="154" font-size="15" font-weight="700" fill="#0b0b0b" font-family="monospace">"q" + "u"</text><text x="810" y="180" font-size="12" fill="#52514e">count(qu) / [count(q)·count(u)] very high</text><rect x="740" y="226" width="560" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><circle cx="776" cy="271" r="18" fill="#cde2fb"/><text x="776" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#0d2c4e">2</text><text x="810" y="260" font-size="15" font-weight="700" fill="#0b0b0b" font-family="monospace">"t" + "h"</text><text x="810" y="286" font-size="12" fill="#52514e">count(th) / [count(t)·count(h)] moderate</text><rect x="740" y="332" width="560" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><circle cx="776" cy="377" r="18" fill="#cde2fb"/><text x="776" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#0d2c4e">3</text><text x="810" y="366" font-size="15" font-weight="700" fill="#0b0b0b" font-family="monospace">"i" + "n"</text><text x="810" y="392" font-size="12" fill="#52514e">count(in) / [count(i)·count(n)] moderate</text><rect x="60" y="470" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Same toy corpus, different merge order: WordPiece can promote a rarer pair ahead of a more frequent</text><text x="680" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">one when it is more mutually predictive.</text>
</svg>