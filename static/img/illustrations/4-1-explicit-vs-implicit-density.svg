<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-densitysplit desc-densitysplit">
  <title id="title-densitysplit">Explicit-density models compute a real probability per output; implicit-density models never do</title>
  <desc id="desc-densitysplit">Two panels. The left panel shows an explicit-density model as a bar chart of a computed probability distribution over possible outputs, representative of an autoregressive LLM. The right panel shows an implicit-density model as a generator network and a discriminator network in an adversarial setup, with no probability distribution computed anywhere, representative of a GAN.</desc>
  <defs><marker id="arr41a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">A further split among generative models</text>
  <rect x="100" y="120" width="520" height="320" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Explicit-density model</text><rect x="160" y="368" width="50" height="22" fill="#5598e7" rx="3"/><rect x="230" y="337.2" width="50" height="52.800000000000004" fill="#5598e7" rx="3"/><rect x="300" y="222.79999999999998" width="50" height="167.20000000000002" fill="#5598e7" rx="3"/><rect x="370" y="293.2" width="50" height="96.80000000000001" fill="#5598e7" rx="3"/><rect x="440" y="324" width="50" height="66" fill="#5598e7" rx="3"/><rect x="510" y="354.8" width="50" height="35.2" fill="#5598e7" rx="3"/><line x1="140" y1="390" x2="580" y2="390" stroke="#898781" stroke-width="1.5"/><text x="360" y="160" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">A real probability is computed</text><text x="360" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">for every possible next token</text><text x="360" y="470" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Example: an autoregressive LLM.</text><text x="360" y="490" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Perplexity (3.3) audits these probabilities directly.</text><rect x="740" y="120" width="520" height="320" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Implicit-density model</text><rect x="800" y="180" width="170" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="885" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Generator</text><text x="885" y="234" text-anchor="middle" font-size="11" fill="#52514e">produces samples</text><rect x="1030" y="180" width="170" height="80" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1115" y="216" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Discriminator</text><text x="1115" y="234" text-anchor="middle" font-size="11" fill="#52514e">real or fake?</text><line x1="970" y1="220" x2="1030" y2="220" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr41a)"/><text x="1000" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">No probability is ever computed;</text><text x="1000" y="338" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">only whether a sample looks convincing</text><text x="1000" y="470" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Example: a GAN (4.2).</text><text x="1000" y="490" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Nothing here can be interrogated for confidence.</text><rect x="60" y="530" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="553.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">An explicit-density model's output can be interrogated for how confident it was; an implicit-density</text><text x="680" y="571.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">model's output cannot, because no probability was ever computed.</text>
</svg>