<svg width="1560" height="720" viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-10-overview desc-6-10-overview">
  <title id="title-6-10-overview">A common export format for three incompatible knowledge sources</title>
  <desc id="desc-6-10-overview">A diagram showing three different internal knowledge sources, a metadata catalog, a wiki, and a code repository, each exporting its knowledge as an OKF bundle, a directory of markdown files with YAML frontmatter, which any OKF-aware ingestion pipeline or agent can then read without a custom connector for each individual source system.</desc>
  <rect width="1560" height="720" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">A common export format for three incompatible knowledge sources</text>
