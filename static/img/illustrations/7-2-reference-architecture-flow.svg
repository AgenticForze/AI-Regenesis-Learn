<svg width="1400" height="780" viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-2-mech desc-7-2-mech">
  <title id="title-7-2-mech">Where a LoRA update lives inside a transformer layer</title>
  <desc id="desc-7-2-mech">A diagram showing input activations flowing into both a frozen pretrained weight matrix and a trainable low-rank matrix pair, A and B. Their outputs are summed to produce the layer output during training. Before serving, the low-rank update is merged directly into the frozen weight matrix, producing a single updated weight matrix with no extra inference latency.</desc>
  <rect width="1400" height="780" fill="#fbfaf7"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Where a LoRA update lives inside a transformer layer</text>
  <defs><marker id="arrow-7-2-mech-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="550" y="90" width="300" height="60" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="700" y="122.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Input activations</text><line x1="700" y1="150" x2="700" y2="190" stroke="#5b8fc9" stroke-width="2"/><line x1="370" y1="190" x2="990" y2="190" stroke="#5b8fc9" stroke-width="2"/><line x1="370" y1="190" x2="370" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-mech-main)"/><line x1="990" y1="190" x2="990" y2="220" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-mech-main)"/><rect x="160" y="220" width="420" height="90" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="370" y="253.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Frozen pretrained weight</text><text x="370" y="269.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">matrix W</text><text x="370" y="293.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">never updated</text><rect x="780" y="220" width="420" height="90" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="990" y="253.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Trainable low-rank matrix A</text><text x="990" y="269.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">(rank r)</text><text x="990" y="293.09999999999997" text-anchor="middle" font-size="10.5" fill="#6b7280">the only parameters trained</text><line x1="990" y1="310" x2="990" y2="350" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-mech-main)"/><rect x="780" y="350" width="420" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="990" y="392.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Trainable low-rank matrix B</text><line x1="370" y1="310" x2="640" y2="470" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-mech-main)"/><line x1="990" y1="430" x2="760" y2="470" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-2-mech-main)"/><rect x="460" y="470" width="480" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="700" y="512.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Sum: W·x + B·A·x</text><line x1="700" y1="550" x2="700" y2="600" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-2-mech-main)"/><rect x="460" y="600" width="480" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="700" y="628.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Merge before serving: W' = W +</text><text x="700" y="644.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">B·A</text><text x="700" y="668.1" text-anchor="middle" font-size="10.5" fill="#6b7280">no extra inference latency (Hu et al.)</text>
</svg>