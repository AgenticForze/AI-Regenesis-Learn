<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-decodingspectrum desc-decodingspectrum">
  <title id="title-decodingspectrum">Decoding strategies span a spectrum from fully deterministic to fully random</title>
  <desc id="desc-decodingspectrum">A spectrum from fully deterministic on the left to fully random on the right, placing greedy decoding, beam search, temperature plus top-k sampling, and nucleus (top-p) sampling along it in that order.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Trading determinism for variety</text>
  <line x1="140" y1="260" x2="1220" y2="260" stroke="#898781" stroke-width="3"/><text x="140" y="230" text-anchor="start" font-size="14" font-weight="700" fill="#184f95">Fully deterministic</text><text x="1220" y="230" text-anchor="end" font-size="14" font-weight="700" fill="#a33a2f">Fully random</text><circle cx="200" cy="260" r="9" fill="#184f95"/><text x="200" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95">Greedy decoding</text><text x="200" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">always the single</text><text x="200" y="339" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">highest-probability token</text><circle cx="560" cy="260" r="9" fill="#2a78d6"/><text x="560" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2a78d6">Beam search</text><text x="560" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">tracks k candidate</text><text x="560" y="339" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">sequences at once</text><circle cx="920" cy="260" r="9" fill="#5598e7"/><text x="920" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#5598e7">Temperature + top-k</text><text x="920" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">samples from a</text><text x="920" y="339" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">restricted, weighted pool</text><circle cx="1160" cy="260" r="9" fill="#a33a2f"/><text x="1160" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#a33a2f">Nucleus (top-p) sampling</text><text x="1160" y="322" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">pool size adapts to</text><text x="1160" y="339" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">the model's confidence</text><rect x="60" y="400" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="430" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Every strategy answers the same question differently: given a full probability distribution over the</text><text x="680" y="447.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">next token, which token actually gets chosen? Speculative decoding (not shown) sits on a separate</text><text x="680" y="465" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">axis entirely: it changes only how fast the chosen strategy runs, not which tokens it picks.</text>
</svg>