<svg width="1560" height="560" viewBox="0 0 1560 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-3-overview desc-7-3-overview">
  <title id="title-7-3-overview">Four techniques, one progression</title>
  <desc id="desc-7-3-overview">A four-stage progression: instruction tuning shows the model demonstrations of good responses in a supervised stage; RLHF trains a reward model on human preference comparisons and uses reinforcement learning against it; RLAIF replaces the human preference labels with AI-generated ones while keeping the same reward-model-plus-RL structure; DPO removes the reward model and RL loop entirely, applying a classification loss directly to preference pairs.</desc>
  <rect width="1560" height="560" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Four techniques, one progression</text>
  <defs><marker id="arrow-7-3-overview-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="60" y="140" width="340" height="110" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="230" y="191.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Instruction tuning</text><text x="230" y="217.125" text-anchor="middle" font-size="10.5" fill="#6b7280">supervised demonstrations of good responses</text><rect x="440" y="140" width="340" height="110" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="610" y="191.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">RLHF</text><text x="610" y="217.125" text-anchor="middle" font-size="10.5" fill="#6b7280">reward model + RL, trained on human preference labels</text><line x1="400" y1="195" x2="440" y2="195" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-overview-main)"/><rect x="820" y="140" width="340" height="110" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="990" y="191.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">RLAIF</text><text x="990" y="217.125" text-anchor="middle" font-size="10.5" fill="#6b7280">same reward model + RL, AI preference labels instead</text><line x1="780" y1="195" x2="820" y2="195" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-overview-main)"/><rect x="1200" y="140" width="340" height="110" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1370" y="191.625" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">DPO</text><text x="1370" y="217.125" text-anchor="middle" font-size="10.5" fill="#6b7280">no reward model, no RL: a classification loss on pairs</text><line x1="1160" y1="195" x2="1200" y2="195" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-overview-main)"/><rect x="60" y="320" width="1480" height="130" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="800" y="352" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="700">Each stage keeps something from the one before it and removes or replaces one piece of machinery.</text><text x="800" y="378" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="400">RLHF adds a reward model and reinforcement learning on top of instruction tuning.</text><text x="800" y="404" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="400">RLAIF keeps that structure but swaps the human labeler for an AI one.</text><text x="800" y="430" text-anchor="middle" font-size="13" fill="#1f2d3d" font-weight="400">DPO keeps the preference data but removes the reward model and RL loop entirely.</text>
</svg>