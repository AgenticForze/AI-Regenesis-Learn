<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-8-combine desc-5-8-combine">
  <title id="title-5-8-combine">Why RAG alone is not always enough</title>
  <desc id="desc-5-8-combine">A diagram showing a query and a retrieval step that returns one relevant document and one irrelevant distractor; an untuned generator may pick the distractor or ignore both, producing an ungrounded or miscited answer, while a generator that was fine-tuned with a RAFT-style recipe learns to prefer the genuinely relevant document and cite it, producing a grounded answer with a correct citation.</desc>
  <defs></defs>
  <rect width="1400" height="620" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Why RAG alone is not always enough</text>
  <defs><marker id="arrow-5-8-combine" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="530" y="90" width="340" height="80" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="131.3" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A query arrives</text><rect x="500" y="220" width="400" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Retrieval returns a</text><text x="700" y="266.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">relevant document and an</text><text x="700" y="282.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">irrelevant distractor</text><line x1="700.0" y1="170.0" x2="700.0" y2="220.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-combine)"/><rect x="140" y="380" width="340" height="100" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="310" y="407.8" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">An untuned generator</text><text x="310" y="423.40000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">may pick the</text><text x="310" y="439" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">distractor, or</text><text x="310" y="454.6" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">ignore both</text><rect x="920" y="380" width="340" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1090" y="407.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">A RAFT-tuned</text><text x="1090" y="423.40000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">generator learns to</text><text x="1090" y="439" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">prefer the relevant</text><text x="1090" y="454.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">document and cite it</text><line x1="593.6" y1="310.0" x2="428.2" y2="380.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-combine)"/><line x1="806.4" y1="310.0" x2="971.8" y2="380.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-combine)"/><rect x="140" y="530" width="340" height="70" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="310" y="558.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Ungrounded or</text><text x="310" y="574.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">miscited answer</text><line x1="310.0" y1="480.0" x2="310.0" y2="530.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-8-combine)"/><rect x="920" y="530" width="340" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1090" y="558.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Grounded answer with</text><text x="1090" y="574.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">a correct citation</text><line x1="1090.0" y1="480.0" x2="1090.0" y2="530.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-8-combine)"/>
</svg>