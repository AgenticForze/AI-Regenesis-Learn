<svg width="1300" height="760" viewBox="0 0 1300 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-5-chain desc-5-5-chain">
  <title id="title-5-5-chain">A concrete authority hierarchy: OpenAI's model spec</title>
  <desc id="desc-5-5-chain">A diagram showing four tiers of authority in descending order: Platform, the highest, set by OpenAI itself and unable to be overridden; Developer, the system-role instructions setting an application's rules; User, operating within developer-set rules; and Guideline, the lowest tier, with a separate note that assistant and tool messages carry no authority at all in this scheme.</desc>
  <defs></defs>
  <rect width="1300" height="760" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">A concrete authority hierarchy: OpenAI's model spec</text>
  <defs><marker id="arrow-5-5-chain" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="370" y="60" width="560" height="90" rx="8" fill="#0d2c4e" stroke="#0d2c4e" stroke-width="1.5"/><text x="650" y="89.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Platform</text><text x="650" y="125.55" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">OpenAI-set rules, cannot be overridden</text><rect x="370" y="175" width="560" height="90" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="650" y="204.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Developer</text><text x="650" y="240.55" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">System-role instructions, sets the</text><text x="650" y="256.15000000000003" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">application's rules</text><rect x="370" y="290" width="560" height="90" rx="8" fill="#5598e7" stroke="#5598e7" stroke-width="1.5"/><text x="650" y="319.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">User</text><text x="650" y="355.55" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">Operates within developer-set rules</text><rect x="370" y="405" width="560" height="90" rx="8" fill="#cde2fb" stroke="#cde2fb" stroke-width="1.5"/><text x="650" y="434.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Guideline</text><text x="650" y="470.55" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Lowest authority tier</text><line x1="650.0" y1="150.0" x2="650.0" y2="175.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-chain)"/><line x1="650.0" y1="265.0" x2="650.0" y2="290.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-chain)"/><line x1="650.0" y1="380.0" x2="650.0" y2="405.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-chain)"/><rect x="370" y="540" width="560" height="75" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="650" y="553.3" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">Assistant and tool</text><text x="650" y="571.5" text-anchor="middle" font-size="14" font-weight="700" fill="#a33a2f">messages</text><text x="650" y="606.5" text-anchor="middle" font-size="12" font-weight="400" fill="#a33a2f">no authority at all</text><rect x="60" y="640" width="1180" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="668.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">OpenAI model spec: "Instructions with higher authority override those with lower authority."</text><text x="650" y="686.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Assistant and tool messages carry no authority in this scheme at all.</text>
</svg>