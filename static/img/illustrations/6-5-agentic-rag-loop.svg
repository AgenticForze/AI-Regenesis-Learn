<svg width="1500" height="760" viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-5-loop desc-6-5-loop">
  <title id="title-6-5-loop">The agentic loop: retrieval gets more than one attempt</title>
  <desc id="desc-6-5-loop">A diagram showing a query, optionally decomposed into sub-questions, feeding retrieval and reranking, which feeds a reason-and-critique step, either ReAct-style interleaved reasoning or Self-RAG-style reflection tokens, which decides whether the evidence is sufficient: if not, a dashed feedback path loops back to retrieval with a refined query, and if so, the pipeline proceeds to grounded generation.</desc>
  <rect width="1500" height="760" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">The agentic loop: retrieval gets more than one attempt</text>
  <defs><marker id="arrow-6-5-loop-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker><marker id="arrow-6-5-loop-back" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c98b3a"/></marker></defs><line x1="230" y1="95" x2="230" y2="690" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="274" height="92" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="417" y="172.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Query</text><text x="417" y="195.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">optionally decomposed into sub-questions</text><rect x="582" y="130" width="274" height="92" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="719" y="164.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Retrieval +</text><text x="719" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">reranking</text><text x="719" y="203.25" text-anchor="middle" font-size="10.5" fill="#6b7280">Ch. 6.3 / 6.4 pipeline</text><rect x="884" y="130" width="274" height="92" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1021" y="172.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Reason + critique</text><text x="1021" y="195.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">ReAct-style reasoning or Self-RAG reflection tokens</text><rect x="1186" y="130" width="274" height="92" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1323" y="172.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Generation</text><text x="1323" y="195.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">grounded answer</text><line x1="554" y1="176" x2="582" y2="176" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-loop-main)"/><line x1="856" y1="176" x2="884" y2="176" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-loop-main)"/><line x1="1158" y1="176" x2="1186" y2="176" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-loop-main)"/><rect x="20" y="156" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">LOOP</text><rect x="884" y="332" width="274" height="70" rx="10" fill="#fbfaf7" stroke="#c98b3a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="1021" y="360" text-anchor="middle" font-size="12" font-weight="700" fill="#c98b3a">Evidence sufficient?</text><text x="1021" y="378" text-anchor="middle" font-size="10.5" fill="#6b7280">no: refine and retrieve again</text><line x1="1021" y1="222" x2="1021" y2="332" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-5-loop-back)"/><path d="M 884 367 L 719 367 L 719 222" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-5-loop-back)"/><rect x="280" y="452" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="484" text-anchor="middle" font-size="12.5" fill="#6b7280">ReAct interleaves reasoning and retrieval turn by turn; Self-RAG trains the model to emit reflection tokens that decide when to retrieve and whether a draft answer is actually supported.</text>
</svg>