<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-threearch desc-threearch">
  <title id="title-threearch">Three architectures, each inherited from one of chapter 3.3's three objectives</title>
  <desc id="desc-threearch">GPT is a decoder-only stack processing prompt and generation in one causal stream. BERT is an encoder-only stack feeding a separate task-specific head. T5/BART pairs an encoder and decoder connected by cross-attention.</desc>
  <defs><marker id="arr34d" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker><marker id="arr34e" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a33a2f"/></marker></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Decoder-only, encoder-only, and encoder-decoder, side by side</text>
  <rect x="60" y="140" width="380" height="330" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="250" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">GPT: decoder-only</text><rect x="120" y="210" width="260" height="170" rx="8" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="250" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">decoder stack</text><text x="250" y="309" text-anchor="middle" font-size="11" fill="#52514e">causal self-attention only</text><text x="250" y="440" text-anchor="middle" font-size="12" fill="#52514e">prompt + generation:</text><text x="250" y="458" text-anchor="middle" font-size="12" fill="#52514e">one causal stream</text><rect x="490" y="140" width="380" height="330" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#2a78d6">BERT: encoder-only</text><rect x="550" y="210" width="260" height="110" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="2"/><text x="680" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">encoder stack</text><text x="680" y="279" text-anchor="middle" font-size="11" fill="#52514e">bidirectional self-attention</text><rect x="570" y="340" width="220" height="50" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">task-specific head</text><line x1="680.0" y1="320.0" x2="680.0" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arr34d)"/><text x="680" y="440" text-anchor="middle" font-size="12" fill="#52514e">bidirectional input,</text><text x="680" y="458" text-anchor="middle" font-size="12" fill="#52514e">task head on top</text><rect x="920" y="140" width="380" height="330" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1110" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#104281">T5/BART: encoder-decoder</text><rect x="950" y="210" width="130" height="100" rx="8" fill="#cde2fb" stroke="#104281" stroke-width="2"/><text x="1015" y="264.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">encoder</text><rect x="1140" y="210" width="130" height="100" rx="8" fill="#ffffff" stroke="#104281" stroke-width="2"/><text x="1205" y="264.1666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">decoder</text><path d="M 1080 260 L 1140 260" stroke="#a33a2f" stroke-width="2" marker-end="url(#arr34e)" fill="none"/><text x="1110" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#a33a2f">cross-attention</text><text x="1110" y="440" text-anchor="middle" font-size="12" fill="#52514e">encoder + decoder,</text><text x="1110" y="458" text-anchor="middle" font-size="12" fill="#52514e">cross-attention between</text>
</svg>