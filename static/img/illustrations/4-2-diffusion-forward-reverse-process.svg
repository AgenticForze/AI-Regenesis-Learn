" fill="#52514e" opacity="0.55"/><circle cx="1091.7" cy="197.3" r="2" fill="#52514e" opacity="0.55"/><circle cx="1158.6" cy="173.2" r="2" fill="#52514e" opacity="0.55"/><circle cx="1201.0" cy="246.2" r="2" fill="#52514e" opacity="0.55"/><circle cx="1141.8" cy="198.2" r="2" fill="#52514e" opacity="0.55"/><circle cx="1222.1" cy="245.6" r="2" fill="#52514e" opacity="0.55"/><circle cx="1215.4" cy="212.7" r="2" fill="#52514e" opacity="0.55"/><circle cx="1087.5" cy="227.7" r="2" fill="#52514e" opacity="0.55"/><circle cx="1114.0" cy="249.5" r="2" fill="#52514e" opacity="0.55"/><circle cx="1152.5" cy="208.1" r="2" fill="#52514e" opacity="0.55"/><circle cx="1108.8" cy="186.3" r="2" fill="#52514e" opacity="0.55"/><circle cx="1194.9" cy="183.1" r="2" fill="#52514e" opacity="0.55"/><circle cx="1099.9" cy="236.8" r="2" fill="#52514e" opacity="0.55"/><text x="125" y="136" font-size="13.5" font-weight="700" fill="#a33a2f">Forward process: add a little noise at each step (fixed, not learned) →</text><text x="125" y="300" font-size="13.5" font-weight="700" fill="#184f95">← Reverse process: a trained network removes a little noise at each step</text><line x1="1075" y1="228" x2="1045" y2="228" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42e)"/><line x1="885" y1="228" x2="855" y2="228" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42e)"/><line x1="695" y1="228" x2="665" y2="228" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42e)"/><line x1="505" y1="228" x2="475" y2="228" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42e)"/><line x1="315" y1="228" x2="285" y2="228" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr42e)"/><text x="135" y="216" font-size="12" font-weight="700" fill="#184f95">Real sample</text><text x="1145" y="216" font-size="12" font-weight="700" fill="#0b0b0b">Pure noise</text><rect x="60" y="350" width="1240" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="375" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The forward process is a simple, fixed recipe for adding Gaussian noise. Only the reverse process is</text><text x="680" y="392.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">learned: a neural network predicts and removes a bit of noise at each step, so running it from pure</text><text x="680" y="410" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">noise produces a new realistic sample.</text>
