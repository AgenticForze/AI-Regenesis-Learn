<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-ru desc-ru">
  <title id="title-ru">A recurrent neural network unrolled across four time steps, the same cell and weights reused at each step</title>
  <desc id="desc-ru">Four identical cell boxes in a row, each labeled Cell (same weights W). Each cell receives an input x at that time step from below and the hidden state from the previous cell from the left, and passes its new hidden state to the next cell on the right and optionally up to an output. A dashed box around all four cells notes that every cell shares the same weight matrices.</desc>
  <rect width="1360" height="660" fill="#fcfcfb"/><text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The same cell and weights are reused at every time step</text><text x="680" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#2a78d6">Same weights (W_hh, W_xh, b) reused at every step</text><rect x="165" y="280" width="950" height="140" rx="10" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="8 6"/><rect x="15" y="328" width="90" height="44" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="60" y="355" text-anchor="middle" font-size="13" fill="#52514e">h_0</text><line x1="105" y1="350" x2="190" y2="350" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="190" y="300" width="150" height="100" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="265" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Cell</text><text x="265" y="366" text-anchor="middle" font-size="11.5" fill="#52514e">t = 1</text><rect x="235" y="455" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="265" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">x_1</text><line x1="265" y1="455" x2="265" y2="400" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="340" y1="350" x2="440" y2="350" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#104281">h_1</text><line x1="265" y1="300" x2="265" y2="225" stroke="#898781" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowgray)"/><text x="265" y="218" text-anchor="middle" font-size="11" fill="#898781">y_1 (optional)</text><rect x="440" y="300" width="150" height="100" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="515" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Cell</text><text x="515" y="366" text-anchor="middle" font-size="11.5" fill="#52514e">t = 2</text><rect x="485" y="455" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="515" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">x_2</text><line x1="515" y1="455" x2="515" y2="400" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="590" y1="350" x2="690" y2="350" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrow)"/><text x="640" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#104281">h_2</text><line x1="515" y1="300" x2="515" y2="225" stroke="#898781" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowgray)"/><text x="515" y="218" text-anchor="middle" font-size="11" fill="#898781">y_2 (optional)</text><rect x="690" y="300" width="150" height="100" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="765" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Cell</text><text x="765" y="366" text-anchor="middle" font-size="11.5" fill="#52514e">t = 3</text><rect x="735" y="455" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="765" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">x_3</text><line x1="765" y1="455" x2="765" y2="400" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="840" y1="350" x2="940" y2="350" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrow)"/><text x="890" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#104281">h_3</text><line x1="765" y1="300" x2="765" y2="225" stroke="#898781" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowgray)"/><text x="765" y="218" text-anchor="middle" font-size="11" fill="#898781">y_3 (optional)</text><rect x="940" y="300" width="150" height="100" rx="10" fill="#86b6ef" stroke="#184f95" stroke-width="2"/><text x="1015" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Cell</text><text x="1015" y="366" text-anchor="middle" font-size="11.5" fill="#52514e">t = 4</text><rect x="985" y="455" width="60" height="34" rx="6" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1015" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">x_4</text><line x1="1015" y1="455" x2="1015" y2="400" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1090" y1="350" x2="1220" y2="350" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1155" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#104281">h_4</text><line x1="1015" y1="300" x2="1015" y2="225" stroke="#898781" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowgray)"/><text x="1015" y="218" text-anchor="middle" font-size="11" fill="#898781">y_4 (optional)</text><rect x="1220" y="328" width="90" height="44" rx="6" fill="#104281" stroke="#104281" stroke-width="1.5"/><text x="1265" y="355" text-anchor="middle" font-size="13" fill="#ffffff">h_4</text><defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
    <marker id="arrowgray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#898781"/></marker>
  </defs><rect x="70" y="525" width="1220" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="558" text-anchor="middle" font-size="12.5" fill="#52514e">Only the hidden state passed between cells changes from step to step; the cell weights themselves do not</text></svg>