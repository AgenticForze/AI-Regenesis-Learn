<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-5-guardrails desc-5-5-guardrails">
  <title id="title-5-5-guardrails">Two kinds of external guardrail</title>
  <desc id="desc-5-5-guardrails">A diagram comparing NeMo Guardrails, a programmable rails framework covering input, dialog, retrieval, execution, and output stages of a conversation, with Llama Guard, a fine-tuned model that classifies a prompt or response into a safety label as a dedicated checkpoint.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two kinds of external guardrail</text>
  <defs><marker id="arrow-5-5-guardrails" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="70" y="90" width="560" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="350" y="104.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">NeMo Guardrails</text><text x="350" y="140.55" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">programmable rails around</text><text x="350" y="156.15" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">a conversation</text><rect x="86" y="220" width="96" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="134" y="251.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Input</text><rect x="194" y="220" width="96" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="242" y="251.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Dialog</text><rect x="302" y="220" width="96" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="350" y="251.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Retrieval</text><rect x="410" y="220" width="96" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="458" y="251.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Execution</text><rect x="518" y="220" width="96" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="566" y="251.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Output</text><text x="350" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Five rail types, configured via</text><text x="350" y="357" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">the Colang DSL, each checking or</text><text x="350" y="374" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">reshaping content at that stage</text><rect x="730" y="90" width="560" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1010" y="104.25" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Llama Guard</text><text x="1010" y="140.55" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">a fine-tuned</text><text x="1010" y="156.15" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">safety-classification</text><text x="1010" y="171.75" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">model</text><rect x="730" y="220" width="160" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="810" y="256.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Prompt</text><rect x="930" y="220" width="160" height="70" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1010" y="256.3" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Llama Guard</text><rect x="1130" y="220" width="160" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1210" y="256.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Safety label</text><line x1="890.0" y1="255.0" x2="930.0" y2="255.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-guardrails)"/><line x1="1090.0" y1="255.0" x2="1130.0" y2="255.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-5-guardrails)"/><text x="1010" y="340" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">A dedicated checkpoint a prompt or</text><text x="1010" y="357" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">response must pass, not a rule the</text><text x="1010" y="374" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">base model must remember</text><rect x="60" y="400" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="438.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Neither guardrail depends on the underlying model having any instruction-hierarchy training; both</text><text x="680" y="456.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">work as an independent layer regardless of what the base model was trained to prioritize.</text>
</svg>