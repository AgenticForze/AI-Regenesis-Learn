<svg width="1400" height="800" viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-3-refarch desc-6-3-refarch">
  <title id="title-6-3-refarch">What a vector database wraps around an ANN index</title>
  <desc id="desc-6-3-refarch">A flow diagram: writes go through an ingestion layer into an ANN index and a metadata store; queries run vector search against the index, an optional sparse keyword search, and a metadata filter, all feeding into a fusion and ranking step that returns ranked results.</desc>
  <defs></defs>
  <rect width="1400" height="800" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">What a vector database wraps around an ANN index</text>
  <defs><marker id="arrow-6-3-refarch" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="120" y="40" width="420" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="330" y="68.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Insert, update, or delete a</text><text x="330" y="84.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">vector + metadata</text><rect x="860" y="40" width="420" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="1070" y="68.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Incoming query: vector, text,</text><text x="1070" y="84.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">filters</text><rect x="120" y="150" width="420" height="60" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="330" y="181.3" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Ingestion layer</text><line x1="330.0" y1="110.0" x2="330.0" y2="150.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><rect x="60" y="260" width="260" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="190" y="296.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">ANN index (Ch. 6.2)</text><line x1="293.5" y1="210.0" x2="232.6" y2="260.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><rect x="340" y="260" width="260" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="470" y="296.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Metadata store</text><line x1="366.5" y1="210.0" x2="427.4" y2="260.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><rect x="620" y="420" width="260" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="750" y="456.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Vector search</text><line x1="1040.5" y1="110.0" x2="779.5" y2="420.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><line x1="312.5" y1="330.0" x2="627.5" y2="420.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-6-3-refarch)"/><rect x="900" y="420" width="220" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1010" y="448.675" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Sparse keyword</text><text x="1010" y="463.625" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">search (optional)</text><line x1="1064.5" y1="110.0" x2="1015.5" y2="420.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><rect x="1140" y="420" width="220" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1250" y="456.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Metadata filter</text><line x1="1086.6" y1="110.0" x2="1233.4" y2="420.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><line x1="600.0" y1="321.7" x2="1140.0" y2="432.4" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-6-3-refarch)"/><rect x="560" y="540" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="730" y="570.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Fusion and ranking</text><text x="730" y="603.675" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">reciprocal rank fusion for</text><text x="730" y="617.9749999999999" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">hybrid search</text><line x1="744.6" y1="490.0" x2="736.9" y2="540.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><line x1="934.6" y1="490.0" x2="826.9" y2="540.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><line x1="1140.0" y1="482.5" x2="900.0" y2="542.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/><rect x="560" y="690" width="340" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="730" y="717.85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Ranked results</text><text x="730" y="734.75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">returned</text><line x1="730.0" y1="630.0" x2="730.0" y2="690.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-refarch)"/>
