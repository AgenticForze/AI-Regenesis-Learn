<svg width="1500" height="660" viewBox="0 0 1500 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-8-precrec desc-6-8-precrec">
  <title id="title-6-8-precrec">Context Precision penalizes rank order; Context Recall penalizes absence</title>
  <desc id="desc-6-8-precrec">A diagram contrasting two retrieval failure modes: a low Context Precision case where a relevant chunk is present in the retrieved set but ranked below an irrelevant one, and a low Context Recall case where a relevant chunk needed to answer the question was never retrieved at all, shown as a missing dashed slot in the retrieved list.</desc>
  <rect width="1500" height="660" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Context Precision penalizes rank order; Context Recall penalizes absence</text>
  <line x1="230" y1="95" x2="230" y2="580" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="130" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="560" y="156.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Low Context Precision</text><text x="560" y="179.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">relevant chunk ranked below an irrelevant one</text><rect x="900" y="130" width="560" height="60" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="156.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Low Context Recall</text><text x="1180" y="179.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">relevant chunk never retrieved at all</text><rect x="280" y="220" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3" /><text x="314" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">1</text><text x="358" y="248" font-size="12" fill="#1f2d3d">Irrelevant chunk</text><rect x="280" y="276" width="560" height="46" rx="7" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.3" /><text x="314" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">2</text><text x="358" y="304" font-size="12" fill="#1f2d3d">Relevant chunk</text><rect x="280" y="332" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3" /><text x="314" y="360" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">3</text><text x="358" y="360" font-size="12" fill="#1f2d3d">Irrelevant chunk</text><rect x="900" y="220" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3" /><text x="934" y="248" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">1</text><text x="978" y="248" font-size="12" fill="#1f2d3d">Irrelevant chunk</text><rect x="900" y="276" width="560" height="46" rx="7" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.3" /><text x="934" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">2</text><text x="978" y="304" font-size="12" fill="#1f2d3d">Irrelevant chunk</text><rect x="900" y="332" width="560" height="46" rx="7" fill="#f6dced" stroke="#c96fa8" stroke-width="1.3" stroke-dasharray="5 4"/><text x="934" y="360" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2d3d">missing</text><text x="978" y="360" font-size="12" fill="#1f2d3d">Relevant chunk never retrieved</text><rect x="280" y="428" width="1180" height="92" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="454" text-anchor="middle" font-size="12.5" fill="#6b7280">Context Precision penalizes rank order: the relevant chunk is present but not first. Context Recall</text><text x="870" y="474" text-anchor="middle" font-size="12.5" fill="#6b7280">penalizes absence entirely: the relevant chunk needed to answer the question is not in the retrieved set at</text><text x="870" y="494" text-anchor="middle" font-size="12.5" fill="#6b7280">all, no matter how the other chunks are ranked.</text>
</svg>