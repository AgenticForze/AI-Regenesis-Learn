<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-rl desc-rl">
  <title id="title-rl">The roofline model: a memory-bound rising line meets a compute-bound flat ceiling at the ridge point</title>
  <desc id="desc-rl">A log-log chart with arithmetic intensity (FLOPs per byte moved) on the horizontal axis and achievable performance on the vertical axis. A diagonal line rising from the origin represents the memory-bandwidth limit; a flat horizontal line represents the hardware's peak compute throughput. The two lines meet at the ridge point. A point for small-batch inference sits on the rising diagonal portion, memory-bound. A point for large-batch training sits further right, near or under the flat ceiling, compute-bound.</desc>
  <rect width="1200" height="680" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The roofline model: what limits a workload's speed</text><line x1="130" y1="90" x2="130" y2="550" stroke="#52514e" stroke-width="1.5"/><line x1="130" y1="550" x2="1080" y2="550" stroke="#52514e" stroke-width="1.5"/><text x="110" y="78" text-anchor="start" font-size="12.5" fill="#52514e">performance (FLOPs/sec, log scale)</text><text x="1080" y="584" text-anchor="end" font-size="12.5" fill="#52514e">arithmetic intensity (FLOPs/byte, log scale)</text><line x1="130" y1="550" x2="491" y2="172.8" stroke="#2a78d6" stroke-width="3"/><line x1="491" y1="172.8" x2="1060" y2="172.8" stroke="#104281" stroke-width="3"/><text x="397.1" y="256.9" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2a78d6" transform="rotate(-46.3 397.1 256.9)">memory-bound region</text><text x="805.5" y="158.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#104281">compute-bound region (peak throughput ceiling)</text><circle cx="491" cy="172.8" r="5" fill="#0b0b0b"/><rect x="451" y="132.8" width="80" height="20" fill="#fcfcfb"/><text x="491" y="147.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">ridge point</text><circle cx="253.5" cy="420.9578947368421" r="8" fill="#a33a2f" stroke="#ffffff" stroke-width="2"/><rect x="163.5" y="365.9578947368421" width="180" height="42" rx="6" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="253.5" y="384.9578947368421" text-anchor="middle" font-size="12" font-weight="700" fill="#a33a2f">small-batch inference</text><text x="253.5" y="400.9578947368421" text-anchor="middle" font-size="10.5" fill="#52514e">memory-bound: low intensity</text><circle cx="776" cy="172.8" r="8" fill="#184f95" stroke="#ffffff" stroke-width="2"/><rect x="686" y="188.8" width="180" height="42" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/><text x="776" y="206.8" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">large-batch training</text><text x="776" y="222.8" text-anchor="middle" font-size="10.5" fill="#52514e">compute-bound: high intensity</text></svg>