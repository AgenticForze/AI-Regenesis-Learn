<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-1-order desc-5-1-order">
  <title id="title-5-1-order">Few-shot prompts are sensitive to example order</title>
  <desc id="desc-5-1-order">A diagram showing the same three few-shot examples arranged in three different orderings, with accuracy ranging from 92% to 34% purely as a result of reordering, with no examples added or removed.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Few-shot prompts are sensitive to example order</text>
  <rect x="40" y="130" width="380" height="260" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="230" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Ordering A</text><rect x="70" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="115" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 1</text><rect x="175" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="220" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 2</text><rect x="280" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="325" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 3</text><text x="230" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">92% accuracy</text><rect x="490" y="130" width="380" height="260" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Ordering B</text><rect x="520" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="565" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 2</text><rect x="625" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="670" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 3</text><rect x="730" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="775" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 1</text><text x="680" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#52514e">61% accuracy</text><rect x="940" y="130" width="380" height="260" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1130" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Ordering C</text><rect x="970" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="1015" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 3</text><rect x="1075" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="1120" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 1</text><rect x="1180" y="220" width="90" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.2"/><text x="1225" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Ex 2</text><text x="1130" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#a33a2f">34% accuracy</text><text x="680" y="445" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">The same three examples, only reordered, no examples added or removed.</text><rect x="60" y="480" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="503.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Lu et al., 2021: reordering the same few-shot examples can swing accuracy from near state-of-the-art</text><text x="680" y="521.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">to close to random chance on the same task.</text>
</svg>