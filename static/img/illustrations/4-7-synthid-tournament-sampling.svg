<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-7-synthid desc-4-7-synthid">
  <title id="title-4-7-synthid">SynthID: a tournament-based watermark that preserves output quality</title>
  <desc id="desc-4-7-synthid">A diagram showing several candidate next tokens drawn from the model's own unmodified distribution, run through a key-seeded pairwise tournament, with the winner emitted as the next token, encoding a detectable pattern without distorting the underlying distribution.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">SynthID: a tournament-based watermark that preserves output quality</text>
  <defs><marker id="arrow-4-7-synthid" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="110" width="280" height="100" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="220" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Model's own next-token</text><text x="220" y="174" text-anchor="middle" font-size="12" fill="#52514e">distribution, unmodified</text><rect x="480" y="260" width="140" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="550" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Candidate A</text><line x1="342.2" y1="210.0" x2="480.0" y2="266.4" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><rect x="650" y="260" width="140" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="720" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Candidate B</text><line x1="360.0" y1="197.8" x2="650.0" y2="276.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><rect x="820" y="260" width="140" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="890" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Candidate C</text><line x1="360.0" y1="188.2" x2="820.0" y2="280.9" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><rect x="990" y="260" width="140" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1060" y="299" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Candidate D</text><line x1="360.0" y1="182.5" x2="990.0" y2="283.8" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><rect x="480" y="400" width="650" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="805" y="441" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Key-seeded pairwise tournament</text><text x="805" y="459" text-anchor="middle" font-size="12.5" fill="#ffffff">winner emitted as the next token</text><line x1="609.5" y1="330.0" x2="728.5" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><line x1="739.8" y1="330.0" x2="779.5" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><line x1="870.2" y1="330.0" x2="830.5" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><line x1="1000.5" y1="330.0" x2="881.5" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-7-synthid)"/><rect x="60" y="520" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="540" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Dathathri et al. (Nature, 2024): the tournament winner encodes a detectable pattern across many</text><text x="680" y="557.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">tokens without distorting the underlying probability distribution the way a green/red-list logit</text><text x="680" y="575" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">bias does, measuring a negligible quality change at scale.</text>
</svg>