<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-licensespectrum desc-licensespectrum">
  <title id="title-licensespectrum">"Open-weight" spans a spectrum of actual legal freedom</title>
  <desc id="desc-licensespectrum">A spectrum from fully permissive licenses like Apache 2.0 or MIT, with no usage restriction, through conditional community licenses that are free below a stated usage threshold, to Meta's Llama 4 license, which requires a separate license from Meta if the licensee exceeded 700 million monthly active users as of the Llama 4 release date.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three real examples along the same spectrum</text>
  <line x1="140" y1="260" x2="1220" y2="260" stroke="#898781" stroke-width="3"/><text x="140" y="230" text-anchor="start" font-size="14" font-weight="700" fill="#184f95">Fully permissive</text><text x="1220" y="230" text-anchor="end" font-size="14" font-weight="700" fill="#a33a2f">Conditional / restricted</text><circle cx="200" cy="260" r="9" fill="#2a78d6"/><text x="200" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2a78d6">Apache 2.0 / MIT</text><text x="200" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">no usage restriction,</text><text x="200" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">no threshold</text><circle cx="640" cy="260" r="9" fill="#184f95"/><text x="640" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#184f95">Conditional community license</text><text x="640" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">free below a stated</text><text x="640" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">usage threshold</text><circle cx="1140" cy="260" r="9" fill="#a33a2f"/><text x="1140" y="300" text-anchor="middle" font-size="13.5" font-weight="700" fill="#a33a2f">Llama 4 license</text><text x="1140" y="324" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">separate license required if</text><text x="1140" y="342" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">&gt;700M MAU as of release date</text><rect x="60" y="420" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="448.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">All three examples are commonly marketed as "open"; only checking the actual license text reveals</text><text x="680" y="466.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">which kind of freedom a given model actually grants.</text>
</svg>