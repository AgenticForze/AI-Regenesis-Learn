<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-5-hyde desc-6-5-hyde">
  <title id="title-6-5-hyde">HyDE: search with a hypothetical answer, not the query itself</title>
  <desc id="desc-6-5-hyde">A five-step flow diagram: a short or vague query is passed to an instruction-following LLM which generates a hypothetical answer document, that document is embedded by an unsupervised contrastively learned encoder, the resulting vector runs an approximate nearest neighbor search against the real corpus, and the search returns real documents grounded by the encoder's dense bottleneck, which filters out any hallucinated details from the hypothetical document.</desc>
  <rect width="1500" height="620" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">HyDE: search with a hypothetical answer, not the query itself</text>
  <defs><marker id="arrow-6-5-hyde-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="530" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="220" width="212" height="100" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="386" y="266.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Query</text><text x="386" y="289.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">short, vague, or jargon-light</text><rect x="522" y="220" width="212" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="628" y="266.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">LLM generates</text><text x="628" y="289.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">a hypothetical answer document</text><rect x="764" y="220" width="212" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="870" y="258.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Contrastive</text><text x="870" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">encoder</text><text x="870" y="297.25" text-anchor="middle" font-size="10.5" fill="#6b7280">embeds the hypothetical document</text><rect x="1006" y="220" width="212" height="100" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1112" y="266.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">ANN search</text><text x="1112" y="289.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">against the real corpus</text><rect x="1248" y="220" width="212" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1354" y="266.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Real documents</text><text x="1354" y="289.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">grounded by the encoder's dense bottleneck</text><line x1="492" y1="270" x2="522" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-hyde-main)"/><line x1="734" y1="270" x2="764" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-hyde-main)"/><line x1="976" y1="270" x2="1006" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-hyde-main)"/><line x1="1218" y1="270" x2="1248" y2="270" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-hyde-main)"/><rect x="20" y="250" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="275" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">HYDE</text><rect x="280" y="390" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="422" text-anchor="middle" font-size="12.5" fill="#6b7280">The hypothetical document "captures relevance patterns but is unreal and may contain false details"; the encoder's limited capacity filters those details out.</text>
</svg>