<svg width="1560" height="830" viewBox="0 0 1560 830" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-7 desc-8-7"><title id="title-8-7">Two Independent Axes Place Every Strategy on One Map</title><desc id="desc-8-7">A horizontal axis runs from reactive, committing to one action at a time, to deliberative, planning every step upfront before acting. A vertical axis runs from linear reasoning, a single chain of steps, to branching or graph-shaped reasoning, where multiple candidate paths are explored and can even be merged back together. Chain-of-thought sits deliberative and linear. ReAct sits reactive and linear. Reflexion sits reactive and linear with a retry loop. Plan-and-execute sits deliberative on the horizontal axis, but is positioned between the linear and branching rows on the vertical axis, because it produces one linear plan yet re-plans reactively when a step's result contradicts that plan. Tree-of-thought sits deliberative and branching. Graph-of-thought sits deliberative and graph-shaped, the only strategy on this map whose branches can recombine into one.</desc><rect width="1560" height="830" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">Two Independent Axes Place Every Strategy on One Map</text><rect x="280" y="110" width="1020" height="560" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><line x1="790.0" y1="110" x2="790.0" y2="670" stroke="#e3e1db" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="280" y1="390.0" x2="1300" y2="390.0" stroke="#e3e1db" stroke-width="1.5" stroke-dasharray="4,4"/><text x="280" y="704" text-anchor="start" font-size="13.5" fill="#4b5563">reactive: commit one step at a time</text><text x="1300" y="704" text-anchor="end" font-size="13.5" fill="#4b5563">deliberative: plan every step upfront</text><text x="266" y="124" text-anchor="end" font-size="13.5" fill="#4b5563">graph-shaped:</text><text x="266" y="140" text-anchor="end" font-size="13.5" fill="#4b5563">branches can merge</text><text x="266" y="654" text-anchor="end" font-size="13.5" fill="#4b5563">linear:</text><text x="266" y="670" text-anchor="end" font-size="13.5" fill="#4b5563">one chain of steps</text><rect x="348.20000000000005" y="538.2" width="190" height="62" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="443.20000000000005" y="562.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">ReAct</text><text x="443.20000000000005" y="582.2" text-anchor="middle" font-size="11" fill="#6b7280">reactive, linear (Ch. 8.3)</text><rect x="348.20000000000005" y="426.2" width="190" height="62" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="443.20000000000005" y="450.2" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Reflexion</text><text x="443.20000000000005" y="470.2" text-anchor="middle" font-size="11" fill="#6b7280">reactive, linear + retry (Ch. 8.3)</text><rect x="1041.8" y="571.8" width="190" height="62" rx="10" fill="#fff6df" stroke="#c9975b" stroke-width="1.75"/><text x="1136.8" y="595.8" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Chain-of-Thought</text><text x="1136.8" y="615.8" text-anchor="middle" font-size="11" fill="#6b7280">deliberative, linear (Phase 5)</text><rect x="817.4" y="359.0" width="190" height="62" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.75"/><text x="912.4" y="383.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Plan-and-Execute</text><text x="912.4" y="403.0" text-anchor="middle" font-size="11" fill="#6b7280">deliberative plan, then reactive re-planning</text><rect x="1041.8" y="247.0" width="190" height="62" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.75"/><text x="1136.8" y="271.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Tree-of-Thought</text><text x="1136.8" y="291.0" text-anchor="middle" font-size="11" fill="#6b7280">deliberative, branching (Phase 5)</text><rect x="1041.8" y="123.80000000000001" width="190" height="62" rx="10" fill="#f5dde8" stroke="#c96fa8" stroke-width="1.75"/><text x="1136.8" y="147.8" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Graph-of-Thought</text><text x="1136.8" y="167.8" text-anchor="middle" font-size="11" fill="#6b7280">deliberative, graph-shaped: branches merge</text><rect x="280" y="730" width="1020" height="80" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="790.0" y="760" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Every strategy is a specific point on this map, not a wholly separate idea.</text><text x="790.0" y="785" text-anchor="middle" font-size="13" fill="#1f2d3d">Plan-and-execute is the only one that moves during a single run: deliberative, then reactive when re-planning fires.</text></svg>