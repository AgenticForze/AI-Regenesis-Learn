<svg width="1560" height="640" viewBox="0 0 1560 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-4-overview desc-6-4-overview">
  <title id="title-6-4-overview">Two halves of the RAG pipeline</title>
  <desc id="desc-6-4-overview">A two-row diagram in a streamlined, layered style: the write path (raw document, ingestion, chunking, embed and store) on top, the query path (query, retrieval, reranking, generation, grounded answer) below, connected by an orthogonal dashed elbow showing that retrieval searches what the write path indexed. Left-margin bordered labels mark each row, attached to a single vertical accent spine.</desc>
  <rect width="1560" height="640" fill="#fbfaf7"/>
  <text x="780" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Two halves of the RAG pipeline</text>
