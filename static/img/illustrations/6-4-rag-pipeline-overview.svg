ITE PATH</text><rect x="280" y="400" width="290.5" height="90" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="425.25" y="447.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Query</text><rect x="596.5" y="400" width="290.5" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="741.75" y="447.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Retrieval</text><rect x="913" y="400" width="290.5" height="90" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="1058.25" y="447.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Reranking</text><rect x="1229.5" y="400" width="290.5" height="90" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1374.75" y="447.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Generation</text><line x1="570.5" y1="445" x2="596.5" y2="445" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-overview-main)"/><line x1="887" y1="445" x2="913" y2="445" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-overview-main)"/><line x1="1203.5" y1="445" x2="1229.5" y2="445" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-overview-main)"/><rect x="20" y="425" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="450" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">QUERY PATH</text><rect x="1229.5" y="545" width="290.5" height="66" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1374.75" y="580.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Grounded answer</text><line x1="1374.75" y1="490" x2="1374.75" y2="545" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-overview-main)"/><path d="M 1374.75 200
