<svg width="2240" height="670" viewBox="0 0 2240 670" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-4-decision-flow desc-5-4-decision-flow">
  <title id="title-5-4-decision-flow">Choosing a constrained-decoding approach</title>
  <desc id="desc-5-4-decision-flow">A decision-flow diagram branching from needing a hard schema guarantee into whether the target is expressible as a regex or JSON Schema, whether this is high-throughput production serving, whether the same schema will be reused across requests, and whether the values themselves, not just their shape, must be correct, each branch pointing to a specific engine choice or follow-up action.</desc>
  <defs></defs>
  <rect width="2240" height="670" fill="#fcfcfb"/>
  <text x="1120" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Choosing a constrained-decoding approach</text>
  <defs><marker id="arrow-5-4-decision" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="980" y="90" width="340" height="75" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="1150" y="120.35" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Need a hard schema</text><text x="1150" y="137.25" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">guarantee</text><rect x="210" y="240" width="320" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="370" y="278.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Expressible as regex</text><text x="370" y="294.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">or JSON Schema?</text><line x1="980.0" y1="161.8" x2="530.0" y2="252.7" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="810" y="240" width="320" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="970" y="278.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">High-throughput</text><text x="970" y="294.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">production serving?</text><line x1="1107.1" y1="165.0" x2="1021.4" y2="240.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="1410" y="240" width="320" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1570" y="278.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Same schema reused</text><text x="1570" y="294.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">across requests?</text><line x1="1250.0" y1="165.0" x2="1450.0" y2="240.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="1910" y="240" width="280" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="2050" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Must values be</text><text x="2050" y="286.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">correct, not just</text><text x="2050" y="302.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">shape?</text><line x1="1320.0" y1="157.3" x2="1910.0" y2="260.5" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="130" y="390" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="240" y="407.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use an FSM-based</text><text x="240" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">engine</text><text x="240" y="456.15" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">e.g. Outlines</text><line x1="329.7" y1="330.0" x2="275.9" y2="390.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-decision)"/><rect x="390" y="390" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="500" y="423.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use a CFG-based</text><text x="500" y="439.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">engine</text><line x1="410.3" y1="330.0" x2="464.1" y2="390.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="730" y="390" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="840" y="407.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Use an optimized</text><text x="840" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">engine</text><text x="840" y="456.15" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">e.g. XGrammar</text><line x1="929.7" y1="330.0" x2="875.9" y2="390.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="990" y="390" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1100" y="415.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">FSM or CFG engine</text><text x="1100" y="448.025" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">overhead less critical</text><line x1="1010.3" y1="330.0" x2="1064.1" y2="390.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-decision)"/><rect x="1330" y="390" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1440" y="423.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Cache the compiled</text><text x="1440" y="439.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">grammar</text><line x1="1529.7" y1="330.0" x2="1475.9" y2="390.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/><rect x="1590" y="390" width="220" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1700" y="423.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Accept per-request</text><text x="1700" y="439.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">compile cost</text><line x1="1610.3" y1="330.0" x2="1664.1" y2="390.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-decision)"/><rect x="1910" y="390" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="2050" y="412.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Add evaluation on</text><text x="2050" y="429" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">top</text><text x="2050" y="461.15" text-anchor="middle" font-size="11" font-weight="400" fill="#52514e">no grammar checks this</text><line x1="2050.0" y1="330.0" x2="2050.0" y2="390.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-decision)"/>
</svg>