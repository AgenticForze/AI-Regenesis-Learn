<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-threetok desc-threetok">
  <title id="title-threetok">Three tokenizer algorithms, three different vocabulary-building strategies</title>
  <desc id="desc-threetok">BPE builds its vocabulary bottom-up by frequency, WordPiece builds bottom-up by likelihood gain, and SentencePiece's Unigram algorithm builds top-down by pruning, each associated with a different family of models.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Same goal, three different construction strategies</text>
  <rect x="60" y="130" width="380" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="250" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">BPE (byte-level)</text><text x="250" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Bottom-up merges,</text><text x="250" y="221" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">ranked by raw frequency</text><text x="250" y="242" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e"> </text><text x="250" y="263" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No unknown-token</text><text x="250" y="284" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">fallback needed</text><text x="250" y="305" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e"> </text><text x="250" y="326" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Used by: GPT-2, GPT-3, GPT-4</text><rect x="480" y="130" width="380" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="670" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">WordPiece</text><text x="670" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Bottom-up merges,</text><text x="670" y="221" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">ranked by likelihood gain</text><text x="670" y="242" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e"> </text><text x="670" y="263" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Falls back to [UNK]</text><text x="670" y="284" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">for unencodable input</text><text x="670" y="305" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e"> </text><text x="670" y="326" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Used by: BERT</text><rect x="900" y="130" width="380" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1090" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">SentencePiece (Unigram)</text><text x="1090" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Top-down pruning,</text><text x="1090" y="221" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">EM-based likelihood loss</text><text x="1090" y="242" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e"> </text><text x="1090" y="263" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Whitespace is an</text><text x="1090" y="284" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">ordinary symbol</text><text x="1090" y="305" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e"> </text><text x="1090" y="326" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Used by: T5, mT5, ALBERT</text><rect x="60" y="510" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="533.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">All three solve the same problem, representing arbitrary text with a fixed vocabulary, but disagree</text><text x="680" y="551.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">on how that vocabulary should be built.</text>
</svg>