<svg width="1300" height="600" viewBox="0 0 1300 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-mlmrecipe desc-mlmrecipe">
  <title id="title-mlmrecipe">BERT masks about 15% of positions, but not all of them with the literal [MASK] token</title>
  <desc id="desc-mlmrecipe">Of the roughly 15% of token positions selected for masking, 80% are replaced with the literal MASK token, 10% are replaced with a random other vocabulary token, and 10% are left unchanged, each shown with an example using the word account.</desc>
  <defs></defs>
  <rect width="1300" height="600" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">BERT's masking recipe: 80/10/10</text>
  <rect x="110" y="150" width="110" height="80" rx="8" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="165" y="197.33333333333334" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">80%</text><rect x="260" y="150" width="430" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="475" y="194.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">replace with [MASK]</text><rect x="730" y="150" width="460" height="80" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><text x="960" y="194.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#52514e">"account" -&gt; [MASK]</text><rect x="110" y="260" width="110" height="80" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="165" y="307.3333333333333" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">10%</text><rect x="260" y="260" width="430" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="475" y="304.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">replace with a random token</text><rect x="730" y="260" width="460" height="80" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><text x="960" y="304.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#52514e">"account" -&gt; "guitar"</text><rect x="110" y="370" width="110" height="80" rx="8" fill="#86b6ef" stroke="#104281" stroke-width="1.5"/><text x="165" y="417.3333333333333" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0b0b">10%</text><rect x="260" y="370" width="430" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="475" y="414.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">leave unchanged</text><rect x="730" y="370" width="460" height="80" rx="8" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1.5"/><text x="960" y="414.5" text-anchor="middle" font-size="13.5" font-weight="400" fill="#52514e">"account" -&gt; "account"</text><text x="110" y="120" font-size="13" font-weight="700" fill="#184f95">of the ~15% selected positions:</text><rect x="90" y="490" width="1120" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="513.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The mixture keeps the model building genuine contextual representations everywhere, since [MASK]</text><text x="650" y="531.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">never appears again after pretraining ends.</text>
</svg>