<svg width="1400" height="660" viewBox="0 0 1400 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-4-fsm desc-5-4-fsm">
  <title id="title-5-4-fsm">Outlines: compiling a schema into a finite-state machine</title>
  <desc id="desc-5-4-fsm">A diagram showing a JSON Schema or regex compiled into a sequence of finite-state-machine states, feeding a precomputed index mapping each state to its valid token set, which a decoding step looks up rather than reparsing, producing a structurally guaranteed output.</desc>
  <defs></defs>
  <rect width="1400" height="660" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Outlines: compiling a schema into a finite-state machine</text>
  <defs><marker id="arrow-5-4-fsm" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="540" y="70" width="320" height="65" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="103.85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">JSON Schema or regex</text><rect x="215" y="220" width="130" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="280" y="261.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">q0</text><rect x="495" y="220" width="130" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="560" y="261.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">q1</text><rect x="775" y="220" width="130" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="840" y="261.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">q2</text><rect x="1055" y="220" width="130" height="80" rx="8" fill="#5598e7" stroke="#2a78d6" stroke-width="1.5"/><text x="1120" y="261.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">q3</text><line x1="613.3" y1="135.0" x2="345.0" y2="235.6" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-fsm)"/><line x1="345.0" y1="260.0" x2="495.0" y2="260.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-fsm)"/><line x1="625.0" y1="260.0" x2="775.0" y2="260.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-fsm)"/><line x1="905.0" y1="260.0" x2="1055.0" y2="260.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-fsm)"/><rect x="350" y="360" width="700" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="381.45" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Precomputed index: state to</text><text x="700" y="399" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">valid token set</text><text x="700" y="433.35" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">one hashmap lookup per decoding</text><text x="700" y="448.95000000000005" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">step, no re-parsing</text><line x1="345.0" y1="282.4" x2="569.7" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-fsm)"/><line x1="598.6" y1="300.0" x2="656.6" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-fsm)"/><line x1="801.4" y1="300.0" x2="743.4" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-fsm)"/><line x1="1055.0" y1="282.4" x2="830.3" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-4-fsm)"/><rect x="530" y="500" width="340" height="65" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="525.35" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Structurally</text><text x="700" y="542.25" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">guaranteed output</text><line x1="700.0" y1="450.0" x2="700.0" y2="500.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-fsm)"/><rect x="60" y="590" width="1280" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="605" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Willard and Louf, 2023: a schema or regex is compiled once into a finite-state machine, and the</text><text x="700" y="622.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">state-to-token index is built once, turning each decoding step into a fast lookup rather than a</text><text x="700" y="640" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">fresh parse.</text>
</svg>