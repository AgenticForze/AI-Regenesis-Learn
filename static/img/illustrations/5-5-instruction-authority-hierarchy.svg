<svg width="1360" height="700" viewBox="0 0 1360 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-5-hierarchy desc-5-5-hierarchy">
  <title id="title-5-5-hierarchy">Instruction authority hierarchy</title>
  <desc id="desc-5-5-hierarchy">A diagram showing three tiers of authority: a system or developer message at the top with the highest authority, a user message in the middle operating within the system prompt's rules, and third-party content such as retrieved documents or tool results at the bottom with no authority to issue instructions, meant to be read as data only.</desc>
  <defs></defs>
  <rect width="1360" height="700" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Instruction authority hierarchy</text>
  <rect x="330" y="90" width="700" height="105" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="680" y="126.75" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">System / developer message</text><text x="680" y="163.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#ffffff">Highest authority: sets the rules of the</text><text x="680" y="179.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#ffffff">interaction</text><rect x="330" y="225" width="700" height="105" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="680" y="261.75" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">User message</text><text x="680" y="298.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#ffffff">Operates within the system prompt's</text><text x="680" y="314.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#ffffff">rules</text><rect x="330" y="360" width="700" height="105" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="680" y="387" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Third-party content: retrieved</text><text x="680" y="406.5" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">documents, tool results</text><text x="680" y="443.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">No authority, read as data only</text><text x="680" y="525" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b0b0b">Prompt injection is what happens when a model treats all three tiers as equally persuasive.</text><rect x="60" y="555" width="1240" height="80" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="588.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">A well-defended system keeps this ordering intact: content from a lower tier can be read and</text><text x="680" y="606.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">reasoned about, but should never be able to override an instruction from a higher tier.</text>
</svg>