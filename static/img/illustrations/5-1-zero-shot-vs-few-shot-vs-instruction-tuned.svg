<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-1-zero-few-instruct desc-5-1-zero-few-instruct">
  <title id="title-5-1-zero-few-instruct">Zero-shot, few-shot, and instruction tuning compared</title>
  <desc id="desc-5-1-zero-few-instruct">A diagram showing three scenarios: a base model given a zero-shot instruction that it may not reliably follow, the same base model given a few-shot prompt with worked examples that it can follow, and an instruction-tuned model given only a zero-shot instruction that it follows reliably.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Zero-shot, few-shot, and instruction tuning compared</text>
  <rect x="20" y="120" width="400" height="380" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="220" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Base model, zero-shot</text><text x="220" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#a33a2f">Prompt: instruction only</text><text x="220" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">May continue the text rather</text><text x="220" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">than obey the instruction</text><rect x="480" y="120" width="400" height="380" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Base model, few-shot</text><text x="680" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#184f95">Prompt: instruction + examples</text><text x="680" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Infers the expected format</text><text x="680" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">from worked examples shown</text><rect x="940" y="120" width="400" height="380" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="1140" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Instruction-tuned, zero-shot</text><text x="1140" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Prompt: instruction only</text><text x="1140" y="340" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">Follows the instruction</text><text x="1140" y="360" text-anchor="middle" font-size="13" font-weight="400" fill="#ffffff">directly, no examples needed</text><text x="680" y="555" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Zero-shot prompting works reliably with an instruction-tuned model;</text><text x="680" y="577" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">a base model often needs few-shot examples to infer the expected task format.</text>
</svg>