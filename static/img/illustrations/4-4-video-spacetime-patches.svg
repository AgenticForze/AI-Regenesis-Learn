<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-videodiffusion desc-videodiffusion">
  <title id="title-videodiffusion">Spacetime patches model temporal consistency directly, rather than stitching independent frames</title>
  <desc id="desc-videodiffusion">Two panels of four sequential frames each. The left panel shows independent per-frame generation, where an object jumps unpredictably between frames. The right panel shows a diffusion transformer operating on spacetime patches, where the object moves smoothly and consistently across frames.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Why video diffusion needs more than independent frames</text>
  <rect x="80" y="130" width="560" height="320" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="360" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#a33a2f">Independent per-frame generation</text><rect x="120" y="230" width="90" height="90" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5" rx="4"/><circle cx="155" cy="250" r="10" fill="#a33a2f"/><rect x="240" y="230" width="90" height="90" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5" rx="4"/><circle cx="315" cy="265" r="10" fill="#a33a2f"/><rect x="360" y="230" width="90" height="90" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5" rx="4"/><circle cx="395" cy="280" r="10" fill="#a33a2f"/><rect x="480" y="230" width="90" height="90" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5" rx="4"/><circle cx="555" cy="250" r="10" fill="#a33a2f"/><text x="360" y="360" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Object position jumps unpredictably</text><text x="360" y="378" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">between frames: no temporal consistency</text><rect x="720" y="130" width="560" height="320" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="106" text-anchor="middle" font-size="15.5" font-weight="700" fill="#184f95">Spacetime patches, one diffusion transformer</text><rect x="760" y="230" width="90" height="90" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" rx="4"/><circle cx="780" cy="275" r="10" fill="#184f95"/><line x1="850" y1="275" x2="880" y2="275" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="880" y="230" width="90" height="90" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" rx="4"/><circle cx="912" cy="275" r="10" fill="#184f95"/><line x1="970" y1="275" x2="1000" y2="275" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="1000" y="230" width="90" height="90" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" rx="4"/><circle cx="1044" cy="275" r="10" fill="#184f95"/><line x1="1090" y1="275" x2="1120" y2="275" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="1120" y="230" width="90" height="90" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5" rx="4"/><circle cx="1176" cy="275" r="10" fill="#184f95"/><text x="1000" y="360" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Space and time modeled together:</text><text x="1000" y="378" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">smooth, consistent motion across frames</text><rect x="60" y="510" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="525" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Representing video as spacetime patches, chunks spanning both space and time, lets a diffusion</text><text x="680" y="542.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">transformer model temporal consistency directly rather than stitching independently generated frames</text><text x="680" y="560" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">together afterward.</text>
</svg>