<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-lr desc-lr">
  <title id="title-lr">Three learning rate schedules over the course of training: step decay, cosine annealing, and warm-up plus decay</title>
  <desc id="desc-lr">A line chart plotting learning rate against training step for three schedules. Step decay holds a constant rate then drops sharply twice. Cosine annealing decreases smoothly following a cosine curve. Warm-up plus decay rises from near zero for the first steps before following a smooth cosine-style decay.</desc>
  <rect width="1000" height="560" fill="#fcfcfb"/>
  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three ways to vary the learning rate over training</text>

  <rect x="100" y="70" width="800" height="400" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/>
  <line x1="100" y1="470" x2="900" y2="470" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="94" y="84" text-anchor="end" font-size="10.5" fill="#898781">high</text>
  <text x="94" y="470" text-anchor="end" font-size="10.5" fill="#898781">0</text>
  <text x="500" y="490" text-anchor="middle" font-size="11.5" fill="#898781">training step</text>

  <polyline fill="none" stroke="#a33a2f" stroke-width="3"
    points="100.0,80.0 356.0,80.0 364.0,270.0 620.0,270.0 628.0,365.0 900.0,365.0"/>
  <polyline fill="none" stroke="#184f95" stroke-width="3"
    points="100.0,80.0 180.0,88.8 260.0,114.5 340.0,154.4 420.0,204.7 500.0,260.5 580.0,316.3 660.0,366.6 740.0,406.5 820.0,432.2 900.0,441.0"/>
  <polyline fill="none" stroke="#5598e7" stroke-width="3" stroke-dasharray="8,5"
    points="100.0,460.0 180.0,80.0 260.0,90.9 340.0,122.2 420.0,170.3 500.0,229.2 580.0,291.8 660.0,350.8 740.0,398.8 820.0,430.1 900.0,441.0"/>

  <g font-size="13" font-weight="600">
    <line x1="640" y1="100" x2="670" y2="100" stroke="#a33a2f" stroke-width="3"/>
    <text x="678" y="104" fill="#0b0b0b">Step decay</text>
    <line x1="640" y1="122" x2="670" y2="122" stroke="#184f95" stroke-width="3"/>
    <text x="678" y="126" fill="#0b0b0b">Cosine annealing</text>
    <line x1="640" y1="144" x2="670" y2="144" stroke="#5598e7" stroke-width="3" stroke-dasharray="8,5"/>
    <text x="678" y="148" fill="#0b0b0b">Warm-up + decay</text>
  </g>

  <rect x="100" y="495" width="800" height="50" rx="8" fill="#eaf2fc"/>
  <text x="500" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#184f95">Warm-up avoids a large, potentially destabilizing step while weights are near their random start</text>
  <text x="500" y="534" text-anchor="middle" font-size="11" fill="#184f95">then follows the same kind of smooth decay cosine annealing uses on its own</text>
</svg>
