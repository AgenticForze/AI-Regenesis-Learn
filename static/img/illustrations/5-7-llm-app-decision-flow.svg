<svg width="1400" height="1500" viewBox="0 0 1400 1500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-7-refarch desc-5-7-refarch">
  <title id="title-5-7-refarch">Routing a request through a first LLM app</title>
  <desc id="desc-5-7-refarch">A decision-flow diagram branching from a user request into whether a semantic cache hit exists, returning a cached response if so or passing to an LLM gateway if not; whether the primary provider is healthy, routing to a fallback or the primary provider; assembling the request through an orchestration layer; checking input and output validation guardrails, rejecting or blocking a failing request; delivering a passing response to the user; and logging every path, cached or not, to an observability layer.</desc>
  <defs></defs>
  <rect width="1400" height="1500" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Routing a request through a first LLM app</text>
  <defs><marker id="arrow-5-7-refarch" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="530" y="90" width="340" height="70" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="117.85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A user request arrives</text><text x="700" y="134.75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">at the app backend</text><rect x="530" y="210" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="247.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Does a semantic cache</text><text x="700" y="264.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">hit exist?</text><line x1="700.0" y1="160.0" x2="700.0" y2="210.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="140" y="360" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="290" y="398.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Return the cached</text><text x="290" y="414.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">response</text><rect x="560" y="360" width="300" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="710" y="398.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Pass to the LLM</text><text x="710" y="414.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">gateway</text><line x1="577.0" y1="300.0" x2="413.0" y2="360.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-7-refarch)"/><line x1="703.0" y1="300.0" x2="707.0" y2="360.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="560" y="510" width="300" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="710" y="548.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Is the primary</text><text x="710" y="564.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">provider healthy?</text><line x1="710.0" y1="450.0" x2="710.0" y2="510.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="340" y="660" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="470" y="690.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Route to a</text><text x="470" y="706.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">fallback</text><text x="470" y="721.8000000000001" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">provider</text><rect x="620" y="660" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="750" y="698.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Route to the</text><text x="750" y="714" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">primary provider</text><line x1="638.0" y1="600.0" x2="542.0" y2="660.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-7-refarch)"/><line x1="722.0" y1="600.0" x2="738.0" y2="660.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="530" y="810" width="340" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="840" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Orchestration assembles</text><text x="700" y="856.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">the prompt, history, and</text><text x="700" y="872.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">tools</text><line x1="539.0" y1="750.0" x2="631.0" y2="810.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><line x1="735.0" y1="750.0" x2="715.0" y2="810.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="530" y="960" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="700" y="997.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Input and output</text><text x="700" y="1014.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">validation guardrails</text><line x1="700.0" y1="900.0" x2="700.0" y2="960.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="140" y="960" width="300" height="90" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="290" y="998.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Reject or block,</text><text x="290" y="1014.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">per 5.5</text><line x1="530.0" y1="1005.0" x2="440.0" y2="1005.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-7-refarch)"/><rect x="530" y="1110" width="340" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="1147.85" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Deliver the response</text><text x="700" y="1164.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">to the user</text><line x1="700.0" y1="1050.0" x2="700.0" y2="1110.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><rect x="530" y="1260" width="340" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="700" y="1297.85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Observability layer</text><text x="700" y="1314.75" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">logs the full trace</text><line x1="700.0" y1="1200.0" x2="700.0" y2="1260.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-refarch)"/><path d="M 290 450 L 290 470 L 60 470 L 60 1305 L 530 1305" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#arrow-5-7-refarch)"/><path d="M 290 1050 L 290 1360 L 700 1360 L 700 1350" fill="none" stroke="#a33a2f" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-5-7-refarch)"/><rect x="60" y="1380" width="1280" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="1410" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Whether a cache hit exists and whether the primary provider is healthy determine the path a request</text><text x="700" y="1427.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">takes; a request that fails validation is rejected or blocked before it ever reaches the user, per</text><text x="700" y="1445" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">5.5, and every path, cached, delivered, or rejected, still reaches the same observability log.</text>
</svg>