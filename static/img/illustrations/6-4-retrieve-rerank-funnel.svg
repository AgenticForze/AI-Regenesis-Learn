<svg width="1500" height="820" viewBox="0 0 1500 820" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-4-funnel desc-6-4-funnel">
  <title id="title-6-4-funnel">From a hundred candidates to a well-ordered handful</title>
  <desc id="desc-6-4-funnel">A funnel diagram in a streamlined, layered style: a query feeds a retrieval step that fans out via a shared horizontal bus to roughly a hundred candidates, which fan back in through a second bus into a reranking step, which fans out to a small reordered top-k set with the strongest evidence placed first and last. Left-margin bordered labels mark the retrieve and rerank stages on a single accent spine.</desc>
  <rect width="1500" height="820" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">From a hundred candidates to a well-ordered handful</text>
