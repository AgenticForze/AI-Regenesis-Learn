-end="url(#arrow-6-4-funnel-main)"/><line x1="595" y1="290" x2="595" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><line x1="705" y1="290" x2="705" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><line x1="815" y1="290" x2="815" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><line x1="925" y1="290" x2="925" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><line x1="1035" y1="290" x2="1035" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><line x1="1145" y1="290" x2="1145" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><line x1="1255" y1="290" x2="1255" y2="340" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-4-funnel-main)"/><rect x="640" y="460" width="460" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="870" y="496.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Reranking</text><text x="870" y="520.5125" text-anchor="middle" font-size="10.5" fill="#6b7280">cross-encoder · scores query + doc jointly</text><line x1="485" y1="386" x2="485" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="595" y1="386" x2="595" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="705" y1="386" x2="705" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="815" y1="386" x2="815" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="925" y1="386" x2="925" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1035" y1="386" x2="1035" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1145" y1="386" x2="1145" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="1255" y1="386" x2="1255" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="485" y1="425" x2="1255" y2="425" stroke="#5b8fc9" stroke-width="1.4"/><line x1="870" y1="425" x2="870" y2="460" stroke="#5b8fc9" stroke