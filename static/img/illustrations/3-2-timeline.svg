<svg width="1350" height="480" viewBox="0 0 1350 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-timeline desc-timeline">
  <title id="title-timeline">From static embeddings to contextual encoders, 2013 to 2019</title>
  <desc id="desc-timeline">A timeline from Word2Vec in 2013 through GloVe in 2014, both static embeddings, to ELMo in 2018 and BERT in 2018 to 2019, both contextual embeddings, marking the architectural shift this chapter describes.</desc>
  <defs></defs>
  <rect width="1350" height="480" fill="#fcfcfb"/>
  <text x="675" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The static-to-contextual shift, on a timeline</text>
  <line x1="100" y1="240" x2="1250" y2="240" stroke="#898781" stroke-width="2"/><circle cx="180" cy="240" r="10" fill="#898781" stroke="#ffffff" stroke-width="2"/><text x="180" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">2013</text><rect x="70" y="275" width="220" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="180" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Word2Vec</text><text x="180" y="324" text-anchor="middle" font-size="11" fill="#52514e">skip-gram / CBOW</text><circle cx="480" cy="240" r="10" fill="#898781" stroke="#ffffff" stroke-width="2"/><text x="480" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">2014</text><rect x="370" y="275" width="220" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="480" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">GloVe</text><text x="480" y="324" text-anchor="middle" font-size="11" fill="#52514e">co-occurrence factorization</text><circle cx="820" cy="240" r="10" fill="#184f95" stroke="#ffffff" stroke-width="2"/><text x="820" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">2018</text><rect x="710" y="275" width="220" height="70" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.5"/><text x="820" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">ELMo</text><text x="820" y="324" text-anchor="middle" font-size="11" fill="#52514e">bidirectional LSTM</text><circle cx="1140" cy="240" r="10" fill="#184f95" stroke="#ffffff" stroke-width="2"/><text x="1140" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">2018-19</text><rect x="1030" y="275" width="220" height="70" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.5"/><text x="1140" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">BERT</text><text x="1140" y="324" text-anchor="middle" font-size="11" fill="#52514e">bidirectional Transformer</text><text x="330" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#898781">STATIC EMBEDDINGS</text><text x="980" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95">CONTEXTUAL EMBEDDINGS</text><line x1="650" y1="90" x2="650" y2="400" stroke="#e3e1db" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="90" y="400" width="1170" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="675" y="423.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The shift is architectural: from a trained lookup table to a model that reads the whole sequence</text><text x="675" y="441.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">before producing any single token's vector.</text>
</svg>