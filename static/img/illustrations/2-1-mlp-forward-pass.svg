<svg width="1300" height="480" viewBox="0 0 1300 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-fp desc-fp">
  <title id="title-fp">Forward pass through a two-hidden-layer multilayer perceptron</title>
  <desc id="desc-fp">A left-to-right pipeline: the input layer holds the raw feature vector, hidden layer 1 computes a weighted sum plus ReLU for each unit, hidden layer 2 does the same on hidden layer 1's output, and the output layer applies a sigmoid or softmax to produce the final prediction.</desc>
  <rect width="1300" height="480" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Forward pass: each layer feeds the next, left to right</text>

  <defs>
    <marker id="arrFP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52514e"/>
    </marker>
  </defs>

  <rect x="40" y="150" width="230" height="140" rx="10" fill="#86b6ef"/>
  <text x="155" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">INPUT LAYER</text>
  <text x="155" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Feature Vector</text>
  <text x="155" y="230" text-anchor="middle" font-size="10" fill="#184f95">holds raw features as-is</text>
  <text x="155" y="246" text-anchor="middle" font-size="10" fill="#184f95">no computation performed</text>

  <rect x="320" y="150" width="230" height="140" rx="10" fill="#5598e7"/>
  <text x="435" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">HIDDEN LAYER 1</text>
  <text x="435" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">z = Wx + b, then ReLU</text>
  <text x="435" y="230" text-anchor="middle" font-size="10" fill="#eaf2fc">every unit fully connected</text>
  <text x="435" y="246" text-anchor="middle" font-size="10" fill="#eaf2fc">to every input feature</text>

  <rect x="600" y="150" width="230" height="140" rx="10" fill="#2a78d6"/>
  <text x="715" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">HIDDEN LAYER 2</text>
  <text x="715" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">z = Wh&#8321; + b, then ReLU</text>
  <text x="715" y="230" text-anchor="middle" font-size="10" fill="#cde2fb">weighted sum of layer 1's</text>
  <text x="715" y="246" text-anchor="middle" font-size="10" fill="#cde2fb">activations, not raw inputs</text>

  <rect x="880" y="150" width="230" height="140" rx="10" fill="#184f95"/>
  <text x="995" y="180" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">OUTPUT LAYER</text>
  <text x="995" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">sigmoid / softmax / linear</text>
  <text x="995" y="230" text-anchor="middle" font-size="10" fill="#9fb8d6">binary, multi-class, or</text>
  <text x="995" y="246" text-anchor="middle" font-size="10" fill="#9fb8d6">regression, respectively</text>

  <rect x="1150" y="180" width="110" height="80" rx="10" fill="#0d2c4e"/>
  <text x="1205" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Prediction</text>
  <text x="1205" y="234" text-anchor="middle" font-size="9.5" fill="#9fb8d6">compared to</text>
  <text x="1205" y="248" text-anchor="middle" font-size="9.5" fill="#9fb8d6">true label (2.2)</text>

  <line x1="270" y1="220" x2="315" y2="220" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrFP)"/>
  <line x1="550" y1="220" x2="595" y2="220" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrFP)"/>
  <line x1="830" y1="220" x2="875" y2="220" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrFP)"/>
  <line x1="1110" y1="220" x2="1145" y2="220" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrFP)"/>

  <rect x="60" y="340" width="1180" height="60" rx="10" fill="#eaf2fc" stroke="#184f95" stroke-width="1.5"/>
  <text x="650" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95">Every arrow only moves data forward, layer to layer</text>
  <text x="650" y="384" text-anchor="middle" font-size="11.5" fill="#184f95">chapter 2.2 covers backpropagation: how error flows backward to update every weight in every layer</text>
</svg>
