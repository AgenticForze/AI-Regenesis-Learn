<svg width="1500" height="660" viewBox="0 0 1500 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-8-faith desc-6-8-faith">
  <title id="title-6-8-faith">Faithfulness decomposes a response into claims and scores each one</title>
  <desc id="desc-6-8-faith">A diagram showing a generated response about Einstein decomposed into three claims: his birth country and birth date, both supported by the retrieved context, and a claim about winning a Nobel Prize in 1922 that is not found in the retrieved context, yielding a Faithfulness score of two supported claims out of three total claims, or 0.67.</desc>
  <rect width="1500" height="660" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Faithfulness decomposes a response into claims and scores each one</text>
  <defs><marker id="arrow-6-8-faith-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="580" stroke="#1f3a5f" stroke-width="3"/><rect x="650" y="130" width="440" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="870" y="161.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Generated response</text><text x="870" y="184.975" text-anchor="middle" font-size="10.5" fill="#6b7280">decomposed into individual claims</text><rect x="280" y="260" width="1180" height="60" rx="8" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.4"/><text x="300" y="284" font-size="12.5" font-weight="700" fill="#1f2d3d">Claim 1: "Einstein was born in Germany"</text><text x="300" y="304" font-size="11" fill="#6b7280">supported by context</text><rect x="280" y="342" width="1180" height="60" rx="8" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.4"/><text x="300" y="366" font-size="12.5" font-weight="700" fill="#1f2d3d">Claim 2: "on 14 March 1879"</text><text x="300" y="386" font-size="11" fill="#6b7280">supported by context</text><rect x="280" y="424" width="1180" height="60" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.4"/><text x="300" y="448" font-size="12.5" font-weight="700" fill="#1f2d3d">Claim 3: "and won the 1922 Nobel Prize"</text><text x="300" y="468" font-size="11" fill="#6b7280">not found in retrieved context</text><line x1="870" y1="200" x2="870" y2="260" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-faith-main)"/><text x="870" y="526" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">Faithfulness = 2 supported claims / 3 total claims = 0.67</text>
</svg>