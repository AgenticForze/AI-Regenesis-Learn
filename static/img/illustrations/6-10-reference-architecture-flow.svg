<svg width="1500" height="940" viewBox="0 0 1500 940" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-10-refarch desc-6-10-refarch">
  <title id="title-6-10-refarch">OKF as a common export target feeding ingestion or a direct agent read</title>
  <desc id="desc-6-10-refarch">A single-column flow diagram showing a metadata catalog, wiki, and code repository each exporting an OKF bundle, filtered by a directory walk and YAML parse, then either flowing into the ingestion pipeline, vector and graph index, and retrieval and generation for open-ended questions, or being read directly by an agent for a narrow single-concept lookup, both paths converging on a final answer.</desc>
  <rect width="1500" height="940" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">OKF as a common export target feeding ingestion or a direct agent read</text>
  <defs><marker id="arrow-6-10-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="100" y="100" width="1300" height="64" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="128.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Metadata catalog, wiki, code repository</text><text x="750" y="151.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">each exports its own OKF bundle</text><rect x="100" y="186" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="220.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">OKF bundles: markdown files + YAML frontmatter</text><line x1="750" y1="164" x2="750" y2="186" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><rect x="100" y="272" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="306.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Directory walk + YAML parse: filter by type, tags, timestamp</text><line x1="750" y1="250" x2="750" y2="272" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><rect x="100" y="358" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="392.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Ingestion pipeline: parse, chunk, embed, index (Ch. 6.9)</text><line x1="750" y1="336" x2="750" y2="358" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><rect x="100" y="444" width="1300" height="64" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="750" y="478.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Vector + graph index</text><line x1="750" y1="422" x2="750" y2="444" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><rect x="100" y="530" width="1300" height="64" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="558.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Retrieval + generation (Ch. 6.4-6.5)</text><text x="750" y="581.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">for open-ended questions</text><line x1="750" y1="508" x2="750" y2="530" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><rect x="100" y="616" width="1300" height="64" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="750" y="644.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Direct agent read of an OKF file</text><text x="750" y="667.4375" text-anchor="middle" font-size="10.5" fill="#6b7280">for a narrow, single-concept lookup</text><rect x="100" y="702" width="1300" height="64" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="750" y="736.1875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Answer</text><line x1="750" y1="680" x2="750" y2="702" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><path d="M 1400 304 C 1480 304, 1480 648, 1400 648" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-10-refarch-main)"/><path d="M 1400 562 L 1450 562 L 1450 734 L 1400 734" fill="none" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-10-refarch-main)"/><line x1="750" y1="680" x2="750" y2="702" stroke="#5b8fc9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-6-10-refarch-main)"/>
</svg>