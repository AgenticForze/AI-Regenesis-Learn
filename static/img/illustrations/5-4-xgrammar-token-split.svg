ht="700" fill="#0b0b0b">cache</text><line x1="380.0" y1="340.0" x2="380.0" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-xgrammar)"/><rect x="750" y="400" width="460" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="980" y="432.575" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Overlapped with GPU</text><text x="980" y="450.125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">generation</text><line x1="980.0" y1="340.0" x2="980.0" y2="400.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-xgrammar)"/><rect x="480" y="530" width="400" height="65" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="555.075" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Fast, schema-valid</text><text x="680" y="572.625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">decoding</text><line x1="478.0" y1="480.0" x2="600.4" y2="530.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-xgrammar)"/><line x1="882.0" y1="480.0" x2="759.6" y2="530.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-4-xgrammar)"/>
