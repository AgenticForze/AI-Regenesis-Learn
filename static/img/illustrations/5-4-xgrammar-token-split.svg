<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-4-xgrammar desc-5-4-xgrammar">
  <title id="title-5-4-xgrammar">XGrammar: splitting tokens by whether context matters</title>
  <desc id="desc-5-4-xgrammar">A diagram showing the full model vocabulary split into context-independent tokens, over 99% in practice, precomputed once and cached, versus a small remainder of context-dependent tokens needing a runtime check overlapped with GPU generation, together producing fast, schema-valid decoding.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">XGrammar: splitting tokens by whether context matters</text>
