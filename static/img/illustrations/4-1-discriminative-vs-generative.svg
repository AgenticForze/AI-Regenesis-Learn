<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-discvsgen desc-discvsgen">
  <title id="title-discvsgen">A discriminative model draws a boundary between existing classes; a generative model learns the shape of the data well enough to produce new examples</title>
  <desc id="desc-discvsgen">Two panels side by side. The left panel shows a discriminative model as a scatter of two labeled classes separated by a decision boundary line, with no ability to produce new points. The right panel shows a generative model as a learned distribution (shaded ellipse) containing the original training points plus new sampled points drawn from that same learned shape.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Discriminative model vs. generative model</text>
  <rect x="100" y="110" width="520" height="340" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="360" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Discriminative model</text><circle cx="200" cy="180" r="7" fill="#5598e7"/><circle cx="230" cy="220" r="7" fill="#5598e7"/><circle cx="190" cy="260" r="7" fill="#5598e7"/><circle cx="260" cy="190" r="7" fill="#5598e7"/><circle cx="220" cy="300" r="7" fill="#5598e7"/><circle cx="470" cy="170" r="7" fill="#a33a2f"/><circle cx="510" cy="210" r="7" fill="#a33a2f"/><circle cx="540" cy="260" r="7" fill="#a33a2f"/><circle cx="480" cy="290" r="7" fill="#a33a2f"/><circle cx="550" cy="180" r="7" fill="#a33a2f"/><line x1="380" y1="130" x2="440" y2="430" stroke="#0b0b0b" stroke-width="2.5" stroke-dasharray="6 4"/><text x="360" y="480" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Learns a boundary between existing classes.</text><text x="360" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Cannot produce a new point outside the training data.</text><rect x="740" y="110" width="520" height="340" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1000" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Generative model</text><ellipse cx="1000" cy="280" rx="200" ry="120" fill="#86b6ef" opacity="0.45"/><circle cx="820" cy="170" r="6" fill="#2a78d6"/><circle cx="860" cy="220" r="6" fill="#2a78d6"/><circle cx="900" cy="180" r="6" fill="#2a78d6"/><circle cx="840" cy="270" r="6" fill="#2a78d6"/><circle cx="940" cy="300" r="6" fill="#2a78d6"/><circle cx="980" cy="200" r="6" fill="#2a78d6"/><circle cx="1020" cy="260" r="6" fill="#2a78d6"/><circle cx="1060" cy="310" r="6" fill="#2a78d6"/><circle cx="920" cy="340" r="6" fill="#2a78d6"/><circle cx="1000" cy="350" r="6" fill="#2a78d6"/><circle cx="940" cy="230" r="8" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/><circle cx="890" cy="300" r="8" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/><circle cx="1020" cy="220" r="8" fill="#0b0b0b" stroke="#ffffff" stroke-width="1.5"/><text x="1000" y="480" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Learns the shape of the whole distribution.</text><text x="1000" y="500" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Dark points: new samples drawn from that learned shape.</text><rect x="60" y="540" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="563.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Both models can look at faces or transactions or text; only the generative model can produce a new</text><text x="680" y="581.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">one that never existed.</text>
</svg>