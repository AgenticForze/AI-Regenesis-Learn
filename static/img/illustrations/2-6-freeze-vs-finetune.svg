<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-fvf desc-fvf">
  <title id="title-fvf">Feature extraction freezes every pretrained layer; fine-tuning unfreezes some or all of them</title>
  <desc id="desc-fvf">Two rows of six layer boxes representing the same pretrained network. In the feature extraction row, all six pretrained layers are shown locked and only a new seventh output layer is trainable. In the fine-tuning row, the earlier layers stay locked while the later layers and the new output layer are all trainable.</desc>
  <rect width="1300" height="560" fill="#fcfcfb"/><text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Which layers update: feature extraction vs. fine-tuning</text><text x="90" y="96" font-size="14" font-weight="700" fill="#0b0b0b">Feature extraction</text><rect x="90" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="155" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 1</text><text x="155" y="160" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="234" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="299" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 2</text><text x="299" y="160" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="378" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="443" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 3</text><text x="443" y="160" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="522" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="587" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 4</text><text x="587" y="160" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="666" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="731" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 5</text><text x="731" y="160" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="810" y="110" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="875" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 6</text><text x="875" y="160" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="954" y="110" width="130" height="70" rx="8" fill="#104281"/><text x="1019" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">New head</text><text x="1019" y="160" text-anchor="middle" font-size="10.5" fill="#dbe8fb">trainable</text><text x="90" y="206" font-size="12" fill="#52514e">All 6 pretrained layers frozen; only the new head is trained.</text><text x="90" y="306" font-size="14" font-weight="700" fill="#0b0b0b">Fine-tuning</text><rect x="90" y="320" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="155" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 1</text><text x="155" y="370" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="234" y="320" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="299" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 2</text><text x="299" y="370" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="378" y="320" width="130" height="70" rx="8" fill="#ffffff" stroke="#898781" stroke-width="2"/><text x="443" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#52514e">Layer 3</text><text x="443" y="370" text-anchor="middle" font-size="10.5" fill="#898781">frozen</text><rect x="522" y="320" width="130" height="70" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="2"/><text x="587" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Layer 4</text><text x="587" y="370" text-anchor="middle" font-size="10.5" fill="#dbe8fb">trainable</text><rect x="666" y="320" width="130" height="70" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="2"/><text x="731" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Layer 5</text><text x="731" y="370" text-anchor="middle" font-size="10.5" fill="#dbe8fb">trainable</text><rect x="810" y="320" width="130" height="70" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="2"/><text x="875" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Layer 6</text><text x="875" y="370" text-anchor="middle" font-size="10.5" fill="#dbe8fb">trainable</text><rect x="954" y="320" width="130" height="70" rx="8" fill="#104281"/><text x="1019" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">New head</text><text x="1019" y="370" text-anchor="middle" font-size="10.5" fill="#dbe8fb">trainable</text><text x="90" y="416" font-size="12" fill="#52514e">Earlier layers (1-3) stay frozen; later layers (4-6) and the new head are trained.</text><rect x="90" y="480" width="1120" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="513" text-anchor="middle" font-size="12.5" fill="#52514e">Where the frozen/trainable boundary sits is a choice, not a fixed rule, driven by target-task similarity and data size</text></svg>