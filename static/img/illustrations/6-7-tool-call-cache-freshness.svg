<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-7-tool desc-6-7-tool">
  <title id="title-6-7-tool">Idempotent does not mean safe to cache</title>
  <desc id="desc-6-7-tool">A three-column diagram: a deterministic calculation with no external dependency can be cached indefinitely; a slowly-changing external reference dataset can be cached with a time-to-live matched to its update schedule; and a rapidly-changing live data source, such as a price or an incident status, should not be cached at all, regardless of how idempotent each underlying tool call is.</desc>
  <rect width="1500" height="620" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Idempotent does not mean safe to cache</text>
  <defs><marker id="arrow-6-7-tool-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><line x1="230" y1="95" x2="230" y2="540" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="140" width="420" height="80" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="490" y="168.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Deterministic</text><text x="490" y="184.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">calculation</text><text x="490" y="208.1" text-anchor="middle" font-size="10.5" fill="#6b7280">no external dependency</text><rect x="280" y="380" width="420" height="70" rx="8" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.6" stroke-dasharray="none"/><text x="490" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Cache indefinitely</text><line x1="490" y1="220" x2="490" y2="380" stroke="#5fae83" stroke-width="2" marker-end="url(#arrow-6-7-tool-main)"/><rect x="740" y="140" width="420" height="80" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="950" y="168.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Slowly-changing</text><text x="950" y="184.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">reference data</text><text x="950" y="208.1" text-anchor="middle" font-size="10.5" fill="#6b7280">updated on a known schedule</text><rect x="740" y="380" width="420" height="70" rx="8" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.6" stroke-dasharray="none"/><text x="950" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Cache with a matched TTL</text><line x1="950" y1="220" x2="950" y2="380" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-7-tool-main)"/><rect x="1200" y="140" width="420" height="80" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1410" y="168.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Rapidly-changing live</text><text x="1410" y="184.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">data</text><text x="1410" y="208.1" text-anchor="middle" font-size="10.5" fill="#6b7280">changes within seconds</text><rect x="1200" y="380" width="420" height="70" rx="8" fill="#f6dced" stroke="#c96fa8" stroke-width="1.6" stroke-dasharray="5 4"/><text x="1410" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Do not cache</text><line x1="1410" y1="220" x2="1410" y2="380" stroke="#c96fa8" stroke-width="2" marker-end="url(#arrow-6-7-tool-main)"/><rect x="20" y="160" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="185" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">IDEMPOTENT?</text><text x="950" y="120" text-anchor="middle" font-size="11" fill="#6b7280"></text><rect x="280" y="480" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="512" text-anchor="middle" font-size="12.5" fill="#6b7280">All three can be equally idempotent, safe to call twice. Only data volatility decides whether the cached result stays true.</text>
</svg>