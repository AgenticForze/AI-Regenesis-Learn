<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-1-storage desc-6-1-storage">
  <title id="title-6-1-storage">A fact lives in a specific place, not a lookup table</title>
  <desc id="desc-6-1-storage">A diagram of a transformer's layers, from input embedding through early transformer layers, middle-layer feed-forward modules, later transformer layers, to the output layer, with the middle-layer feed-forward modules highlighted as the location Meng et al. (2022) found factual associations localized in, described as directly-editable computations rather than entries in a simple lookup table.</desc>
  <defs></defs>
  <rect width="1400" height="640" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">A fact lives in a specific place, not a lookup table</text>
  <defs><marker id="arrow-6-1-storage" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="500" y="110" width="400" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="141.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Input embedding</text><rect x="500" y="180" width="400" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="203.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Early transformer</text><text x="700" y="219.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">layers</text><rect x="500" y="250" width="400" height="60" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="700" y="273.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Middle-layer</text><text x="700" y="289.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">feed-forward modules</text><rect x="500" y="320" width="400" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="343.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Later transformer</text><text x="700" y="359.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">layers</text><rect x="500" y="390" width="400" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="421.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Output layer</text><rect x="60" y="240" width="360" height="160" rx="8" fill="#ffffff" stroke="#a33a2f" stroke-width="1.5"/><text x="240" y="274" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">Meng et al. (2022): factual</text><text x="240" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">associations are "localized,</text><text x="240" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">directly-editable computations"</text><text x="240" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a33a2f">here</text><text x="240" y="362" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Not a lookup table you can</text><text x="240" y="379" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">overwrite; a specific,</text><text x="240" y="396" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">identifiable computation</text><line x1="420" y1="320" x2="500" y2="280" stroke="#a33a2f" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-6-1-storage)"/>
</svg>