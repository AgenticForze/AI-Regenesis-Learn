<svg width="1500" height="640" viewBox="0 0 1500 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-10-link desc-6-10-link">
  <title id="title-6-10-link">Ordinary markdown links turn a directory into a lightweight graph</title>
  <desc id="desc-6-10-link">A diagram showing several OKF concept files connected by ordinary markdown links, such as a customers table file and an orders table file linked by a foreign-key reference, forming a lightweight graph structure from the directory of files without any dedicated graph database or query language.</desc>
  <rect width="1500" height="640" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Ordinary markdown links turn a directory into a lightweight graph</text>
