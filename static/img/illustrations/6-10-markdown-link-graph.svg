="645" y="409" text-anchor="middle" font-size="9.5" fill="#c98b3a" font-style="italic">part of</text><line x1="1320" y1="355" x2="420" y2="175" stroke="#c98b3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-6-10-link-main)"/><text x="870" y="259" text-anchor="middle" font-size="9.5" fill="#c98b3a" font-style="italic">references</text><line x1="1320" y1="355" x2="1320" y2="175" stroke="#c98b3a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-6-10-link-main)"/><text x="1320" y="259" text-anchor="middle" font-size="9.5" fill="#c98b3a" font-style="italic">references</text><rect x="20" y="280" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="305" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">GRAPH</text>
