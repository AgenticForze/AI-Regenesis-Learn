<svg width="1300" height="620" viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-jax desc-jax">
  <title id="title-jax">JAX's function transformations compose: grad, jit, vmap, and pmap can be layered on the same function</title>
  <desc id="desc-jax">A diagram starting from a plain Python function, loss_fn, at the center. Four transformations point to it: grad, which produces a function computing the gradient; jit, which compiles a function with XLA; vmap, which rewrites a single-example function to run on a batch; and pmap, which distributes a computation across multiple devices. A separate composition example at the bottom shows jit wrapped around grad wrapped around loss_fn, illustrating that these transformations can be nested and combined.</desc>
  <rect width="1300" height="620" fill="#fcfcfb"/><text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">JAX's transformations are composable functions, not framework magic</text><defs>
    <marker id="arrowjax" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
  </defs><line x1="386.8" y1="139.9" x2="542.0" y2="193.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowjax)"/><line x1="913.2" y1="139.9" x2="758.0" y2="193.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowjax)"/><line x1="386.8" y1="320.1" x2="542.0" y2="266.9" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowjax)"/><line x1="913.2" y1="320.1" x2="758.0" y2="266.9" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowjax)"/><rect x="540" y="195" width="220" height="70" rx="10" fill="#104281" stroke="#104281" stroke-width="1.5"/><text x="650" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">loss_fn(params, x, y)</text><text x="650" y="248" text-anchor="middle" font-size="11.5" fill="#86b6ef">an ordinary, pure Python function</text><rect x="150" y="62" width="240" height="76" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="270" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">grad(loss_fn)</text><text x="270" y="116" text-anchor="middle" font-size="12" fill="#ffffff">gradient of the function</text><rect x="910" y="62" width="240" height="76" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="1030" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">jit(loss_fn)</text><text x="1030" y="116" text-anchor="middle" font-size="12" fill="#ffffff">compiles with XLA</text><rect x="150" y="322" width="240" height="76" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="270" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">vmap(loss_fn)</text><text x="270" y="376" text-anchor="middle" font-size="12" fill="#ffffff">single example → batch</text><rect x="910" y="322" width="240" height="76" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="1030" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">pmap(loss_fn)</text><text x="1030" y="376" text-anchor="middle" font-size="12" fill="#ffffff">distributes across devices</text><rect x="190" y="445" width="920" height="70" rx="10" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="650" y="474" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">jit(grad(loss_fn))</text><text x="650" y="498" text-anchor="middle" font-size="12.5" fill="#86b6ef">compiles the gradient computation itself: transformations nest and combine freely</text></svg>