="884" y2="165" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-graph-main)"/><line x1="1158" y1="165" x2="1186" y2="165" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-5-graph-main)"/><rect x="20" y="145" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">BUILD</text><rect x="730" y="420" width="280" height="84" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="870" y="464.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Query at search time</text><rect x="280" y="570" width="560" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="560" y="616.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Global search</text><text x="560" y="640.5124999999999" text-anchor="middle" font-size="10.5" fill="#6b7280">holistic questions, reasons over community summaries</text><rect x="900" y="570" width="560" height="100" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1180" y="616.3625" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2d3d">Local search</text><text x="1180" y="640.5124999999999" text-anchor="middle" font-size="10.5" fill="#6b7280">entity questions, fans out to that entity's neighbors</text><path d="M 870 504
