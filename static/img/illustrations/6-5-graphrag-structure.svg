<svg width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-5-graphrag desc-6-5-graphrag">
  <title id="title-6-5-graphrag">GraphRAG: a second index, built and queried differently from a chunk store</title>
  <desc id="desc-6-5-graphrag">A two-row diagram: the build row shows source documents moving through entity and relationship extraction into a knowledge graph, then hierarchical clustering into communities with generated summaries; the query-time row shows a query splitting into global search, which reasons over community summaries for holistic questions, and local search, which fans out from a specific entity to its neighbors.</desc>
  <rect width="1500" height="900" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">GraphRAG: a second index, built and queried differently</text>
