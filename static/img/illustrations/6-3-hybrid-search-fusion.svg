<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-3-hybrid desc-6-3-hybrid">
  <title id="title-6-3-hybrid">Hybrid search: dense and sparse results fused into one ranking</title>
  <desc id="desc-6-3-hybrid">A diagram showing hybrid search: a single query runs as both a dense vector search and a sparse keyword search in parallel, and the two ranked result lists are combined by a fusion algorithm such as reciprocal rank fusion into one final ranked list.</desc>
  <defs></defs>
  <rect width="1400" height="560" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Hybrid search: dense and sparse results fused into one ranking</text>
  <defs><marker id="arrow-6-3-hybrid" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="600" y="40" width="200" height="64" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Query</text><rect x="260" y="180" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="430" y="209.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Dense vector search</text><text x="430" y="244.45" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">matches by meaning</text><line x1="643.5" y1="104.0" x2="509.4" y2="180.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-hybrid)"/><rect x="800" y="180" width="340" height="90" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="970" y="200.8" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Sparse keyword</text><text x="970" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">search</text><text x="970" y="253.54999999999998" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">matches exact terms</text><line x1="756.5" y1="104.0" x2="890.6" y2="180.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-hybrid)"/><rect x="500" y="340" width="400" height="100" rx="8" fill="#184f95" stroke="#0d2c4e" stroke-width="1.5"/><text x="700" y="374.25" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Fusion algorithm</text><text x="700" y="410.1" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">e.g. reciprocal rank</text><text x="700" y="425.05" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">fusion, combines both</text><text x="700" y="440" text-anchor="middle" font-size="11.5" font-weight="400" fill="#cde2fb">ranked lists</text><line x1="503.6" y1="270.0" x2="618.2" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-hybrid)"/><line x1="896.4" y1="270.0" x2="781.8" y2="340.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-6-3-hybrid)"/><rect x="60" y="470" width="1280" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">One query, two searches run in parallel, and a fusion algorithm that rewards a document ranked</text><text x="700" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">highly by either one.</text>
</svg>