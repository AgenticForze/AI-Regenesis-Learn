<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-3-toolcall desc-5-3-toolcall">
  <title id="title-5-3-toolcall">Native tool calling: who does what</title>
  <desc id="desc-5-3-toolcall">A diagram showing a calling application defining tool schemas for a model, the model selecting a tool and returning a structured tool call with typed arguments, the application executing the real tool and returning an observation, which is fed back to the model to continue reasoning or produce a final answer.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Native tool calling: who does what</text>
  <defs><marker id="arrow-5-3-toolcall" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="260" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="210" y="290.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Calling application</text><text x="210" y="324.575" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">defines tool schemas</text><rect x="550" y="260" width="260" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="680" y="290.225" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Model</text><text x="680" y="324.575" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">selects a tool, fills</text><text x="680" y="340.175" text-anchor="middle" font-size="12" font-weight="400" fill="#ffffff">arguments</text><rect x="1020" y="150" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1150" y="180.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Structured tool call</text><text x="1150" y="213.79999999999998" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">name + typed arguments</text><rect x="550" y="420" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="680" y="450.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Application executes</text><text x="680" y="483.8" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">the real tool, e.g. an API</text><text x="680" y="498.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">call</text><rect x="1020" y="420" width="260" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1150" y="450.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">Observation returned</text><text x="1150" y="483.8" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">fed back to the model as</text><text x="1150" y="498.75" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">context</text><line x1="340.0" y1="305.0" x2="550.0" y2="305.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-toolcall)"/><line x1="810.0" y1="274.6" x2="1020.0" y2="225.4" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-toolcall)"/><line x1="1150.0" y1="240.0" x2="1150.0" y2="420.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-toolcall)"/><line x1="1020.0" y1="465.0" x2="810.0" y2="465.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-3-toolcall)"/><line x1="680.0" y1="420.0" x2="680.0" y2="350.0" stroke="#184f95" stroke-width="2.2" stroke-dasharray="4 4" marker-end="url(#arrow-5-3-toolcall)"/><rect x="60" y="560" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="583.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The model decides which tool to call and how to fill it in; executing the tool and returning its</text><text x="680" y="601.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">result to the model both remain the calling application's responsibility.</text>
</svg>