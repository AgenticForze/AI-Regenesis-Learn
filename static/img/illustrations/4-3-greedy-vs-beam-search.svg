<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-greedybeam desc-greedybeam">
  <title id="title-greedybeam">Greedy decoding follows one path; beam search tracks several candidate sequences at once</title>
  <desc id="desc-greedybeam">The left side shows greedy decoding as a single chain of tokens, each chosen as the single highest-probability continuation. The right side shows beam search with a beam width of two, branching into two candidate continuations at each step and pruning back down to the top two overall.</desc>
  <defs><marker id="arr43a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a78d6"/></marker></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two ways of maximizing sequence likelihood</text>
  <text x="300" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Greedy decoding</text><rect x="230" y="110" width="140" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="137.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">the</text><rect x="230" y="185" width="140" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="212.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">cat</text><line x1="300" y1="156" x2="300" y2="185" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><rect x="230" y="260" width="140" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="287.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">sat</text><line x1="300" y1="231" x2="300" y2="260" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><rect x="230" y="335" width="140" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="362.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">on</text><line x1="300" y1="306" x2="300" y2="335" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><rect x="230" y="410" width="140" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="437.6666666666667" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">the</text><line x1="300" y1="381" x2="300" y2="410" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><rect x="230" y="485" width="140" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="300" y="512.6666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">mat</text><line x1="300" y1="456" x2="300" y2="485" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><text x="300" y="570" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">One path only: always the single</text><text x="300" y="588" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">highest-probability next token</text><text x="980" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Beam search (width 2)</text><rect x="900" y="110" width="160" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="980" y="137.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">"the cat"</text><rect x="790" y="185" width="160" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="870" y="212.16666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">"...sat" (kept)</text><rect x="1010" y="185" width="160" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1090" y="212.16666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">"...ran" (kept)</text><line x1="980" y1="156" x2="870" y2="185" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><line x1="980" y1="156" x2="1090" y2="185" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><rect x="770" y="260" width="160" height="46" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="850" y="286.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">"...on the mat" (best)</text><rect x="1030" y="260" width="160" height="46" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1110" y="286.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#52514e">"...away fast" (pruned)</text><line x1="870" y1="231" x2="850" y2="260" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#arr43a)"/><line x1="1090" y1="231" x2="1110" y2="260" stroke="#898781" stroke-width="2.2" marker-end="url(#arr43a)"/><text x="980" y="346" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">Multiple candidate sequences tracked;</text><text x="980" y="364" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">the lower-scoring beam is pruned at each step</text><rect x="60" y="540" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="563.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Both strategies maximize sequence likelihood, and both inherit the same repetitive, degenerate-text</text><text x="680" y="581.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">tendency Holtzman et al. (2019) documented.</text>
</svg>