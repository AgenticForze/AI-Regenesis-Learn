<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-al desc-al">
  <title id="title-al">The shared training loop: forward pass, loss, autodiff backward pass, optimizer step</title>
  <desc id="desc-al">A circular diagram showing model parameters feeding a forward pass that produces a prediction, compared against a target to produce a loss, which an automatic differentiation backward pass turns into a gradient for every parameter, which an optimizer step uses to update the parameters, closing the loop back to the next forward pass.</desc>
  <rect width="1200" height="620" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The training loop every framework implements</text><defs><marker id="arrowloop" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#184f95"/></marker></defs><line x1="650.3" y1="166.5" x2="749.4" y2="238.6" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowloop)"/><line x1="787.1" y1="313.8" x2="736.0" y2="471.2" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowloop)"/><line x1="617.4" y1="509.9" x2="582.6" y2="509.9" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowloop)"/><line x1="464.0" y1="471.2" x2="412.9" y2="313.8" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowloop)"/><line x1="450.6" y1="238.6" x2="549.7" y2="166.5" stroke="#184f95" stroke-width="2.5" marker-end="url(#arrowloop)"/><rect x="500.0" y="97.0" width="200" height="66" rx="10" fill="#104281" stroke="#104281" stroke-width="1.5"/><text x="600.0" y="135.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Model parameters</text><rect x="699.7" y="242.1" width="200" height="66" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="799.7" y="280.1" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Forward pass</text><rect x="623.4" y="476.9" width="200" height="66" rx="10" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="723.4" y="514.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Loss</text><rect x="376.6" y="476.9" width="200" height="66" rx="10" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="476.6" y="505.9" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Backward pass</text><text x="476.6" y="525.9" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(autodiff)</text><rect x="300.3" y="242.1" width="200" height="66" rx="10" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="400.3" y="280.1" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0b0b0b">Optimizer step</text><rect x="90" y="565" width="1" height="0" fill="none"/></svg>