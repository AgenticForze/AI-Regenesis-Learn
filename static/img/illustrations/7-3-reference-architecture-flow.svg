<svg width="1520" height="900" viewBox="0 0 1520 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-7-3-refarch desc-7-3-refarch">
  <title id="title-7-3-refarch">Where instruction tuning, RLHF, RLAIF, and DPO fit in one pipeline</title>
  <desc id="desc-7-3-refarch">A flow diagram starting from a pretrained base model through instruction tuning to generate response pairs for comparison. Human or AI preference labels both feed a reward model and reinforcement learning stage, producing an aligned model via the RLHF or RLAIF path. The same human or AI preference labels can instead feed directly into a DPO classification loss, skipping the reward model and RL loop, producing an aligned model via the DPO path.</desc>
  <rect width="1520" height="900" fill="#fbfaf7"/>
  <text x="760" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Where instruction tuning, RLHF, RLAIF, and DPO fit in one pipeline</text>
  <defs><marker id="arrow-7-3-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="570" y="90" width="380" height="70" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="760" y="127.45" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Pretrained base model</text><line x1="760" y1="160" x2="760" y2="200" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="540" y="200" width="440" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="760" y="229.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Instruction tuning: supervised</text><text x="760" y="245.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">fine-tune on demonstrations</text><line x1="760" y1="270" x2="760" y2="310" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="540" y="310" width="440" height="70" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="760" y="339.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Generate response pairs for</text><text x="760" y="355.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">comparison</text><line x1="760" y1="380" x2="760" y2="420" stroke="#5b8fc9" stroke-width="2"/><line x1="390" y1="420" x2="1130" y2="420" stroke="#5b8fc9" stroke-width="2"/><line x1="390" y1="420" x2="390" y2="460" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><line x1="1130" y1="420" x2="1130" y2="460" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="200" y="460" width="380" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="390" y="497.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Human preference labels</text><rect x="940" y="460" width="380" height="70" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="1130" y="497.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">AI preference labels</text><line x1="390" y1="530" x2="700" y2="580" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><line x1="1130" y1="530" x2="820" y2="580" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="570" y="580" width="380" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="760" y="617.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Train reward model</text><line x1="760" y1="650" x2="760" y2="690" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="570" y="690" width="380" height="70" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="760" y="719.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">Reinforcement learning against</text><text x="760" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">the reward model</text><line x1="760" y1="760" x2="760" y2="800" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="570" y="800" width="380" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="760" y="829.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Aligned model: RLHF or</text><text x="760" y="845.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">RLAIF path</text><path d="M 390 530 L 390 552 L 1300 552 L 1300 690" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-3-refarch-main)"/><path d="M 1130 530 L 1130 566 L 1340 566 L 1340 690" fill="none" stroke="#c98b3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="1110" y="690" width="380" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1300" y="719.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">DPO: classification loss</text><text x="1300" y="735" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">directly on pairs</text><line x1="1300" y1="760" x2="1300" y2="800" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-7-3-refarch-main)"/><rect x="1110" y="800" width="380" height="70" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="1300" y="829.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">Aligned model: DPO path, no</text><text x="1300" y="844.6" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2d3d">reward model or RL loop</text>
</svg>