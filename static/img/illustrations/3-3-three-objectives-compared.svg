<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-threeobj desc-threeobj">
  <title id="title-threeobj">Three language modeling objectives, and what each can see when it predicts</title>
  <desc id="desc-threeobj">Three panels: causal LM sees only prior tokens and predicts the next one; masked LM sees the full sequence with one position hidden and predicts that position; seq2seq has an encoder see the full input while the decoder generates conditioned on it and prior outputs.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three objectives, three different views at prediction time</text>
  <rect x="60" y="130" width="400" height="340" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="260" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Causal LM</text><rect x="78" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="120.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">the</text><rect x="171" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="213.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">account</text><rect x="264" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="306.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">was</text><rect x="357" y="230" width="85" height="50" rx="6" fill="#184f95" stroke="#104281" stroke-width="1"/><text x="399.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">?</text><text x="260" y="320" text-anchor="middle" font-size="12" fill="#52514e">sees only prior tokens</text><rect x="190" y="350" width="18" height="14" fill="#184f95"/><text x="214" y="362" font-size="11" fill="#52514e">predicted</text><rect x="280" y="350" width="18" height="14" fill="#86b6ef"/><text x="304" y="362" font-size="11" fill="#52514e">visible</text><rect x="500" y="130" width="400" height="340" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Masked LM</text><rect x="518" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="560.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">the</text><rect x="611" y="230" width="85" height="50" rx="6" fill="#184f95" stroke="#104281" stroke-width="1"/><text x="653.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">[MASK]</text><rect x="704" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="746.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">was</text><rect x="797" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="839.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">overdrawn</text><text x="700" y="320" text-anchor="middle" font-size="12" fill="#52514e">sees full sequence, one position hidden</text><rect x="630" y="350" width="18" height="14" fill="#184f95"/><text x="654" y="362" font-size="11" fill="#52514e">predicted</text><rect x="720" y="350" width="18" height="14" fill="#86b6ef"/><text x="744" y="362" font-size="11" fill="#52514e">visible</text><rect x="940" y="130" width="400" height="340" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1140" y="165" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Seq2Seq</text><rect x="958" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="1000.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">(enc: full input)</text><rect x="1051" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="1093.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">-></text><rect x="1144" y="230" width="85" height="50" rx="6" fill="#86b6ef" stroke="#104281" stroke-width="1"/><text x="1186.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">gen</text><rect x="1237" y="230" width="85" height="50" rx="6" fill="#184f95" stroke="#104281" stroke-width="1"/><text x="1279.5" y="260" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">?</text><text x="1140" y="320" text-anchor="middle" font-size="12" fill="#52514e">decoder sees full input + prior outputs</text><rect x="1070" y="350" width="18" height="14" fill="#184f95"/><text x="1094" y="362" font-size="11" fill="#52514e">predicted</text><rect x="1160" y="350" width="18" height="14" fill="#86b6ef"/><text x="1184" y="362" font-size="11" fill="#52514e">visible</text>
</svg>