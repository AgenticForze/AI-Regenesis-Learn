<svg width="1360" height="620" viewBox="0 0 1360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-6-taxonomy desc-4-6-taxonomy">
  <title id="title-4-6-taxonomy">Two kinds of hallucination, split by whether the source can check it</title>
  <desc id="desc-4-6-taxonomy">A diagram showing a source document branching into two hallucination outcomes: intrinsic hallucination, which directly contradicts the source, and extrinsic hallucination, which the source can neither confirm nor deny.</desc>
  <defs></defs>
  <rect width="1360" height="620" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two kinds of hallucination, split by whether the source can check it</text>
  <defs><marker id="arrow-4-6-taxo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="80" y="130" width="320" height="140" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="240" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Source document</text><text x="240" y="214" text-anchor="middle" font-size="12" fill="#52514e">"The policy took effect in 2019."</text><rect x="520" y="90" width="380" height="180" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="710" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#a33a2f">Intrinsic hallucination</text><text x="710" y="165" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">Output: "The policy took</text><text x="710" y="183" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">effect in 2021."</text><text x="710" y="225" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Directly contradicts the</text><text x="710" y="241" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">source content given</text><rect x="960" y="90" width="380" height="180" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1150" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Extrinsic hallucination</text><text x="1150" y="165" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">Output: "The policy was</text><text x="1150" y="183" text-anchor="middle" font-size="12.5" font-weight="400" fill="#0b0b0b">championed by Senator X."</text><text x="1150" y="225" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">Not confirmed or denied by</text><text x="1150" y="241" text-anchor="middle" font-size="11.5" font-weight="400" fill="#52514e">the source, true or not</text><line x1="400.0" y1="193.2" x2="520.0" y2="188.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-taxo)"/><line x1="400.0" y1="196.5" x2="960.0" y2="184.2" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-taxo)"/><rect x="60" y="330" width="1240" height="90" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="351.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Ji et al., "Survey of Hallucination in Natural Language Generation" (2022/2023): intrinsic</text><text x="680" y="368.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">hallucination directly contradicts the source; extrinsic hallucination is unverifiable from the</text><text x="680" y="386.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">source either way. Both count as hallucination, though only intrinsic hallucination is directly</text><text x="680" y="403.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">checkable against the text the model was given.</text>
</svg>