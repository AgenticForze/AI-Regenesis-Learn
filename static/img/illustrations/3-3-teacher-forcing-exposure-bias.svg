<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-teacherforcing desc-teacherforcing">
  <title id="title-teacherforcing">Teacher forcing at training time creates a mismatch with how a seq2seq model actually runs at inference</title>
  <desc id="desc-teacherforcing">Two panels: during training, teacher forcing feeds the ground-truth previous token at every decoder step regardless of what the model predicted. During inference, the model must feed back its own predicted previous token, so an early mistake can compound, a phenomenon called exposure bias.</desc>
  <defs></defs>
  <rect width="1300" height="560" fill="#fcfcfb"/>
  <text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Training feeds the truth; inference feeds itself</text>
  <rect x="90" y="130" width="520" height="300" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="350" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Training: teacher forcing</text><rect x="130" y="210" width="440" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.2"/><text x="350" y="236.16666666666666" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">step 1: feed &lt;start&gt;</text><rect x="130" y="270" width="440" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.2"/><text x="350" y="296.1666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">step 2: feed true "le"</text><rect x="130" y="330" width="440" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.2"/><text x="350" y="356.1666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">step 3: feed true "chat"</text><text x="350" y="410" text-anchor="middle" font-size="12" fill="#52514e">ground truth fed in regardless of model's own prediction</text><rect x="690" y="130" width="520" height="300" rx="8" fill="#ffffff" stroke="#104281" stroke-width="2"/><text x="950" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Inference: feeds its own output</text><rect x="730" y="210" width="440" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.2"/><text x="950" y="236.16666666666666" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">step 1: feed &lt;start&gt;</text><rect x="730" y="270" width="440" height="44" rx="8" fill="#cde2fb" stroke="#184f95" stroke-width="1.2"/><text x="950" y="296.1666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b0b0b">step 2: feed OWN prediction "le"</text><rect x="730" y="330" width="440" height="44" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.2"/><text x="950" y="356.1666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a33a2f">step 3: feed OWN prediction (maybe wrong)</text><text x="950" y="410" text-anchor="middle" font-size="12" fill="#a33a2f">a wrong early prediction can compound: exposure bias</text><rect x="90" y="460" width="1120" height="65" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="486.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">The model never practices recovering from its own mistakes during training, since training always</text><text x="650" y="503.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">shows it the correct previous token.</text>
</svg>