<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-emergentcurve desc-emergentcurve">
  <title id="title-emergentcurve">Smooth loss curves versus a sharp emergent-ability jump</title>
  <desc id="desc-emergentcurve">Two charts side by side: test loss or perplexity improving smoothly and predictably as model scale increases, contrasted with a task accuracy metric that stays near random chance until a scale threshold, then rises sharply, the pattern Wei et al. call an emergent ability.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The same increase in scale, two very different-looking curves</text>
  <text x="340" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Smooth scaling (loss / perplexity)</text><text x="1020" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Emergent ability (task accuracy)</text><line x1="120" y1="420" x2="600" y2="420" stroke="#898781" stroke-width="1.5"/><line x1="120" y1="420" x2="120" y2="120" stroke="#898781" stroke-width="1.5"/><text x="360" y="454" text-anchor="middle" font-size="12.5" fill="#52514e">model scale →</text><line x1="800" y1="420" x2="1280" y2="420" stroke="#898781" stroke-width="1.5"/><line x1="800" y1="420" x2="800" y2="120" stroke="#898781" stroke-width="1.5"/><text x="1040" y="454" text-anchor="middle" font-size="12.5" fill="#52514e">model scale →</text><path d="M 130 400 L 149.2 394.5 L 168.3 388.9 L 187.5 383.2 L 206.7 377.3 L 225.8 371.3 L 245.0 365.2 L 264.2 358.8 L 283.3 352.3 L 302.5 345.5 L 321.7 338.6 L 340.8 331.4 L 360.0 323.8 L 379.2 316.0 L 398.3 307.8 L 417.5 299.2 L 436.7 290.1 L 455.8 280.4 L 475.0 270.0 L 494.2 258.7 L 513.3 246.1 L 532.5 231.9 L 551.7 215.1 L 570.8 193.1 L 590.0 140.0" fill="none" stroke="#2a78d6" stroke-width="3"/><path d="M 810 415 L 1070 412 C 1090 410, 1105 200, 1130 150 L 1270 130" fill="none" stroke="#a33a2f" stroke-width="3"/><line x1="1100" y1="420" x2="1100" y2="120" stroke="#e3e1db" stroke-width="1.5" stroke-dasharray="5,5"/><text x="1100" y="105" text-anchor="middle" font-size="12" fill="#52514e">scale threshold</text><rect x="60" y="470" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Loss and perplexity improve gradually with scale; some task-level accuracy metrics instead stay near</text><text x="680" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">chance, then rise sharply above a threshold.</text>
</svg>