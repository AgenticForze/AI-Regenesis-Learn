<svg width="1400" height="610" viewBox="0 0 1400 610" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-7-lifecycle desc-5-7-lifecycle">
  <title id="title-5-7-lifecycle">A request's path through a first LLM app</title>
  <desc id="desc-5-7-lifecycle">A diagram showing a request entering the app backend, checked against a semantic cache, passed to an LLM gateway that selects a healthy provider, assembled by an orchestration layer with conversation history and tools, checked by an input validation guardrail, sent to the model which generates a response optionally streaming it, checked by an output validation guardrail, and finally logged by an observability layer as it reaches the user.</desc>
  <defs></defs>
  <rect width="1400" height="610" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">A request's path through a first LLM app</text>
  <defs><marker id="arrow-5-7-lifecycle" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="60" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="200" y="148.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Request arrives at</text><text x="200" y="164.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">the app backend</text><rect x="380" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="520" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Semantic cache</text><text x="520" y="156.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">checked for a</text><text x="520" y="172.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">near-duplicate</text><rect x="700" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="840" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">LLM gateway</text><text x="840" y="156.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">selects a healthy</text><text x="840" y="172.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">provider</text><rect x="1020" y="110" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1160" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Orchestration</text><text x="1160" y="156.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">assembles prompt,</text><text x="1160" y="172.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">history, and tools</text><line x1="340.0" y1="155.0" x2="380.0" y2="155.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><line x1="660.0" y1="155.0" x2="700.0" y2="155.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><line x1="980.0" y1="155.0" x2="1020.0" y2="155.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><rect x="60" y="340" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="200" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Input passes a</text><text x="200" y="386.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">validation</text><text x="200" y="402.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">guardrail</text><rect x="380" y="340" width="280" height="90" rx="8" fill="#5598e7" stroke="#184f95" stroke-width="1.5"/><text x="520" y="361.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Model generates a</text><text x="520" y="378.125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">response,</text><text x="520" y="394.375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">optionally</text><text x="520" y="410.625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">streaming</text><rect x="700" y="340" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="840" y="370" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Output passes a</text><text x="840" y="386.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">validation</text><text x="840" y="402.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">guardrail</text><rect x="1020" y="340" width="280" height="90" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1160" y="362.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Observability</text><text x="1160" y="378.40000000000003" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">layer logs the</text><text x="1160" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">trace; response</text><text x="1160" y="409.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">reaches the user</text><line x1="340.0" y1="385.0" x2="380.0" y2="385.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><line x1="660.0" y1="385.0" x2="700.0" y2="385.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><line x1="980.0" y1="385.0" x2="1020.0" y2="385.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><path d="M 1160 200 L 1160 270 L 200 270 L 200 340" fill="none" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-5-7-lifecycle)"/><rect x="60" y="470" width="1280" height="100" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="505" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">A cache hit at the second box returns a stored response immediately, skipping the gateway,</text><text x="700" y="522.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">orchestration, and model call entirely; every other request flows through the full chain shown here,</text><text x="700" y="540" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">with the observability layer recording it regardless of which path it took.</text>
</svg>