<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-tfd desc-tfd">
  <title id="title-tfd">One trained TensorFlow model, three deployment paths built on its graph-based history</title>
  <desc id="desc-tfd">A single trained TensorFlow model at the top branches into three deployment targets. TensorFlow Serving deploys the model for high-throughput server inference. TensorFlow Lite converts the model for mobile and embedded devices. TensorFlow.js converts the model to run directly in a web browser.</desc>
  <rect width="1300" height="560" fill="#fcfcfb"/><text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">TensorFlow's deployment ecosystem: one model, three targets</text><defs>
    <marker id="arrowtfd" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
  </defs><rect x="490" y="75" width="320" height="70" rx="10" fill="#104281" stroke="#104281" stroke-width="1.5"/><text x="650" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Trained TensorFlow model</text><text x="650" y="128" text-anchor="middle" font-size="11.5" fill="#86b6ef">a SavedModel, framework-independent format</text><line x1="583.9" y1="148.0" x2="368.2" y2="272.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowtfd)"/><line x1="650.0" y1="151.0" x2="650.0" y2="269.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowtfd)"/><line x1="716.1" y1="148.0" x2="931.8" y2="272.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowtfd)"/><rect x="90" y="275" width="320" height="130" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="90" y="275" width="320" height="40" rx="10" fill="#2a78d6"/><rect x="90" y="295" width="320" height="20" fill="#2a78d6"/><text x="250" y="301" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">TensorFlow Serving</text><text x="250" y="336" text-anchor="middle" font-size="12" fill="#52514e">high-throughput server inference</text><text x="250" y="362" text-anchor="middle" font-size="12" fill="#52514e">used for production APIs at scale</text><rect x="490" y="275" width="320" height="130" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="490" y="275" width="320" height="40" rx="10" fill="#2a78d6"/><rect x="490" y="295" width="320" height="20" fill="#2a78d6"/><text x="650" y="301" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">TensorFlow Lite</text><text x="650" y="336" text-anchor="middle" font-size="12" fill="#52514e">compiled for mobile and embedded devices</text><text x="650" y="362" text-anchor="middle" font-size="12" fill="#52514e">used for on-device, offline-capable inference</text><rect x="890" y="275" width="320" height="130" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><rect x="890" y="275" width="320" height="40" rx="10" fill="#2a78d6"/><rect x="890" y="295" width="320" height="20" fill="#2a78d6"/><text x="1050" y="301" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">TensorFlow.js</text><text x="1050" y="336" text-anchor="middle" font-size="12" fill="#52514e">converted to run in a web browser</text><text x="1050" y="362" text-anchor="middle" font-size="12" fill="#52514e">used for client-side, in-browser inference</text><rect x="90" y="480" width="1120" height="50" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="510" text-anchor="middle" font-size="12.5" fill="#52514e">Built up over TensorFlow's graph-based history, this deployment tooling remains a distinguishing strength</text></svg>