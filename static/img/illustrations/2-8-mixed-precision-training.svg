<svg width="1300" height="620" viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-mp desc-mp">
  <title id="title-mp">Mixed-precision training: FP32 master weights, FP16 forward and backward pass, loss scaling to protect small gradients</title>
  <desc id="desc-mp">A cyclical diagram showing an FP32 master copy of the weights being cast down to FP16 for the forward pass, which runs on Tensor Cores. The loss is scaled up by a constant before the backward pass, which also runs in FP16 on Tensor Cores, and the resulting FP16 gradients are unscaled back down and used to update the FP32 master weights, closing the loop.</desc>
  <rect width="1300" height="620" fill="#fcfcfb"/><text x="650" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Mixed-precision training: fast FP16 compute, stable FP32 weights</text><defs>
    <marker id="arrowmp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker>
  </defs><line x1="271.0" y1="150.0" x2="529.0" y2="150.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><line x1="771.0" y1="150.0" x2="1029.0" y2="150.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><line x1="1150.0" y1="193.0" x2="1150.0" y2="277.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><line x1="1150.0" y1="363.0" x2="1150.0" y2="447.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><line x1="1029.0" y1="490.0" x2="771.0" y2="490.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><line x1="529.0" y1="490.0" x2="271.0" y2="490.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><line x1="150.0" y1="447.0" x2="150.0" y2="193.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrowmp)"/><rect x="35" y="113" width="230" height="74" rx="10" fill="#104281" stroke="#104281" stroke-width="1.5"/><text x="150" y="144" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FP32 master weights</text><text x="150" y="166" text-anchor="middle" font-size="10.5" fill="#ffffff">stored for numerical stability</text><rect x="535" y="113" width="230" height="74" rx="10" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="650" y="144" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Cast to FP16</text><text x="650" y="166" text-anchor="middle" font-size="10.5" fill="#ffffff">faster on Tensor Cores</text><rect x="1035" y="113" width="230" height="74" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="1150" y="144" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Forward pass (FP16)</text><text x="1150" y="166" text-anchor="middle" font-size="10.5" fill="#ffffff">runs on Tensor Cores</text><rect x="1035" y="283" width="230" height="74" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="1150" y="314" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Loss scaled up</text><text x="1150" y="336" text-anchor="middle" font-size="10.5" fill="#ffffff">multiplied by a constant</text><rect x="1035" y="453" width="230" height="74" rx="10" fill="#5598e7" stroke="#104281" stroke-width="1.5"/><text x="1150" y="484" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Backward pass (FP16)</text><text x="1150" y="506" text-anchor="middle" font-size="10.5" fill="#ffffff">runs on Tensor Cores</text><rect x="535" y="453" width="230" height="74" rx="10" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="650" y="484" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Gradients unscaled</text><text x="650" y="506" text-anchor="middle" font-size="10.5" fill="#ffffff">divided back down</text><rect x="35" y="453" width="230" height="74" rx="10" fill="#104281" stroke="#104281" stroke-width="1.5"/><text x="150" y="484" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">FP32 weight update</text><text x="150" y="506" text-anchor="middle" font-size="10.5" fill="#ffffff">applied to the master weights</text></svg>