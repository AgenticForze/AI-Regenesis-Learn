<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-5 desc-8-5"><title id="title-8-5">Two Gated Paths Connect a Bounded Context to an Unbounded Store</title><desc id="desc-8-5">Working Context holds everything currently in the prompt: bounded and expensive per token, but perfectly reliable while it lasts. A write gate decides whether something worth keeping gets appended to the External Memory Store, which is effectively unbounded but outside the model's view until something is retrieved. A retrieve gate decides what, if anything, comes back into Working Context for the current turn, scored by a combination of recency, importance, and relevance. Content that fails either gate is not lost immediately, but it is not remembered on purpose either: it stays only in context until it is evicted, or it stays in the store until nothing ever scores it high enough to be retrieved again.</desc><rect width="1560" height="700" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">Two Gated Paths Connect a Bounded Context to an Unbounded Store</text><defs><marker id="a85-blue" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b8fc9"/></marker><marker id="a85-green" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5fae83"/></marker><marker id="a85-amber" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c9975b"/></marker></defs><rect x="55" y="285" width="270" height="130" rx="12" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="190.0" y="315" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d3d">Working Context</text><text x="190.0" y="335" text-anchor="middle" font-size="11" fill="#6b7280">everything in the prompt</text><text x="190.0" y="350" text-anchor="middle" font-size="11" fill="#6b7280">right now, bounded and</text><text x="190.0" y="365" text-anchor="middle" font-size="11" fill="#6b7280">expensive per token</text><rect x="1235" y="285" width="270" height="130" rx="12" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.75"/><text x="1370.0" y="315" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d3d">External Memory Store</text><text x="1370.0" y="335" text-anchor="middle" font-size="11" fill="#6b7280">episodic + semantic,</text><text x="1370.0" y="350" text-anchor="middle" font-size="11" fill="#6b7280">effectively unbounded,</text><text x="1370.0" y="365" text-anchor="middle" font-size="11" fill="#6b7280">invisible until retrieved</text><polygon points="660,130.0 775.0,185 660,240.0 545.0,185" fill="#fff6df" stroke="#c9975b" stroke-width="1.75"/><text x="660" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">Worth keeping, or</text><text x="660" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">over context budget?</text><polygon points="660,460.0 775.0,515 660,570.0 545.0,515" fill="#e3f0e8" stroke="#5fae83" stroke-width="1.75"/><text x="660" y="509" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">Scores high enough</text><text x="660" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">right now to recall?</text><path d="M 325 315 L 545.0 185" fill="none" stroke="#c9975b" stroke-width="2.25" marker-end="url(#a85-amber)"/><path d="M 775.0 185 L 1235 315" fill="none" stroke="#c9975b" stroke-width="2.25" marker-end="url(#a85-amber)"/><text x="1015.0" y="228.0" text-anchor="middle" font-size="12" fill="#a97b3e">yes: appended, e.g. to a memory stream or archival store</text><text x="660" y="116.0" text-anchor="middle" font-size="12" fill="#9aa3ad">no: stays only in context, evicted whenever it rolls over</text><path d="M 1235 385 L 775.0 515" fill="none" stroke="#5fae83" stroke-width="2.25" marker-end="url(#a85-green)"/><path d="M 545.0 515 L 325 385" fill="none" stroke="#5fae83" stroke-width="2.25" marker-end="url(#a85-green)"/><text x="425.0" y="474.0" text-anchor="middle" font-size="12" fill="#3f8a63">yes: top-k by recency + importance + relevance</text><text x="660" y="592.0" text-anchor="middle" font-size="12" fill="#9aa3ad">no: not recalled this turn, stays in the store</text><rect x="55" y="600" width="1450" height="72" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="628" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Write and retrieve are two separately gated decisions, not one memory mechanism.</text><text x="780.0" y="650" text-anchor="middle" font-size="13.5" fill="#1f2d3d">A system can get either gate wrong independently: writing too much, or retrieving the wrong thing.</text></svg>