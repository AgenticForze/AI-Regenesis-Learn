<svg width="1300" height="460" viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-ai desc-ai">
  <title id="title-ai">Self-attention connects "it" directly to "animal" regardless of distance</title>
  <desc id="desc-ai">The sentence "the animal did not cross the street because it was too tired" is shown as a row of words. Curved lines connect the word "it" to every other word, with line thickness proportional to attention weight. The thickest line connects "it" to "animal", showing self-attention resolves the reference in a single step rather than through a chain of intermediate hidden states.</desc>
