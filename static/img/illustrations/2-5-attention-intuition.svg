xt x="228.18181818181816" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">animal</text><rect x="284.9090909090909" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="333.6363636363636" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">didn’t</text><rect x="390.3636363636364" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="439.0909090909091" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">cross</text><rect x="495.81818181818176" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="544.5454545454545" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">the</text><rect x="601.2727272727273" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">street</text><rect x="706.7272727272727" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="755.4545454545455" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">because</text><rect x="812.1818181818181" y="260" width="97.45454545454545" height="40" rx="8" fill="#104281" stroke="#e3e1db" stroke-width="1.5"/><text x="860.9090909090909" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">it</text><rect x="917.6363636363636" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="966.3636363636364" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">was</text><rect x="1023.090909090909" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1071.8181818181818" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">too</text><rect x="1128.5454545454545" y="260" width="97.45454545454545" height="40" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1177.2727272727273" y="286" text-anchor="middle" font-size="14" font-weight="400" fill="#0b0b0b">tired</text><rect x="90" y="360" width="1120" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="386" text-anchor="middle" font-size="12.5" fill="#52514e">Line thickness = attention weight from "it" to that word</text><text x="650" y="406" text-anchor="middle" font-size="12.5" fill="#52514e">The connection to "animal" forms in one attention step, regardless of the words between them</text></svg>