<svg width="1300" height="680" viewBox="0 0 1300 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-mha desc-mha">
  <title id="title-mha">Multi-head attention runs several attention computations in parallel and concatenates the results</title>
  <desc id="desc-mha">A diagram showing the same query, key, and value input feeding four separate attention heads, each with its own learned projections, running in parallel. The four heads outputs are concatenated and passed through one final linear projection to produce the multi-head attention output.</desc>
  <rect width="1300" height="680" fill="#fcfcfb"/><text x="650" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Multi-head attention: parallel heads, concatenated</text><rect x="465" y="80" width="90" height="42" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="510" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Q</text><rect x="605" y="80" width="90" height="42" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="650" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">K</text><rect x="745" y="80" width="90" height="42" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="790" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">V</text><rect x="130" y="220" width="230" height="130" rx="10" fill="#86b6ef" stroke="#104281" stroke-width="2"/><text x="245" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Head 1</text><text x="245" y="278" text-anchor="middle" font-size="11" fill="#52514e">own W_Q_i, W_K_i, W_V_i</text><text x="245" y="300" text-anchor="middle" font-size="11" fill="#52514e">Attention(Q W_Q_i, K W_K_i,</text><text x="245" y="318" text-anchor="middle" font-size="11" fill="#52514e">V W_V_i)</text><line x1="650" y1="122" x2="245" y2="220" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="400" y="220" width="230" height="130" rx="10" fill="#5598e7" stroke="#104281" stroke-width="2"/><text x="515" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Head 2</text><text x="515" y="278" text-anchor="middle" font-size="11" fill="#52514e">own W_Q_i, W_K_i, W_V_i</text><text x="515" y="300" text-anchor="middle" font-size="11" fill="#52514e">Attention(Q W_Q_i, K W_K_i,</text><text x="515" y="318" text-anchor="middle" font-size="11" fill="#52514e">V W_V_i)</text><line x1="650" y1="122" x2="515" y2="220" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="670" y="220" width="230" height="130" rx="10" fill="#2a78d6" stroke="#104281" stroke-width="2"/><text x="785" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Head 3</text><text x="785" y="278" text-anchor="middle" font-size="11" fill="#dbe8fb">own W_Q_i, W_K_i, W_V_i</text><text x="785" y="300" text-anchor="middle" font-size="11" fill="#dbe8fb">Attention(Q W_Q_i, K W_K_i,</text><text x="785" y="318" text-anchor="middle" font-size="11" fill="#dbe8fb">V W_V_i)</text><line x1="650" y1="122" x2="785" y2="220" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="940" y="220" width="230" height="130" rx="10" fill="#184f95" stroke="#104281" stroke-width="2"/><text x="1055" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Head 4</text><text x="1055" y="278" text-anchor="middle" font-size="11" fill="#dbe8fb">own W_Q_i, W_K_i, W_V_i</text><text x="1055" y="300" text-anchor="middle" font-size="11" fill="#dbe8fb">Attention(Q W_Q_i, K W_K_i,</text><text x="1055" y="318" text-anchor="middle" font-size="11" fill="#dbe8fb">V W_V_i)</text><line x1="650" y1="122" x2="1055" y2="220" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="130" y="410" width="1040" height="46" rx="8" fill="#0b0b0b"/><text x="650" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Concat(head_1, head_2, head_3, head_4)</text><line x1="245" y1="350" x2="245" y2="410" stroke="#104281" stroke-width="2" marker-end="url(#arrowmh)"/><line x1="515" y1="350" x2="515" y2="410" stroke="#104281" stroke-width="2" marker-end="url(#arrowmh)"/><line x1="785" y1="350" x2="785" y2="410" stroke="#104281" stroke-width="2" marker-end="url(#arrowmh)"/><line x1="1055" y1="350" x2="1055" y2="410" stroke="#104281" stroke-width="2" marker-end="url(#arrowmh)"/><rect x="510" y="506" width="280" height="52" rx="8" fill="#104281"/><text x="650" y="539" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">× W_O (final linear projection)</text><line x1="650" y1="456" x2="650" y2="506" stroke="#0b0b0b" stroke-width="2.5" marker-end="url(#arrowmh)"/><defs><marker id="arrowmh" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#104281"/></marker></defs><rect x="90" y="586" width="1120" height="55" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="650" y="619" text-anchor="middle" font-size="12.5" fill="#52514e">Each head learns its own subspace; splitting into h heads costs about the same compute as one large head</text></svg>