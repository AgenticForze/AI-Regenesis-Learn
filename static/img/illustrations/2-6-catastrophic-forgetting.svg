<svg width="1100" height="600" viewBox="0 0 1100 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-cf desc-cf">
  <title id="title-cf">Catastrophic forgetting: as target-task accuracy rises during naive continued training, source-task accuracy collapses</title>
  <desc id="desc-cf">A line chart with target-task training steps on the horizontal axis and accuracy on the vertical axis. A blue line for target-task accuracy rises steadily from a low starting point toward a high plateau. A red line for source-task accuracy starts high but declines sharply as target-task training continues, illustrating catastrophic forgetting.</desc>
