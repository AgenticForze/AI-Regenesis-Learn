4" y="390" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="774" y="390" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="834" y="390" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="470" y="430" width="62" height="38" fill="#fcfcfb" stroke="#e3e1db" stroke-width="1"/><text x="502" y="454" text-anchor="middle" font-size="12" font-weight="400" fill="#898781">id 8</text><rect x="534" y="430" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="594" y="430" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="654" y="430" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="714" y="430" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="774" y="430" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><rect x="834" y="430" width="58" height="38" fill="#ffffff" stroke="#e3e1db" stroke-width="1"/><path d="M 904 270 L 919 270 L 919 308 L 904 308" fill="none" stroke="#184f95" stroke-width="2"/><text x="934" y="282" font-size="13" font-weight="700" fill="#184f95">token ID 4's row</text><text x="934" y="302" font-size="12" fill="#52514e">= its embedding vector, E_4</text><rect x="60" y="260" width="150" height="60" rx="8" fill="#ffffff" stroke="#104281" stroke-width="2"/><text x="135" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">token ID = 4</text><line x1="210" y1="290" x2="467" y2="290" stroke="#184f95" stroke-width="2.4" marker-end="url(#arr31e)"/><rect x="60" y="500" width="1130" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="625" y="523.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Training only updates the rows touched by that batch's token IDs; a rare token's row is updated far</text><text x="625" y="541.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">less often than a common one's, one reason rare-token embeddings tend to be lower quality.</text>
