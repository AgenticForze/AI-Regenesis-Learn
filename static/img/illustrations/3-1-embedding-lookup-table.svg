<svg width="1250" height="600" viewBox="0 0 1250 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-lookup desc-lookup">
  <title id="title-lookup">An embedding lookup indexes directly into the embedding matrix by token ID</title>
  <desc id="desc-lookup">A matrix with one row per vocabulary token ID and one column per embedding dimension. Token ID 4 is highlighted, showing that looking up its embedding means reading row 4 of the matrix directly, an array index rather than a matrix multiplication.</desc>
  <defs><marker id="arr31e" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#104281"/></marker></defs>
  <rect width="1250" height="600" fill="#fcfcfb"/>
  <text x="625" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The embedding matrix is a table, indexed by ID</text>
