<svg width="1360" height="640" viewBox="0 0 1360 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-4-6-selfcheckgpt desc-4-6-selfcheckgpt">
  <title id="title-4-6-selfcheckgpt">SelfCheckGPT: catching likely hallucination via sampled-answer consistency</title>
  <desc id="desc-4-6-selfcheckgpt">A diagram showing the same prompt sampled four times, with three consistent answers and one divergent outlier flagged as a likely hallucination.</desc>
  <defs></defs>
  <rect width="1360" height="640" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">SelfCheckGPT: catching likely hallucination via sampled-answer consistency</text>
  <defs><marker id="arrow-4-6-scg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="560" y="90" width="240" height="80" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="680" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0b0b0b">Same prompt</text><text x="680" y="144" text-anchor="middle" font-size="11.5" fill="#52514e">sampled N times</text><rect x="85" y="250" width="260" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="215" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Sample 1</text><text x="215" y="321" text-anchor="middle" font-size="12.5" font-weight="400" fill="#184f95">Founded in 1994</text><line x1="573.7" y1="170.0" x2="345.0" y2="256.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-scg)"/><rect x="395" y="250" width="260" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="525" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Sample 2</text><text x="525" y="321" text-anchor="middle" font-size="12.5" font-weight="400" fill="#184f95">Founded in 1994</text><line x1="644.6" y1="170.0" x2="573.7" y2="250.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-scg)"/><rect x="705" y="250" width="260" height="110" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="835" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Sample 3</text><text x="835" y="321" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">Founded in 1988</text><line x1="715.4" y1="170.0" x2="786.3" y2="250.0" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-scg)"/><rect x="1015" y="250" width="260" height="110" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="1145" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">Sample 4</text><text x="1145" y="321" text-anchor="middle" font-size="12.5" font-weight="400" fill="#184f95">Founded in 1994</text><line x1="786.3" y1="170.0" x2="1015.0" y2="256.1" stroke="#184f95" stroke-width="2.2" marker-end="url(#arrow-4-6-scg)"/><text x="680" y="415" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Three of four sampled answers agree; one diverges, the outlier the model has no</text><text x="680" y="435" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">real fact anchoring, since a genuinely known fact tends to be reproduced consistently.</text><rect x="60" y="470" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Manakul, Liusie, and Gales, "SelfCheckGPT" (2023): a black-box, sampling-based detector needing no</text><text x="680" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">model internals or external knowledge source.</text>
</svg>