<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-1-memory desc-6-1-memory">
  <title id="title-6-1-memory">Two kinds of memory</title>
  <desc id="desc-6-1-memory">A diagram contrasting parametric memory, knowledge baked into a model's weights during training, frozen and unable to cite a source, with non-parametric memory, an external corpus or index that is queried fresh at inference time, can be updated independently of the model, and can point back to the exact document a fact came from.</desc>
  <defs></defs>
  <rect width="1400" height="620" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Two kinds of memory</text>
  <rect x="60" y="130" width="600" height="70" rx="8" fill="#184f95" stroke="#184f95" stroke-width="1.5"/><text x="360" y="166.6" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Parametric memory</text><rect x="60" y="220" width="600" height="290" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="360" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Baked into the model's weights during training</text><text x="360" y="310" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Frozen the moment training data collection</text><text x="360" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">stops</text><text x="360" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">No pointer back to any source document</text><text x="360" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Coverage shaped by how often a fact appeared</text><text x="360" y="434" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">in training data</text><rect x="800" y="130" width="600" height="70" rx="8" fill="#5598e7" stroke="#5598e7" stroke-width="1.5"/><text x="1100" y="166.6" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Non-parametric memory</text><rect x="800" y="220" width="600" height="290" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1100" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Lives in an external, queryable corpus or</text><text x="1100" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">index</text><text x="1100" y="328" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Updated the moment a source document changes</text><text x="1100" y="372" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Every retrieved passage can be cited directly</text><text x="1100" y="416" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Coverage is whatever was deliberately indexed,</text><text x="1100" y="434" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">including rare facts</text><rect x="60" y="540" width="1280" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="563.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Two different kinds of memory, one baked into the model during training, one queried fresh at</text><text x="700" y="581.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">inference time.</text>
</svg>