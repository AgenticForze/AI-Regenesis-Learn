<svg width="1360" height="560" viewBox="0 0 1360 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-sizeclasses desc-sizeclasses">
  <title id="title-sizeclasses">Three size classes, three different capability-versus-deployability trade-offs</title>
  <desc id="desc-sizeclasses">Three panels contrasting frontier/flagship, mid-size, and small/edge model size classes across capability, cost and latency, and typical hardware requirement.</desc>
  <defs></defs>
  <rect width="1360" height="560" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Bigger is not automatically the right choice</text>
  <rect x="60" y="130" width="380" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="250" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Frontier / flagship</text><text x="250" y="210" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Highest capability</text><text x="250" y="236" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Highest cost and latency</text><text x="250" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Multi-GPU cluster or API only</text><rect x="480" y="130" width="380" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="670" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Mid-size</text><text x="670" y="210" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Somewhat lower capability</text><text x="670" y="236" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Lower cost and latency</text><text x="670" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Self-hostable on a few GPUs</text><rect x="900" y="130" width="380" height="300" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="1090" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">Small / edge (SLM)</text><text x="1090" y="210" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Further reduced capability</text><text x="1090" y="236" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Lowest cost and latency</text><text x="1090" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Single consumer GPU or on-device</text><rect x="60" y="470" width="1240" height="60" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="493.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">A smaller model fine-tuned tightly on one narrow task can sometimes match a much larger</text><text x="680" y="511.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">general-purpose model on that specific task.</text>
</svg>