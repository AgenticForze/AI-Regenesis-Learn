<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-8-refarch desc-6-8-refarch">
  <title id="title-6-8-refarch">An evaluation pipeline scoring both halves of a RAG system</title>
  <desc id="desc-6-8-refarch">A single-column flow diagram: an evaluation set of queries, known-relevant documents, and reference answers feeds retrieval, which is scored with Precision at k, Recall at k, MRR, and NDCG, then generation runs on the retrieved context and is scored with Faithfulness, Answer Relevancy, Context Precision, and Context Recall, producing an aggregate report that a human spot-check validates before a regression gate decides whether to ship or block the change.</desc>
  <rect width="1500" height="980" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">An evaluation pipeline scoring both halves of a RAG system</text>
  <defs><marker id="arrow-6-8-refarch-main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5b8fc9"/></marker></defs><rect x="100" y="100" width="1300" height="68" rx="10" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.5"/><text x="750" y="128.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Evaluation set: queries + known-relevant docs + reference</text><text x="750" y="144.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">answers</text><rect x="100" y="192" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="228.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Run retrieval (Ch. 6.2-6.4)</text><line x1="750" y1="168" x2="750" y2="192" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/><rect x="100" y="284" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="320.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Retrieval metrics: Precision@k, Recall@k, MRR, NDCG</text><line x1="750" y1="260" x2="750" y2="284" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/><rect x="100" y="376" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="412.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Run generation on retrieved context</text><line x1="750" y1="352" x2="750" y2="376" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/><rect x="100" y="468" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="504.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Faithfulness + Answer Relevancy + Context Precision/Recall</text><line x1="750" y1="444" x2="750" y2="468" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/><rect x="100" y="560" width="1300" height="68" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="750" y="596.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Aggregate evaluation report</text><line x1="750" y1="536" x2="750" y2="560" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/><rect x="100" y="652" width="1300" height="68" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="750" y="680.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Human spot-check a sample, track agreement with automated</text><text x="750" y="696.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">scores</text><line x1="750" y1="628" x2="750" y2="652" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/><rect x="100" y="744" width="1300" height="68" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="750" y="774.275" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Regression gate: within threshold of baseline?</text><text x="750" y="797.975" text-anchor="middle" font-size="10.5" fill="#6b7280">yes: ship | no: block and investigate</text><line x1="750" y1="720" x2="750" y2="744" stroke="#5b8fc9" stroke-width="2" marker-end="url(#arrow-6-8-refarch-main)"/>
</svg>