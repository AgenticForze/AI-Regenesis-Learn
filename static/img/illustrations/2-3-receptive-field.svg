<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-rf desc-rf">
  <title id="title-rf">Each additional layer expands the receptive field of the units that follow it</title>
  <desc id="desc-rf">A 9x9 input grid with three concentric highlighted squares centered on the same point: a 3x3 region for a single unit after one convolutional layer, a 5x5 region after two layers, and a 7x7 region after three layers. The deepest unit's value depends on a much larger area of the original input than the shallowest one's.</desc>
  <rect width="1000" height="500" fill="#fcfcfb"/>
  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Depth expands what one unit "sees" in the original input</text>
  <text x="300" y="74" font-size="13" font-weight="700" fill="#0b0b0b">ORIGINAL INPUT (9&#215;9)</text>
