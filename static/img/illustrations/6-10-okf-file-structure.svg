<svg width="1500" height="700" viewBox="0 0 1500 700" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-10-fs desc-6-10-fs">
  <title id="title-6-10-fs">One concept, one markdown file, identified by its file path</title>
