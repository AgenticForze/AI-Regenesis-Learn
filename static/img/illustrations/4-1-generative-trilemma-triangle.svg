<svg width="1360" height="660" viewBox="0 0 1360 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-trilemma desc-trilemma">
  <title id="title-trilemma">The generative learning trilemma: no single family gets quality, diversity, and speed all at once</title>
  <desc id="desc-trilemma">A triangle with three vertices labeled high sample quality, full coverage of data diversity, and fast sampling. Beside it, a separate legend block lists which two goals GANs, VAEs, and diffusion models each tend to satisfy, and which goal each sacrifices.</desc>
  <defs></defs>
  <rect width="1360" height="660" fill="#fcfcfb"/>
  <text x="680" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three goals, no family gets all three</text>
  <polygon points="430,150 265.4551732809566,435 594.5448267190434,435" fill="#cde2fb" stroke="#2a78d6" stroke-width="2"/><text x="430" y="89.19999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">High sample</text><text x="430" y="109.19999999999999" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">quality</text><text x="212.80082873086272" y="465.4" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">Full coverage of</text><text x="212.80082873086272" y="485.4" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">data diversity</text><text x="647.1991712691373" y="465.4" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">Fast</text><text x="647.1991712691373" y="485.4" text-anchor="middle" font-size="14" font-weight="700" fill="#184f95">sampling</text><rect x="800" y="150" width="480" height="380" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1040" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">Where each family lands</text><circle cx="834" cy="226" r="7" fill="#2a78d6"/><text x="856" y="231" font-size="14.5" font-weight="700" fill="#0b0b0b">GANs</text><text x="1050" y="258" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Keeps: quality + speed</text><text x="1050" y="280" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">Sacrifices: diversity (prone to mode</text><text x="1050" y="298" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">collapse)</text><circle cx="834" cy="331" r="7" fill="#184f95"/><text x="856" y="336" font-size="14.5" font-weight="700" fill="#0b0b0b">VAEs</text><text x="1050" y="363" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Keeps: diversity + speed</text><text x="1050" y="385" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">Sacrifices: sample quality (often</text><text x="1050" y="403" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">blurrier)</text><circle cx="834" cy="436" r="7" fill="#0d2c4e"/><text x="856" y="441" font-size="14.5" font-weight="700" fill="#0b0b0b">Diffusion models</text><text x="1050" y="468" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">Keeps: quality + diversity</text><text x="1050" y="490" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">Sacrifices: speed (many sequential</text><text x="1050" y="508" text-anchor="middle" font-size="12.5" font-weight="400" fill="#a33a2f">steps)</text><rect x="60" y="560" width="1240" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="680" y="588.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">No family available today achieves all three goals at once; the generative learning trilemma is why</text><text x="680" y="606.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">chapter 4.2 covers several structurally different families rather than one best approach.</text>
</svg>