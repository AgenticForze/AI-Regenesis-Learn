<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-gru desc-gru">
  <title id="title-gru">Inside a GRU cell: an update gate blends the previous hidden state with a new candidate</title>
  <desc id="desc-gru">A diagram of one GRU cell. A horizontal hidden-state line runs across the top. An update gate controls a blend between the previous hidden state and a new candidate hidden state computed from a reset-gated version of the previous hidden state and the current input. There is no separate cell state, only the hidden state line.</desc>
  <rect width="1200" height="720" fill="#fcfcfb"/><text x="600" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Inside a GRU cell: one gate blends old and new hidden state</text><rect x="90" y="80" width="1020" height="500" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><line x1="110" y1="150" x2="1090" y2="150" stroke="#104281" stroke-width="3.5"/><text x="100" y="136" font-size="12.5" font-weight="700" fill="#104281">h_(t-1)</text><text x="1100" y="136" text-anchor="end" font-size="12.5" font-weight="700" fill="#104281">h_t</text><circle cx="330" cy="150" r="18" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="330" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#184f95">1-z</text><circle cx="870" cy="150" r="16" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="870" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#184f95">+</text><line x1="348" y1="150" x2="854" y2="150" stroke="#104281" stroke-width="3.5"/><rect x="445" y="300" width="130" height="56" rx="8" fill="#2a78d6" stroke="#104281" stroke-width="1.5"/><text x="510" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">reset gate</text><text x="510" y="343" text-anchor="middle" font-size="11" fill="#ffffff">r_t = σ(...)</text><rect x="625" y="300" width="130" height="56" rx="8" fill="#184f95" stroke="#104281" stroke-width="1.5"/><text x="690" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">update gate</text><text x="690" y="343" text-anchor="middle" font-size="11" fill="#ffffff">z_t = σ(...)</text><line x1="690" y1="300" x2="330" y2="168" stroke="#184f95" stroke-width="2" marker-end="url(#arrowu)"/><circle cx="870" cy="450" r="20" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="870" y="455" text-anchor="middle" font-size="11.5" font-weight="700" fill="#184f95">tanh</text><text x="900" y="424" font-size="11" fill="#52514e">candidate h~_t</text><line x1="510" y1="300" x2="855" y2="464" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrowu)"/><circle cx="870" cy="260" r="16" fill="#ffffff" stroke="#184f95" stroke-width="2"/><text x="870" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#184f95">z</text><line x1="870" y1="430" x2="870" y2="276" stroke="#184f95" stroke-width="2" marker-end="url(#arrowu)"/><line x1="870" y1="244" x2="870" y2="166" stroke="#184f95" stroke-width="2" marker-end="url(#arrowu)"/><line x1="690" y1="356" x2="855" y2="268" stroke="#184f95" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowu)"/><defs><marker id="arrowu" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#184f95"/></marker></defs><rect x="130" y="530" width="110" height="40" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><text x="185" y="555" text-anchor="middle" font-size="12.5" fill="#52514e">h_(t-1)</text><rect x="260" y="530" width="90" height="40" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><text x="305" y="555" text-anchor="middle" font-size="12.5" fill="#52514e">x_t</text><text x="410" y="555" font-size="11.5" fill="#898781">h_(t-1) and x_t together feed both gates and the candidate (arrows omitted for clarity)</text><rect x="90" y="610" width="1020" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="600" y="635" text-anchor="middle" font-size="12.5" fill="#52514e">No separate cell state: the update gate directly blends the old hidden state with the new candidate</text><text x="600" y="654" text-anchor="middle" font-size="12.5" fill="#52514e">Fewer gates and parameters than an LSTM of the same size, often comparable accuracy</text></svg>