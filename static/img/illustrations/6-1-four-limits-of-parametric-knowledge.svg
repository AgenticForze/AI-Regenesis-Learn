<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-1-limits desc-6-1-limits">
  <title id="title-6-1-limits">The four limits of parametric knowledge</title>
  <desc id="desc-6-1-limits">A four-quadrant diagram naming the four limits of parametric knowledge: staleness, knowledge is frozen at the training cutoff; no provenance, a fact baked into weights carries no pointer back to a source document; uneven coverage, some facts are learned far more readily than others depending on how often they appeared in training data; and costly, risky updates, retraining or fine-tuning to add new knowledge risks catastrophic forgetting of what the model already knew.</desc>
  <defs></defs>
  <rect width="1400" height="640" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">The four limits of parametric knowledge</text>
  <rect x="60" y="110" width="580" height="210" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="350" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#a33a2f">Staleness</text><text x="350" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Knowledge is frozen at whatever moment</text><text x="350" y="220" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">training data collection stopped; nothing</text><text x="350" y="240" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">updates it on its own.</text><rect x="760" y="110" width="580" height="210" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1050" y="154" text-anchor="middle" font-size="17" font-weight="700" fill="#a33a2f">No provenance</text><text x="1050" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">A fact baked into weights carries no pointer</text><text x="1050" y="220" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">back to a source document a reader could</text><text x="1050" y="240" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">check.</text><rect x="60" y="360" width="580" height="210" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="350" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#a33a2f">Uneven coverage</text><text x="350" y="450" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Some facts are learned far more readily than</text><text x="350" y="470" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">others, shaped by how often they appeared in</text><text x="350" y="490" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">training data.</text><rect x="760" y="360" width="580" height="210" rx="8" fill="#fdecea" stroke="#a33a2f" stroke-width="1.5"/><text x="1050" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#a33a2f">Costly, risky updates</text><text x="1050" y="450" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Retraining risks catastrophic forgetting;</text><text x="1050" y="470" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">direct editing is a delicate, localized</text><text x="1050" y="490" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">operation, not a simple overwrite.</text>
</svg>