<svg width="1500" height="660" viewBox="0 0 1500 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-6-9-drift desc-6-9-drift">
  <title id="title-6-9-drift">Three layers of context drift, invisible to standard evaluation metrics</title>
  <desc id="desc-6-9-drift">A diagram showing three types of context drift, schema drift where underlying data structure changes without a reindex, semantic drift where a term's organizational meaning shifts while the word stays the same, and staleness drift where source documents move on while the index keeps serving an old version, all three connected to a note that the faithfulness score stays high throughout, since faithfulness checks consistency with retrieved context rather than whether that context is still true.</desc>
  <rect width="1500" height="660" fill="#fbfaf7"/>
  <text x="750" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2d3d">Three layers of context drift, invisible to standard evaluation metrics</text>
  <line x1="230" y1="95" x2="230" y2="580" stroke="#1f3a5f" stroke-width="3"/><rect x="280" y="140" width="373.3333333333333" height="140" rx="10" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.5"/><text x="466.66666666666663" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Schema drift</text><text x="466.66666666666663" y="196" text-anchor="middle" font-size="11" fill="#6b7280">Underlying data structure</text><text x="466.66666666666663" y="213" text-anchor="middle" font-size="11" fill="#6b7280">changes; the index is</text><text x="466.66666666666663" y="230" text-anchor="middle" font-size="11" fill="#6b7280">never rebuilt to match</text><rect x="683.3333333333333" y="140" width="373.3333333333333" height="140" rx="10" fill="#f6dced" stroke="#c96fa8" stroke-width="1.5"/><text x="869.9999999999999" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Semantic drift</text><text x="869.9999999999999" y="196" text-anchor="middle" font-size="11" fill="#6b7280">A term's organizational</text><text x="869.9999999999999" y="213" text-anchor="middle" font-size="11" fill="#6b7280">meaning shifts; the word</text><text x="869.9999999999999" y="230" text-anchor="middle" font-size="11" fill="#6b7280">in the index stays the</text><text x="869.9999999999999" y="247" text-anchor="middle" font-size="11" fill="#6b7280">same</text><rect x="1086.6666666666665" y="140" width="373.3333333333333" height="140" rx="10" fill="#f4f3f0" stroke="#b8b5ad" stroke-width="1.5"/><text x="1273.3333333333333" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Staleness drift</text><text x="1273.3333333333333" y="196" text-anchor="middle" font-size="11" fill="#6b7280">Source documents move on;</text><text x="1273.3333333333333" y="213" text-anchor="middle" font-size="11" fill="#6b7280">the index keeps serving</text><text x="1273.3333333333333" y="230" text-anchor="middle" font-size="11" fill="#6b7280">the old version</text><rect x="20" y="190" width="190" height="40" rx="4" fill="#fbfaf7" stroke="#1f2d3d" stroke-width="1.5"/><text x="115" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2d3d">INVISIBLE</text><rect x="610" y="350" width="520" height="60" rx="10" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.5"/><text x="870" y="374.15" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">Faithfulness score:</text><text x="870" y="390.4" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">stays high throughout</text><line x1="466.66666666666663" y1="280" x2="870" y2="350" stroke="#c98b3a" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="869.9999999999999" y1="280" x2="870" y2="350" stroke="#c98b3a" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="1273.3333333333333" y1="280" x2="870" y2="350" stroke="#c98b3a" stroke-width="1.6" stroke-dasharray="4 4"/><rect x="280" y="450" width="1180" height="56" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="870" y="472" text-anchor="middle" font-size="11.5" fill="#6b7280">Faithfulness checks whether a response matches its retrieved context, not whether that context is still</text><text x="870" y="490" text-anchor="middle" font-size="11.5" fill="#6b7280">true. All three drift types can push answers quietly wrong while every generation-side metric keeps</text><text x="870" y="508" text-anchor="middle" font-size="11.5" fill="#6b7280">reporting a healthy score.</text>
</svg>