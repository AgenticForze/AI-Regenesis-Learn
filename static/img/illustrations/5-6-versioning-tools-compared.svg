<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-5-6-versioning desc-5-6-versioning">
  <title id="title-5-6-versioning">Three prompt-versioning tools compared</title>
  <desc id="desc-5-6-versioning">A diagram comparing LangSmith, which offers commits, diffs, and reference tags; PromptLayer, which offers a versioned prompt registry with diffing and protected release labels; and Weights and Biases Weave, which versions prompts, datasets, and model configurations together and compares full evaluation runs side by side.</desc>
  <defs></defs>
  <rect width="1400" height="560" fill="#fcfcfb"/>
  <text x="700" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0b0b0b">Three prompt-versioning tools compared</text>
  <rect x="50" y="90" width="400" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="250" y="113.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">LangSmith</text><text x="250" y="151.65" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">commits, diffs, and reference</text><text x="250" y="167.9" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">tags</text><rect x="50" y="210" width="400" height="220" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="250" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Each saved prompt is a commit comparable</text><text x="250" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">to its previous version via a diff view;</text><text x="250" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">reference tags such as staging and</text><text x="250" y="310" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">production can be repointed to a new</text><text x="250" y="330" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">commit without touching application</text><text x="250" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">code.</text><rect x="500" y="90" width="400" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="700" y="113.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">PromptLayer</text><text x="700" y="151.65" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">a versioned prompt registry</text><rect x="500" y="210" width="400" height="220" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Saving a new version requires a commit</text><text x="700" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">message and shows a diff of exactly what</text><text x="700" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">changed before it saves; release labels</text><text x="700" y="310" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">can be protected behind an approval flow</text><text x="700" y="330" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">so a labeled prompt cannot ship</text><text x="700" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">silently.</text><rect x="950" y="90" width="400" height="80" rx="8" fill="#ffffff" stroke="#898781" stroke-width="1.5"/><text x="1150" y="113.6" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Weights &amp; Biases Weave</text><text x="1150" y="151.65" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">versions plus evaluation runs</text><rect x="950" y="210" width="400" height="220" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="1150" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">Tracks versions of prompts, datasets,</text><text x="1150" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">and model configurations together, and</text><text x="1150" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">compares two or more full evaluation</text><text x="1150" y="310" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">runs side by side down to which</text><text x="1150" y="330" text-anchor="middle" font-size="13" font-weight="400" fill="#52514e">individual examples regressed.</text><rect x="60" y="460" width="1280" height="70" rx="8" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="700" y="488.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">None of these tools grades a prompt on their own; each exists to guarantee a grading result is</text><text x="700" y="506.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52514e">attached to an exact, reproducible version of the prompt that produced it.</text>
</svg>