<svg width="1560" height="620" viewBox="0 0 1560 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title-8-4 desc-8-4"><title id="title-8-4">A Proposed Call Is Checked Before It Is Ever Executed</title><desc id="desc-8-4">Reasoning proposes a tool call. Validate checks it against the tool's schema before anything runs: an invalid call returns an error result without ever reaching the underlying function; a valid call executes and returns its real result. Either way the result becomes the next turn's perception.</desc><rect width="1560" height="620" fill="#fbfaf7"/><text x="780" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">A Proposed Call Is Checked Before It Is Ever Executed</text><defs><marker id="a84-blue" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5b8fc9"/></marker><marker id="a84-green" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5fae83"/></marker><marker id="a84-red" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c96f6f"/></marker></defs><rect x="60" y="260" width="250" height="95" rx="12" fill="#dbe9f8" stroke="#5b8fc9" stroke-width="1.75"/><text x="185.0" y="290" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d3d">Reasoning</text><text x="185.0" y="310" text-anchor="middle" font-size="11" fill="#6b7280">proposes a tool call:</text><text x="185.0" y="325" text-anchor="middle" font-size="11" fill="#6b7280">name + arguments</text><path d="M 310 307.5 L 385.0 307.5" fill="none" stroke="#5b8fc9" stroke-width="2.25" marker-end="url(#a84-blue)"/><polygon points="480,252.5 575.0,307.5 480,362.5 385.0,307.5" fill="#fff6df" stroke="#c9975b" stroke-width="1.75"/><text x="480" y="301.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">Validate against</text><text x="480" y="316.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2d3d">the tool's schema</text><rect x="780" y="130" width="250" height="95" rx="12" fill="#dcf0e4" stroke="#5fae83" stroke-width="1.75"/><text x="905.0" y="160" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d3d">Execute the tool</text><text x="905.0" y="180" text-anchor="middle" font-size="11" fill="#6b7280">the real function runs</text><text x="905.0" y="195" text-anchor="middle" font-size="11" fill="#6b7280">with the validated arguments</text><path d="M 575.0 292.5 L 780 177.5" fill="none" stroke="#5fae83" stroke-width="2.25" marker-end="url(#a84-green)"/><text x="667.5" y="220.0" text-anchor="middle" font-size="12" fill="#5fae83">valid</text><rect x="780" y="390" width="250" height="95" rx="12" fill="#fbe3e3" stroke="#c96f6f" stroke-width="1.75"/><text x="905.0" y="420" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d3d">Reject, no execution</text><text x="905.0" y="440" text-anchor="middle" font-size="11" fill="#6b7280">the underlying function</text><text x="905.0" y="455" text-anchor="middle" font-size="11" fill="#6b7280">never runs</text><path d="M 575.0 322.5 L 780 437.5" fill="none" stroke="#c96f6f" stroke-width="2.25" marker-end="url(#a84-red)"/><text x="667.5" y="400.0" text-anchor="middle" font-size="12" fill="#c96f6f">invalid</text><rect x="1120" y="260" width="250" height="95" rx="12" fill="#ede4d3" stroke="#b7a37e" stroke-width="1.75"/><text x="1245.0" y="290" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2d3d">tool_result</text><text x="1245.0" y="310" text-anchor="middle" font-size="11" fill="#6b7280">is_error: true or false,</text><text x="1245.0" y="325" text-anchor="middle" font-size="11" fill="#6b7280">plus content, either way</text><path d="M 1030 177.5 L 1150 177.5 L 1150 260" fill="none" stroke="#5fae83" stroke-width="2" marker-end="url(#a84-green)"/><path d="M 1030 437.5 L 1150 437.5 L 1150 355" fill="none" stroke="#c96f6f" stroke-width="2" marker-end="url(#a84-red)"/><path d="M 1245.0 260 L 1245.0 85 L 185.0 85 L 185.0 260" fill="none" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#a84-blue)"/><text x="715.0" y="73" text-anchor="middle" font-size="12.5" fill="#6b7280">becomes the next turn's perception (Ch. 8.2/8.3's Observe)</text><rect x="60" y="500" width="1440" height="90" rx="10" fill="#ffffff" stroke="#e3e1db" stroke-width="1.5"/><text x="780.0" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Validation happens before execution, not after.</text><text x="780.0" y="556" text-anchor="middle" font-size="13.5" fill="#1f2d3d">A malformed call is caught and reported as an error result; it never reaches the real function.</text></svg>